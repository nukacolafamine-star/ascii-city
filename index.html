<script>
"use strict";
/*==============================================================================
  ASCII CITY
  A grid-world 3D engine rendered exclusively with colored ASCII characters.

  Pipeline, once per frame:
    1. background gradient  sky -> fog -> ground
    2. sky pass             sparse star / horizon-glow glyphs above the horizon
    3. floor pass           per character-cell inverse projection onto the grid
                            (roads, lane paint, crosswalks, sidewalks, grass)
    4. wall pass            one DDA ray per character COLUMN through the tile
                            grid; the first hit sets the near surface, and the
                            march continues so taller buildings behind shorter
                            ones still poke above them
    5. sprite pass          billboards (cars / pedestrians / props) depth-tested
                            per character cell against the wall+floor z-buffer
    6. blit                 every cell is one drawImage from a prebaked glyph
                            atlas: (character x colour) baked per distance level
    7. HUD                  ASCII overlay + minimap

  Distance drives three things at once:
    GLYPH DENSITY : near cells use heavy glyphs (@ % # *), far cells thin out
                    to (. ,) and finally to blank
    GLYPH SIZE    : 8 distance levels, each atlas baked at a smaller font size
    COLOUR        : each level pre-mixes the material colour toward the fog
==============================================================================*/

/*------------------------------- 1. CONFIG ---------------------------------*/
const CFG = {
  MAP:     1000,   // 1000 tiles a side; at ~2 m a tile that is 2 km x 2 km = 4 km^2
  P:         20,   // city block period in tiles
  RW:         6,   // roadway width: one 3-tile lane each way
  SW:         2,   // sidewalk width in tiles
  FOV:       90 * Math.PI / 180,
  MAXD:      96,   // render / fade distance in tiles
  CELLW:  [24, 19, 16, 13, 11, 9, 7],
  resIdx:     6,   // default to the finest grid; auto-res steps down if needed
  manualRes: false,   // set once you pick a grid with [ or ]
  CARS:      54,   // air traffic only - set dressing, never physical
  PEDS:     430,   // streamed: kept near the camera rather than spread thin
  timeMode:   0    // 0 neon night, 1 dusk, 2 day
};
const MAP = CFG.MAP, P = CFG.P, RW = CFG.RW, SW = CFG.SW, NB = (MAP / P) | 0;
const LANE_A = RW * 0.25, LANE_B = RW * 0.75;   // lane centres inside a roadway

/*------------------------------ 2. UTILITIES -------------------------------*/
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
let rngState = 1;
function srand(s){ rngState = (s >>> 0) || 1; }
function rnd(){                                   // mulberry32
  rngState = rngState + 0x6D2B79F5 | 0;
  let t = Math.imul(rngState ^ rngState >>> 15, 1 | rngState);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
  return ((t ^ t >>> 14) >>> 0) / 4294967296;
}
const rr = (a, b) => a + rnd() * (b - a);
const ri = (a, b) => (a + rnd() * (b - a + 1)) | 0;
function hash3(a, b, c){                          // stable per-cell noise
  let h = Math.imul(a | 0, 374761393) ^ Math.imul(b | 0, 668265263) ^ Math.imul(c | 0, 1442695041);
  h = Math.imul(h ^ h >>> 13, 1274126177);
  return ((h ^ h >>> 16) >>> 0) / 4294967296;
}

/*----------------------------- 3. CHARACTER SET ----------------------------*/
// RAMP is ordered by visual weight; a surface's "density" indexes straight in.
const RAMP  = " .',:;-=+ox*#%@&$";
const EXTRA = "|/\\_[]()<>^~`{}";   // note the escaped backslash - it IS a glyph
const ALPHA = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";   // readable signage
const CHARS = RAMP + EXTRA + ALPHA;
const RMAX  = RAMP.length - 1;
const GI = {};                                   // char -> glyph index
for (let i = 0; i < CHARS.length; i++) GI[CHARS[i]] = i;
const G_BAR = GI['|'];

/*------------------------------- 4. PALETTE --------------------------------*/
// Base materials. Distance shading is baked per level, so this stays flat.
const BASE = [];
const C = {};
function mat(name, r, g, b){ C[name] = BASE.length; BASE.push([r, g, b]); }
mat('skyGlow',  92, 40, 96);
mat('asphalt',  22, 22, 32);   mat('lineY',   190,150, 70);
mat('lineW',   172,192,212);   mat('walk',     56, 60, 76);
mat('curb',     98,106,126);   mat('grass',    38, 84, 62);
// Building shells: dark and chromatic, so the neon on them carries the frame.
mat('bldA',     58, 62, 96);   mat('bldB',     78, 66,102);
mat('bldC',     46, 84, 92);   mat('bldD',     62, 66, 74);
mat('bldE',    104, 66, 58);   mat('bldF',     70, 88,116);
mat('bldG',     92, 62, 86);   mat('bldH',     84, 86, 66);
mat('bldI',     40, 44, 64);   mat('bldJ',     96, 90, 84);
mat('bldK',     52, 78, 68);   mat('bldL',     86, 78,110);
mat('bldM',     34, 38, 52);   mat('bldN',    112, 84, 72);
// Neon: window glow, signage, crowns, kerb strips, wet-tarmac reflections.
mat('nCyan',   120,255,240);   mat('nMag',    255,110,220);
mat('nAmber',  255,190, 90);   mat('nGreen',  140,255,150);
mat('nBlue',   110,170,255);   mat('nPink',   255,120,150);
mat('nWhite',  225,240,255);   mat('nViolet', 190,130,255);
mat('winDark',  24, 28, 44);
mat('carA',     40, 44, 62);   mat('carB',     92, 32, 52);
mat('carC',    150,156,168);   mat('carD',     30, 70, 78);
mat('carE',     70, 46, 92);   mat('carF',    186,158, 62);
mat('glass',    64, 96,128);   mat('tire',     24, 26, 32);
mat('head',    220,250,255);   mat('tail',    255, 60, 80);
mat('skinA',   226,182,144);   mat('skinB',   152,112, 82);
mat('shirtA',  214, 92, 92);   mat('shirtB',   92,152,214);
mat('shirtC',  228,228,228);   mat('shirtD',   96,196,160);
mat('pants',    58, 68,100);   mat('metal',   112,120,132);
mat('leaf',     58,132, 72);
mat('trunk',    92, 66, 48);   mat('tlRed',   255, 64, 52);
mat('tlGrn',    74,240,128);   mat('tlAmb',   255,182, 44);
mat('hydr',    214, 78, 58);
mat('water',    26,122,110);   mat('waterD',   14, 66, 68);
mat('deck',     92, 90,104);   mat('deckOld',  96, 78, 62);
mat('worktop', 152,126, 90);   // counter tops: lighter than any floor wood
mat('blossom', 236,172,200);   mat('blossomD', 198,120,160);   // sakura canopy
mat('glowDusk', 214, 96, 44);  // dusk horizon cells (drawn in sky, behind walls)
mat('rail',    124,132,146);   mat('turf',     44,102, 62);
mat('path',    118,110, 96);   mat('screen',   30, 34, 52);
mat('dataDk',   30, 34, 40);   mat('camRed',  255, 70, 60);   mat('bank',     44, 46, 58);
mat('signBack', 10, 11, 18);   mat('signCase', 62, 66, 84);
const NBASE  = BASE.length;
const BLDC   = [C.bldA, C.bldB, C.bldC, C.bldD, C.bldE, C.bldF, C.bldG,
                C.bldH, C.bldI, C.bldJ, C.bldK, C.bldL, C.bldM, C.bldN];
const NEONC  = [C.nCyan, C.nMag, C.nAmber, C.nGreen, C.nBlue, C.nPink, C.nWhite, C.nViolet];
const LAMPC  = [C.nCyan, C.nMag, C.nAmber, C.nBlue, C.nViolet, C.nPink];
const CARC   = [C.carA, C.carB, C.carC, C.carD, C.carE, C.carF, C.carA, C.carC];
// Which materials actually emit light - only these are reflected in wet tarmac.
const EMISSIVE = new Uint8Array(64);
[C.nCyan, C.nMag, C.nAmber, C.nGreen, C.nBlue, C.nPink, C.nWhite, C.nViolet,
 C.head, C.tail, C.tlRed, C.tlGrn, C.tlAmb].forEach(i => { EMISSIVE[i] = 1; });
const SHIRTC = [C.shirtA, C.shirtB, C.shirtC, C.shirtD];
const SKINC  = [C.skinA, C.skinB];

// Time of day: fog colour, sky colours, and how many windows are lit.
const TIME = [
  { fog: [ 14, 10, 28], sky: [  4,  4, 14], glow: [ 78, 24, 84], lit: 0.62, amb: 0.94 },
  { fog: [ 64, 38, 58], sky: [ 24, 16, 48], glow: [214, 96, 44], lit: 0.55, amb: 1.00 },
  { fog: [ 96,116,150], sky: [ 30, 88,172], glow: [118,132,152], lit: 0.10, amb: 1.00 }
];

/*----------------------------- 4b. DISTRICTS -------------------------------
  A coarse per-block field picks a ruleset. Everything a district touches is a
  parameter that already existed - palette subset, height curve, how hard the
  block subdivides, prop mix, lit ratio, signage density, fog tint.
============================================================================*/
const D_DOWN = 0, D_STRIP = 1, D_RES = 2, D_IND = 3, D_SUB = 4, D_RURAL = 5;
const DISTRICT = [
  { name: 'DOWNTOWN',
    shells: [C.bldA, C.bldF, C.bldI, C.bldM, C.bldL, C.bldD],
    neon:   [C.nCyan, C.nBlue, C.nWhite, C.nViolet, C.nCyan, C.nWhite],
    hBase: [13, 22], hScale: [24, 60], lit: 1.15, wpm: [2, 2, 3, 3],
    split: 2, park: 0.05, alley: 0.30, tier: 0.80, crown: 0.55, stripe: 0.45,
    lamp: 0.098, tree: 0.004, bin: 0.018, hydr: 0.020, sign: 0.55, signV: 0.45,
    stall: 0.012, stree: 0.55, cam: 0.022,
    fog: [16, 14, 36],
    words: ['ZAIBATSU', 'OMNICORP', 'HOLDINGS', 'SYNTEK', 'AXIOM', 'VERTEX',
            'NEXUS', 'GLOBAL', 'FINANCE', 'DATACORP', 'HELIX', 'MERIDIAN'] },
  { name: 'THE STRIP',
    shells: [C.bldG, C.bldB, C.bldE, C.bldN, C.bldJ],
    neon:   [C.nMag, C.nPink, C.nAmber, C.nCyan, C.nGreen, C.nViolet],
    hBase: [8, 13], hScale: [7, 24], lit: 1.35, wpm: [2, 3, 3, 3],
    split: 3, park: 0.04, alley: 0.45, tier: 0.25, crown: 0.80, stripe: 0.70,
    lamp: 0.150, tree: 0.003, bin: 0.035, hydr: 0.012, sign: 0.95, signV: 0.60,
    stall: 0.045, stree: 0.30, cam: 0.030,
    fog: [36, 12, 42],
    words: ['NOODLES', 'RAMEN', 'CLUB', 'ARCADE', 'PACHINKO', 'SUSHI', 'BAR',
            'KARAOKE', 'TATTOO', '24 HRS', 'HOTEL', 'VR DEN', 'CHROME', 'LOANS',
            'PAWN', 'NEON', 'DRINKS', 'LIVE'] },
  { name: 'RESIDENTIAL',
    shells: [C.bldJ, C.bldH, C.bldK, C.bldN, C.bldD, C.bldE],
    neon:   [C.nAmber, C.nWhite, C.nGreen, C.nAmber, C.nPink],
    hBase: [7, 11], hScale: [5, 18], lit: 0.85, wpm: [1.5, 2, 2, 2],
    split: 2, park: 0.26, alley: 0.28, tier: 0.35, crown: 0.18, stripe: 0.10,
    lamp: 0.078, tree: 0.016, bin: 0.022, hydr: 0.018, sign: 0.22, signV: 0.15,
    stall: 0.016, stree: 0.70, cam: 0.014,
    fog: [18, 16, 34],
    words: ['LAUNDRY', 'GROCER', 'PHARMACY', 'CAFE', 'CLINIC', 'MARKET',
            'BAKERY', 'APARTMENTS', 'DELI', 'HARDWARE'] },
  { name: 'INDUSTRIAL',
    shells: [C.bldE, C.bldH, C.bldD, C.bldM, C.bldN],
    neon:   [C.nAmber, C.nGreen, C.nWhite],
    hBase: [6, 9], hScale: [3, 11], lit: 0.45, wpm: [1.5, 1.5, 2],
    split: 1, park: 0.06, alley: 0.20, tier: 0.15, crown: 0.10, stripe: 0.15,
    lamp: 0.065, tree: 0.002, bin: 0.050, hydr: 0.030, sign: 0.30, signV: 0.10,
    stall: 0.005, stree: 0.15, cam: 0.024,
    fog: [24, 22, 28],
    words: ['LOADING', 'DOCK 7', 'SCRAP', 'FUEL', 'WAREHOUSE', 'CARGO',
            'RECYCLING', 'HAZMAT', 'UNIT 12', 'FREIGHT'] },
  { name: 'SUBURBS',
    shells: [C.bldJ, C.bldN, C.bldE, C.bldH, C.bldK],
    neon:   [C.nAmber, C.nWhite, C.nAmber, C.nGreen],
    hBase: [4, 7], hScale: [0, 4], lit: 0.75, wpm: [1.5, 1.5, 2],
    split: 2, park: 0.30, alley: 0.10, tier: 0.05, crown: 0.04, stripe: 0.02,
    lamp: 0.040, tree: 0.045, bin: 0.010, hydr: 0.012, sign: 0.10, signV: 0.02,
    stall: 0.004, inset: 1, fill: 0.72, stree: 0.60, cam: 0.006,
    fog: [20, 22, 32],
    words: ['HOME', 'GARAGE', 'CORNER', 'DELI', 'SCHOOL', 'CHURCH'] },
  { name: 'FARMLAND',
    shells: [C.bldE, C.bldN, C.bldJ, C.bldH],
    neon:   [C.nAmber, C.nWhite],
    hBase: [3, 6], hScale: [0, 2], lit: 0.45, wpm: [1.5, 1.5],
    split: 1, park: 0.62, alley: 0.05, tier: 0, crown: 0.02, stripe: 0,
    lamp: 0.008, tree: 0.030, bin: 0.002, hydr: 0.002, sign: 0.06, signV: 0,
    stall: 0.001, inset: 2, fill: 0.34, stree: 0.10, cam: 0.001,
    fog: [26, 30, 34],
    words: ['BARN', 'FEED', 'GRAIN', 'FARM', 'EGGS'] }
];
// how far out each ring of the map sits, as a fraction of the half-diagonal
const Z_CORE = 0.15, Z_URBAN = 0.34, Z_SUB = 0.60, Z_RURAL = 0.85;
function zoneAt(bi, bj){
  const zr = Math.hypot(bi + 0.5 - NB * 0.5, bj + 0.5 - NB * 0.5) / (NB * 0.5);
  return zr < Z_CORE ? 0 : zr < Z_URBAN ? 1 : zr < Z_SUB ? 2 : zr < Z_RURAL ? 3 : 4;
}
const distMap = new Uint8Array(NB * NB);
function districtAt(x, y){
  const bi = clamp((x / P) | 0, 0, NB - 1), bj = clamp((y / P) | 0, 0, NB - 1);
  return distMap[bj * NB + bi];
}

/*--------------------------- 5. DISTANCE LEVELS ----------------------------*/
// One atlas per level: smaller font + more fog the further away it is.
const LV = 8;
const LV_SCALE = [1.00, 0.94, 0.87, 0.79, 0.70, 0.60, 0.50, 0.41];
const LV_FADE  = [0.00, 0.09, 0.19, 0.31, 0.44, 0.58, 0.73, 0.89];
const LV_BOLD  = [1, 1, 1, 0, 0, 0, 0, 0];
function levelOf(t){ return t <= 0 ? 0 : t >= 1 ? LV - 1 : Math.min(LV - 1, (Math.pow(t, 0.90) * LV) | 0); }
// How hard glyphs thin out with distance. On a clear day the far skyline
// stays dense and SOLID - the dissolve-into-dots only suits dark or hazy
// backdrops, where it reads as fog instead of blur. Set per frame in render.
let densK = 0.74;
function densMul(t){ return 1 - densK * Math.pow(t, 1.15); }

/*------------------------------- 6. CANVAS ---------------------------------*/
const cv  = document.getElementById('cv');
const glv = document.getElementById('glv');
const ctx = cv.getContext('2d', { alpha: false });
let view = cv;                       // whichever canvas is actually on screen
const FONT = '"Cascadia Mono","Consolas","Courier New",monospace';
const R = { cols: 0, rows: 0, cellW: 11, cellH: 20, ox: 0, oy: 0, W: 0, H: 0 };
let gBuf, bBuf, lBuf, dBuf, refBuf, srcBuf;  // glyph / colour / level / depth / wet / mirrorable
let hGlyph, hCol;                    // HUD layer
let atlas = [], hudAtlas = null, bgGrad = null, glTried = false;
const HUDC = ['#8ff0c0', '#4fbf8a', '#dfe8ef', '#ffd166', '#ff6b6b', '#7fc8ff', '#6d7a88', '#c39bff',
              '#d8a276', '#46566e', '#3a4158', '#232a36'];   // skin, jacket, pants, dark
const H_GRN = 0, H_DIM = 1, H_WHT = 2, H_YEL = 3, H_RED = 4, H_BLU = 5, H_GRY = 6, H_PUR = 7,
      H_SKIN = 8, H_JKT = 9, H_PNT = 10, H_DRK = 11;

function buildAtlases(){
  const cw = R.cellW, ch = R.cellH;
  const fbase = Math.min(ch * 0.99, cw / 0.575);
  const T = curTime();
  atlas = [];
  for (let l = 0; l < LV; l++){
    const cn = document.createElement('canvas');
    cn.width = CHARS.length * cw; cn.height = NBASE * ch;
    const g = cn.getContext('2d');
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.font = (LV_BOLD[l] ? 'bold ' : '') + (fbase * LV_SCALE[l]).toFixed(2) +
             'px "Cascadia Mono","Consolas","Courier New",monospace';
    const f = LV_FADE[l] * fogScale();
    const dim = 1 - 0.22 * f;
    const sat = CFG.timeMode === 2 ? 1.5 : 1;   // daylight pulls the hue OUT of
    for (let b = 0; b < NBASE; b++){            // shells that were cut for night
      const c = BASE[b];
      let r0 = c[0] * dim * T.amb, g0 = c[1] * dim * T.amb, b0 = c[2] * dim * T.amb;
      if (sat !== 1){
        const lum = r0 * 0.3 + g0 * 0.59 + b0 * 0.11;
        r0 = lum + (r0 - lum) * sat; g0 = lum + (g0 - lum) * sat; b0 = lum + (b0 - lum) * sat;
      }
      const rC = Math.round(clamp(r0, 0, 255) * (1 - f) + T.fog[0] * f);
      const gC = Math.round(clamp(g0, 0, 255) * (1 - f) + T.fog[1] * f);
      const bC = Math.round(clamp(b0, 0, 255) * (1 - f) + T.fog[2] * f);
      g.fillStyle = 'rgb(' + rC + ',' + gC + ',' + bC + ')';
      const y = b * ch + ch * 0.5;
      for (let i = 1; i < CHARS.length; i++) g.fillText(CHARS[i], i * cw + cw * 0.5, y);
    }
    atlas.push(cn);
  }
  // HUD atlas: full printable ASCII, one row per HUD colour.
  const hcv = document.createElement('canvas');
  hcv.width = 95 * cw; hcv.height = HUDC.length * ch;
  const hg = hcv.getContext('2d');
  hg.textAlign = 'center'; hg.textBaseline = 'middle';
  hg.font = 'bold ' + (fbase * 0.94).toFixed(2) + 'px "Cascadia Mono","Consolas","Courier New",monospace';
  for (let k = 0; k < HUDC.length; k++){
    hg.fillStyle = HUDC[k];
    for (let i = 1; i < 95; i++) hg.fillText(String.fromCharCode(32 + i), i * cw + cw * 0.5, k * ch + ch * 0.5);
  }
  hudAtlas = hcv;
}

let bgPitch = NaN, bgTime = -1, bgDist = -1, bgIns = -1;
function buildBackground(){
  const dn = distMap.length ? districtAt(cam.x, cam.y) : 0;
  const ins = inside ? 1 : 0;
  if (bgGrad && cam.pitch === bgPitch && bakeKey === bgTime && dn === bgDist && ins === bgIns) return;
  bgPitch = cam.pitch; bgTime = bakeKey; bgDist = dn; bgIns = ins;
  if (ins){                                  // indoors: a flat near-black
    const g = ctx.createLinearGradient(0, 0, 0, R.H || 1);
    g.addColorStop(0, 'rgb(8,9,14)');
    g.addColorStop(1, 'rgb(4,5,8)');
    bgGrad = g;
    return;
  }
  const T0 = curTime(), DF = DISTRICT[dn].fog;
  // grade the horizon toward the district you are standing in
  const T = { sky: T0.sky, glow: T0.glow,
              fog: T0.fog.map((v, i) => Math.round(v * 0.66 + DF[i] * 0.34)) };
  const g = ctx.createLinearGradient(0, 0, 0, R.H || 1);
  const hz = clamp(0.5 + cam.pitch / Math.max(1, R.rows), 0.03, 0.97);
  g.addColorStop(0, 'rgb(' + T.sky.join(',') + ')');
  g.addColorStop(Math.max(0.001, hz - 0.16),     // no glow band in the backdrop -
    'rgb(' + T.sky.map((v, i) => Math.round(v * 0.35 + T.fog[i] * 0.65)).join(',') + ')');
  g.addColorStop(hz, 'rgb(' + T.fog.join(',') + ')');
  g.addColorStop(1, 'rgb(' + T.fog.map(v =>
    Math.round(v * (CFG.timeMode === 2 ? 0.22 : 0.42))).join(',') + ')');
  bgGrad = g;
}

/*=============================== 7. THE GRID ================================
  Everything in the world is decided by tile residues inside a block period P:
      residue 0 .. RW-1          -> roadway (one lane each way)
      residue RW .. RW+SW-1      -> sidewalk, kerb side
      residue P-SW .. P-1        -> sidewalk, far side
      residue RW+SW .. P-SW-1    -> buildable lot interior
  A road residue crossed with a sidewalk residue is a crosswalk.
============================================================================*/
const T_ROAD = 0, T_CROSS = 1, T_WALK = 2, T_LOT = 3, T_BLD = 4,
      T_WATER = 5, T_BRIDGE = 6, T_PATH = 7, T_INF = 8;   // T_INF: interior floor
const PK_LAMP = 0, PK_TREE = 1, PK_HYDR = 2, PK_TLIGHT = 3, PK_BIN = 4,
      PK_RAIL = 5, PK_STALL = 6, PK_BENCH = 7, PK_CAM = 8, PK_PLAY = 9,
      PK_METRO = 10, PK_APPLE = 11, PK_TURBINE = 12, PK_ITEM = 13,
      PK_SAKURA = 14, PK_CROP = 15, PK_ROCK = 16, PK_STAIR = 17;

// `let`, not `const`: entering a building swaps these references to a second
// interior array set and back, so the renderer never learns scenes exist.
let tType = new Uint8Array(MAP * MAP);
let tH    = new Float32Array(MAP * MAP);
let tB    = new Int16Array(MAP * MAP);
let walkG = new Uint8Array(MAP * MAP);   // 0 blocked, else step cost x10
let buildings = [], props = [], signs = [], stalls = [];

function residue(r){ return r < RW ? 0 : (r < RW + SW || r >= P - SW ? 1 : 2); }
function baseType(x, y){
  const rx = residue(x % P), ry = residue(y % P);
  if (rx === 0 && ry === 0) return T_ROAD;               // intersection
  if (rx === 0) return ry === 1 ? T_CROSS : T_ROAD;      // north-south street
  if (ry === 0) return rx === 1 ? T_CROSS : T_ROAD;      // east-west street
  if (rx === 1 || ry === 1) return T_WALK;               // sidewalk ring
  return T_LOT;
}
const inMap = (x, y) => x >= 0 && y >= 0 && x < MAP && y < MAP;
const tileAt = (x, y) => inMap(x, y) ? tType[y * MAP + x] : T_BLD;
const heightAt = (x, y) => inMap(x, y) ? tH[y * MAP + x] : 0;
function solidAt(wx, wy){
  const x = wx | 0, y = wy | 0;
  if (!inMap(x, y)) return true;
  return tH[y * MAP + x] > 0;
}
function wetAt(x, y){ return inMap(x, y) && tType[y * MAP + x] === T_WATER; }

/*--------------------- recursive lot subdivision (BSP) ---------------------*/
function bsp(x0, y0, x1, y1, depth, out){
  const w = x1 - x0 + 1, h = y1 - y0 + 1;
  const canW = w >= 7, canH = h >= 7;
  if (depth <= 0 || (!canW && !canH) || (w <= 6 && h <= 6 && rnd() < 0.45)){
    out.push([x0, y0, x1, y1]); return;
  }
  let vertical;
  if (canW && canH) vertical = w > h ? rnd() < 0.78 : rnd() < 0.22;
  else vertical = canW;
  if (vertical){
    const cut = x0 + 3 + ((rnd() * (w - 6)) | 0);
    bsp(x0, y0, cut, y1, depth - 1, out); bsp(cut + 1, y0, x1, y1, depth - 1, out);
  } else {
    const cut = y0 + 3 + ((rnd() * (h - 6)) | 0);
    bsp(x0, y0, x1, cut, depth - 1, out); bsp(x0, cut + 1, x1, y1, depth - 1, out);
  }
}

// The map is laid out in rings - tower core, urban, suburban, farmland,
// wilderness - and each ring draws its districts from its own menu, so the
// character of the place changes as you travel out rather than at random.
const ZONE_MIX = [
  [D_DOWN, D_DOWN, D_DOWN, D_STRIP],
  [D_STRIP, D_RES, D_RES, D_IND, D_DOWN],
  [D_SUB, D_SUB, D_SUB, D_RES, D_IND],
  [D_RURAL, D_RURAL, D_RURAL, D_SUB],
  [D_RURAL]
];
function buildDistricts(){
  const salt = (rnd() * 65535) | 0;
  // a coarse patch field, so like districts clump instead of speckling
  const PS = 3;
  const pw = Math.ceil(NB / PS) + 1;
  const patch = new Uint8Array(pw * pw);
  for (let i = 0; i < patch.length; i++) patch[i] = (rnd() * 64) | 0;
  for (let bj = 0; bj < NB; bj++)
    for (let bi = 0; bi < NB; bi++){
      const z = zoneAt(bi, bj);
      const mix = ZONE_MIX[z];
      const pv = patch[((bj / PS) | 0) * pw + ((bi / PS) | 0)];
      const jitter = hash3(bi, bj, salt) < 0.22 ? ((rnd() * 97) | 0) : 0;
      distMap[bj * NB + bi] = mix[(pv + jitter) % mix.length];
    }
}

/*=========================== 7b. LANDMARKS =================================
  Everything below is stamped over the lattice after it is generated. A stamp
  may overwrite tiles, register its own building record so facades still work,
  and drop props and signage of its own.
============================================================================*/
let landmarks = [];
function lmBuilding(o){
  const b = Object.assign({
    id: buildings.length, x0: 0, y0: 0, x1: 0, y1: 0, h: 10, dist: D_DOWN,
    col: C.bldD, winA: C.nCyan, winB: C.nWhite, sign: C.nCyan,
    crown: -1, stripe: -1, stripePh: 0, litP: 0.4,
    fh: 1.4, wpm: 2, seed: (rnd() * 65535) | 0, landmark: true
  }, o);
  buildings.push(b);
  return b;
}
function lmFill(x0, y0, x1, y1, type, h, bid){
  for (let y = Math.max(0, y0); y <= Math.min(MAP - 1, y1); y++)
    for (let x = Math.max(0, x0); x <= Math.min(MAP - 1, x1); x++){
      const id = y * MAP + x;
      tType[id] = type;
      tH[id] = h || 0;
      tB[id] = bid === undefined ? -1 : bid;
    }
}
function lmSign(x, y, z, nx, ny, txt, col, vert){
  const art = signArt(txt, !!vert);
  const pix = Math.min(0.22, 6.0 / art.w);
  const axis = nx !== 0 ? 0 : 1, n = nx !== 0 ? nx : ny;
  pushSign(axis, n, axis === 0 ? x : y, axis === 0 ? y : x,
           art.w * pix, art.h * pix, z, nx, ny, art, col, 0);
}

// The river meanders east-west and cuts the map in two.
const RIVER_Y = MAP * 0.5;
const RIVER_DEPTH = 3.0;          // how far the water sits below the street
function riverMid(x){ return RIVER_Y + Math.sin(x * 0.042) * 9 + Math.sin(x * 0.017 + 1.7) * 5; }
function riverHalf(x){ return 6.5 + Math.sin(x * 0.061 + 0.5) * 1.9; }
function carveRiver(){
  for (let x = 0; x < MAP; x++){
    const mid = riverMid(x), hw = riverHalf(x);
    for (let y = Math.max(0, Math.floor(mid - hw)); y <= Math.min(MAP - 1, Math.ceil(mid + hw)); y++){
      const id = y * MAP + x;
      tType[id] = T_WATER; tH[id] = 0; tB[id] = -1;
    }
  }
}
// A bridge carries a whole boulevard - roadway plus both sidewalks - across.
function carveBridge(k, worn){
  const x0 = k * P - SW, x1 = k * P + RW + SW - 1;
  let yTop = MAP, yBot = -1;
  for (let x = x0; x <= x1; x++){
    if (x < 0 || x >= MAP) continue;
    const mid = riverMid(x), hw = riverHalf(x);
    yTop = Math.min(yTop, Math.floor(mid - hw) - 3);
    yBot = Math.max(yBot, Math.ceil(mid + hw) + 3);
  }
  const wx0 = worn ? x0 + 2 : x0, wx1 = worn ? x1 - 2 : x1;
  for (let y = Math.max(0, yTop); y <= Math.min(MAP - 1, yBot); y++)
    for (let x = Math.max(0, wx0); x <= Math.min(MAP - 1, wx1); x++){
      const id = y * MAP + x;
      if (tType[id] !== T_WATER && tType[id] !== T_BRIDGE && y > yTop + 1 && y < yBot - 1) continue;
      tType[id] = T_BRIDGE; tH[id] = 0; tB[id] = -1;
    }
  // railings down both edges, and lamps along the primary deck
  for (let y = Math.max(0, yTop); y <= Math.min(MAP - 1, yBot); y += 2){
    for (const ex of [wx0, wx1]){
      if (ex < 0 || ex >= MAP) continue;
      if (tType[y * MAP + ex] !== T_BRIDGE) continue;
      props.push({ x: ex + 0.5, y: y + 0.5, k: PK_RAIL, s: worn ? 1 : 0, r: 0.14 });
    }
    if (!worn && (y % 8) === 0 && tType[y * MAP + wx0 + 1] === T_BRIDGE)
      props.push({ x: wx0 + 1.5, y: y + 0.5, k: PK_LAMP, s: 0.05, r: 0.16 });
  }
  landmarks.push({ name: worn ? 'OLD CROSSING' : 'CENTRAL BRIDGE',
                   x: (wx0 + wx1) * 0.5, y: (yTop + yBot) * 0.5 });
  return { x0: wx0, x1: wx1, yTop, yBot };
}
// Toll plaza on the northern approach of the main bridge.
function tollBooth(br){
  const y = Math.max(2, br.yTop - 2);
  for (const bx of [br.x0 + 1, br.x1 - 2]){
    if (bx < 1 || bx + 1 >= MAP) continue;
    const b = lmBuilding({ x0: bx, y0: y, x1: bx + 1, y1: y + 1, h: 3.4,
                           col: C.bldJ, sign: C.nAmber, winA: C.nAmber, winB: C.nWhite,
                           litP: 0.9, fh: 1.6, wpm: 2, crown: C.nAmber });
    lmFill(bx, y, bx + 1, y + 1, T_BLD, 3.4, b.id);
    lmSign(bx + 1, y - 0.6, 3.9, 0, -1, 'TOLL', C.nAmber, false);
  }
}

/*------------------------- the rest of the landmarks -----------------------*/
const blockUsed = new Uint8Array(NB * NB);
function blockFree(bi, bj, bw, bh){
  if (bi < 0 || bj < 0 || bi + bw > NB || bj + bh > NB) return false;
  for (let y = bj; y < bj + bh; y++)              // already claimed by a landmark
    for (let x = bi; x < bi + bw; x++) if (blockUsed[y * NB + x]) return false;
  for (let y = bj * P; y < (bj + bh) * P; y++)
    for (let x = bi * P; x < (bi + bw) * P; x++){
      if (!inMap(x, y)) return false;
      const t = tType[y * MAP + x];
      if (t === T_WATER || t === T_BRIDGE) return false;
    }
  return true;
}
function findBlock(bw, bh, want, zone){
  const c = [];
  for (let bj = 1; bj < NB - bh; bj++)
    for (let bi = 1; bi < NB - bw; bi++){
      if (!blockFree(bi, bj, bw, bh)) continue;
      if (want !== undefined && distMap[bj * NB + bi] !== want) continue;
      if (zone !== undefined && zoneAt(bi, bj) !== zone) continue;
      c.push([bi, bj]);
    }
  if (!c.length) return null;
  const pick = c[(rnd() * c.length) | 0];
  for (let y = pick[1]; y < pick[1] + bh; y++)     // reserve it so nothing lands on top
    for (let x = pick[0]; x < pick[0] + bw; x++) blockUsed[y * NB + x] = 1;
  return pick;
}
function clearArea(x0, y0, x1, y1, type){
  for (let y = Math.max(0, y0); y <= Math.min(MAP - 1, y1); y++)
    for (let x = Math.max(0, x0); x <= Math.min(MAP - 1, x1); x++){
      const id = y * MAP + x;
      if (tType[id] === T_WATER || tType[id] === T_BRIDGE) continue;
      tType[id] = type; tH[id] = 0; tB[id] = -1;
    }
}

// --- the sphere: a stepped hemisphere whose whole skin is one display -----
//
// Tile heights follow h = H * sqrt(1 - (r/R)^2), so the dome is a voxel
// hemisphere. Every wall cell on it maps to a point on that sphere - longitude
// around, height for latitude - and samples the current frame, which may ask
// for a specific character rather than a density. The image wraps twice, so a
// whole face reads from any approach.
function domeFrame(rows, c1, c2, scroll){
  let w = 0;
  for (const r of rows) w = Math.max(w, r.length);
  const padded = rows.map(r => r + ' '.repeat(w - r.length));
  return { rows: padded, w, h: padded.length, c1, c2, scroll: !!scroll };
}

function textFrame(lines, c1, c2){
  const W = 32, H = 16;
  const grid = [];
  for (let y = 0; y < H; y++) grid.push(new Array(W).fill('.'));
  let y0 = Math.max(0, ((H - (lines.length * 7 - 2)) * 0.5) | 0);
  for (const line of lines){
    let x0 = Math.max(0, ((W - (line.length * 4 - 1)) * 0.5) | 0);
    for (let i = 0; i < line.length; i++){
      const gl = (MINIFONT[line[i]] || MINIFONT[' ']).split('|');
      for (let r = 0; r < 5; r++)
        for (let c = 0; c < 3; c++)
          if (gl[r][c] === '#' && y0 + r < H && x0 + c < W) grid[y0 + r][x0 + c] = '#';
      x0 += 4;
    }
    y0 += 7;
  }
  return domeFrame(grid.map(r => r.join('')), c1, c2);
}

function domeSurface(b, z, hx, hy){
  const lon = Math.atan2(hy - b.cy, hx - b.cx);
  let u = (lon / (Math.PI * 2) + 0.5) * 2;         // two copies around
  u -= Math.floor(u);
  const v = clamp(z / b.domeH, 0, 0.9999);
  const fr = DOME_FRAMES[((worldTime / 4.0) | 0) % DOME_FRAMES.length];
  let fx = (u * fr.w) | 0;
  if (fr.scroll) fx = (fx + ((worldTime * 4) | 0)) % fr.w;
  const fy = Math.min(fr.h - 1, ((1 - v) * fr.h) | 0);
  const ch = fr.rows[fy].charAt(fx);
  if (ch === '.' || ch === ' '){ _wd = 0.26; _wb = C.signBack; }
  else if (ch === '#'){ _wd = 0.97; _wb = fr.c1; }
  else { _wd = 1.0; _wb = fr.c2; const g = GI[ch]; if (g !== undefined) _wg = g; }
}
function stampDome(){
  const b = findBlock(2, 2);
  if (!b) return;
  const [bi, bj] = b;
  const cx = bi * P + P, cy = bj * P + P;
  const Rr = 16, HK = 22;
  clearArea(bi * P, bj * P, (bi + 2) * P - 1, (bj + 2) * P - 1, T_WALK);
  const rec = lmBuilding({ x0: Math.round(cx - Rr), y0: Math.round(cy - Rr),
                           x1: Math.round(cx + Rr), y1: Math.round(cy + Rr),
                           h: HK, col: C.signCase, litP: 0 });
  rec.dome = true; rec.cx = cx; rec.cy = cy; rec.domeH = HK;
  for (let y = Math.round(cy - Rr); y <= Math.round(cy + Rr); y++)
    for (let x = Math.round(cx - Rr); x <= Math.round(cx + Rr); x++){
      if (!inMap(x, y)) continue;
      const dx = x + 0.5 - cx, dy = y + 0.5 - cy;
      const rr = Math.hypot(dx, dy) / Rr;
      if (rr > 1) continue;
      const id = y * MAP + x;
      if (tType[id] === T_WATER || tType[id] === T_BRIDGE) continue;
      tType[id] = T_BLD;
      tH[id] = Math.max(1.5, HK * Math.sqrt(1 - rr * rr));
      tB[id] = rec.id;
    }
  // a ring of lamps so the plaza reads as a forecourt
  for (let a = 0; a < 16; a++){
    const th = a / 16 * Math.PI * 2;
    const px = cx + Math.cos(th) * (Rr + 2.5), py = cy + Math.sin(th) * (Rr + 2.5);
    if (inMap(px | 0, py | 0) && tType[(py | 0) * MAP + (px | 0)] === T_WALK)
      props.push({ x: px, y: py, k: PK_LAMP, s: a / 16, r: 0.16 });
  }
  landmarks.push({ name: 'THE SPHERE', x: cx, y: cy - Rr - 5 });
}

// --- parks --------------------------------------------------------------
function stampPark(bi, bj, bw, bh, kind){
  const x0 = bi * P, y0 = bj * P, x1 = x0 + bw * P - 1, y1 = y0 + bh * P - 1;
  clearArea(x0, y0, x1, y1, T_LOT);
  // a path that wanders from one side to the other
  for (let x = x0; x <= x1; x++){
    const py = Math.round((y0 + y1) * 0.5 + Math.sin((x - x0) * 0.19) * (y1 - y0) * 0.24);
    for (let w = -1; w <= 1; w++){
      const y = py + w;
      if (y < y0 || y > y1) continue;
      const id = y * MAP + x;
      if (tType[id] === T_LOT) tType[id] = T_PATH;
    }
  }
  for (let y = y0; y <= y1; y++)
    for (let x = x0; x <= x1; x++){
      if (tType[y * MAP + x] !== T_LOT) continue;
      const r = rnd();
      if (nearBuilding(x, y, 1)) continue;
      if (kind === 'main'){
        if (r < 0.030) props.push({ x: x + 0.5, y: y + 0.5, k: PK_APPLE, s: rnd(), r: 0.4 });
        else if (r < 0.150) props.push({ x: x + 0.5, y: y + 0.5,
          k: rnd() < 0.55 ? PK_SAKURA : PK_TREE, s: rnd(), r: 0.42 });
      } else {
        if (r < 0.085) props.push({ x: x + 0.5, y: y + 0.5,
          k: rnd() < 0.55 ? PK_SAKURA : PK_TREE, s: rnd(), r: 0.42 });
        else if (r < 0.110) props.push({ x: x + 0.5, y: y + 0.5, k: PK_BENCH, s: 0, r: 0.35 });
      }
    }
  if (kind !== 'main'){
    const px = (x0 + x1) * 0.5, py = (y0 + y1) * 0.5;
    for (let k = 0; k < 3; k++)
      props.push({ x: px + rr(-4, 4), y: py + rr(-3, 3), k: PK_PLAY, s: rnd(), r: 0.7 });
    for (let k = 0; k < 4; k++)
      props.push({ x: px + rr(-6, 6), y: py + rr(-5, 5), k: PK_BENCH, s: 0, r: 0.35 });
  }
  landmarks.push({ name: kind === 'main' ? 'CENTRAL PARK' : 'PLAYGROUND',
                   x: (x0 + x1) * 0.5, y: (y0 + y1) * 0.5 });
}

// --- data centre: four blocks of windowless concrete, watched ------------
function stampDataCentre(){
  const b = findBlock(2, 2, D_IND) || findBlock(2, 2);
  if (!b) return;
  const [bi, bj] = b;
  const x0 = bi * P + 2, y0 = bj * P + 2, x1 = (bi + 2) * P - 3, y1 = (bj + 2) * P - 3;
  clearArea(bi * P, bj * P, (bi + 2) * P - 1, (bj + 2) * P - 1, T_WALK);
  const rec = lmBuilding({ x0, y0, x1, y1, h: 15, col: C.dataDk, winA: C.camRed,
                           winB: C.camRed, sign: C.camRed, crown: C.camRed,
                           stripe: C.camRed, stripePh: 2, litP: 0.03, fh: 3.0, wpm: 1.5 });
  for (let y = y0; y <= y1; y++)
    for (let x = x0; x <= x1; x++){
      const id = y * MAP + x;
      tType[id] = T_BLD; tH[id] = 15; tB[id] = rec.id;
    }
  for (let x = x0 - 1; x <= x1 + 1; x += 4){
    props.push({ x: x + 0.5, y: y0 - 1.5, k: PK_CAM, s: rnd(), r: 0.16 });
    props.push({ x: x + 0.5, y: y1 + 1.5, k: PK_CAM, s: rnd(), r: 0.16 });
  }
  for (let y = y0 - 1; y <= y1 + 1; y += 4){
    props.push({ x: x0 - 1.5, y: y + 0.5, k: PK_CAM, s: rnd(), r: 0.16 });
    props.push({ x: x1 + 1.5, y: y + 0.5, k: PK_CAM, s: rnd(), r: 0.16 });
  }
  lmSign((x0 + x1) * 0.5, y0 - 0.6, 4.5, 0, -1, 'DATA', C.camRed, false);
  landmarks.push({ name: 'DATA CENTRE', x: (x0 + x1) * 0.5, y: y0 - 4 });
}

// --- one street given over to the red light trade ------------------------
const RED_WORDS = ['GIRLS', 'LIVE', 'PEEP', 'XXX', 'ROOMS', 'BAR', 'SHOW',
                   'PRIVATE', 'OPEN', 'CABARET'];
function stampRedLight(){
  const b = findBlock(1, 2, D_STRIP) || findBlock(1, 2);
  if (!b) return;
  const [bi, bj] = b;
  const sx = bi * P + RW * 0.5;                        // the street itself
  const y0 = bj * P, y1 = (bj + 2) * P - 1;
  let n = 0;
  for (const bd of buildings){
    if (bd.landmark) continue;
    const cxb = (bd.x0 + bd.x1) * 0.5, cyb = (bd.y0 + bd.y1) * 0.5;
    if (Math.abs(cxb - sx) > P * 0.75 || cyb < y0 || cyb > y1) continue;
    bd.winA = C.nMag; bd.winB = C.nPink; bd.sign = C.nPink;
    bd.crown = C.nMag; bd.stripe = C.nPink;
    bd.litP = 0.88; bd.redlight = true;
    n++;
  }
  for (let y = y0; y <= y1; y += 3){
    for (const dx of [-RW * 0.5 - SW, RW * 0.5 + SW]){
      const px = sx + dx, py = y + 0.5;
      if (!inMap(px | 0, py | 0)) continue;
      if (tType[(py | 0) * MAP + (px | 0)] !== T_WALK) continue;
      props.push({ x: px, y: py, k: PK_LAMP, s: 0.18, r: 0.16 });
    }
  }
  if (n) landmarks.push({ name: 'THE RED MILE', x: sx, y: (y0 + y1) * 0.5 });
}

// --- fields: the ring outside the city proper ---------------------------
function stampFields(){
  for (let bj = 0; bj < NB; bj++)
    for (let bi = 0; bi < NB; bi++){
      if (zoneAt(bi, bj) < 4) continue;
      for (let y = bj * P; y < (bj + 1) * P; y++)
        for (let x = bi * P; x < (bi + 1) * P; x++){
          if (!inMap(x, y)) continue;
          const id = y * MAP + x;
          const t = tType[id];
          if (t === T_WATER || t === T_BRIDGE) continue;
          if (t === T_BLD){ tType[id] = T_LOT; tH[id] = 0; tB[id] = -1; }
          else if (t === T_WALK || t === T_CROSS) tType[id] = T_LOT;
          else if (t === T_ROAD) tType[id] = T_PATH;
          if (tType[id] === T_LOT && hash3(x, y, 71) < 0.007 && !nearBuilding(x, y, 1))
            props.push({ x: x + 0.5, y: y + 0.5, k: treeKind(x, y), s: hash3(x, y, 73), r: 0.42 });
        }
    }
}

// --- metro: four entrances, evenly spread, that link to each other -------
function stampMetro(){
  buildWalkGrid();          // entrances are chosen by walkability, so build it first
  const spots = [[0.50, 0.22], [0.78, 0.32], [0.86, 0.55], [0.72, 0.78],
                 [0.46, 0.84], [0.22, 0.70], [0.15, 0.44], [0.30, 0.24]];
  const names = ['NORTH GATE', 'NORTHEAST', 'EAST GATE', 'SOUTHEAST',
                 'SOUTH GATE', 'SOUTHWEST', 'WEST GATE', 'NORTHWEST'];
  metroStops = [];
  for (let i = 0; i < spots.length; i++){
    const tx = MAP * spots[i][0], ty = MAP * spots[i][1];
    let best = null, bd = 1e9;
    for (let t = 0; t < 1400; t++){
      const x = clamp((tx + rr(-P * 2, P * 2)) | 0, 2, MAP - 3), y = clamp((ty + rr(-P * 2, P * 2)) | 0, 2, MAP - 3);
      const tt = tType[y * MAP + x];
      if (tt !== T_WALK && tt !== T_ROAD) continue;
      let open = 0;                                   // needs elbow room
      for (let oy = -2; oy <= 2; oy++)
        for (let ox = -2; ox <= 2; ox++)
          if (walkG[clamp(y + oy, 0, MAP - 1) * MAP + clamp(x + ox, 0, MAP - 1)]) open++;
      if (open < 20) continue;
      const d = Math.hypot(x - tx, y - ty);
      if (d < bd){ bd = d; best = [x, y]; }
    }
    if (!best) continue;
    props.push({ x: best[0] + 0.5, y: best[1] + 0.5, k: PK_METRO, s: 0, r: 0.34 });
    metroStops.push({ x: best[0] + 0.5, y: best[1] + 0.5, name: names[i] });
    lmSign(best[0] + 0.5, best[1] - 0.1, 2.6, 0, -1, 'METRO', C.nGreen, false);
    landmarks.push({ name: 'METRO ' + names[i], x: best[0] + 0.5, y: best[1] + 0.5 });
  }
}

// --- rural set pieces -----------------------------------------------------
function stampWindFarm(){
  const b = findBlock(2, 2, undefined, 3);
  if (!b) return;
  const [bi, bj] = b;
  clearArea(bi * P, bj * P, (bi + 2) * P - 1, (bj + 2) * P - 1, T_LOT);
  for (let k = 0; k < 16; k++){
    const x = bi * P + 4 + rnd() * (2 * P - 8), y = bj * P + 4 + rnd() * (2 * P - 8);
    props.push({ x, y, k: PK_TURBINE, s: rnd(), r: 0.35 });
  }
  landmarks.push({ name: 'WIND FARM', x: (bi + 1) * P, y: (bj + 1) * P });
}
function stampSilos(){
  const b = findBlock(1, 1, undefined, 3);
  if (!b) return;
  const [bi, bj] = b;
  clearArea(bi * P, bj * P, (bi + 1) * P - 1, (bj + 1) * P - 1, T_LOT);
  const cx = bi * P + P * 0.5, cy = bj * P + P * 0.5;
  for (let k = 0; k < 5; k++){
    const sx = Math.round(cx - 6 + k * 3), sy = Math.round(cy - 1);
    const rec = lmBuilding({ x0: sx, y0: sy, x1: sx + 1, y1: sy + 1, h: 13 + rnd() * 5,
                             col: C.bldJ, winA: C.nAmber, winB: C.nWhite, litP: 0.05,
                             fh: 4, wpm: 1.5, crown: C.nAmber });
    lmFill(sx, sy, sx + 1, sy + 1, T_BLD, rec.h, rec.id);
  }
  lmSign(cx, cy - 2.6, 3.4, 0, -1, 'GRAIN', C.nAmber, false);
  landmarks.push({ name: 'GRAIN SILOS', x: cx, y: cy - 4 });
}
function stampMast(){
  const b = findBlock(1, 1, undefined, 3) || findBlock(1, 1, undefined, 2);
  if (!b) return;
  const [bi, bj] = b;
  const cx = bi * P + P * 0.5, cy = bj * P + P * 0.5;
  clearArea(bi * P, bj * P, (bi + 1) * P - 1, (bj + 1) * P - 1, T_LOT);
  const h = 78 + rnd() * 26;
  const rec = lmBuilding({ x0: Math.round(cx - 1), y0: Math.round(cy - 1),
                           x1: Math.round(cx), y1: Math.round(cy), h,
                           col: C.rail, winA: C.camRed, winB: C.camRed, litP: 0.25,
                           fh: 6, wpm: 1.5, crown: C.camRed, stripe: C.camRed, stripePh: 0 });
  lmFill(Math.round(cx - 1), Math.round(cy - 1), Math.round(cx), Math.round(cy), T_BLD, h, rec.id);
  for (let k = 0; k < 4; k++)
    props.push({ x: cx + Math.cos(k * 1.57) * 4, y: cy + Math.sin(k * 1.57) * 4,
                 k: PK_CAM, s: rnd(), r: 0.16 });
  landmarks.push({ name: 'RADIO MAST', x: cx, y: cy - 5 });
}
function stampLake(){
  const b = findBlock(2, 2, undefined, 3);
  if (!b) return;
  const [bi, bj] = b;
  const cx = bi * P + P, cy = bj * P + P, rr = P * 0.8;
  for (let y = Math.round(cy - rr); y <= Math.round(cy + rr); y++)
    for (let x = Math.round(cx - rr); x <= Math.round(cx + rr); x++){
      if (!inMap(x, y)) continue;
      const d = Math.hypot(x + 0.5 - cx, y + 0.5 - cy) / rr;
      const wob = 1 + Math.sin(Math.atan2(y - cy, x - cx) * 3) * 0.12;
      if (d > wob) continue;
      const id = y * MAP + x;
      tType[id] = T_WATER; tH[id] = 0; tB[id] = -1;
    }
  landmarks.push({ name: 'RESERVOIR', x: cx, y: cy - rr - 3 });
}

function stampLandmarks(){
  stampFields();
  stampDome();
  stampDataCentre();
  stampRedLight();
  // the world is 4 km^2 now, so the repeatable set is scaled to fill it
  for (let k = 0; k < 7; k++){
    const mp = findBlock(2, 2, undefined, 1) || findBlock(2, 2, undefined, 2);
    if (mp) stampPark(mp[0], mp[1], 2, 2, 'main');
  }
  for (let k = 0; k < 10; k++){
    const sp = findBlock(1, 1, D_SUB) || findBlock(1, 1, undefined, 2);
    if (sp) stampPark(sp[0], sp[1], 1, 1, 'sub');
  }
  for (let k = 0; k < 3; k++) stampWindFarm();
  for (let k = 0; k < 4; k++) stampSilos();
  for (let k = 0; k < 2; k++) stampMast();
  for (let k = 0; k < 2; k++) stampLake();
  stampMetro();
}

function buildCity(seed){
  srand(seed);
  buildings = []; props = []; signs = []; landmarks = []; metroStops = [];
  blockUsed.fill(0);
  tH.fill(0); tB.fill(-1);
  for (let y = 0; y < MAP; y++)
    for (let x = 0; x < MAP; x++) tType[y * MAP + x] = baseType(x, y);
  buildDistricts();
  carveRiver();
  const mid = Math.round(NB * 0.5);
  // Beyond the rural ring the lattice gives way: two highways leave the city
  // through the wilderness and every other road out there returns to earth.
  for (let bj = 0; bj < NB; bj++)
    for (let bi = 0; bi < NB; bi++){
      if (zoneAt(bi, bj) < 4 || bi === mid || bj === mid) continue;
      for (let y = bj * P; y < Math.min(MAP, (bj + 1) * P); y++)
        for (let x = bi * P; x < Math.min(MAP, (bi + 1) * P); x++){
          const id = y * MAP + x, t = tType[id];
          if (t === T_ROAD || t === T_WALK || t === T_CROSS) tType[id] = T_LOT;
        }
    }
  const brMain = carveBridge(mid, false);
  tollBooth(brMain);
  for (const k of [mid - 14, mid - 7, mid + 7, mid + 14])
    if (k > 1 && k < NB - 1) carveBridge(k, true);

  const cx0 = MAP * 0.5, cy0 = MAP * 0.5;
  for (let bj = 0; bj < NB; bj++){
    for (let bi = 0; bi < NB; bi++){
      if (zoneAt(bi, bj) >= 4){                     // wilderness: scrub, stone, sky
        for (let y = bj * P; y < Math.min(MAP, (bj + 1) * P); y++)
          for (let x = bi * P; x < Math.min(MAP, (bi + 1) * P); x++){
            if (tType[y * MAP + x] !== T_LOT) continue;
            const h4 = hash3(x, y, 606);
            if (h4 < 0.005) props.push({ x: x + 0.5, y: y + 0.5, k: PK_ROCK, s: rnd(), r: 0.4 });
            else if (h4 < 0.008) props.push({ x: x + 0.5, y: y + 0.5, k: PK_TREE, s: rnd(), r: 0.42 });
          }
        continue;
      }
      const D = DISTRICT[distMap[bj * NB + bi]];
      const lx0 = bi * P + RW + SW, lx1 = bi * P + P - SW - 1;
      const ly0 = bj * P + RW + SW, ly1 = bj * P + P - SW - 1;
      if (lx1 >= MAP || ly1 >= MAP) continue;
      const rects = [];
      bsp(lx0, ly0, lx1, ly1, D.split, rects);
      for (const rc of rects){
        let [x0, y0, x1, y1] = rc;
        if (rnd() < D.alley){                             // alley / setback
          if (rnd() < 0.5 && x1 - x0 >= 3){ if (rnd() < 0.5) x0++; else x1--; }
          else if (y1 - y0 >= 3){ if (rnd() < 0.5) y0++; else y1--; }
        }
        let w = x1 - x0 + 1, h = y1 - y0 + 1;
        if (w < 2 || h < 2) continue;
        let blocked = false;
        for (let y = y0; y <= y1 && !blocked; y++)
          for (let x = x0; x <= x1; x++){
            const t0 = tType[y * MAP + x];
            if (t0 === T_WATER || t0 === T_BRIDGE){ blocked = true; break; }
          }
        if (blocked) continue;

        const cx = (x0 + x1) * 0.5, cy = (y0 + y1) * 0.5;
        const dc = Math.hypot(cx - cx0, cy - cy0) / (MAP * 0.5);
        const down = Math.max(0, 1 - dc * 0.85);          // centre falloff

        if (rnd() < D.park){                              // green lot
          for (let y = y0; y <= y1; y++)
            for (let x = x0; x <= x1; x++){
              tType[y * MAP + x] = T_LOT;
              if (rnd() < 0.11 + D.tree * 1.6 && !nearBuilding(x, y, 1))
                props.push({ x: x + 0.5, y: y + 0.5, k: treeKind(x, y), s: rnd(), r: 0.42 });
            }
          continue;
        }

        if (D.fill !== undefined && rnd() > D.fill){        // left as open ground
          const rural = distMap[bj * NB + bi] === D_RURAL;
          for (let y = y0; y <= y1; y++)
            for (let x = x0; x <= x1; x++){
              if (tType[y * MAP + x] !== T_LOT) continue;
              // rural open ground is worked land: crops stand in rows
              if (rural && x % 3 === 1 && y % 3 !== 0 && hash3(x, y, 505) < 0.5)
                props.push({ x: x + 0.5, y: y + 0.5, k: PK_CROP, s: rnd(), r: 0 });
              else if (rnd() < D.tree * 0.5 && !nearBuilding(x, y, 1))
                props.push({ x: x + 0.5, y: y + 0.5, k: treeKind(x, y), s: rnd(), r: 0.42 });
            }
          continue;
        }
        if (D.inset){                                        // gardens and yards
          x0 += D.inset; y0 += D.inset; x1 -= D.inset; y1 -= D.inset;
          if (x1 - x0 < 1 || y1 - y0 < 1) continue;
        }
        const area = w * h;
        let ht = D.hBase[0] + rnd() * (D.hBase[1] - D.hBase[0]) +
                 Math.pow(down, 1.6) * (D.hScale[0] + rnd() * (D.hScale[1] - D.hScale[0])) *
                 Math.min(1.8, area / 8);
        if (rnd() < 0.045) ht *= 1.9;                     // landmark tower
        ht = Math.min(ht, 120);

        // ---- footprint shape: L cut, open courtyard notch, chamfers -----
        const cut = new Uint8Array(w * h);
        const shp = rnd();
        if (w >= 4 && h >= 4 && shp < 0.18){              // L shape
          const cw = 1 + ((rnd() * (w - 2)) | 0), ch2 = 1 + ((rnd() * (h - 2)) | 0);
          const ox = rnd() < 0.5 ? 0 : w - cw, oy = rnd() < 0.5 ? 0 : h - ch2;
          for (let y = oy; y < oy + ch2; y++)
            for (let x = ox; x < ox + cw; x++) cut[y * w + x] = 1;
        } else if (w >= 5 && h >= 5 && shp < 0.32){       // U: notch one edge
          const sideN = (rnd() * 4) | 0;
          const span = sideN < 2 ? w : h, deep = sideN < 2 ? h : w;
          const nw = 1 + ((rnd() * (span - 3)) | 0);
          const dep = 1 + ((rnd() * (deep - 2)) | 0);
          const off = 1 + ((rnd() * (span - nw - 1)) | 0);
          for (let a = 0; a < nw; a++)
            for (let k = 0; k < dep; k++){
              const x = (sideN === 0 || sideN === 1) ? off + a : (sideN === 2 ? k : w - 1 - k);
              const y = sideN === 0 ? k : (sideN === 1 ? h - 1 - k : off + a);
              if (x >= 0 && y >= 0 && x < w && y < h) cut[y * w + x] = 1;
            }
        } else if (w >= 3 && h >= 3 && shp < 0.50){       // chamfered corners
          const n = 1 + ((rnd() * 2) | 0);
          for (let c = 0; c < 4; c++){
            if (rnd() < 0.45) continue;
            for (let y = 0; y < h; y++)
              for (let x = 0; x < w; x++){
                const dx = (c & 1) ? w - 1 - x : x, dy = (c & 2) ? h - 1 - y : y;
                if (dx + dy < n) cut[y * w + x] = 1;
              }
          }
        }
        let kept = 0;
        for (let i = 0; i < cut.length; i++) if (!cut[i]) kept++;
        if (kept < 2) cut.fill(0);

        // A tower reads as "the cyan one" or "the magenta one": one dominant
        // window glow plus a minority accent, and its own signage and crown.
        const wa = (rnd() * D.neon.length) | 0;
        const wb = (wa + 1 + ((rnd() * (D.neon.length - 1)) | 0)) % D.neon.length;
        const b = {
          id: buildings.length, x0, y0, x1, y1, h: ht, dist: distMap[bj * NB + bi],
          col:   D.shells[(rnd() * D.shells.length) | 0],
          winA:  D.neon[wa],
          winB:  D.neon[wb],
          sign:  D.neon[(rnd() * D.neon.length) | 0],
          crown:  rnd() < D.crown  ? D.neon[(rnd() * D.neon.length) | 0] : -1,
          stripe: rnd() < D.stripe ? D.neon[(rnd() * D.neon.length) | 0] : -1,
          stripePh: (rnd() * 6) | 0,
          litP: clamp(curTime().lit * D.lit * (0.45 + rnd()), 0.04, 0.96),
          fh: 1.15 + rnd() * 0.55,                        // floor height
          wpm: D.wpm[(rnd() * D.wpm.length) | 0],         // windows per tile
          seed: (rnd() * 65535) | 0
        };
        buildings.push(b);

        // ---- stamp, stepping the height down toward the footprint edge ---
        const mi = Math.min((w - 1) >> 1, (h - 1) >> 1);
        const setback = (rnd() < D.tier && ht > 15 && mi > 0) ? 0.28 + rnd() * 0.36 : 0;
        for (let y = y0; y <= y1; y++)
          for (let x = x0; x <= x1; x++){
            if (cut[(y - y0) * w + (x - x0)]) continue;
            const inset = Math.min(x - x0, x1 - x, y - y0, y1 - y);
            const t = mi > 0 ? inset / mi : 1;
            const id = y * MAP + x;
            tType[id] = T_BLD;
            tH[id] = ht * (1 - setback * (1 - t));
            tB[id] = b.id;
          }
      }
    }
  }
  stampLandmarks();
  buildProps();
  buildWalkGrid();
  buildSigns();
  buildDoors();
  placeStreetItems();
}

/*--------------------------- readable signage ------------------------------
  A sign is anchored to a street-facing wall tile but drawn in screen space at
  one character per cell, so the text stays legible at any range - a
  holographic panel rather than a painted texture.
============================================================================*/
// A sign is a lit panel: border, dark backing, and block-font lettering, all
// baked into one small bitmap that is then drawn as an ordinary billboard.
// Roles: 1 backing, 2 border, 3 lettering.
function signArt(txt, vert){
  const n = txt.length;
  const tw = vert ? 3 : n * 4 - 1;
  const th = vert ? n * 6 - 1 : 5;
  const W = tw + 4, H = th + 4;
  const data = new Uint8Array(W * H);
  for (let y = 0; y < H; y++)
    for (let x = 0; x < W; x++)
      data[y * W + x] = (x === 0 || y === 0 || x === W - 1 || y === H - 1) ? 2 : 1;
  for (let i = 0; i < n; i++){
    const g = (MINIFONT[txt[i]] || MINIFONT[' ']).split('|');
    const ox = vert ? 2 : 2 + i * 4, oy = vert ? 2 + i * 6 : 2;
    for (let r = 0; r < 5; r++)
      for (let c = 0; c < 3; c++)
        if (g[r][c] === '#') data[(oy + r) * W + (ox + c)] = 3;
  }
  return { w: W, h: H, data };
}
function signSlots(col){
  const sb = new Int16Array(NROLE), sd = new Float32Array(NROLE);
  sb[1] = C.signBack; sd[1] = 0.82;
  sb[2] = col;        sd[2] = 0.95;
  sb[3] = col;        sd[3] = 1.0;
  return { sb, sd };
}
// How far the same building keeps this face exposed, in tiles. A sign is
// centred in that run and never allowed wider than it.
function faceRun(b, tx, ty, nx, ny){
  const open = (px, py) => {
    if (!inMap(px, py) || tB[py * MAP + px] !== b.id) return false;
    const ox = px + nx, oy = py + ny;
    return !inMap(ox, oy) || tType[oy * MAP + ox] !== T_BLD;
  };
  let lo, hi;
  if (nx !== 0){ lo = ty; while (open(tx, lo - 1)) lo--; hi = ty; while (open(tx, hi + 1)) hi++; }
  else         { lo = tx; while (open(lo - 1, ty)) lo--; hi = tx; while (open(hi + 1, ty)) hi++; }
  return [lo, hi + 1];
}
function pushSign(axis, n, plane, mid, wm, hm, z, nx, ny, art, col, blink){
  const sl = signSlots(col);
  signs.push({
    axis, n, plane: plane + n * 0.06,          // sit just proud of the wall
    a0: mid - wm * 0.5, a1: mid + wm * 0.5,
    x: axis === 0 ? plane : mid, y: axis === 0 ? mid : plane,
    nx, ny, z, hm, wm, art, sb: sl.sb, sd: sl.sd, col, blink: blink || 0
  });
}
function makeSign(b, tx, ty, nx, ny, txt, col, vert, blink){
  if (!vert && b.word === undefined) b.word = txt;   // the door borrows the sign's name
  const axis = nx !== 0 ? 0 : 1, n = nx !== 0 ? nx : ny;
  const run = faceRun(b, tx, ty, nx, ny);
  const runLen = run[1] - run[0];
  const art = signArt(txt, vert);
  const maxW = runLen - 0.5;                    // leave the corners clear
  if (maxW < 0.8) return;
  let pix = Math.min(0.26, maxW / art.w);
  if (vert) pix = Math.min(pix, 9.0 / art.h);
  if (pix < 0.07) return;                       // wall too narrow to carry it
  const wm = art.w * pix, hm = art.h * pix;
  const hostH = tH[ty * MAP + tx];
  let z = vert ? 5 + rnd() * 5 : 2.4 + rnd() * 1.5;
  z = clamp(z, 1.2, hostH - hm - 0.3);
  if (z < 1.1 || z + hm > hostH - 0.1) return;  // does not fit on this wall
  const face = axis === 0 ? (nx > 0 ? tx + 1 : tx) : (ny > 0 ? ty + 1 : ty);
  pushSign(axis, n, face, (run[0] + run[1]) * 0.5, wm, hm, z, nx, ny, art, col, blink);
}
function buildSigns(){
  signs = [];
  const mkSign = (b, D, f, vert, words) => {
    const list = words || D.words;
    makeSign(b, f.tx, f.ty, f.nx, f.ny, list[(rnd() * list.length) | 0],
             D.neon[(rnd() * D.neon.length) | 0], vert,
             rnd() < 0.13 ? 0.5 + rnd() * 1.7 : 0);
  };
  for (const b of buildings){
    if (b.landmark) continue;
    const D = DISTRICT[b.dist];
    const words = b.redlight ? RED_WORDS : D.words;
    // one bucket per outward direction, so a shop faces every street it fronts
    const faces = [[], [], [], []];
    for (let y = b.y0; y <= b.y1; y++)
      for (let x = b.x0; x <= b.x1; x++){
        if (!inMap(x, y) || tB[y * MAP + x] !== b.id) continue;
        for (let d = 0; d < 4; d++){
          const nx = x + DIRV[d][0], ny = y + DIRV[d][1];
          if (!inMap(nx, ny)) continue;
          const t = tType[ny * MAP + nx];
          if (t !== T_WALK && t !== T_ROAD && t !== T_CROSS) continue;
          faces[d].push({ tx: x, ty: y, nx: DIRV[d][0], ny: DIRV[d][1], h: tH[y * MAP + x] });
        }
      }
    let anyFace = null;
    for (let d = 0; d < 4; d++){
      const bucket = faces[d];
      if (!bucket.length) continue;
      anyFace = bucket;
      if (rnd() > (b.redlight ? 0.98 : D.sign)) continue;
      mkSign(b, D, bucket[(rnd() * bucket.length) | 0], false, words);
    }
    if (anyFace && rnd() < D.signV){
      const tall = anyFace.filter(f => f.h > 13);
      if (tall.length) mkSign(b, D, tall[(rnd() * tall.length) | 0], true, words);
    }
  }
}

// Residential streets and suburbs favour cherry blossom; the industrial belt
// keeps its scraggly evergreens.
function treeKind(x, y){
  const d = districtAt(x, y);
  return (d === D_SUB || d === D_RES) && hash3(x, y, 404) < 0.6 ? PK_SAKURA : PK_TREE;
}
// Nothing should be planted against a facade - a trunk half inside a wall
// reads as a glitch, not a tree.
function nearBuilding(x, y, r){
  for (let dy = -r; dy <= r; dy++)
    for (let dx = -r; dx <= r; dx++)
      if (tileAt(x + dx, y + dy) === T_BLD) return true;
  return false;
}
function buildProps(){
  // street furniture scattered along the sidewalk ring
  for (let y = 1; y < MAP - 1; y++){
    for (let x = 1; x < MAP - 1; x++){
      if (tType[y * MAP + x] !== T_WALK) continue;
      let kerb = false;
      for (let d = 0; d < 4; d++){
        const q = tileAt(x + DIRV[d][0], y + DIRV[d][1]);
        if (q === T_ROAD || q === T_CROSS){ kerb = true; break; }
      }
      const hh = hash3(x, y, 7), sd = hash3(x, y, 19);
      let nearStop = false;
      for (let m = 0; m < metroStops.length; m++)
        if (Math.abs(metroStops[m].x - x) < 2.5 && Math.abs(metroStops[m].y - y) < 2.5) nearStop = true;
      if (nearStop) continue;
      const D = DISTRICT[districtAt(x, y)];
      if (kerb){
        if (hh < D.lamp)               props.push({ x: x + 0.5, y: y + 0.5, k: PK_LAMP, s: sd, r: 0.16 });
        else if (hh < D.lamp + D.cam)  props.push({ x: x + 0.5, y: y + 0.5, k: PK_CAM,  s: sd, r: 0.16 });
        else if (hh < D.lamp + D.cam + D.hydr) props.push({ x: x + 0.5, y: y + 0.5, k: PK_HYDR, s: sd, r: 0.18 });
      } else if (hh < D.bin){
        props.push({ x: x + 0.5, y: y + 0.5, k: PK_BIN, s: sd, r: 0.22 });
      }
    }
  }
  // Street-level walk-ups: stalls and benches where the old kerb line ran, so
  // the boulevard has somewhere for crowds to gather.
  for (let y = 1; y < MAP - 1; y++)
    for (let x = 1; x < MAP - 1; x++){
      const t = tType[y * MAP + x];
      if (t !== T_ROAD && t !== T_WALK) continue;
      let nearWalk = false, nearRoad = false;
      for (let d = 0; d < 4; d++){
        const q = tileAt(x + DIRV[d][0], y + DIRV[d][1]);
        if (q === T_WALK) nearWalk = true;
        else if (q === T_ROAD) nearRoad = true;
      }
      if (!nearWalk || !nearRoad) continue;
      const D = DISTRICT[districtAt(x, y)];
      const hh = hash3(x, y, 41);
      if (hh < D.stall)
        props.push({ x: x + 0.5, y: y + 0.5, k: PK_STALL, s: hash3(x, y, 43), r: 0.55 });
      else if (hh < D.stall + 0.035)
        props.push({ x: x + 0.5, y: y + 0.5, k: PK_BENCH, s: 0, r: 0.35 });
    }

  // The junctions keep a fitting on the corner, but with nothing driving it is
  // a surveillance camera rather than a signal head.
  for (let bj = 0; bj < NB; bj++){
    for (let bi = 0; bi < NB; bi++){
      const zn = zoneAt(bi, bj);
      if (zn > 2) continue;
      const rate = zn === 0 ? 0.60 : zn === 1 ? 0.34 : 0.12;
      const corners = [
        [bi * P - 0.5,      bj * P - 0.5],
        [bi * P + RW + 0.5, bj * P - 0.5],
        [bi * P - 0.5,      bj * P + RW + 0.5],
        [bi * P + RW + 0.5, bj * P + RW + 0.5]
      ];
      for (let ci = 0; ci < corners.length; ci++){
        const c = corners[ci];
        if (c[0] < 1 || c[1] < 1 || c[0] > MAP - 1 || c[1] > MAP - 1) continue;
        if (hash3(bi * 4 + ci, bj, 71) > rate) continue;
        const tt = tType[(c[1] | 0) * MAP + (c[0] | 0)];
        if (tt !== T_WALK) continue;
        props.push({ x: c[0], y: c[1], k: PK_CAM, s: hash3(bi, bj * 4 + ci, 73), r: 0.16 });
      }
    }
  }
  // Street trees go in last, once every other fitting is placed, because a
  // tree on the promenade has to stand clear: nothing beside it to left or
  // right, and no facade within two tiles.
  const occ = new Uint8Array(MAP * MAP);
  for (const q of props){
    const ix = q.x | 0, iy = q.y | 0;
    if (ix >= 0 && iy >= 0 && ix < MAP && iy < MAP) occ[iy * MAP + ix] = 1;
  }
  for (let y = 2; y < MAP - 2; y++)
    for (let x = 2; x < MAP - 2; x++){
      if (tType[y * MAP + x] !== T_ROAD) continue;
      const rx = x % P, ry = y % P;
      const inX = rx < RW;
      if (inX && ry < RW) continue;                   // never in the junction
      if (inX ? rx !== 3 : ry !== 3) continue;        // the centre line only
      if ((inX ? y : x) % 8) continue;                // spaced down the avenue
      const D = DISTRICT[districtAt(x, y)];
      if (hash3(x, y, 61) > D.stree) continue;
      if (nearBuilding(x, y, 2)) continue;
      // sweep out to either side, across the width of the walkway
      const lx = inX ? 1 : 0, ly = inX ? 0 : 1;       // sideways
      const ax = inX ? 0 : 1, ay = inX ? 1 : 0;       // along the avenue
      let flanked = false;
      for (let k = 1; k <= 3 && !flanked; k++)
        for (let m = -1; m <= 1; m++){
          const px = x + lx * k + ax * m, py2 = y + ly * k + ay * m;
          const qx = x - lx * k + ax * m, qy = y - ly * k + ay * m;
          if ((inMap(px, py2) && occ[py2 * MAP + px]) ||
              (inMap(qx, qy) && occ[qy * MAP + qx])){ flanked = true; break; }
        }
      if (flanked) continue;
      props.push({ x: x + 0.5, y: y + 0.5, k: treeKind(x, y), s: hash3(x, y, 63), r: 0.38 });
      occ[y * MAP + x] = 1;                           // and keep the next one off
    }

  // Park and lot trees are dropped while the blocks are still being built, so
  // a later building - or a landmark stamped over the top - can land on one.
  // Prune once at the end, when the geometry is final.
  props = props.filter(q => {
    if (q.k !== PK_TREE && q.k !== PK_APPLE && q.k !== PK_SAKURA && q.k !== PK_CROP) return true;
    return !nearBuilding(q.x | 0, q.y | 0, 1);
  });
  stalls = props.filter(q => q.k === PK_STALL);
}

// Pedestrian navigation grid. Cost x10 so it stays in a Uint8Array.
function buildWalkGrid(){
  for (let i = 0; i < MAP * MAP; i++){
    const t = tType[i];
    // the old carriageway is paving now, so it costs exactly what a
    // sidewalk costs and people spread across the whole boulevard
    walkG[i] = t === T_WALK ? 10 : t === T_BRIDGE ? 10 : t === T_PATH ? 9 :
               t === T_LOT ? 14 : t === T_CROSS ? 10 : t === T_ROAD ? 10 : 0;
  }
}

  Billboards are tiny role maps. A role is resolved per instance to a base
  colour + a surface density, so one template serves every car colour.
============================================================================*/
const ROLE = { '.':0, 'B':1, 'W':2, 'T':3, 'L':4, 'R':5, 'S':6, 'P':7,
               'H':8, 'K':9, 'V':10, 'M':11, 'G':12, 'X':13 };

// each cell carrying its own glyph, colour and fallback density. Authoring
// loop: draw in a text file, paste the lines here, give each character class
// a colour with colorOf(ch, x, y). Far distance levels fall back to density
// shading so the art still fades into the fog like everything else.
function parseArtLit(rows, colorOf){
  let w = 0; for (const r of rows) w = Math.max(w, r.length);
  const h = rows.length;
  const data = new Uint8Array(w * h);
  const g = new Int16Array(w * h);
  const cm = new Uint8Array(w * h);
  const dn = new Float32Array(w * h);
  for (let y = 0; y < h; y++)
    for (let x = 0; x < rows[y].length; x++){
      const ch = rows[y][x];
      if (ch === ' ') continue;
      const i = y * w + x;
      const gi = GI[ch];
      data[i] = 1;
      g[i] = gi === undefined ? GI['*'] : gi;
      cm[i] = colorOf(ch, x, y);
      const ri = RAMP.indexOf(ch);
      dn[i] = ri > 0 ? clamp(ri / RMAX, 0.3, 1) : 0.7;
    }
  return { w, h, data, g, cm, dn, lit: 1 };
}
function parseArt(rows){
  let w = 0; for (const r of rows) w = Math.max(w, r.length);
  const h = rows.length, data = new Uint8Array(w * h);
  for (let y = 0; y < h; y++)
    for (let x = 0; x < rows[y].length; x++) data[y * w + x] = ROLE[rows[y][x]] || 0;
  return { w, h, data };
}

/*========================= 10. SPATIAL HASH BUCKETS ========================*/
const HG = 8, HW = Math.ceil(MAP / HG);
// Across 4 km^2 the hash has tens of thousands of buckets, so clearing has to
// cost what the agents cost, not what the map costs: only touched buckets are
// reset, tracked as they are filled.
function makeGrid(){
  const g = [];
  for (let i = 0; i < HW * HW; i++) g.push([]);
  g.dirty = [];
  return g;
}
const pedGrid = makeGrid(), carGrid = makeGrid();
function gridClear(g){
  const d = g.dirty;
  for (let i = 0; i < d.length; i++) g[d[i]].length = 0;
  d.length = 0;
}
function gridAdd(g, x, y, o){
  const gx = (x / HG) | 0, gy = (y / HG) | 0;
  if (gx < 0 || gy < 0 || gx >= HW || gy >= HW) return;
  const i = gy * HW + gx, b = g[i];
  if (b.length === 0) g.dirty.push(i);
  b.push(o);
}
function gridQuery(g, x, y, rad, out){
  out.length = 0;
  const x0 = Math.max(0, ((x - rad) / HG) | 0), x1 = Math.min(HW - 1, ((x + rad) / HG) | 0);
  const y0 = Math.max(0, ((y - rad) / HG) | 0), y1 = Math.min(HW - 1, ((y + rad) / HG) | 0);
  for (let gy = y0; gy <= y1; gy++)
    for (let gx = x0; gx <= x1; gx++){
      const b = g[gy * HW + gx];
      for (let i = 0; i < b.length; i++) out.push(b[i]);
    }
  return out;
}

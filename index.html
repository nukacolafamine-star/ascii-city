/*============================== 13c. AUDIO =================================
  Sound comes from local files in audio/ - free-use mp3 / wav the repo does
  not ship. Every slot is optional: a missing file is a silent no-op, so the
  game runs fine with no audio folder at all.

  Two tiers, picked once at the first user gesture:
    tier 1  WebAudio - fetch + decodeAudioData, per-bus gains, stereo pan.
            Available when the page is served over http(s).
    tier 2  <audio> elements - file:// blocks fetch, media elements are
            exempt, so each slot becomes an element. Volume and playback
            rate work; panning does not. Same city, flatter stage.

  A slot tries name.mp3 first, then name.wav, so a curated mp3 dropped next
  to a placeholder wav wins without deleting anything. Buses: music, ambient
  and weather (rain, thunder, wind) duck to 30% while the world is frozen;
  fx does not, so menu blips stay crisp. The slot list and every hook that
  fires one live here and in audio/AUDIO.md.
============================================================================*/
const AUD = {
  music_night:     { loop: 1, bus: 'music' },
  music_dusk:      { loop: 1, bus: 'music' },
  music_day:       { loop: 1, bus: 'music' },
  amb_downtown:    { loop: 1, bus: 'ambient' },
  amb_strip:       { loop: 1, bus: 'ambient' },
  amb_residential: { loop: 1, bus: 'ambient' },
  amb_industrial:  { loop: 1, bus: 'ambient' },
  amb_suburbs:     { loop: 1, bus: 'ambient' },
  amb_farmland:    { loop: 1, bus: 'ambient' },
  rain_loop:       { loop: 1, bus: 'weather' },
  wind_loop:       { loop: 1, bus: 'weather' },
  thunder:         { bus: 'weather' },
  footstep:        { bus: 'fx' },
  metro:           { bus: 'fx' },
  door:            { bus: 'fx' },
  shot:            { bus: 'fx' },
  hit:             { bus: 'fx' },
  hurt:            { bus: 'fx' },
  ui_move:         { bus: 'fx' },
  ui_select:       { bus: 'fx' },
  ui_back:         { bus: 'fx' }
};
const AMB_BY_DISTRICT = ['amb_downtown', 'amb_strip', 'amb_residential',
                         'amb_industrial', 'amb_suburbs', 'amb_farmland', 'amb_strip'];
const MUSIC_BY_TIME = ['music_night', 'music_dusk', 'music_day'];

let audioCtx = null;
const audio = {
  tier: 0, force: 0, unlocked: false, loaded: 0,
  vol: { master: 0.8, music: 0.7, ambient: 0.8, weather: 0.8, fx: 0.8 },
  duck: 1, buffers: {}, els: {}, missing: {}, loops: {},
  master: null, bus: null, oneShots: 0, stepN: 0
};
try { const v = JSON.parse(localStorage.getItem('asciiCityVol')); if (v) Object.assign(audio.vol, v); } catch (e){}
function saveVol(){ try { localStorage.setItem('asciiCityVol', JSON.stringify(audio.vol)); } catch (e){} }
function volBar(k){ const n = Math.round(audio.vol[k] * 10); return '#'.repeat(n) + '.'.repeat(10 - n); }
function stepVol(k, d){ audio.vol[k] = clamp(Math.round((audio.vol[k] + d * 0.1) * 10) / 10, 0, 1); saveVol(); }

// Browsers refuse sound until the page is touched, so the first click or
// keypress does all the startup work: context, tier probe, every load.
function audioUnlock(){
  if (audio.unlocked) return;
  audio.unlocked = true;
  const AC = window.AudioContext || window.webkitAudioContext;
  audioCtx = AC ? new AC() : null;
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
  // fetch resolves (even 404) over http, rejects outright on file://
  const probe = audio.force ? Promise.resolve(audio.force)
    : (audioCtx ? fetch('audio/.probe').then(() => 1, () => 2) : Promise.resolve(2));
  probe.then(t => {
    audio.tier = t;
    if (t === 1){
      audio.master = audioCtx.createGain();
      audio.master.connect(audioCtx.destination);
      audio.bus = {};
      for (const b of ['music', 'ambient', 'weather', 'fx']){
        const g = audioCtx.createGain(); g.connect(audio.master); audio.bus[b] = g;
      }
    }
    for (const name in AUD) audioLoad(name);
  });
  setTimeout(() => {
    if (audio.loaded === 0) toast('no audio files found - see audio/AUDIO.md');
  }, 4000);
}
function audioLoad(name){
  const exts = ['.mp3', '.wav'];
  if (audio.tier === 1){
    (function tryExt(i){
      if (i >= exts.length){ audio.missing[name] = 1; return; }
      fetch('audio/' + name + exts[i])
        .then(r => { if (!r.ok) throw 0; return r.arrayBuffer(); })
        .then(ab => audioCtx.decodeAudioData(ab))
        .then(buf => { audio.buffers[name] = buf; audio.loaded++; })
        .catch(() => tryExt(i + 1));
    })(0);
  } else {
    const el = new Audio();
    let i = 0;
    el.onerror = () => { if (++i < exts.length) el.src = 'audio/' + name + exts[i]; else audio.missing[name] = 1; };
    el.oncanplaythrough = () => { if (!audio.els[name]){ audio.els[name] = el; audio.loaded++; } };
    el.preload = 'auto';
    el.src = 'audio/' + name + exts[0];
  }
}

/* fire-and-forget one-shot; o = { vol, rate, pan } */
function sfx(name, o){
  if (!audio.tier || audio.missing[name]) return;
  o = o || {};
  // the ride warps the ears: pitch bend, plus jitter on static
  const aw = drugFx('aud', 1), aj = drugFx('audJit', 0);
  if (aw !== 1 || aj) o = Object.assign({}, o,
    { rate: (o.rate || 1) * aw * (1 + (aj ? (Math.random() * 2 - 1) * aj : 0)) });
  const bus = AUD[name] ? AUD[name].bus : 'fx';
  if (audio.tier === 1){
    const buf = audio.buffers[name]; if (!buf) return;
    const s = audioCtx.createBufferSource(); s.buffer = buf;
    if (o.rate) s.playbackRate.value = o.rate;
    const g = audioCtx.createGain(); g.gain.value = o.vol !== undefined ? o.vol : 1;
    s.connect(g);
    if (o.pan !== undefined && audioCtx.createStereoPanner){
      const p = audioCtx.createStereoPanner(); p.pan.value = clamp(o.pan, -1, 1);
      g.connect(p); p.connect(audio.bus[bus]);
    } else g.connect(audio.bus[bus]);
    s.start();
  } else {
    const base = audio.els[name];
    if (!base || audio.oneShots > 14) return;      // cap runaway overlaps
    const el = base.cloneNode();
    el.loop = false;
    el.volume = clamp((o.vol !== undefined ? o.vol : 1) * audio.vol[bus] * audio.vol.master, 0, 1);
    if (o.rate){ el.preservesPitch = false; el.playbackRate = o.rate; }
    audio.oneShots++;
    el.onended = () => { audio.oneShots--; };
    el.play().catch(() => { audio.oneShots--; });
  }
}
/* one-shot at a world position: distance attenuation, panned by bearing */
function sfxAt(name, x, y, o){
  const dx = x - cam.x, dy = y - cam.y, d = Math.hypot(dx, dy);
  if (d > 46) return;
  o = Object.assign({}, o);
  o.vol = (o.vol !== undefined ? o.vol : 1) / (1 + d * 0.22);
  o.pan = clamp((dirX * dy - dirY * dx) / Math.max(0.001, d) * 0.9, -1, 1);
  sfx(name, o);
}

/* Looping beds never restart - they hold gain targets and chase them, so a
   district border or a weather change is a crossfade, not a cut. */
function loopVol(name, target){
  let L = audio.loops[name];
  if (!L) L = audio.loops[name] = { g: 0, t: 0, node: null };
  L.t = target;
}
function audioFrame(dt){
  if (!audio.tier) return;
  audio.duck += ((worldFrozen() ? 0.3 : 1) - audio.duck) * Math.min(1, dt * 4);
  if (audio.tier === 1){
    audio.master.gain.value = audio.vol.master;
    audio.bus.music.gain.value = audio.vol.music * audio.duck;
    audio.bus.ambient.gain.value = audio.vol.ambient * audio.duck;
    audio.bus.weather.gain.value = audio.vol.weather * audio.duck;
    audio.bus.fx.gain.value = audio.vol.fx;
  }
  // indoors the street bed goes muffled but does not change district
  const dn = inside ? inside.district : districtAt(cam.x, cam.y);
  const ambT = inside ? 0.45 : 0.9;
  for (let i = 0; i < AMB_BY_DISTRICT.length; i++) loopVol(AMB_BY_DISTRICT[i], i === dn ? ambT : 0);
  for (let i = 0; i < MUSIC_BY_TIME.length; i++) loopVol(MUSIC_BY_TIME[i], i === CFG.timeMode ? 0.9 : 0);
  loopVol('rain_loop', (weather === 2 ? 0.85 : weather === 1 ? 0.45 : 0) * (inside ? 0.3 : 1));
  loopVol('wind_loop', cam.riding ? 0.8 : skating ? clamp((skV - 4) / 6, 0, 0.5) : 0);
  const K = Math.min(1, dt * 1.3);
  for (const name in audio.loops){
    const L = audio.loops[name];
    L.g += (L.t - L.g) * K;
    if (audio.tier === 1){
      if (!L.node && audio.buffers[name]){
        const s = audioCtx.createBufferSource();
        s.buffer = audio.buffers[name]; s.loop = true;
        const g = audioCtx.createGain(); g.gain.value = 0;
        s.connect(g); g.connect(audio.bus[AUD[name].bus]); s.start();
        L.node = g;
      }
      if (L.node) L.node.gain.value = L.g;
    } else {
      const el = audio.els[name];
      if (el){
        el.loop = true;
        const v = clamp(L.g * audio.vol[AUD[name].bus] * audio.vol.master * audio.duck, 0, 1);
        el.volume = v;
        if (v > 0.004 && el.paused) el.play().catch(() => {});
        else if (v <= 0.004 && !el.paused) el.pause();
      }
    }
  }
}

  const d = DRUGFX[id];

    const rem = Math.min(d.dur * 1.5, drug.dur - drug.t + d.dur);
    drug.t = Math.min(drug.t, d.onset || 0.5);  // the high never restarts
    drug.dur = drug.t + rem;

}
function drugFx(k, dflt){
  if (!drug || drug.fx[k] === undefined) return dflt;
  const e = drug.env === undefined ? 1 : drug.env;   // ride the envelope
  return dflt + (drug.fx[k] - dflt) * e;
}

function refreshWear(){

  // the outer layer is whichever coat cost the most
  let outer = null, best = -1;
  for (const id of w){
    const d = ITEMS[id];
    if (!d || d.cat !== 'clothing' || OUTFIT_COL[id] === undefined) continue;
    if ((d.price || 0) > best){ best = d.price || 0; outer = id; }

  player.outfit = outer;

function drugTick(dt){
  if (!drug) return;
  drug.t += dt;
  const f = drug.fx;
  const on = Math.min(1, drug.t / (f.onset || 0.5));
  const off = Math.min(1, Math.max(0, (drug.dur - drug.t) / (f.fall || 2)));
  drug.env = on * on * (3 - 2 * on) * off;      // smoothstep in, ease out
  if (f.hpDrain){
    const late = drug.t > drug.dur - 10;            // the bill arrives at the end
    player.hp = Math.max(1, player.hp -
                f.hpDrain * (late ? 3 : drug.env) * dt);

  add later - there has to be somebody standing there, and it has to be the

const COAT_COL = { puffer: C.dataDk, vest: C.nAmber, workjacket: C.tlAmb,
                   tracksuit: C.nCyan, hoodie: C.rail };
const BODY_W = 0.62, BODY_H = 1.76, BODY_DEP = 0.55;

/* roles: S skin, P trousers, T shoes, B shirt, K coat, X ice, W trim */
function playerBodyVol(worn){
  const has = id => worn.indexOf(id) >= 0;
  const outer = ['puffer', 'vest', 'workjacket', 'tracksuit', 'hoodie']
                  .find(id => has(id)) || null;
  const shirt = has('tee') ? 'tee' : null;
  const shoes = has('runners') ? 'runners' : has('sneakers') ? 'sneakers' : null;
  const R = ROLE;
  return function(aw, vd, ah){
    const v = new Uint8Array(aw * vd * ah);
    const set = (x, y, z, role) => {
      if (x < 0 || y < 0 || z < 0 || x >= aw || y >= vd || z >= ah) return;
      v[(z * vd + y) * aw + x] = role;
    };
    // z is measured DOWN from the top of the art, so build from the head
    const zOf = h => Math.round((1 - h / BODY_H) * (ah - 1));   // h in metres
    const cx = (aw - 1) / 2, cy = (vd - 1) / 2;
    const slab = (h0, h1, halfW, halfD, role, xoff) => {
      const z0 = zOf(h1), z1 = zOf(h0);
      for (let z = Math.min(z0, z1); z <= Math.max(z0, z1); z++)
        for (let y = 0; y < vd; y++)
          for (let x = 0; x < aw; x++){
            if (Math.abs(x - cx - (xoff || 0)) > halfW) continue;
            if (Math.abs(y - cy) > halfD) continue;
            set(x, y, z, role);
          }
    };
    // --- the person ---------------------------------------------------
    slab(0.00, 0.10, 2.6, 2.6, shoes ? R.W : R.T);          // feet
    slab(0.10, 0.86, 1.6, 1.6, R.P, -2.4);                  // legs
    slab(0.10, 0.86, 1.6, 1.6, R.P,  2.4);
    slab(0.86, 1.42, 4.2, 2.4, shirt || outer ? R.B : R.S);  // torso
    slab(0.92, 1.38, 1.2, 1.9, R.S, -5.2);                  // arms
    slab(0.92, 1.38, 1.2, 1.9, R.S,  5.2);
    slab(1.42, 1.52, 2.0, 2.0, R.S);                        // neck
    slab(1.52, 1.76, 3.0, 2.6, R.S);                        // head
    // --- what you put on ----------------------------------------------
    if (outer){                                             // the coat wins
      slab(0.84, 1.46, 4.6, 2.7, R.K);
      slab(0.90, 1.40, 1.5, 2.1, R.K, -5.3);                // sleeves
      slab(0.90, 1.40, 1.5, 2.1, R.K,  5.3);
      if (outer === 'puffer'){                              // horizontal baffles
        for (let h = 0.90; h < 1.46; h += 0.16) slab(h, h + 0.05, 4.8, 2.8, R.W);
      } else if (outer === 'tracksuit'){                    // the four stripes
        slab(0.86, 1.44, 4.7, 0.6, R.W, -3.4);
        slab(0.86, 1.44, 4.7, 0.6, R.W,  3.4);
      } else if (outer === 'hoodie'){                       // the hood, bunched
        slab(1.44, 1.58, 3.4, 2.9, R.K);
      } else if (outer === 'vest'){                         // open at the front
        slab(0.88, 1.44, 4.7, 0.9, R.B, 0);
      }
    }
    if (has('workjacket') && outer !== 'workjacket')        // worn under
      slab(0.88, 1.30, 4.4, 2.6, R.K);
    if (shoes) slab(0.00, 0.14, 2.8, 2.8, R.W);             // the good shoes
    if (has('shades')) slab(1.62, 1.68, 3.1, 2.8, R.X);     // across the eyes
    if (has('chain')) slab(1.34, 1.44, 2.6, 2.5, R.X);      // heavy on the chest
    if (has('ring')) slab(1.00, 1.06, 1.4, 2.0, R.X, 5.4);  // one knuckle
    if (has('watch')) slab(1.06, 1.12, 1.4, 2.0, R.X, -5.4);
    return v;
  };
}

      const names = Object.keys(TAG_ART);

      // the renderer floors the hit point: approaching from +x/+y the hit

function applyDeltaToProps(){
  let removed = false;
  for (let i = props.length - 1; i >= 0; i--){
    const p = props[i];
    if (p.k === PK_ITEM && p.key && worldDelta.taken[p.key]){ props.splice(i, 1); removed = true; }
  }
  if (removed){ indexProps(); indexSpriteProps(); }
}

/* ---- saves: seed + camera + player + delta, three slots -------------------

   room itself regenerates from its seed, so nothing in it needs storing.  */
const saveKey = n => 'asciiCitySave' + n;
try {   // migrate the old single-slot save into slot 1, once
  const old = localStorage.getItem('asciiCitySave');
  if (old && !localStorage.getItem(saveKey(1))){
    localStorage.setItem(saveKey(1), old);
    localStorage.removeItem('asciiCitySave');
  }
} catch (e){}
function readSlot(n){
  try {
    const s = JSON.parse(localStorage.getItem(saveKey(n)));
    return s && s.v === 1 ? s : null;
  } catch (e){ return null; }
}
function anySave(){
  try { return !!(localStorage.getItem(saveKey(1)) || localStorage.getItem(saveKey(2)) ||
                  localStorage.getItem(saveKey(3))); }
  catch (e){ return false; }
}
function slotLabel(s){
  if (!s) return 'EMPTY';
  const d = new Date(s.at);
  return (d.getMonth() + 1) + '/' + d.getDate() + ' ' +
         String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
}
function openSlotMenu(kind){
  const slots = [readSlot(1), readSlot(2), readSlot(3)];
  const items = slots.map((s, i) => ({
    label: 'SLOT ' + (i + 1),
    value: () => slotLabel(s),
    hint: s ? (kind === 'save' ? 'overwrites: ' : '') +
              'hp ' + s.player.hp + '/' + s.player.maxHp +
              '   cr ' + s.player.credits + '   ' +
              (s.player.outfit && ITEMS[s.player.outfit]
                 ? ITEMS[s.player.outfit].name.split(' ').pop().toLowerCase() : 'no coat') +
              (s.player.bling && ITEMS[s.player.bling]
                 ? ' + ' + ITEMS[s.player.bling].name.split(' ').pop().toLowerCase() : '')
            : (kind === 'save' ? 'an empty slot' : 'nothing saved here'),
    act(){
      if (kind === 'save'){ saveGame(i + 1); popMode(); }
      else if (s) loadGame(i + 1);
      else toast('slot ' + (i + 1) + ' is empty');
    }
  }));
  items.push({ sep: true });
  items.push({ label: 'BACK', act(){ popMode(); } });
  pushMode(makeListMenu({ name: kind + '-slots',
                          title: kind === 'save' ? 'SAVE GAME' : 'LOAD GAME', items }));
}
function saveGame(n){
  const pos = inside
    ? { x: EXT.camX, y: EXT.camY, ang: EXT.camAng, pitch: EXT.camPitch }
    : { x: cam.x, y: cam.y, ang: cam.ang, pitch: cam.pitch };
  const s = { v: 1, at: Date.now(), seed: worldSeed, timeMode: CFG.timeMode, weather,
              clock, dayCount, fogLevel,
              cam: pos, player, delta: worldDelta, tags };
  try {
    localStorage.setItem(saveKey(n), JSON.stringify(s));
    sfx('ui_select', { vol: 0.5 });
    toast('saved to slot ' + n + (inside ? ' - you will wake on the street outside' : ''));
  } catch (e){ toast('save failed - storage unavailable'); }
}
function loadGame(n){
  const s = readSlot(n);
  if (!s){ toast('no save in slot ' + n); return; }
  closeMenus();
  CFG.timeMode = s.timeMode | 0;
  clock = s.clock !== undefined ? s.clock : 20;
  dayCount = s.dayCount | 0;
  weather = s.weather | 0; flash = 0;
  if (s.fogLevel) fogLevel = s.fogLevel;
  newWorld(s.seed);                          // deterministic rebuild, fresh delta
  worldDelta = s.delta || { taken: {} };
  applyDeltaToProps();
  tags = s.tags || {};                          // your marks outlive the rewind
  if (worldDelta.cut)                           // and the cut poles stay dead
    for (const p of props)
      if ((p.k === PK_CAM || p.k === PK_LAMP) &&
          worldDelta.cut[(p.y | 0) * MAP + (p.x | 0)]) p.dead = 1;
  // Restore INTO the objects that already exist rather than swapping them
  // out. Long-lived closures - dialogue trees above all - hold references to
  // player.quests and player.qvar for the life of the world, and replacing
  // those objects leaves every one of them reading a snapshot that can never
  // change again. Keeping identity means a load is invisible to them.
  for (const k in s.player){
    const v = s.player[k], cur = player[k];
    if (Array.isArray(v) && Array.isArray(cur)){
      cur.length = 0;
      for (let i = 0; i < v.length; i++) cur.push(v[i]);
    } else if (v && cur && typeof v === 'object' && typeof cur === 'object' &&
               !Array.isArray(v) && !Array.isArray(cur)){
      for (const kk in cur) delete cur[kk];
      Object.assign(cur, v);
    } else player[k] = v;
  }
  if (!player.quests) player.quests = {};      // saves from before quests existed
  if (!player.qvar) player.qvar = {};
  cam.x = s.cam.x; cam.y = s.cam.y; cam.ang = s.cam.ang; cam.pitch = s.cam.pitch;
  cam.riding = null; cam.z = 1.62; sitting = null; skating = false; resetSkate();
  if (!walkG[clamp(cam.y | 0, 0, MAP - 1) * MAP + clamp(cam.x | 0, 0, MAP - 1)]){
    const sp = freeSpotNear(cam.x, cam.y);
    cam.x = sp[0]; cam.y = sp[1]; faceClear();
  }
  if (!player.worn){                          // saves from before layering
    player.worn = [];
    if (player.outfit) player.worn.push(player.outfit);
    if (player.bling && player.bling !== player.outfit) player.worn.push(player.bling);
  }
  refreshWear();                              // the arms wear what was saved
  if (!player.hotbar) player.hotbar = [null, null, null];
  drug = null; jamT = 0; snifferT = 0; bakeKey = -1;   // no ride survives a rewind
  if (GL) glBuildPalette(); else buildAtlases();
  bgGrad = null; buildBackground();
  fade = 1;
  toast('save loaded');
}

/* a condemned tower to send the player into, remembered once chosen */
let mqDgnBld = null;
function mqDungeon(){
  if (mqDgnBld === null){
    let best = null, bd = 1e9;
    for (const d of doors){
      const b = buildings.find(bb => bb.id === d.b);
      if (!b || !isDungeon(b)) continue;
      const dd = Math.hypot(d.x - HIDEOUT.x, d.y - HIDEOUT.y);
      if (dd < bd){ bd = dd; mqDgnBld = { x: d.x, y: d.y }; }
    }
    if (mqDgnBld === null) mqDgnBld = HIDEOUT;
  }
  return { x: mqDgnBld.x, y: mqDgnBld.y, name: 'THE CONDEMNED TOWER' };
}

/* a camera catching you during mq16 spawns a wave */
function mqTowerSeen(){
  if (!mqLive('mq16') || !inside) return;
  if (player.qvar.mq16waveT && worldTime - player.qvar.mq16waveT < 20) return;
  player.qvar.mq16waveT = worldTime;
  for (let i = 0; i < 2; i++){
    const a = spawnClearInterior('enforcer');
    if (a){ a.aggro = 1; a.atk = 10; a.interior = 1; }
  }
  toast('the tower saw you - security is moving');
  sfx('shot', { vol: 0.6, rate: 0.6 });
}
function spawnClearInterior(kind){
  if (!inside) return null;
  // interiors live at the IOX/IOY origin, not at the street footprint
  for (let t = 0; t < 40; t++){
    const x = IOX + 1 + Math.random() * 13;
    const y = IOY + 1 + Math.random() * 13;
    if (inMap(x | 0, y | 0) && walkG[(y | 0) * MAP + (x | 0)])
      return spawnActor(kind, x, y, { name: 'SECURITY', brain: 'hostile', hp: 45,
                                      shirt: C.carC, skin: C.dataDk });
  }
  return null;
}

function questStage(id){ return player.quests[id]; }
/* An objective that names a place cannot be a fixed string: the places are
   dealt per city. Stage logs may be functions, and everything that shows one
   asks for it through here. */
function questLog(st){
  const base = typeof st.log === 'function' ? st.log() : st.log;
  // a job you have no tool for is a shopping trip with a job after it
  const need = toolNeeded(st);
  return need ? toolWords(need) + ' first - ' + base : base;
}
/* Where the scrap actually is. Depots are the only rooms that stock it, and
   the only use dealt in the industrial regions, so the nearest one is both
   the right errand and the right direction. */
const DEPOT_SCRAP = 5;                   // what every depot keeps on its floor
/* How much of a depot's scrap is still lying there. The drops are keyed
   'b<id>_0' upward, so this is answerable without opening the room. */
function depotScrapLeft(b){
  let n = 0;
  for (let i = 0; i < DEPOT_SCRAP; i++)
    if (!worldDelta.taken['b' + b.id + '_' + i]) n++;
  return n;
}
/* The nearest depot that can actually fill the order. An errand for five
   units should not walk you to a shed you emptied an hour ago - if none has
   enough left, take the fullest one within reach rather than the nearest. */
function nearestDepot(need){
  let best = null, bd = 1e9, alt = null, ad = -1;
  for (const d of doors){
    const b = buildings[d.b];
    if (!b || buildingUse(b) !== 'depot') continue;
    const dd = Math.abs(d.x - cam.x) + Math.abs(d.y - cam.y);
    const left = depotScrapLeft(b);
    if (!need || left >= need){
      if (dd < bd){ bd = dd; best = d; }
    } else if (left > 0 && (left > ad || (left === ad && dd < bd))){
      ad = left; alt = d;
    }
  }
  return best || alt;
}
/* Where to buy a thing. Every trade carries its whole list, so the nearest
   counter of the right trade is a promise, not a hope. */
function nearestShopFor(item){
  let best = null, bd = 1e9;
  for (const d of doors){
    const b = buildings[d.b];
    if (!b) continue;
    const u = buildingUse(b);
    const tr = u && USES[u] && USES[u].trade;
    if (!tr || !SHOP_TYPES[tr] || SHOP_TYPES[tr].stock.indexOf(item) < 0) continue;
    const dd = Math.abs(d.x - cam.x) + Math.abs(d.y - cam.y);
    if (dd < bd){ bd = dd; best = d; }
  }
  return best;
}
function supplyMark(d, what){
  return d && { x: d.x, y: d.y, name: regionName(d.x, d.y) + ' ' + what };
}
/* A counter that sells the thing, named by its trade sign so the marker
   matches the word over the door. Every shop has somebody behind it, so
   this is somewhere you can actually buy. */
function shopMark(item){
  const d = nearestShopFor(item);
  if (!d) return null;
  const u = buildingUse(buildings[d.b]);
  const tr = u && USES[u] && USES[u].trade;
  return supplyMark(d, SHOP_SIGN[tr] || 'SHOP');
}
/* Which of a stage's required tools you are missing. A stage may name one
   ('saw') or a choice of them (['saw','jammer']) - carrying any one of the
   set counts. Returns null once you are equipped for the job. */
function toolNeeded(st){
  if (!st || !st.tool) return null;
  const list = Array.isArray(st.tool) ? st.tool : [st.tool];
  for (let i = 0; i < list.length; i++) if (invCount(list[i]) > 0) return null;
  return list;
}
function toolWords(list){
  const n = list.map(id => (ITEMS[id] && ITEMS[id].name) || id);
  return n.length === 1 ? n[0] : n.slice(0, -1).join(', ') + ' or ' + n[n.length - 1];
}
/* The city names its own industry - GANTRY ROW, RUSTYARD, THE SMELTERS - and
   those names are on the map. Quests use them instead of inventing one. */
function indPlaces(join){
  const n = REGIONS.filter(r => r.type === D_IND).map(r => r.name);
  return n.length === 0 ? 'the industrial yards'
       : n.length === 1 ? n[0]
       : n.slice(0, -1).join(', ') + ' ' + (join || 'or') + ' ' + n[n.length - 1];
}
function compassTo(x, y, fx, fy){
  const dx = x - (fx === undefined ? cam.x : fx), dy = y - (fy === undefined ? cam.y : fy);
  return (Math.abs(dy) > Math.abs(dx) * 0.5 ? (dy > 0 ? 'south' : 'north') : '') +
         (Math.abs(dx) > Math.abs(dy) * 0.5 ? (dx > 0 ? 'east' : 'west') : '');
}
/* Whoever's card is open. Read from the stack rather than tracked in a
   variable, so it cannot be left pointing at somebody you stopped talking to
   ten minutes ago. */
function speakingTo(){
  for (let i = modeStack.length - 1; i >= 0; i--){
    const m = modeStack[i];
    if (m.name === 'dialog' && m.title) return m.title;
  }
  return null;
}
function startQuest(id){
  if (player.quests[id] !== undefined) return;
  player.quests[id] = 0;
  // remember whose job this is - the fee gets handed over in person - and
  // where to find them again. Said indoors, that is the door you came in by;
  // a name alone is no use once they are behind a wall.
  const who = speakingTo();
  if (who){
    (player.qvar.giver = player.qvar.giver || {})[id] = who;
    const src = actors.find(x => x.name === who);
    const at = inside && inside.door ? { x: inside.door.x, y: inside.door.y }
             : src ? { x: src.x, y: src.y } : null;
    if (at) (player.qvar.giverAt = player.qvar.giverAt || {})[id] = at;
  }
  player.track = id;
  sfx('ui_select', { vol: 0.6, rate: 0.8 });
  toast('new objective: ' + QUESTS[id].name);
}
/*--------------------------- what a job is worth ---------------------------
  Every quest pays on completion. The main line climbs by act - errands on
  the red mile pay errand money, and by the time you are fighting up a
  tower the cell is handing over everything it has. A few jobs also pay in
  dialogue, mid-handshake ("here - forty credits"); those are counted here,
  so the number below is the REST of the fee, and the total is what the job
  was actually worth. The three that end the story pay nothing: nobody is
  left holding a purse.
============================================================================*/
/* The line pays for the line and very little else. Each act covers the gear
   that act FORCES you to own, plus a couple of meals, and stops - act one
   asks for a burner, a hacksaw, firecrackers and a board, which is 320
   credits against 285 of wages and the 120 you start with. Everything past
   that - a gun, a coat, a second medkit, the cam-jack, a home - is what the
   side work, the shifts and the things you should not be doing are for.
   It used to hand out 3345 across the main line, which bought all of it
   twice over and left nothing to want. */
const QUEST_PAY = {
  // ---- the odd jobs the city hands out ----
  scrap: 0,            // paid per unit, at the counter
  noodles: 20,         // the drifter already presses 30 on you
  test: 40,            // the chemist pays 60 in the room
  quiet: 120,
  sphere: 35,          // the cook pays 40 for the story
  // ---- Vance and the runner ----
  wheels1: 25, wheels2: 30, wheels3: 220, wheels4: 40, wheels5: 150,
  /* Front-loaded inside each act, because the gear is demanded before the
     wage that buys it arrives. mq4 is the biggest purse in act one for one
     reason: mq5 wants a board, and the courier run is what pays for it. */
  // ---- act one: proving you turn up ----
  mq1: 0, mq2: 30, mq3: 35, mq4: 95, mq5: 30, mq6: 25, mq7: 50, mq8: 65,
  // ---- act two: the cell trusts you with doors ----
  mq9: 0, mq10: 30, mq11: 35, mq12: 50, mq13: 0, mq14: 0,
  mq15: 40, mq16: 65,
  // ---- act three: the plan, and what it costs ----
  mq17: 0, mq18: 60, mq19: 45, mq20: 30, mq21: 45, mq22: 40,
  mq23: 0, mq24: 0,
  // ---- act four: nobody is counting any more ----
  mq25: 0, mq26: 50, mq27: 85, mq28: 125, mq29: 0, mq30: 0,
  /* the other side of it. Corpo money is not cell money - these are the
     first purses in the game that are not the bare minimum, because that is
     the whole difference between the two employers. The last one pays in a
     deed, which is worth more than all of them. */
  sp1: 150, sp2: 200, sp3: 260, sp4: 340, sp5: 0
};
/* Finishing a job is not the same as being paid for one. Cutting three
   cameras in an alley used to put the fee straight in your pocket, which made
   the walk back to whoever asked for it meaningless. The money now sits on
   the books until you are standing in front of them again - unless you were
   already standing there when the job closed, which is most of the errands
   that end in "report back". */
function payQuest(id){
  const n = QUEST_PAY[id];
  if (!n) return;
  const who = (player.qvar.giver || {})[id];
  if (!who || who === speakingTo()){          // face to face already
    player.credits += n;
    toast('paid: ' + n + ' cr');
    sfx('ui_select', { vol: 0.6, rate: 1.35 });
    return;
  }
  (player.qvar.owed = player.qvar.owed || {})[id] = n;
  toast('job done - ' + who + ' owes you ' + n + ' cr');
  sfx('ui_select', { vol: 0.5, rate: 0.9 });
}
/* settling up, the moment their card opens */
function payOwed(who){
  const owed = player.qvar.owed;
  if (!owed || !who) return;
  const giver = player.qvar.giver || {};
  let sum = 0, jobs = 0;
  for (const id in owed)
    if (giver[id] === who){ sum += owed[id]; jobs++; delete owed[id]; }
  if (!sum) return;
  player.credits += sum;
  toast(who + ' settles up: ' + sum + ' cr for ' + jobs + (jobs > 1 ? ' jobs' : ' job'));
  sfx('ui_select', { vol: 0.7, rate: 1.35 });
  // paid, and the walk back is over: pick up whatever job is still open so
  // the line has somewhere to go next instead of going out
  if (!player.track)
    player.track = Object.keys(player.quests).find(k => typeof player.quests[k] === 'number') || null;
}
function owedTo(who){
  const owed = player.qvar.owed, giver = player.qvar.giver || {};
  let sum = 0;
  for (const id in owed || {}) if (giver[id] === who) sum += owed[id];
  return sum;
}
function advanceQuest(id){
  const q = QUESTS[id];
  // a finished quest has 'done' where its stage number was, and 'done' + 1
  // is a string that indexes nothing - any second call used to crash here
  if (!q || typeof player.quests[id] !== 'number') return;
  let s = player.quests[id] + 1;
  if (s >= q.stages.length){
    player.quests[id] = 'done';
    sfx('ui_select', { vol: 0.7, rate: 0.7 });
    toast('completed: ' + q.name);
    payQuest(id);
    if (id === 'mq30'){                        // the line closes on a betrayal
      player.qvar.act = 4;
      const rk = actors.find(a => a.name === 'ROOK');
      if (rk){ rk.brain = 'hostile'; rk.tree = null; rk.dialog = null;
               rk.hp = 220; rk.maxHp = 220; rk.atk = 12; rk.spd = 2.4; rk.aggro = 0; }
      toast('the lights stay on. the cell hunts you now. the city is yours to keep');
      // and the towers, who were watching, start dialling
      startQuest('sp1'); player.track = 'sp1';
      setTimeout(() => toast('an unknown number: "MERIDIAN. Downtown. Ask for the manager."'), 4000);
    }
    // The job is finished, but if it finished away from whoever handed it
    // out then the next step is the walk back to be paid - not some other
    // job picked out of the list by key order. Drop the track so the owed
    // pointer wins; payOwed puts you back on a live job afterwards.
    if (player.track === id)
      player.track = (player.qvar.owed && player.qvar.owed[id]) ? null
        : Object.keys(player.quests).find(k => typeof player.quests[k] === 'number') || null;
  } else {
    player.quests[id] = s;
    sfx('ui_select', { vol: 0.5 });
    toast(questLog(q.stages[s]));
  }
}

function questTarget(){

    const st = QUESTS[id].stages[player.quests[id]];

    // job needs, so the marker walks you to a counter that sells it.
    const need = toolNeeded(st);

    }
    if (st && st.target){

/*============================== 13f. COMBAT ================================
  A hitscan pistol against melee hostiles. The shot ray is 2D - everyone is
  person-height - but it respects walls above chest height, so a 1.05 shop
  counter is cover you can shoot over and a wall is not. Hostiles are plain
  actors with a 'hostile' brain: stand until they see you, rush, slash on a
  cooldown. Death costs half your credits and a walk back from the metro.
============================================================================*/

/* ---- corruption: the system keeps a ledger --------------------------------
   Crimes raise it, two clean days lower it, the fixer erases it for money.
   1-2: the cameras notice you. 3-5: prices up a quarter, a third of doors
   refuse you. 6+: enforcers come looking. Ped-sourced corruption caps at 2
   (assault three different people = +1; killing = +1 each, into the cap). */
/* Who is actually watching you.

   Four places asked this and only ONE of them wondered whether there was a
   building in the way. So the EYES readout counted every camera within nine
   tiles through walls, round corners and across whole blocks - and the
   LEDGER did the same, which is the part that mattered: a crime committed in
   a sealed alley still found a witness and still went on your record.

   One answer now, and the readout, the ledger, the whisper and the hiding
   check all read it. A camera needs a live pole, nine tiles, and an
   uninterrupted line to you - the same line-of-sight test the rest of the
   game uses, so a wall that stops a conversation stops a camera. */
const CAM_SEE = 9;                              // tiles a flock pole covers
const _qEye = [];
function flockEyes(){
  if (jamT > 0) return 0;                       // a jammed flock sees nothing
  let n = 0;
  for (const p of gridQuery(propGrid, cam.x, cam.y, CAM_SEE, _qEye))
    if (p.k === PK_CAM && !p.dead && sightClear(p.x, p.y, cam.x, cam.y)) n++;
  return n;
}
function flockSees(){ return flockEyes() > 0; } // the ledger needs a witness
function crimeEvent(n, why){
  if (!flockSees()){                            // no witness, no record
    toast('no cameras saw that');
    return;
  }
  if (n <= 0) return;
  player.corruption = Math.min(10, player.corruption + n);
  player.qvar.lastCrimeDay = dayCount;
  sfx('ui_back', { vol: 0.6, rate: 0.5 });
  toast('the system notices: +' + n + ' corruption (' + why + ')');
}
function pedCrime(n, why){
  // the cap is on OUTSTANDING ped-sourced corruption: as the score decays
  // (or the fixer clears it), headroom comes back with it
  const pc = Math.min(player.qvar.pedCorr || 0, player.corruption);
  if (pc >= 2) return;
  const add = Math.min(n, 2 - pc);
  player.qvar.pedCorr = pc + add;
  crimeEvent(add, why);

function dayTick(){                           // called once per day rollover
  dayCount++;

  // steep enough that waiting it out should not be most of an evening
  if (player.corruption > 0 && dayCount - (player.qvar.lastCrimeDay || 0) >= 1){
    player.corruption--;

}

/* Which piece of work you are on: the stage you are at, or - when no stage
   is live - whoever is holding your money. The walk back to be paid is a
   step like any other, and keying only off the tracked stage returned '' the
   moment a job finished, so the tick bailed before it ever asked
   questTarget() where to go. */
function questLeg(){
  const id = player.track;
  if (id && typeof player.quests[id] === 'number') return id + '#' + player.quests[id];
  const owed = player.qvar.owed;
  if (owed){
    const ids = Object.keys(owed);
    if (ids.length) return 'owed#' + ids.sort().join(',');
  }
  return '';
}
/* ...and WHERE that work is sending you, which is not the same question. A
   stage can hold still while its destination moves out from under it: carry
   three scrap and the watcher's job stops pointing at the depot and starts
   pointing at the watcher; buy the burner and a tool job stops pointing at
   the counter. The stage number never changed, so a key built from it alone
   said 'same leg, leave the line alone' and the walk home was never drawn.
   The destination's name is part of the key for that reason. */
function questKey(t){
  const leg = questLeg();
  if (!leg) return '';
  if (t === undefined) t = questTarget();
  return leg + (t ? '@' + t.name : '');
}
function autoPathTick(){
  if (!autoPath){ autoPathKey = ''; return; } // toggling it on redraws anyway
  // Most jobs are handed over indoors, where there is no street to draw on.
  // Do NOT count the objective as dealt with - hold it until you are back
  // out, or the walk you were given the line for happens without one.
  if (inside) return;
  const leg = questLeg();
  const t = questTarget();
  const key = questKey(t);
  if (key === autoPathKey) return;            // same work, same place
  if (!t){
    // Nowhere to go. If the line is already drawn for THIS leg then whatever
    // it was pointing at is done with - you bought the tool, and the job
    // itself has no address - so take it down. If we have not drawn for this
    // leg at all, the target simply cannot answer yet (an actor not spawned,
    // a giver behind a door): hold, and draw it the moment it resolves.
    if (leg && autoPathKey.indexOf(leg + '@') === 0){
      autoPathKey = key;
      clearWaypoint(true);
    }
    return;
  }
  autoPathKey = key;
  setWaypoint(t.x, t.y, t.name);
}
function setWaypoint(wx, wy, autoName){
  // snap to the nearest walkable tile so the line has somewhere to end
  let tx = -1, ty = -1;
  outer:
  for (let r = 0; r <= 8; r++)
    for (let dy = -r; dy <= r; dy++)
      for (let dx = -r; dx <= r; dx++){
        if (Math.max(Math.abs(dx), Math.abs(dy)) !== r) continue;
        const x = (wx | 0) + dx, y = (wy | 0) + dy;
        if (inMap(x, y) && walkG[y * MAP + x]){ tx = x; ty = y; break outer; }
      }
  if (tx < 0){ if (!autoName) toast('nothing to walk on there'); return false; }
  waypoint = { x: tx + 0.5, y: ty + 0.5 };
  wayT = 0;
  if (autoName){
    toast('the line draws itself to ' + autoName);
  } else {
    // a line of your own takes the job's place until the job changes
    autoPathKey = questKey();
    toast('waypoint set - follow the red line');
  }
  sfx('ui_select', { vol: 0.5, rate: 1.2 });
  return true;
}
function clearWaypoint(quiet){
  if (!quiet) autoPathKey = questKey();        // cleared on purpose: stay cleared
  waypoint = null; wayOn = false;
  if (wayG) for (const i of waySet) wayG[i] = 0;
  waySet.length = 0;
  if (!quiet) toast('you have arrived');
}
function wayTick(dt){
  if (inside) return;
  // During the run the line is not drawn TO anywhere - it IS the route, the
  // same array VESPER is running and the same one the pipes were laid along.
  // Routed independently the two agree for a while and then pick different
  // sides of a block, and from behind that reads as her taking a different
  // way home rather than a faster one. One path, one line, one lead.
  if (RUN && RUN.path.length){
    wayT -= dt;
    if (wayT > 0) return;
    wayT = 0.5;
    if (!wayG) wayG = new Uint8Array(MAP * MAP);
    for (const i of waySet) wayG[i] = 0;
    waySet.length = 0;
    // from the point on the route you are nearest to, onward
    let bi = 0, bd = 1e9;
    for (let i = 0; i < RUN.path.length; i++){
      const c = RUN.path[i], dx = (c % MAP) + 0.5 - cam.x, dy = ((c / MAP) | 0) + 0.5 - cam.y;
      const d = dx * dx + dy * dy;
      if (d < bd){ bd = d; bi = i; }
    }
    for (let i = bi; i < RUN.path.length; i++){ wayG[RUN.path[i]] = 1; waySet.push(RUN.path[i]); }
    wayOn = true;
    return;
  }
  if (!waypoint) return;
  if (Math.hypot(waypoint.x - cam.x, waypoint.y - cam.y) < 3){
    clearWaypoint(); sfx('ui_select', { vol: 0.6, rate: 0.8 }); return;
  }
  wayT -= dt;
  if (wayT > 0) return;
  wayT = 1.0;
  const sx0 = clamp(cam.x | 0, 0, MAP - 1), sy0 = clamp(cam.y | 0, 0, MAP - 1);
  const path = walkG[sy0 * MAP + sx0]
    ? astar(sx0, sy0, waypoint.x | 0, waypoint.y | 0, 90000) : null;
  if (!wayG) wayG = new Uint8Array(MAP * MAP);
  for (const i of waySet) wayG[i] = 0;
  waySet.length = 0;
  if (path){
    for (const c of path){ wayG[c] = 1; waySet.push(c); }
    wayOn = true;
  } else wayOn = false;                          // unroutable: the dots wait
}
function enfCap(){
  const c = player.corruption;
  return c >= 6 ? 6 : c >= 4 ? 3 : c >= 2 ? 2 : 0;
}
function spawnEnforcer(nearR, aggro){

  if (!t) return null;
  const a = spawnActor('enforcer', t[0] + 0.5, t[1] + 0.5,
    { name: 'ENFORCER', brain: 'hostile', hp: 40, shirt: C.carC, skin: C.dataDk });
  a.aggro = aggro ? 1 : 0; a.atk = 9;
  return a;

function heliFrame(dt){
  if (!heli) return;
  heli.t -= dt;
  if (heli.t <= 0 && player.corruption < 6){ heli = null; toast('the rotor noise fades'); return; }
  if (heli.t <= 0) heli.t = 20;                // at six it just circles back
  // the airframe drifts toward a point behind the player; the light hunts
  heli.x += (cam.x + Math.cos(worldTime * 0.4) * 8 - heli.x) * 0.4 * dt;
  heli.y += (cam.y + Math.sin(worldTime * 0.4) * 8 - heli.y) * 0.4 * dt;
  const sdx = cam.x - heli.sx, sdy = cam.y - heli.sy;
  const sd = Math.hypot(sdx, sdy) || 1;
  const chase = 2.6 + player.corruption * 0.3; // the light gets faster with heat
  heli.sx += sdx / sd * Math.min(sd, chase * dt);
  heli.sy += sdy / sd * Math.min(sd, chase * dt);
  // pinned in the light?
  if (sd < 1.6){
    heli.lock += dt;
    if (((worldTime * 3) | 0) & 1) hurtT = Math.max(hurtT, 0.06);   // the glare
    for (const a of actors)                    // the light holds their eyes on you
      if (a.kind === 'enforcer') a.aggro = 1;
    if (heli.lock > 3 && player.corruption >= 6 && swatT <= 0){
      swatT = 30;                              // the drop team
      let n = 0;
      for (let i = 0; i < 3; i++) if (spawnEnforcer(4, true)) n++;
      if (n) toast('ropes hit the pavement - SWAT drop');
      sfx('door', { rate: 0.5, vol: 0.8 });
    }
  } else heli.lock = Math.max(0, heli.lock - dt * 2);
  // the machine is heard, seen high up, and the light shows on the street
  heli.rot -= dt;
  if (heli.rot <= 0){
    heli.rot = 0.55;
    sfx('footstep', { vol: 0.5, rate: 0.42 });
    addFx(heli.x, heli.y, 8.5); addFx(heli.x + 0.6, heli.y, 8.2);
  }
  heli.beam -= dt;
  if (heli.beam <= 0){
    heli.beam = 0.12;
    for (let i = 0; i < 5; i++){               // the pool of light, sketched
      const th = Math.random() * Math.PI * 2, r = Math.random() * 1.6;
      addFx(heli.sx + Math.cos(th) * r, heli.sy + Math.sin(th) * r, 0.05);
    }
  }
  swatT = Math.max(0, swatT - dt);
}

  if (inside || cam.riding || skating){ toast('stand on your own feet first'); return; }
  if (player.corruption <= 0 && !actors.some(a => a.kind === 'enforcer')){
    toast('nobody is looking for you'); return;
  }
  hideT = 6;
  hideX = cam.x; hideY = cam.y;
  toast('hold still - become nobody');
  sfx('ui_move', { vol: 0.4, rate: 0.5 });
}
let hideX = 0, hideY = 0;
function hideFrame(dt){
  if (hideT <= 0) return;
  if (Math.hypot(cam.x - hideX, cam.y - hideY) > 0.4){
    hideT = 0; toast('you moved - still on the books'); return;
  }
  if (hurtT > 0.5){ hideT = 0; toast('a hit is a location'); return; }
  // seen: a live camera with a line on you, or standing in the spotlight.
  // This already asked properly; it reads the shared answer now, which also
  // means a jammed flock cannot give away a hiding place.
  if (flockEyes() > 0){
    hideT = 0; toast('a camera has you - kill its eye or move on'); return;
  }
  if (heli && Math.hypot(cam.x - heli.sx, cam.y - heli.sy) < 2.2){
    hideT = 0; toast('not in the light, you will not'); return;
  }
  hideT -= dt;
  if (hideT <= 0){
    for (const a of actors) if (a.kind === 'enforcer') a.aggro = 0;
    // half of them get reassigned somewhere less interesting
    for (let i = actors.length - 1; i >= 0; i--)
      if (actors[i].kind === 'enforcer' && (i & 1)) actors.splice(i, 1);
    if (heli){ heli = null; toast('the rotor swings away - trail lost'); }
    else toast('the street forgets you - trail lost');
    heliT = 120 + Math.random() * 60;
    sfx('ui_select', { vol: 0.6, rate: 0.7 });
  }
}

                 lock: 0, rot: 0, beam: 0,

/* peds can be hurt; the ledger fills accordingly */
function damagePed(p, d){
  if (p.hp === undefined) p.hp = 10;
  p.hp -= d;
  addFx(p.x, p.y, 1.2);
  sfx('hit', { vol: 0.6 });
  panicHere(cam.x, cam.y, 120);
  if (!p.assaulted){
    p.assaulted = 1;
    player.qvar.assaults = (player.qvar.assaults || 0) + 1;
    if (player.qvar.assaults % 3 === 0) pedCrime(1, 'assault');
  }
  if (p.hp <= 0){
    pedCrime(1, 'murder');
    if (Math.random() < 0.4){                   // some of them carried something
      props.push({ x: p.x, y: p.y, k: PK_ITEM, s: 0, r: 0,
                   item: 'credchip', cval: 4 + ((Math.random() * 12) | 0) });
      indexProps(); indexSpriteProps();
    }
    if (p.sit){ p.sit.occ--; p.sit = null; }
    const t = randWalkNear(cam.x, cam.y, 60, STREAM_R * 0.8);   // the crowd renews
    if (t && !inPanicZone(t[0], t[1])){ p.x = t[0] + 0.5; p.y = t[1] + 0.5; }
    p.hp = undefined; p.assaulted = 0; p.path = null; p.pi = 0; p.cool = rnd() * 2;
    p.flee = 0;
    toast('they drop. the street empties around you');
  }
}
const SPARK_SL = slots({ X: [-1, 1.0] });
function addFx(x, y, z){ fxs.push({ x, y, z, t: 0.12 }); }
function sightClear(x0, y0, x1, y1){
  const dx = x1 - x0, dy = y1 - y0, d = Math.hypot(dx, dy);
  const steps = Math.ceil(d * 2);
  for (let s = 1; s < steps; s++){
    const t = s / steps;
    const ix = (x0 + dx * t) | 0, iy = (y0 + dy * t) | 0;
    if (!inMap(ix, iy) || tH[iy * MAP + ix] > 1.4) return false;
  }
  return true;
}
// how far a bullet travels before masonry stops it (chest height, 1.3)
function wallDist(maxD){
  const rdx = Math.cos(cam.ang), rdy = Math.sin(cam.ang);
  let mapX = cam.x | 0, mapY = cam.y | 0;
  const ddx = rdx === 0 ? 1e30 : Math.abs(1 / rdx);
  const ddy = rdy === 0 ? 1e30 : Math.abs(1 / rdy);
  let stepX, stepY, sdx, sdy;
  if (rdx < 0){ stepX = -1; sdx = (cam.x - mapX) * ddx; } else { stepX = 1; sdx = (mapX + 1 - cam.x) * ddx; }
  if (rdy < 0){ stepY = -1; sdy = (cam.y - mapY) * ddy; } else { stepY = 1; sdy = (mapY + 1 - cam.y) * ddy; }
  let guard = 0;
  while (guard++ < 200){
    let d;
    if (sdx < sdy){ d = sdx; sdx += ddx; mapX += stepX; } else { d = sdy; sdy += ddy; mapY += stepY; }
    if (d > maxD) return maxD;
    if (mapX < 0 || mapY < 0 || mapX >= MAP || mapY >= MAP) return d;
    if (tH[mapY * MAP + mapX] > 1.3) return d;
  }
  return maxD;
}
function hostileInSights(maxD, halfW){
  halfW = halfW || 0.45;
  const vx = Math.cos(cam.ang), vy = Math.sin(cam.ang);
  const wd = wallDist(maxD);
  let best = null, bd = 1e9;
  for (let i = 0; i < actors.length; i++){
    const a = actors[i];
    if (a.brain !== 'hostile' || !!a.interior !== !!inside) continue;
    const rx = a.x - cam.x, ry = a.y - cam.y;
    const f = rx * vx + ry * vy;
    if (f < 0.3 || f > wd) continue;
    if (Math.abs(vy * rx - vx * ry) > halfW) continue;
    if (f < bd){ bd = f; best = a; }
  }
  return best && { a: best, d: bd };
}
// like the above, but a bullet does not care who is in front of it
function characterInSights(maxD, halfW){
  halfW = halfW || 0.45;
  const hit = hostileInSights(maxD, halfW);
  let best = hit ? hit.a : null, bd = hit ? hit.d : 1e9, ped = false;
  {                                             // the civil cast can bleed too
    const vx = Math.cos(cam.ang), vy = Math.sin(cam.ang);
    const wd = Math.min(bd, wallDist(maxD));
    for (const a of actors){
      if (a.brain === 'hostile' || !!a.interior !== !!inside) continue;
      if (!actorTargetable(a)) continue;
      const rx = a.x - cam.x, ry = a.y - cam.y;
      const f = rx * vx + ry * vy;
      if (f < 0.3 || f > wd) continue;
      if (Math.abs(vy * rx - vx * ry) > halfW) continue;
      if (f < bd){
        bd = f; best = a; ped = false;
        if (a.hp === undefined || a.hp <= 0){ a.hp = 30; a.maxHp = 30; }
      }
    }
  }
  if (!inside){
    const vx = Math.cos(cam.ang), vy = Math.sin(cam.ang);
    const wd = Math.min(bd, wallDist(maxD));
    const near = gridQuery(pedGrid, cam.x + vx * Math.min(12, maxD * 0.4),
                           cam.y + vy * Math.min(12, maxD * 0.4), 16, _q1);
    for (let i = 0; i < near.length; i++){
      const p = near[i];
      const rx = p.x - cam.x, ry = p.y - cam.y;
      const f = rx * vx + ry * vy;
      if (f < 0.3 || f > wd) continue;
      if (Math.abs(vy * rx - vx * ry) > halfW) continue;
      if (f < bd){ bd = f; best = p; ped = true; }
    }
  }
  return best && { a: best, d: bd, ped };

// bare knuckles: half a pistol round, arm's reach, a forgiving swing arc
let punchT = 0;

function weaponId(){

  if (w && invCount(w)) return w;
  for (const id of ['railgun', 'rifle', 'shotgun', 'smg', 'revolver', 'pistol',
                    'arcgun', 'nailer', 'holdout', 'katana', 'maul', 'bat',
                    'pipe', 'knife'])

      const nx = a.x + (a.x - cam.x) / l * 1.2, ny = a.y + (a.y - cam.y) / l * 1.2;

      a.stunT = Math.max(a.stunT || 0, 0.6);
      addFx(a.x, a.y, 0.8);

  if (!hit){ sfx('ui_back', { vol: 0.18, rate: 1.6 }); return; }   // an airy miss
  const a = hit.a;
  const dmg = m.d + ((Math.random() * m.r) | 0);
  const vx = Math.cos(cam.ang), vy = Math.sin(cam.ang);
  const nx = a.x + vx * m.kb, ny = a.y + vy * m.kb;   // the shove
  if (inMap(nx | 0, ny | 0) && walkG[(ny | 0) * MAP + (nx | 0)]){ a.x = nx; a.y = ny; }
  hitStopT = m.id === 'bat' ? 0.11 : m.id === 'pipe' ? 0.07 : 0.04;
  cam.pitch -= m.id === 'bat' ? 0.6 : m.id === 'pipe' ? 0.4 : 0.3;
  if (m.id !== 'fist') cam.ang -= 0.015;
  const jit = () => 1 + (Math.random() * 0.16 - 0.08);

    sfx('door', { rate: 2.0 * jit(), vol: 0.3 });     // the wood knock

    sfx('hit', { rate: 0.95 * jit(), vol: 0.6 });
    sfx('hit', { rate: 1.9 * jit(), vol: 0.25 });     // the ring overtone
  } else sfx('hit', { rate: 1.2 * jit(), vol: 0.6 });
  addFx(a.x, a.y, 1.25);
  if (hit.ped){ damagePed(a, dmg); return; }
  a.stunT = Math.max(a.stunT || 0, m.stun);
  a.hp -= dmg;
  a.aggro = 1; a.hitT = 0.15;

    cam.pitch -= 0.4;

/* Every gun in the city, one table. dmg is [base, spread]; pellets fan out;

   target in place. All of them feed on the same ammo. */
const GUNS = {
  pistol:  { dmg: 9,  rng: 6, cool: 0.35, range: 34, kick: 1.3, rate: 0.95, snd: 0.8 },
  holdout: { dmg: 6,  rng: 4, cool: 0.22, range: 22, kick: 0.7, rate: 1.45, snd: 0.55 },
  revolver:{ dmg: 18, rng: 8, cool: 0.75, range: 40, kick: 2.6, rate: 0.66, snd: 0.95 },
  smg:     { dmg: 5,  rng: 4, cool: 0.10, range: 26, kick: 0.45, rate: 1.2, snd: 0.6 },
  shotgun: { dmg: 7,  rng: 4, cool: 0.95, range: 15, kick: 3.2, rate: 0.5, snd: 1.0,

  railgun: { dmg: 60, rng: 10, cool: 1.6, range: 90, kick: 4.0, rate: 0.3, snd: 1.0,
             rail: 1 },
  arcgun:  { dmg: 14, rng: 6, cool: 0.8, range: 24, kick: 1.0, rate: 1.9, snd: 0.7,

function fireWeapon(){
  if (topMode() || worldFrozen()) return;
  if (cam.riding){ toast('not from up here'); return; }
  if (sitting){ toast('not from the bench'); return; }
  if (shotCool > 0) return;                   // the zip pistol is not a minigun
  handsBusy();
  const wid = weaponId(), G = GUNS[wid];
  const armed = !!G && invCount(wid) > 0;
  if (!armed || invCount('ammo') === 0){
    if (!armed && worldTime > unarmedT && meleeStats().id === 'fist'){
      unarmedT = worldTime + 12;
      toast('bare knuckles - counters signed ARMS sell heavier');
    }
    if (armed) sfx('ui_back', { vol: 0.5, rate: 0.55 });   // dry click, then swing
    punch();
    return;
  }
  invTake('ammo', 1);
  shotCool = G.cool;
  muzzleT = 0.09;
  cam.pitch = clamp(cam.pitch + G.kick, -R.rows * 0.62, R.rows * 0.62);
  sfx('shot', { vol: G.snd, rate: G.rate * (0.97 + Math.random() * 0.06) });
  panicHere(cam.x, cam.y, 120);
  for (const a of actors)                       // gunfire carries
    if (a.brain === 'hostile' && Math.hypot(a.x - cam.x, a.y - cam.y) < 15) a.aggro = 1;
  const roll = () => G.dmg + ((Math.random() * G.rng) | 0);
  const wound = (a, ped, dmg) => {
    if (ped){ damagePed(a, dmg); return; }
    a.hp -= dmg;
    a.aggro = 1; a.hitT = 0.15;
    if (G.pin){ a.stunT = Math.max(a.stunT || 0, G.pin); a.pinX = a.x; a.pinY = a.y; }
    addFx(a.x, a.y, 1.25);
    sfx('hit', { vol: 0.7 });
    if (a.hp <= 0) killActor(a);
  };
  if (G.rail){
    // the lance: everything on the line takes it, and the line is visible
    const vx = Math.cos(cam.ang), vy = Math.sin(cam.ang);
    const wd = Math.min(G.range, wallDist(G.range));
    for (let t = 2; t < wd; t += 2.2) addFx(cam.x + vx * t, cam.y + vy * t, 0.55);
    let n = 0;
    const seen = new Set();
    for (let pass = 0; pass < 6; pass++){       // peel targets front to back
      const hit = characterInSights(wd, 0.6);
      if (!hit || seen.has(hit.a)) break;
      seen.add(hit.a); n++;
      wound(hit.a, hit.ped, roll());
      if (hit.a.hp !== undefined && hit.a.hp > 0) break;   // a survivor blocks it
    }
    if (n > 1) toast('clean through');
    return;
  }
  if (G.chain){
    const hit = characterInSights(G.range, 0.5);
    if (hit){
      wound(hit.a, hit.ped, roll());
      // the bolt leaps: nearest others within six tiles, weakening each hop
      let from = hit.a, dmg = roll();
      const struck = new Set([hit.a]);
      for (let c = 0; c < G.chain; c++){
        let nb = null, bd = 36;
        for (const a of actors){
          if (struck.has(a) || a.interior || a.hp === undefined || a.hp <= 0) continue;
          const d2 = (a.x - from.x) ** 2 + (a.y - from.y) ** 2;
          if (d2 < bd){ bd = d2; nb = a; }
        }
        if (!nb) break;
        struck.add(nb);
        dmg = Math.max(4, (dmg * 0.6) | 0);
        addFx((from.x + nb.x) / 2, (from.y + nb.y) / 2, 0.7);
        addFx(nb.x, nb.y, 1.0);
        sfx('hit', { vol: 0.4, rate: 2.2 });
        wound(nb, false, dmg);
        from = nb;
      }
    } else {
      const wd = wallDist(G.range);
      if (wd < G.range) addFx(cam.x + Math.cos(cam.ang) * (wd - 0.05),
                              cam.y + Math.sin(cam.ang) * (wd - 0.05), 1.3);
    }
    return;
  }
  const pellets = G.pellets || 1;
  let landed = 0;
  for (let i = 0; i < pellets; i++){
    const hw = G.spreadW ? G.spreadW * (0.3 + 0.7 * Math.random()) : 0.45;
    const hit = characterInSights(G.range, hw);
    if (hit){ wound(hit.a, hit.ped, roll()); landed++; }
  }
  if (!landed){
    const wd = wallDist(G.range);
    if (wd < G.range) addFx(cam.x + Math.cos(cam.ang) * (wd - 0.05),
                            cam.y + Math.sin(cam.ang) * (wd - 0.05), 1.3);
  }
}
function killActor(a){

function hostileBrain(a, dt){
  if (a.stunT > 0){ a.stunT -= dt; a.windup = 0; return; }   // a hit interrupts the swing
  a.atkCool = (a.atkCool || 0) - dt;
  const tm0 = topMode();
  if ((drug && drug.fx.ghost) || jamT > 0 ||
      (tm0 && tm0.name === 'camjack')) a.aggro = 0;   // ghosted, jammed, or absent
  const rx = cam.x - a.x, ry = cam.y - a.y;
  const pr = Math.hypot(rx, ry) || 0.001;
  if (!a.aggro){
    if (pr < 9 && sightClear(a.x, a.y, cam.x, cam.y)) a.aggro = 1;
    return;
  }
  if (pr > 30){ a.aggro = 0; return; }
  a.dx = rx / pr; a.dy = ry / pr;
  if (pr > 1.0){
    const nx = a.x + a.dx * a.spd * dt, ny = a.y + a.dy * a.spd * dt;
    if (walkG[clamp(a.y | 0, 0, MAP - 1) * MAP + clamp(nx | 0, 0, MAP - 1)]) a.x = nx;
    if (walkG[clamp(ny | 0, 0, MAP - 1) * MAP + clamp(a.x | 0, 0, MAP - 1)]) a.y = ny;
    a.phase += a.spd * dt * 3.4;
    a.moving = 1;
  } else if (a.windup > 0){                    // committed - the blow lands at 0
    a.windup -= dt;
    if (a.windup <= 0 && player.hp > 0 && pr <= 1.6){
      damagePlayer(a.pendAtk || 5);
      a.windup = 0;
    }
  } else if (a.atkCool <= 0 && player.hp > 0){
    a.atkCool = 1.1;                           // telegraph, then strike
    a.windup = 0.25;
    a.pendAtk = (a.atk || 5) + ((Math.random() * 6) | 0);
    sfx('ui_move', { rate: 0.35, vol: 0.35 });
  }
}

/*=========================== 13g. THE LIVING CLOCK =========================
  Time and weather run themselves now. The clock is continuous - one game
  day is 24 real minutes - and the three TIME looks became keyframes: dawn
  passes through the dusk palette on its way to day, evening runs it in
  reverse, and the palettes chase the blend as it moves. The old T and X
  keys are gone; benches are how you hurry time along.

  The calendar starts JAN 12 2420 and counts on from there.
============================================================================*/
let clock = 20, dayCount = 0;              // the city wakes at night
let bakeKey = -1, lastAtlasT = 0;
// blend segments: night ends at 05:00, day runs 06:30-18:30, night by 20:00
function timeBlend(){
  const c = clock;
  if (c >= 20 || c < 5) return { a: 0, b: 0, u: 0 };
  if (c < 5.75)  return { a: 0, b: 1, u: (c - 5) / 0.75 };
  if (c < 6.5)   return { a: 1, b: 2, u: (c - 5.75) / 0.75 };
  if (c < 18.5)  return { a: 2, b: 2, u: 0 };
  if (c < 19.25) return { a: 2, b: 1, u: (c - 18.5) / 0.75 };
  return { a: 1, b: 0, u: (c - 19.25) / 0.75 };
}
function curTime(){
  const t = timeBlend();
  if (t.a === t.b || t.u <= 0) return TIME[t.a];
  const A = TIME[t.a], B = TIME[t.b], u = t.u;
  const mv = (p, q) => p + (q - p) * u;
  const m3 = (P, Q) => [mv(P[0], Q[0]), mv(P[1], Q[1]), mv(P[2], Q[2])];
  return { fog: m3(A.fog, B.fog), sky: m3(A.sky, B.sky), glow: m3(A.glow, B.glow),
           lit: mv(A.lit, B.lit), amb: mv(A.amb, B.amb) };
}
function updateClock(dt){
  clock += dt / 60;
  if (clock >= 24){ clock -= 24; dayTick(); }
  const t = timeBlend();
  const dom = t.u < 0.5 ? t.a : t.b;
  if (dom !== CFG.timeMode){                // the gameplay flags snap here
    CFG.timeMode = dom;
    for (const b of buildings)
      b.litP = clamp(curTime().lit * (0.45 + hash3(b.id, 3, 9)), 0.05, 0.95);
  }
  const key = t.a * 1000 + t.b * 100 + ((t.u * 24) | 0)
            + (drug && (drug.fx.hue || drug.fx.hueC || drug.fx.sat || drug.fx.warm)
                 ? 100000 + (((worldTime * 20) | 0) % 997) * 101 : 0);
  if (key !== bakeKey){                     // the palette chases the blend
    bakeKey = key;
    bgGrad = null;
    if (GL) glBuildPalette();
    else if ((t.u === 0 && !drug) ||
             performance.now() - lastAtlasT > (drug ? 300 : 1200)){
      lastAtlasT = performance.now(); buildAtlases();
    }
  }
}
const MONTHS = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
const MLEN = [31,28,31,30,31,30,31,31,30,31,30,31];
function dateStr(){
  let d = 11 + dayCount, m = 0, y = 2420;
  for (;;){ if (d < MLEN[m]) break; d -= MLEN[m]; m++; if (m === 12){ m = 0; y++; } }
  return MONTHS[m] + ' ' + (d + 1) + ' ' + y;
}
function clockStr(){
  const h = clock | 0, mi = ((clock - h) * 60) | 0;
  return String(h).padStart(2, '0') + ':' + String(mi).padStart(2, '0');
}

let wxT = 4000;
function applyWeather(n){
  const was = weather;
  weather = n; flash = 0;
  if (n === 3) fogLevel = 0.12 + Math.random() * 0.25;
  if (n === 3 || was === 3){ if (GL) glBuildPalette(); else buildAtlases(); }

function wxUpdate(dt){
  wxT -= dt;

  // most days stay dry; a spell always opens with plain rain, storms only
  // grow out of rain, and fog only settles after rain or a storm
  const r = Math.random();
  const fogBias = (clock > 4 && clock < 9) ? 0.3 : 0.18;   // fog loves the small hours
  let n;

  else if (weather === 1) n = r < 0.16 ? 2 : r < 0.16 + fogBias ? 3 : 0;
  else if (weather === 2) n = r < 0.4 ? 1 : r < 0.4 + fogBias ? 3 : 0;

/*=========================== 13h. THE BODY =================================
  A real first-person body. View art is authored as plain text at native
  size and drawn literally - each character is its own glyph, coloured by a
  small per-piece map - then nearest-neighbour scaled to a share of the
  screen so the proportions hold on every grid. The body below you is not
  squashed by pitch: it rises into frame from the bottom edge as you look
  further down, the way a body does.
============================================================================*/
function hudCell(cx, cy2, ch, ci){
  if (cx < 0 || cx >= R.cols || cy2 < 0 || cy2 >= R.rows) return;
  const code = ch.charCodeAt(0) - 32;
  if (code <= 0 || code > 94) return;
  if (cy2 < hudR0) hudR0 = cy2;
  if (cy2 > hudR1) hudR1 = cy2;
  const i = cy2 * R.cols + cx;
  hGlyph[i] = code; hCol[i] = ci;
}
function viewW(rows){ let w = 0; for (const r of rows) w = Math.max(w, r.length); return w; }
/* solid defaults on: what you are holding is opaque. The one caller that
   passes false is the muzzle flash, which is light leaving the bore - a
   black plate behind THAT would be a box round the flash. */
function drawViewArt(rows, ax, ay, tr, cmap, solid){
  rows = groundArt(rows);                    // always planted on the screen edge
  const ah = rows.length, aw = viewW(rows);
  const want = tr;
  tr = Math.min(tr, Math.round(ah * 3.5));   // chunky upscale beats a crushed one
  ay += want - tr;                           // a clamped pose still meets the floor
  const tc = Math.max(2, Math.round(tr * aw / ah));
  for (let y = 0; y < tr; y++){
    const sr = rows[(y * ah / tr) | 0];
    let run = -1;                              // start column of the span
    for (let x = 0; x < tc; x++){
      const ch = sr[(x * aw / tc) | 0];
      if (!ch || ch === ' '){
        if (run >= 0){ if (solid !== false) hudSolidRun(ax + run, ay + y, x - run);
                       run = -1; }
        continue;
      }
      if (run < 0) run = x;
      hudCell(ax + x, ay + y, ch, cmap[ch] !== undefined ? cmap[ch] : H_DRK);
    }
    if (run >= 0 && solid !== false) hudSolidRun(ax + run, ay + y, tc - run);
  }
  return tc;
}
// the width drawViewArt will actually paint, once the art is grounded and
// the upscale clamp has had its say - anchoring needs the real number
function drawnW(art, tr){
  const g = groundArt(art), gh = g.length, gw = viewW(g);
  return Math.max(2, Math.round(Math.min(tr, Math.round(gh * 3.5)) * gw / gh));
}
function shiftArt(rows, dx, dy){              // slide a pose for an in-between
  const w = viewW(rows), out = [];
  for (let i = 0; i < rows.length; i++){
    let src = i - dy;
    if (src < 0){ out.push(' '.repeat(w)); continue; }   // sky above is fine
    if (src >= rows.length) src = rows.length - 1;       // but never float the arms
    const r = rows[src].padEnd(w);
    out.push(dx >= 0 ? ' '.repeat(dx) + r.slice(0, w - dx)
                     : r.slice(-dx) + ' '.repeat(-dx));
  }
  return out;
}
// the body is drawn bottom-anchored, so any blank rows under the last real
// one would hang it in mid-air. Trim them once and remember the result.
function groundArt(rows){
  if (rows._g) return rows._g;
  let n = rows.length;
  while (n > 1 && !rows[n - 1].trim()) n--;
  const g = n === rows.length ? rows : rows.slice(0, n);
  try { Object.defineProperty(rows, '_g', { value: g, enumerable: false }); }
  catch (e){ /* frozen art: just use the trim */ }
  return g;
}
// twice the frames at the same tempo: between every authored pose, the next
// one arriving a row low - the eye reads the travel instead of a cut
function tweenFrames(frames){
  if (!frames || frames.length < 2) return frames;
  const out = [];
  for (let i = 0; i < frames.length; i++){
    out.push(frames[i]);
    // the next pose arriving a row low, or - on the last - this one settling
    out.push(shiftArt(frames[i + 1] || frames[i], 0, 1));
  }
  return out;                                 // exactly twice the frames
}

// how far into its drawn columns a pose actually has ink, so a swing can be
// hung by its blade rather than by the blank margin around it
function inkSpan(art, tr){
  const g = groundArt(art), gh = g.length, gw = viewW(g);
  const t = Math.min(tr, Math.round(gh * 3.5));
  const tc = Math.max(2, Math.round(t * gw / gh));
  if (!art._ink) art._ink = {};
  const hit = art._ink[tc];
  if (hit) return hit;
  let l = tc, r = -1;
  for (let y = 0; y < t; y++){
    const sr = g[(y * gh / t) | 0];
    for (let x = 0; x < tc; x++){
      const ch = sr[(x * gw / tc) | 0];
      if (!ch || ch === ' ') continue;
      if (x < l) l = x;
      if (x > r) r = x;
    }
  }
  if (r < 0){ l = 0; r = tc - 1; }
  return (art._ink[tc] = { l, r });
}
// A swing pose is far wider than it is tall, and drawViewArt sizes it from
// its HEIGHT - so on a small grid the barrel runs off both edges and most of
// the pose is painted into nothing. Cap the request so the drawn art fits the
// screen it is on. At full resolution this never binds.
function fitTr(art, tr, cols){
  const g = groundArt(art);
  return Math.min(tr, Math.floor(cols * 1.02 * g.length / viewW(g)));
}
function swingAX(art, tr, rule, cols){
  const k = inkSpan(art, tr), at = cols * rule[1];
  return Math.round(rule[0] === 'r' ? at - k.r
                  : rule[0] === 'l' ? at - k.l
                                    : at - (k.l + k.r) * 0.5);
}

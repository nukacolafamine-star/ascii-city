/*------------------------- one of a kind, each of them ----------------------
  Seven CENTRAL PARKs and ten PLAYGROUNDs is not a map, it is a legend with
  the same word on it repeatedly. Every landmark now takes a name off a pool
  dealt without replacement for the life of the city, so a direction like
  "meet me at CARRICK GREEN" means exactly one place.
============================================================================*/
const LM_PLACE = ['MERCER', 'HOLLOWAY', 'SABLE', 'KESTREL', 'ARDEN', 'VANTAGE',
  'THISTLE', 'CARRICK', 'LOWELL', 'BRAMBLE', 'OSPREY', 'MARLOW', 'QUAYSIDE',
  'FENN', 'ASHGROVE', 'REDPOLL', 'STILLWATER', 'HAWKER', 'GRANTLEY', 'NORWOOD',
  'CALLOW', 'PENFOLD', 'WINDER', 'GALLOWAY', 'TASKER', 'ELMLEY', 'CORVID',
  'SEDGE', 'HARROW', 'BILLET', 'CASTLETON', 'DRAYTON', 'FALLOW', 'GRIMSBY',
  'KEELING', 'LATCHFORD', 'MOSSGATE', 'NETTLE', 'PARLOW', 'RUSKIN'];
let lmPool = [];
function resetLandmarkNames(){
  lmPool = LM_PLACE.slice();
  for (let i = lmPool.length - 1; i > 0; i--){    // dealt from the seed
    const j = (rnd() * (i + 1)) | 0;
    const t = lmPool[i]; lmPool[i] = lmPool[j]; lmPool[j] = t;
  }
}
function placeWord(){
  return lmPool.length ? lmPool.pop() : 'BLOCK ' + (landmarks.length + 1);
}
/* last line of defence: if anything still collides, it gets a compass point,
   so the map can never print the same word twice */
function uniqueLandmarks(){
  const seen = Object.create(null);
  const cx0 = MAP * 0.5, cy0 = MAP * 0.5;
  for (const l of landmarks){
    if (!seen[l.name]){ seen[l.name] = 1; continue; }
    const dir = Math.abs(l.x - cx0) > Math.abs(l.y - cy0)
              ? (l.x > cx0 ? 'EAST' : 'WEST') : (l.y > cy0 ? 'SOUTH' : 'NORTH');
    let nm = dir + ' ' + l.name;
    while (seen[nm]) nm = nm + "'";
    l.name = nm; seen[nm] = 1;
  }
}
function stampLandmarks(){
  resetLandmarkNames();
  stampFields();
  stampDome();
  stampDataCentre();
  stampRedLight();
  // the world is 4 km^2 now, so the repeatable set is scaled to fill it
  for (let k = 0; k < 7; k++){
    const mp = findBlock(2, 2, undefined, 1) || findBlock(2, 2, undefined, 2);
    if (mp) stampPark(mp[0], mp[1], 2, 2, 'main');
  }
  for (let k = 0; k < 10; k++){
    const sp = findBlock(1, 1, D_SUB) || findBlock(1, 1, undefined, 2);
    if (sp) stampPark(sp[0], sp[1], 1, 1, 'sub');
  }
  for (let k = 0; k < 3; k++) stampWindFarm();
  for (let k = 0; k < 4; k++) stampSilos();
  for (let k = 0; k < 2; k++) stampMast();
  for (let k = 0; k < 2; k++) stampLake();
  stampMetro();
  uniqueLandmarks();
}

function buildCity(seed){
  srand(seed);
  buildings = []; props = []; signs = []; landmarks = []; metroStops = [];
  // buildDoors asks buildingUse for every door name, and buildingUse asks
  // whether the building is the hideout - so a stale id from the city before
  // this one gets its door blanked as well. Forget it before anything reads it.
  HIDEOUT = null;
  riverBed.fill(0);
  blockUsed.fill(0);
  tH.fill(0); tB.fill(-1);
  for (let y = 0; y < MAP; y++)
    for (let x = 0; x < MAP; x++) tType[y * MAP + x] = baseType(x, y);
  buildDistricts();
  carveRiver();
  const mid = Math.round(NB * 0.5);
  // Beyond the rural ring the lattice gives way: two highways leave the city
  // through the wilderness and every other road out there returns to earth.
  for (let bj = 0; bj < NB; bj++)
    for (let bi = 0; bi < NB; bi++){
      if (zoneAt(bi, bj) < 4 || bi === mid || bj === mid) continue;
      for (let y = bj * P; y < Math.min(MAP, (bj + 1) * P); y++)
        for (let x = bi * P; x < Math.min(MAP, (bi + 1) * P); x++){
          const id = y * MAP + x, t = tType[id];
          if (t === T_ROAD || t === T_WALK || t === T_CROSS) tType[id] = T_LOT;
        }
    }
  const brMain = carveBridge(mid, false);
  tollBooth(brMain);
  for (const k of [mid - 14, mid - 7, mid + 7, mid + 14])
    if (k > 1 && k < NB - 1) carveBridge(k, true);

  const cx0 = MAP * 0.5, cy0 = MAP * 0.5;
  for (let bj = 0; bj < NB; bj++){
    for (let bi = 0; bi < NB; bi++){
      if (zoneAt(bi, bj) >= 4){                     // wilderness: scrub, stone, sky
        for (let y = bj * P; y < Math.min(MAP, (bj + 1) * P); y++)
          for (let x = bi * P; x < Math.min(MAP, (bi + 1) * P); x++){
            if (tType[y * MAP + x] !== T_LOT) continue;
            const h4 = hash3(x, y, 606);
            if (h4 < 0.005) props.push({ x: x + 0.5, y: y + 0.5, k: PK_ROCK, s: rnd(), r: 0.4 });
            else if (h4 < 0.008) props.push({ x: x + 0.5, y: y + 0.5, k: PK_TREE, s: rnd(), r: 0.42 });
          }
        continue;
      }
      const D = DISTRICT[distMap[bj * NB + bi]];
      const lx0 = bi * P + RW + SW, lx1 = bi * P + P - SW - 1;
      const ly0 = bj * P + RW + SW, ly1 = bj * P + P - SW - 1;
      if (lx1 >= MAP || ly1 >= MAP) continue;
      const rects = [];
      bsp(lx0, ly0, lx1, ly1, D.split, rects);
      for (const rc of rects){
        let [x0, y0, x1, y1] = rc;
        if (rnd() < D.alley){                             // alley / setback
          if (rnd() < 0.5 && x1 - x0 >= 3){ if (rnd() < 0.5) x0++; else x1--; }
          else if (y1 - y0 >= 3){ if (rnd() < 0.5) y0++; else y1--; }
        }
        let w = x1 - x0 + 1, h = y1 - y0 + 1;
        if (w < 2 || h < 2) continue;
        let blocked = false;
        for (let y = y0; y <= y1 && !blocked; y++)
          for (let x = x0; x <= x1; x++){
            const t0 = tType[y * MAP + x];
            if (t0 === T_WATER || t0 === T_BRIDGE){ blocked = true; break; }
          }
        if (blocked) continue;

        const cx = (x0 + x1) * 0.5, cy = (y0 + y1) * 0.5;
        const dc = Math.hypot(cx - cx0, cy - cy0) / (MAP * 0.5);
        const down = Math.max(0, 1 - dc * 0.85);          // centre falloff

        if (rnd() < D.park){                              // green lot
          for (let y = y0; y <= y1; y++)
            for (let x = x0; x <= x1; x++){
              tType[y * MAP + x] = T_LOT;
              if (rnd() < 0.11 + D.tree * 1.6 && !nearBuilding(x, y, 1))
                props.push({ x: x + 0.5, y: y + 0.5, k: treeKind(x, y), s: rnd(), r: 0.42 });
            }
          continue;
        }

        if (D.fill !== undefined && rnd() > D.fill){        // left as open ground
          const rural = distMap[bj * NB + bi] === D_RURAL;
          for (let y = y0; y <= y1; y++)
            for (let x = x0; x <= x1; x++){
              if (tType[y * MAP + x] !== T_LOT) continue;
              // rural open ground is worked land: crops stand in rows
              if (rural && x % 3 === 1 && y % 3 !== 0 && hash3(x, y, 505) < 0.5)
                props.push({ x: x + 0.5, y: y + 0.5, k: PK_CROP, s: rnd(), r: 0 });
              else if (rnd() < D.tree * 0.5 && !nearBuilding(x, y, 1))
                props.push({ x: x + 0.5, y: y + 0.5, k: treeKind(x, y), s: rnd(), r: 0.42 });
            }
          continue;
        }
        if (D.inset){                                        // gardens and yards
          x0 += D.inset; y0 += D.inset; x1 -= D.inset; y1 -= D.inset;
          if (x1 - x0 < 1 || y1 - y0 < 1) continue;
        }
        const area = w * h;
        let ht = D.hBase[0] + rnd() * (D.hBase[1] - D.hBase[0]) +
                 Math.pow(down, 1.6) * (D.hScale[0] + rnd() * (D.hScale[1] - D.hScale[0])) *
                 Math.min(1.8, area / 8);
        if (rnd() < 0.045) ht *= 1.9;                     // landmark tower
        ht = Math.min(ht, 120);

        // ---- footprint shape: L cut, open courtyard notch, chamfers -----
        const cut = new Uint8Array(w * h);
        const shp = rnd();
        if (w >= 4 && h >= 4 && shp < 0.18){              // L shape
          const cw = 1 + ((rnd() * (w - 2)) | 0), ch2 = 1 + ((rnd() * (h - 2)) | 0);
          const ox = rnd() < 0.5 ? 0 : w - cw, oy = rnd() < 0.5 ? 0 : h - ch2;
          for (let y = oy; y < oy + ch2; y++)
            for (let x = ox; x < ox + cw; x++) cut[y * w + x] = 1;
        } else if (w >= 5 && h >= 5 && shp < 0.32){       // U: notch one edge
          const sideN = (rnd() * 4) | 0;
          const span = sideN < 2 ? w : h, deep = sideN < 2 ? h : w;
          const nw = 1 + ((rnd() * (span - 3)) | 0);
          const dep = 1 + ((rnd() * (deep - 2)) | 0);
          const off = 1 + ((rnd() * (span - nw - 1)) | 0);
          for (let a = 0; a < nw; a++)
            for (let k = 0; k < dep; k++){
              const x = (sideN === 0 || sideN === 1) ? off + a : (sideN === 2 ? k : w - 1 - k);
              const y = sideN === 0 ? k : (sideN === 1 ? h - 1 - k : off + a);
              if (x >= 0 && y >= 0 && x < w && y < h) cut[y * w + x] = 1;
            }
        } else if (w >= 3 && h >= 3 && shp < 0.50){       // chamfered corners
          const n = 1 + ((rnd() * 2) | 0);
          for (let c = 0; c < 4; c++){
            if (rnd() < 0.45) continue;
            for (let y = 0; y < h; y++)
              for (let x = 0; x < w; x++){
                const dx = (c & 1) ? w - 1 - x : x, dy = (c & 2) ? h - 1 - y : y;
                if (dx + dy < n) cut[y * w + x] = 1;
              }
          }
        }
        let kept = 0;
        for (let i = 0; i < cut.length; i++) if (!cut[i]) kept++;
        if (kept < 2) cut.fill(0);

        // A tower reads as "the cyan one" or "the magenta one": one dominant
        // window glow plus a minority accent, and its own signage and crown.
        const wa = (rnd() * D.neon.length) | 0;
        const wb = (wa + 1 + ((rnd() * (D.neon.length - 1)) | 0)) % D.neon.length;
        const b = {
          id: buildings.length, x0, y0, x1, y1, h: ht, dist: distMap[bj * NB + bi],
          col:   D.shells[(rnd() * D.shells.length) | 0],
          winA:  D.neon[wa],
          winB:  D.neon[wb],
          sign:  D.neon[(rnd() * D.neon.length) | 0],
          crown:  rnd() < D.crown  ? D.neon[(rnd() * D.neon.length) | 0] : -1,
          stripe: rnd() < D.stripe ? D.neon[(rnd() * D.neon.length) | 0] : -1,
          stripePh: (rnd() * 6) | 0,
          litP: clamp(curTime().lit * D.lit * (0.45 + rnd()), 0.04, 0.96),
          fh: 1.15 + rnd() * 0.55,                        // floor height
          wpm: D.wpm[(rnd() * D.wpm.length) | 0],         // windows per tile
          seed: (rnd() * 65535) | 0
        };
        buildings.push(b);

        // ---- stamp, stepping the height down toward the footprint edge ---
        const mi = Math.min((w - 1) >> 1, (h - 1) >> 1);
        const setback = (rnd() < D.tier && ht > 15 && mi > 0) ? 0.28 + rnd() * 0.36 : 0;
        for (let y = y0; y <= y1; y++)
          for (let x = x0; x <= x1; x++){
            if (cut[(y - y0) * w + (x - x0)]) continue;
            const inset = Math.min(x - x0, x1 - x, y - y0, y1 - y);
            const t = mi > 0 ? inset / mi : 1;
            const id = y * MAP + x;
            tType[id] = T_BLD;
            tH[id] = ht * (1 - setback * (1 - t));
            tB[id] = b.id;
          }
      }
    }
  }
  stampLandmarks();
  stampIntersectionIds();
  buildProps();
  buildWalkGrid();
  buildSigns();
  buildDoors();
  placeStreetItems();
  placeProps();
  stalls = props.filter(q => q.k === PK_STALL);   // the pass thins them; re-read
  placeWeaponCaches();
  initHomes();
  initDealership();
  initMainQuest();
  initWorks();
  clearWaypoint(true);
  myCar = null;                                 // respawned lazily from the save
  stampFlotsam();
  bakeSolidProps();
}
/* Rubbish on the water. Placed after placeProps so the street placer never
   sees it - it reasons about pavement and would either shove these onto the
   bank or throw them away. Sparse: a river with a raft of bottles every ten
   metres is a landfill. */
function stampFlotsam(){
  for (let x = 6; x < MAP - 6; x += 3){
    const mid = riverMid(x), hw = riverHalf(x);
    if (hash3(x, 0, 811) > 0.22) continue;
    const t = (hash3(x, 1, 812) - 0.5) * 1.55;          // across the channel
    const fy = mid + t * hw;
    const fx = x + hash3(x, 2, 813) * 2.4;
    const ix = fx | 0, iy = fy | 0;
    if (!inMap(ix, iy) || tType[iy * MAP + ix] !== T_WATER) continue;
    props.push({ x: fx, y: fy, k: PK_FLOTSAM, s: hash3(x, 3, 814),
                 r: 0.7, z: -RIVER_DEPTH,
                 fix: hash3(x, 4, 815) * Math.PI * 2 });
  }
}

/* The special weapons are not for sale. They are LEFT places - tucked behind
   the plant of the city where only somebody poking around would look - and
   each cache spawns once per city, remembered through worldDelta like any
   other pickup. Quests will hand out their own copies later; these are the
   finders-keepers set. */
function placeWeaponCaches(){
  const tuck = (want, id) => {
    const cands = props.filter(q => q.k === want);
    if (!cands.length) return;
    const c = cands[(hash3(worldSeed, ITEMS[id].price + id.length, 977) * cands.length) | 0];
    // just behind it, off the walkway side
    for (let ring = 1; ring <= 2; ring++)
      for (let a = 0; a < 8; a++){
        const th = a * Math.PI / 4;
        const x = c.x + Math.cos(th) * ring * 0.8, y = c.y + Math.sin(th) * ring * 0.8;
        if (!inMap(x | 0, y | 0)) continue;
        if (tType[(y | 0) * MAP + (x | 0)] === T_BLD) continue;
        props.push({ x, y, k: PK_ITEM, s: 0, r: 0, item: id, qty: 1,
                     key: 'cache_' + id });
        return;
      }
  };
  if (!worldDelta.taken.cache_railgun) tuck(PK_TURBINE, 'railgun');  // out in the wilds
  if (!worldDelta.taken.cache_arcgun)  tuck(PK_ROCK, 'arcgun');
  if (!worldDelta.taken.cache_nailer)  tuck(PK_METRO, 'nailer');
  if (!worldDelta.taken.cache_katana)  tuck(PK_SAKURA, 'katana');    // under the blossom
  if (!worldDelta.taken.cache_maul)    tuck(PK_TURBINE, 'maul');
  if (!worldDelta.taken.cache_holdout) tuck(PK_BIN, 'holdout');      // someone ditched it
}

/* Solid furniture is baked out of the walk grid once the placer has run, so
   A* routes a pedestrian around a bench rather than through it, and the
   end-of-frame legality check throws nobody stands in a cart. The walk-through
   kinds (pickups, crops, stair markers) stay walkable, as they are for the
   player. Runtime drops are all pickups, so the bake never goes stale. */
function bakeSolidProps(){
  for (const p of props){
    // A ramp is a surface, not an obstacle - closing the road under it would
    // wall off the very street the run is routed down.
    if (p.k === PK_ITEM || p.k === PK_CROP || p.k === PK_STAIR ||
        p.k === PK_RAMP) continue;
    const yaw = p.yaw === undefined ? (p.yaw = propFacing(p)) : p.yaw;
    const fb = footBox(p.k, yaw);
    const x0 = Math.floor(p.x - fb[0] * 0.5 + 1e-6), x1 = Math.floor(p.x + fb[0] * 0.5 - 1e-6);
    const y0 = Math.floor(p.y - fb[1] * 0.5 + 1e-6), y1 = Math.floor(p.y + fb[1] * 0.5 - 1e-6);
    for (let y = y0; y <= y1; y++)
      for (let x = x0; x <= x1; x++)
        if (inMap(x, y)) walkG[y * MAP + x] = 0;
  }
}

// cart dimensions: the model, its collision box and its footprint all read
// these, so they sit up here where every one of them can see them
const STALL_H = 3.4, STALL_W = 3.0;    // tall enough to stand a cook up in
const STALL_DEPTH = 0.85;              // depth as a fraction of the frontage
const STALL_D = STALL_W * STALL_DEPTH; // ... and in world units, for collision
/*--------------------------- placing the furniture --------------------------
  The city is meant to read as laid out, not sprinkled: every prop on a tile
  centre, nothing overlapping anything, nothing standing in a doorway, and
  the things that line a street all sitting the same distance off the kerb.

  Scattering first and nudging the clashes apart could not deliver that. A
  nudge lands wherever the circle test stops complaining, which is how props
  ended up fractionally off-grid and still occasionally stacked - a circle is
  a poor stand-in for a three-metre cart, and the nudge itself had no notion
  of the lattice. So nothing is nudged any more. Every prop CLAIMS a
  tile-aligned rectangle out of an occupancy map, in priority order: the
  things placed on purpose go first and take the spot they were given, the
  scattered dressing fills in around them. If a prop's own tile is taken it
  tries the tiles around it - never a fraction of a tile - and if none of
  those are clear it is not placed at all.
============================================================================*/
const OCC_FREE = 0, OCC_TAKEN = 1, OCC_DOOR = 2;
let occ = null;                             // one cell per map tile
/* What a model actually stands on, in world units, before it is turned.
   Kept at or under one tile for anything laid in a deliberate run - rails
   along a bridge, crops in a furrow - so consecutive tiles never fight. */
const MODEL_FOOT = [];
(function(){
  const f = (k, w, d) => { MODEL_FOOT[k] = [w, d === undefined ? w : d]; };
  f(PK_TREE, 4.6);        f(PK_SAKURA, 3.2);    f(PK_APPLE, 2.6);
  f(PK_TURBINE, 3.6);     f(PK_STALL, STALL_W, STALL_D);
  f(PK_METRO, 2.8, 2.4);  f(PK_PLAY, 3.2, 1.6); f(PK_BENCH, 2.0, 0.9);
  f(PK_RACK, 1.8, 1.2);   f(PK_STAIR, 1.5);     f(PK_ROCK, 1.1);
  f(PK_BIN, 1.0);         f(PK_LAMP, 0.9);      f(PK_TLIGHT, 0.9);
  f(PK_HYDR, 0.9);        f(PK_CAM, 0.9);       f(PK_ITEM, 0.7);
  f(PK_RAIL, 0.95);       f(PK_CROP, 0.9);
  f(PK_HOOP, 1.9, 1.0);   f(PK_SWING, 3.4, 1.8); f(PK_CLIMB, 3.0, 3.0);
  f(PK_FLOTSAM, 2.1, 2.1);
  f(PK_RAMP, 9.4, 3.8);
})();
/* Furniture also wants to be SPREAD, not merely clear of its neighbours: the
   generators scatter by per-tile chance, which clumps. Minimum gap between
   two of the same kind, in tiles. Runs are exempt. */
const MODEL_SPACE = [];
(function(){
  const g = (k, d) => { MODEL_SPACE[k] = d; };
  g(PK_STALL, 8);   g(PK_HYDR, 8);    g(PK_LAMP, 7);
  g(PK_BIN, 7);     g(PK_BENCH, 6);   g(PK_TLIGHT, 6);
  g(PK_CAM, 6);     g(PK_PLAY, 5);    g(PK_APPLE, 5);
  g(PK_TREE, 4);    g(PK_SAKURA, 4);  g(PK_ROCK, 3);
  g(PK_METRO, 8);   g(PK_SWING, 7);   g(PK_CLIMB, 7);
  g(PK_HOOP, 9);
})();
// placed on purpose first, scattered dressing last - and the first three
// are never moved, because other systems know where they are
// Rails come high: they are a run along a bridge edge at a fixed interval,
// and one post lost to a passing bench leaves a visible gap in the railing.
const CLEAR_ORDER = [PK_METRO, PK_STAIR, PK_ITEM, PK_RAIL, PK_HOOP, PK_SWING,
                     PK_CLIMB, PK_STALL, PK_BENCH,
                     PK_CAM, PK_TLIGHT, PK_HYDR, PK_LAMP, PK_TURBINE,
                     PK_APPLE, PK_PLAY, PK_BIN, PK_RACK, PK_CROP,
                     PK_ROCK, PK_TREE, PK_SAKURA];
// things that line a street want the kerb lane, so a run of them reads as a
// row rather than a scatter across the width of the pavement
const KERB_KIND = [];
(function(){ for (const k of [PK_LAMP, PK_BIN, PK_HYDR, PK_CAM, PK_TLIGHT,
                              PK_BENCH, PK_RACK]) KERB_KIND[k] = 1; })();
const PIN_KIND = [];
(function(){ for (const k of [PK_METRO, PK_STAIR, PK_ITEM]) PIN_KIND[k] = 1; })();
function isKerb(tx, ty){
  if (tileAt(tx, ty) !== T_WALK) return false;
  for (let d = 0; d < 4; d++){
    const q = tileAt(tx + DIRV[d][0], ty + DIRV[d][1]);
    if (q === T_ROAD || q === T_CROSS) return true;
  }
  return false;
}
// the facing a prop will be drawn at - its footprint turns with it
function propFacing(p){
  if (p.fix !== undefined) return p.fix;      // set down deliberately, and aimed
  if (p.k === PK_STALL) return stallYaw(p);
  if (p.k === PK_BENCH) return benchYaw(p);
  return propYaw(p) + (MODEL_TURN[p.k] || 0);
}
function footBox(k, yaw){
  const m = MODEL_FOOT[k];
  let w = m ? m[0] : (PROPDEF[k] ? PROPDEF[k].w : 0.8);
  let d = m ? m[1] : w;
  // every facing in this world is a quarter turn, so the swap is exact
  if (Math.abs(Math.round(yaw / (Math.PI / 2))) % 2){ const t = w; w = d; d = t; }
  return [w, d];
}
function placeProps(){
  if (!occ) occ = new Uint8Array(MAP * MAP);
  occ.fill(OCC_FREE);
  // doorways are claimed before anything else gets a look in
  for (const d of doors)
    for (let step = 1; step <= 2; step++){
      const ix = Math.floor(d.bx + d.nx * step), iy = Math.floor(d.by + d.ny * step);
      if (inMap(ix, iy)) occ[iy * MAP + ix] = OCC_DOOR;
    }
  const span = (c, size) => [Math.floor(c - size * 0.5 + 1e-6),
                             Math.floor(c + size * 0.5 - 1e-6)];
  const cellsFree = (cx, cy, w, d) => {
    const [x0, x1] = span(cx, w), [y0, y1] = span(cy, d);
    for (let y = y0; y <= y1; y++)
      for (let x = x0; x <= x1; x++){
        if (!inMap(x, y) || occ[y * MAP + x] !== OCC_FREE) return false;
      }
    return true;
  };
  const doorFree = (cx, cy, w, d) => {
    const [x0, x1] = span(cx, w), [y0, y1] = span(cy, d);
    for (let y = y0; y <= y1; y++)
      for (let x = x0; x <= x1; x++)
        if (inMap(x, y) && occ[y * MAP + x] === OCC_DOOR) return false;
    return true;
  };
  const claim = (cx, cy, w, d) => {
    const [x0, x1] = span(cx, w), [y0, y1] = span(cy, d);
    for (let y = y0; y <= y1; y++)
      for (let x = x0; x <= x1; x++) occ[y * MAP + x] = OCC_TAKEN;
  };
  // same-kind spread, on a coarse bucket grid
  const SP = 8, SPS = 4096, sbuck = new Map();
  const twinTooClose = (k, cx, cy) => {
    const sp = MODEL_SPACE[k];
    if (sp === undefined) return false;
    const sp2 = sp * sp, bx = (cx / SP) | 0, by = (cy / SP) | 0;
    for (let jy = -1; jy <= 1; jy++)
      for (let jx = -1; jx <= 1; jx++){
        const a = sbuck.get((by + jy) * SPS + (bx + jx));
        if (!a) continue;
        for (let i = 0; i < a.length; i++){
          const o = a[i];
          if (o.k !== k) continue;
          const dx = o.x - cx, dy = o.y - cy;
          if (dx * dx + dy * dy < sp2) return true;
        }
      }
    return false;
  };
  const rank = {};
  for (let i = 0; i < CLEAR_ORDER.length; i++) rank[CLEAR_ORDER[i]] = i;
  const order = props.slice().sort((a, b) =>
    (rank[a.k] === undefined ? 99 : rank[a.k]) - (rank[b.k] === undefined ? 99 : rank[b.k]));
  const keep = [];
  let moved = 0, dropped = 0;
  const _p = { k: 0, x: 0, y: 0, fix: undefined };   // scratch, to probe a candidate
  for (const q of order){
    const hx = Math.floor(q.x), hy = Math.floor(q.y);
    const homeT = inMap(hx, hy) ? tType[hy * MAP + hx] : -1;
    const pin = PIN_KIND[q.k], wantKerb = KERB_KIND[q.k];
    // Every tile this prop would accept, best first. Nearest wins, except
    // for the things that line a street: for those the kerb lane outranks
    // the inner pavement outright, so a lamp two tiles from the kerb walks
    // out to it rather than sitting back in the middle of the footway. That
    // is what turns a scatter into a row.
    const cand = [];
    const maxRing = pin ? 0 : 2;
    for (let dy = -maxRing; dy <= maxRing; dy++)
      for (let dx = -maxRing; dx <= maxRing; dx++){
        const ring = Math.max(Math.abs(dx), Math.abs(dy));
        const tx = hx + dx, ty = hy + dy;
        if (!inMap(tx, ty)) continue;
        if (ring && tType[ty * MAP + tx] !== homeT) continue;   // stay on its surface
        cand.push([(wantKerb && !isKerb(tx, ty) ? 8 : 0) + ring, tx, ty]);
      }
    cand.sort((a, b) => a[0] - b[0]);
    let got = null;
    for (let i = 0; i < cand.length; i++){
      let cx = cand[i][1] + 0.5, cy = cand[i][2] + 0.5;
      _p.k = q.k; _p.x = cx; _p.y = cy; _p.fix = q.fix;
      let yaw, fw, fd, kx = cx, ky = cy, kw, kd;
      if (q.k === PK_STALL){
        const d = stallSpot(_p);
        if (d < 0) continue;                    // no pitch here
        yaw = Math.atan2(DIRV[d][0], -DIRV[d][1]);
        const fb = footBox(q.k, yaw);
        fw = fb[0]; fd = fb[1];
        // Back it onto the frontage. A pitch sits hard against the wall, which
        // is what keeps the middle of the footway open - and leaves no slot
        // behind the cart for anything else to end up wedged into.
        const fx = DIRV[d][0], fy = DIRV[d][1];
        const wall = _stallBack - 0.5;          // near face of the building
        const off = Math.max(0, Math.min(3, wall - STALL_D * 0.5));
        cx -= fx * off; cy -= fy * off;
        // Claim back to the wall so the leftover sliver is spoken for, and a
        // stride in FRONT of the counter as well - that is where a customer
        // stands, and without it the later passes park a bench in it.
        const slack = Math.max(0, wall - off - STALL_D * 0.5), apron = 1.6;
        kw = fw + (fx ? slack + apron : 0); kd = fd + (fy ? slack + apron : 0);
        kx = cx + fx * (apron - slack) * 0.5; ky = cy + fy * (apron - slack) * 0.5;
        // What stops the player is this box plus their own width, so a cart
        // that merely TOUCHES a doorway apron still walls it off. Test that
        // wider box against doorways only - it may touch other props freely,
        // and reserving the whole of it would cost carts for nothing.
        if (!doorFree(cx, cy, fw + cam.rad * 2, fd + cam.rad * 2)) continue;
      } else {
        yaw = propFacing(_p);
        const fb = footBox(q.k, yaw);
        fw = fb[0]; fd = fb[1]; kw = fw; kd = fd;
      }
      if (!cellsFree(kx, ky, kw, kd)) continue;
      if (twinTooClose(q.k, cx, cy)) continue;
      got = { cx, cy, yaw, kx, ky, kw, kd };
      break;
    }
    if (!got && pin){                          // these hold their ground regardless
      const cx = hx + 0.5, cy = hy + 0.5;
      _p.k = q.k; _p.x = cx; _p.y = cy; _p.fix = q.fix;
      const yaw = propFacing(_p), fb = footBox(q.k, yaw);
      got = { cx, cy, yaw, kx: cx, ky: cy, kw: fb[0], kd: fb[1] };
    }
    if (!got){ dropped++; continue; }
    if (got.cx !== q.x || got.cy !== q.y) moved++;
    q.x = got.cx; q.y = got.cy; q.yaw = got.yaw;
    claim(got.kx, got.ky, got.kw, got.kd);
    const kk = ((q.y / SP) | 0) * SPS + ((q.x / SP) | 0);
    let a = sbuck.get(kk);
    if (!a) sbuck.set(kk, a = []);
    a.push(q);
    keep.push(q);
  }
  props = keep;
  return { moved, dropped };
}

/*--------------------------- readable signage ------------------------------
  A sign is anchored to a street-facing wall tile but drawn in screen space at
  one character per cell, so the text stays legible at any range - a
  holographic panel rather than a painted texture.
============================================================================*/
/* A sign used to be one word baked into one bitmap that blinked on and off
   whole, frame and all - a light switch, not an advertisement.

   Now the panel is structure and the words are cargo. The frame and its
   running lights are computed from a cell's position in the border ring, and
   the lettering is a separate ink strip swapped underneath it: the name, then
   the pitch, then the name again, then something long enough that it has to
   crawl. A facade is rented, so a panel can carry two or three tenants taking
   turns, and when the turn changes so does the colour, the lights and the
   patter - competition, rendered.

   Roles: 1 backing, 2 frame, 3 lettering. */
const SIGN_WIN   = 9;      // glyphs of window a crawling message runs through
const SIGN_SPEED = 16;     // and how many art columns per second it travels
// A phrase baked to ink. Height is always the panel's inner height so a strip
// drops straight into the frame; width is the inner width for a phrase that
// sits still, or the whole message plus a clear gap for one that crawls.
function bakeText(txt, iw, ih, vert, scroll){
  const gw = vert ? 3 : txt.length * 4 - 1;
  const gh = vert ? txt.length * 6 - 1 : 5;
  const w = scroll ? Math.max(iw + 4, gw + iw) : iw, h = ih;
  const data = new Uint8Array(w * h);
  const ox = scroll ? 0 : Math.max(0, (w - gw) >> 1);
  const oy = Math.max(0, (h - gh) >> 1);
  for (let i = 0; i < txt.length; i++){
    const g = (MINIFONT[txt[i]] || MINIFONT[' ']).split('|');
    const cx = vert ? ox : ox + i * 4, cy = vert ? oy + i * 6 : oy;
    for (let r = 0; r < 5; r++)
      for (let c = 0; c < 3; c++)
        if (g[r][c] === '#' && cy + r < h && cx + c < w)
          data[(cy + r) * w + (cx + c)] = 1;
  }
  return { w, h, data };
}
const SIGN_SL = new Map();
function signSlotsFor(col){
  let sl = SIGN_SL.get(col);
  if (sl) return sl;
  const sb = new Int16Array(NROLE), sd = new Float32Array(NROLE);
  sb[1] = C.signBack; sd[1] = 0.82;
  sb[2] = col;        sd[2] = 0.95;
  sb[3] = col;        sd[3] = 1.0;
  SIGN_SL.set(col, sl = { sb, sd });
  return sl;
}
/* Lamps set around the border, read off a cell's distance along the ring and
   shifted a lamp at a time, so the colours appear to travel round the frame.
   A dark entry in the pattern is what makes the movement legible. */
function chaseFor(col, D){
  if (rnd() < 0.38) return null;                  // plenty of frames are plain
  const alt = D.neon[(rnd() * D.neon.length) | 0];
  const pats = [
    [[col, 1.0], [C.signBack, 0.26]],                                 // on, off
    [[col, 1.0], [alt, 1.0], [C.signBack, 0.24]],                     // two, chasing
    [[C.nWhite, 1.0], [col, 0.95], [C.nWhite, 0.45], [col, 0.30]],    // a soft spin
    [[col, 1.0], [col, 0.62], [C.signBack, 0.22], [alt, 0.95], [C.signBack, 0.22]],
    [[col, 1.0], [C.signBack, 0.22], [alt, 1.0], [C.signBack, 0.22]]  // alternating
  ];
  const pat = pats[(rnd() * pats.length) | 0];
  const cc = new Int16Array(pat.length), cd = new Float32Array(pat.length);
  for (let i = 0; i < pat.length; i++){ cc[i] = pat[i][0]; cd[i] = pat[i][1]; }
  return { c: cc, d: cd, n: pat.length };
}
// How far the same building keeps this face exposed, in tiles. A sign is
// centred in that run and never allowed wider than it.
function faceRun(b, tx, ty, nx, ny){
  const open = (px, py) => {
    if (!inMap(px, py) || tB[py * MAP + px] !== b.id) return false;
    const ox = px + nx, oy = py + ny;
    return !inMap(ox, oy) || tType[oy * MAP + ox] !== T_BLD;
  };
  let lo, hi;
  if (nx !== 0){ lo = ty; while (open(tx, lo - 1)) lo--; hi = ty; while (open(tx, hi + 1)) hi++; }
  else         { lo = tx; while (open(lo - 1, ty)) lo--; hi = tx; while (open(hi + 1, ty)) hi++; }
  return [lo, hi + 1];
}
/* Lay the tenants out into one running order and cut a panel that holds it.
   The wall gets the casting vote: a narrow facade does not lose its sign, it
   loses the luxury of a phrase standing still. Anything too long for the
   space is handed to the crawl, and the crawl's window shrinks to whatever
   the brickwork can actually carry. */
function signPanel(brands, vert, budget){
  const cap = Math.max(3, (budget || 999) - 4);       // art cells of interior
  let iw = 3, ih = 5, anyScroll = false;
  for (const br of brands) for (const ph of br.ph){
    const gw = vert ? 3 : ph.txt.length * 4 - 1;
    const gh = vert ? ph.txt.length * 6 - 1 : 5;
    if (!ph.scroll && !vert && gw > cap) ph.scroll = true;   // too long to sit still
    if (ph.scroll){ anyScroll = true; continue; }
    if (vert) ih = Math.max(ih, gh);
    else      iw = Math.max(iw, gw);
  }
  if (anyScroll && !vert) iw = Math.max(iw, Math.min(SIGN_WIN * 4 - 1, cap));
  if (!vert){
    iw = Math.min(iw, cap);
    if (iw < 11) return null;                          // not even three glyphs
  }
  const seq = [];
  for (const br of brands){
    const sl = signSlotsFor(br.col);
    for (const ph of br.ph){
      const gw = ph.txt.length * 4 - 1;
      const sw = ph.scroll ? Math.max(iw + 4, gw + iw) : iw;
      seq.push({ txt: ph.txt, scroll: !!ph.scroll, sb: sl.sb, sd: sl.sd,
                 ch: br.ch, tx: null,
                 dur: ph.scroll ? sw / SIGN_SPEED : 1.5 + rnd() * 1.7 });
    }
  }
  let cyc = 0;
  for (const e of seq) cyc += e.dur;
  return { iw, ih, pw: iw + 4, ph: ih + 4, seq, cyc };
}
function pushSign(axis, n, plane, mid, wm, hm, z, nx, ny, pan, vert, blink){
  signs.push({
    axis, n, plane: plane + n * 0.06,          // sit just proud of the wall
    a0: mid - wm * 0.5, a1: mid + wm * 0.5,
    x: axis === 0 ? plane : mid, y: axis === 0 ? mid : plane,
    nx, ny, z, hm, wm, vert: !!vert,
    pw: pan.pw, ph: pan.ph, iw: pan.iw, ih: pan.ih,
    seq: pan.seq, cyc: pan.cyc, phase: rnd() * pan.cyc,
    blink: blink || 0, spin: 2.5 + rnd() * 7.5,
    sb: pan.seq[0].sb, sd: pan.seq[0].sd
  });
}
function makeSign(b, tx, ty, nx, ny, brands, vert, blink){
  if (!brands || !brands.length) return;
  const axis = nx !== 0 ? 0 : 1, n = nx !== 0 ? nx : ny;
  const run = faceRun(b, tx, ty, nx, ny);
  const runLen = run[1] - run[0];
  const maxW = runLen - 0.5;                    // leave the corners clear
  if (maxW < 0.8) return;
  const pan = signPanel(brands, vert, Math.floor(maxW / 0.07));
  if (!pan) return;
  let pix = Math.min(0.26, maxW / pan.pw);
  if (vert) pix = Math.min(pix, 9.0 / pan.ph);
  if (pix < 0.07) return;                       // wall too narrow to carry it
  const wm = pan.pw * pix, hm = pan.ph * pix;
  const hostH = tH[ty * MAP + tx];
  let z = vert ? 5 + rnd() * 5 : 2.4 + rnd() * 1.5;
  z = clamp(z, 1.2, hostH - hm - 0.3);
  if (z < 1.1 || z + hm > hostH - 0.1) return;  // does not fit on this wall
  const face = axis === 0 ? (nx > 0 ? tx + 1 : tx) : (ny > 0 ? ty + 1 : ty);
  pushSign(axis, n, face, (run[0] + run[1]) * 0.5, wm, hm, z, nx, ny,
           pan, vert, blink);
}
/*=========================== WHAT A BUILDING IS =============================
  There used to be two unrelated rolls: the door borrowed whatever word the
  first sign happened to paint, and the interior picked a trade from its own
  hash. So a door reading HARDWARE opened onto a fruit market, and a LOVE
  HOTEL sold gummies. One decision now settles both - the building's USE -
  and the door, the map symbol and the room all read it.

  Signage is advertising and says nothing binding about the building any
  more; brands come and go on a facade, the door does not.

  Uses with `kind` are built. The rest are real doors onto rooms nobody has
  furnished yet: they open, they are empty, and they say so, waiting for the
  day laundries and arcades mean something.
============================================================================*/
const USES = {
  grocery:    { door: 'MARKET',     kind: 'shop', trade: 'grocery' },
  bodega:     { door: 'BODEGA',     kind: 'shop', trade: 'bodega' },
  general:    { door: 'GOODS',      kind: 'shop', trade: 'general' },
  clothier:   { door: 'THREADS',    kind: 'shop', trade: 'clothier' },
  jeweler:    { door: 'GOLD',       kind: 'shop', trade: 'jeweler' },
  armory:     { door: 'ARMS',       kind: 'shop', trade: 'armory' },
  tools:      { door: 'HARDWARE',   kind: 'shop', trade: 'tools' },
  dispensary: { door: 'DISPENSARY', kind: 'shop', trade: 'dispensary' },
  lobby:      { door: 'LOBBY',      kind: 'lobby' },
  depot:      { door: 'DEPOT',      kind: 'depot' },
  home:       { door: 'APARTMENTS', kind: 'home' },
  hideout:    { door: 'NO NUMBER',  kind: 'hideout' },
  // doors onto rooms that do not exist yet
  laundry:    { door: 'LAUNDRY' },   club:    { door: 'CLUB' },
  arcade:     { door: 'ARCADE' },    cafe:    { door: 'CAFE' },
  bakery:     { door: 'BAKERY' },    clinic:  { door: 'CLINIC' },
  bar:        { door: 'BAR' },       school:  { door: 'SCHOOL' },
  sushi:      { door: 'SUSHI' },     noodles: { door: 'NOODLE BAR' },
  garage:     { door: 'GARAGE' },    church:  { door: 'CHURCH' },
  pharmacy:   { door: 'PHARMACY' },  gym:     { door: 'GYM' }
};
/* the mix each district draws from - developed uses and undeveloped ones
   side by side, so the city reads varied without lying about any door */
const USE_MIX = [
  // repeats are weights. Roughly a fifth of the city is a door onto a room
  // that does not exist yet - enough to promise a bigger city later, not so
  // much that a street is all shutters.
  ['lobby','lobby','lobby','general','general','clothier','clothier',
   'jeweler','jeweler','cafe','clinic','gym'],                                // D_DOWN
  ['clothier','clothier','tools','tools','jeweler','jeweler','general',
   'general','armory','armory','dispensary','noodles','sushi','bar','club',
   'arcade','bakery'],                                                        // D_STRIP
  ['grocery','grocery','grocery','bodega','bodega','bodega','general',
   'general','home','home','laundry','pharmacy','cafe','clinic','bakery'],    // D_RES
  ['depot','depot','depot','tools','tools','tools','armory','armory',
   'general','garage'],                                                       // D_IND
  ['home','home','home','home','grocery','grocery','bodega','bodega',
   'general','garage','school','church','laundry'],                           // D_SUB
  ['home','home','grocery','grocery','general','church','bakery'],            // D_RURAL
  ['dispensary','dispensary','dispensary','bodega','bodega','jeweler',
   'jeweler','tools','armory','general','bar','club','clinic']                // D_RED
];
function buildingUse(b){
  if (!b || b.landmark || b.x0 === undefined) return null;
  if (HIDEOUT && HIDEOUT.bld === b.id) return 'hideout';   // the cell's room
  if (typeof isDungeon === 'function' && isDungeon(b)) return 'dungeon';
  if ((b.dist === D_RED || b.dist === D_STRIP) && hash3(b.id, 63, 7) < 0.22)
    return 'casino';
  if (b.dist === D_RED && hash3(b.id, 65, 11) < 0.30) return 'parlor';
  const mix = USE_MIX[b.dist] || USE_MIX[0];
  return mix[(hash3(b.id, 31, 7) * mix.length) | 0];
}
/* the word over the door: the truth about the room behind it */
function useDoorName(b){
  const u = buildingUse(b);
  if (!u) return null;
  if (u === 'dungeon' || u === 'casino' || u === 'parlor') return specialWordFor(b);
  return (USES[u] && USES[u].door) || 'DOOR';
}
/* The sign, the door and the room have to agree. Casinos, parlors and the
   condemned towers are dealt by hash inside buildInterior, so their names
   are derived from the SAME hashes here - one function both the signage
   and the door naming consult, so the street never promises noodles over
   a card table. */
function specialWordFor(b){
  if (b.landmark) return null;
  if (isDungeon(b))
    return ['CONDEMNED', 'NO ENTRY', 'SEALED', 'VACANT'][(hash3(b.id, 72, 5) * 4) | 0];
  if ((b.dist === D_RED || b.dist === D_STRIP) && hash3(b.id, 63, 7) < 0.22)
    return ['LUCKY LUCKY', 'VELVET WHEEL', 'PACHINKO', 'HIGH-LOW'][(hash3(b.id, 64, 9) * 4) | 0];
  if (b.dist === D_RED && hash3(b.id, 65, 11) < 0.30)
    return ['VELVET ROOM', 'NEON GARDEN', 'SIGNAL HOUSE', 'STEAM SILK'][(hash3(b.id, 66, 13) * 4) | 0];
  return null;
}
/*---------------------------- what a sign says -----------------------------
  Signage stopped being a nameplate when the door started telling the truth,
  so it is free to do what signage actually does: shout a name, make a claim,
  and shout the name again in case you missed it.
============================================================================*/
const BRAND_HEAD = ['NOVA','ORBIT','KOI','ZEN','IRON','LOTUS','ATLAS','VIPER',
  'MOTH','AMBER','ONYX','SABLE','HALO','TIGER','CRANE','EMBER','PEARL','RUST',
  'JADE','COBALT','SIREN','MAGPIE','FOX','WOLF','GHOST','ROOK','SALT','SUGAR',
  'BRASS','KESTREL','MARROW','TALLOW','QUARTZ','HOLLOW','THISTLE'];
const BRAND_TAIL = ['CO','WORKS','HOUSE','MART','LTD','GROUP','BROS','LABS',
  'TRADE','SUPPLY','ROOM','CLUB','& SON'];
const SLOGANS = ['OPEN 24 HRS','BEST IN TOWN','NO REFUNDS','WE NEVER CLOSE',
  'HALF OFF','CASH ONLY','ASK INSIDE','NEW STOCK','TWO FOR ONE','SINCE 2049',
  'GET SOME','WHY NOT','LOWEST PRICE','TODAY ONLY','THE REAL THING','DONT WAIT',
  'STEP INSIDE','ALWAYS ON','YES WE HAVE IT','STILL CHEAP','TRY IT WET',
  'NO QUESTIONS','TASTE IT','WARM INSIDE','LATE HOURS','WALK IN','ALL NIGHT',
  'YOU EARNED IT','FEELS RIGHT','LAST ONE','BUY TWO','FRESH TODAY'];
const CRAWLS = [
  'NOTHING DOWN AND NOTHING TO PAY UNTIL THE RAIN STOPS',
  'IF YOU CAN CARRY IT OUT YOU CAN BUY IT TONIGHT',
  'WE WERE HERE BEFORE THE TOWER AND WE WILL BE HERE AFTER',
  'ASK ABOUT OUR TERMS THEY ARE WORSE THAN YOU THINK',
  'EVERY ITEM GUARANTEED FOR AS LONG AS YOU ARE HOLDING IT',
  'THE ONLY HONEST PRICE ON THIS ENTIRE BLOCK NO REALLY',
  'BRING A FRIEND BRING TWO BRING EVERYONE YOU STILL TRUST',
  'CLOSED FOR NOTHING SHORT OF THE END OF THE WORLD',
  'YOUR OLD ONE IS WORTH SOMETHING TO US BRING IT IN',
  'DO NOT READ THIS SIGN READ THE PRICES INSIDE INSTEAD'];
function adorn(txt){
  const s = SIGN_SYM[(rnd() * SIGN_SYM.length) | 0];
  const r = rnd();
  if (r < 0.24) return s + ' ' + txt + ' ' + s;
  if (r < 0.38) return s + ' ' + txt;
  if (r < 0.46) return txt + ' ' + s;
  if (r < 0.52) return txt + '!';
  return txt;
}
function brandName(D, words, vert){
  const cap = vert ? 9 : 12;
  const r = rnd();
  let nm;
  if (r < 0.40) nm = words[(rnd() * words.length) | 0];
  else if (r < 0.76) nm = BRAND_HEAD[(rnd() * BRAND_HEAD.length) | 0];
  else {
    const h = BRAND_HEAD[(rnd() * BRAND_HEAD.length) | 0];
    const t = BRAND_TAIL[(rnd() * BRAND_TAIL.length) | 0];
    nm = (h + ' ' + t).length <= cap ? h + ' ' + t : h;
  }
  if (nm.length > cap) nm = BRAND_HEAD[(rnd() * BRAND_HEAD.length) | 0];
  return nm.length <= cap ? nm : nm.slice(0, cap);
}
/* One panel, one to three tenants. Each brings its own colour, its own
   border lights and its own run of copy, and the panel hands itself round. */
function signBrands(D, words, vert){
  const out = [];
  const n = vert ? 1 : rnd() < 0.30 ? 2 : rnd() < 0.09 ? 3 : 1;
  for (let i = 0; i < n; i++){
    const col = D.neon[(rnd() * D.neon.length) | 0];
    const name = brandName(D, words, vert);
    const ph = [{ txt: name }];
    if (!vert){
      const pitches = 1 + ((rnd() * 2) | 0);
      for (let k = 0; k < pitches; k++){
        const line = adorn(SLOGANS[(rnd() * SLOGANS.length) | 0]);
        ph.push(line.length > 13 ? { txt: line, scroll: true } : { txt: line });
        if (rnd() < 0.45) ph.push({ txt: name });   // and the name comes back
      }
      if (n === 1 && rnd() < 0.22)
        ph.push({ txt: CRAWLS[(rnd() * CRAWLS.length) | 0], scroll: true });
    }
    out.push({ col, ph, ch: chaseFor(col, D) });
  }
  return out;
}
function buildSigns(){
  signs = [];
  const mkSign = (b, D, f, vert, words) => {
    makeSign(b, f.tx, f.ty, f.nx, f.ny, signBrands(D, words, vert), vert,
             rnd() < 0.30 ? 0.45 + rnd() * 1.5 : 0);
  };
  for (const b of buildings){
    if (b.landmark) continue;
    const D = DISTRICT[b.dist];
    const words = b.redlight ? RED_WORDS : D.words;
    // one bucket per outward direction, so a shop faces every street it fronts
    const faces = [[], [], [], []];
    for (let y = b.y0; y <= b.y1; y++)
      for (let x = b.x0; x <= b.x1; x++){
        if (!inMap(x, y) || tB[y * MAP + x] !== b.id) continue;
        for (let d = 0; d < 4; d++){
          const nx = x + DIRV[d][0], ny = y + DIRV[d][1];
          if (!inMap(nx, ny)) continue;
          const t = tType[ny * MAP + nx];
          if (t !== T_WALK && t !== T_ROAD && t !== T_CROSS) continue;
          faces[d].push({ tx: x, ty: y, nx: DIRV[d][0], ny: DIRV[d][1], h: tH[y * MAP + x] });
        }
      }
    let anyFace = null;
    for (let d = 0; d < 4; d++){
      const bucket = faces[d];
      if (!bucket.length) continue;
      anyFace = bucket;
      if (rnd() > (b.redlight ? 0.98 : D.sign)) continue;
      mkSign(b, D, bucket[(rnd() * bucket.length) | 0], false, words);
    }
    if (anyFace && rnd() < D.signV){
      const tall = anyFace.filter(f => f.h > 13);
      if (tall.length) mkSign(b, D, tall[(rnd() * tall.length) | 0], true, words);
    }
  }
}

// Residential streets and suburbs favour cherry blossom; the industrial belt
// keeps its scraggly evergreens.
function treeKind(x, y){
  const d = districtAt(x, y);
  return (d === D_SUB || d === D_RES) && hash3(x, y, 404) < 0.6 ? PK_SAKURA : PK_TREE;
}
// Nothing should be planted against a facade - a trunk half inside a wall
// reads as a glitch, not a tree.
function nearBuilding(x, y, r){
  for (let dy = -r; dy <= r; dy++)
    for (let dx = -r; dx <= r; dx++)
      if (tileAt(x + dx, y + dy) === T_BLD) return true;
  return false;
}
// Cart rates run higher than the count you end up with: a pitch has to have
// a wall at its back, a frontage opposite, room to sit flush against that
// wall and a clear stride in front of its counter, and most candidate
// tiles fail one of those. These are tuned to what SURVIVES the placer.
function buildProps(){
  // street furniture scattered along the sidewalk ring
  for (let y = 1; y < MAP - 1; y++){
    for (let x = 1; x < MAP - 1; x++){
      if (tType[y * MAP + x] !== T_WALK) continue;
      let kerb = false;
      for (let d = 0; d < 4; d++){
        const q = tileAt(x + DIRV[d][0], y + DIRV[d][1]);
        if (q === T_ROAD || q === T_CROSS){ kerb = true; break; }
      }
      const hh = hash3(x, y, 7), sd = hash3(x, y, 19);
      let nearStop = false;
      for (let m = 0; m < metroStops.length; m++)
        if (Math.abs(metroStops[m].x - x) < 2.5 && Math.abs(metroStops[m].y - y) < 2.5) nearStop = true;
      if (nearStop) continue;
      const D = DISTRICT[districtAt(x, y)];
      if (kerb){
        if (hh < D.lamp)               props.push({ x: x + 0.5, y: y + 0.5, k: PK_LAMP, s: sd, r: 0.16 });
        else if (hh < D.lamp + D.cam)  props.push({ x: x + 0.5, y: y + 0.5, k: PK_CAM,  s: sd, r: 0.16 });
        else if (hh < D.lamp + D.cam + D.hydr) props.push({ x: x + 0.5, y: y + 0.5, k: PK_HYDR, s: sd, r: 0.18 });
      } else if (hh < D.bin){
        props.push({ x: x + 0.5, y: y + 0.5, k: PK_BIN, s: sd, r: 0.22 });
      }
    }
  }
  // Street-level walk-ups: stalls and benches where the old kerb line ran, so
  // the boulevard has somewhere for crowds to gather.
  for (let y = 1; y < MAP - 1; y++)
    for (let x = 1; x < MAP - 1; x++){
      const t = tType[y * MAP + x];
      if (t !== T_ROAD && t !== T_WALK) continue;
      let nearWalk = false, nearRoad = false;
      for (let d = 0; d < 4; d++){
        const q = tileAt(x + DIRV[d][0], y + DIRV[d][1]);
        if (q === T_WALK) nearWalk = true;
        else if (q === T_ROAD) nearRoad = true;
      }
      const D = DISTRICT[districtAt(x, y)];
      const hh = hash3(x, y, 41);
      if (hh < D.stall){
        // A cart wants a wall at its back and the far side of the street in
        // front of it. That matters more than sitting exactly on the old
        // kerb line, so unlike the benches it may take any paving that fits.
        const cart = { x: x + 0.5, y: y + 0.5, k: PK_STALL, s: hash3(x, y, 43), r: 0.55 };
        if (stallSpot(cart) >= 0) props.push(cart);
        continue;
      }
      if (!nearWalk || !nearRoad) continue;
      if (hh < D.stall + 0.035)
        props.push({ x: x + 0.5, y: y + 0.5, k: PK_BENCH, s: 0, r: 0.35 });
    }

  // The junctions keep a fitting on the corner, but with nothing driving it is
  // a surveillance camera rather than a signal head.
  for (let bj = 0; bj < NB; bj++){
    for (let bi = 0; bi < NB; bi++){
      const zn = zoneAt(bi, bj);
      if (zn > 2) continue;
      const rate = zn === 0 ? 0.60 : zn === 1 ? 0.34 : 0.12;
      const corners = [
        [bi * P - 0.5,      bj * P - 0.5],
        [bi * P + RW + 0.5, bj * P - 0.5],
        [bi * P - 0.5,      bj * P + RW + 0.5],
        [bi * P + RW + 0.5, bj * P + RW + 0.5]
      ];
      for (let ci = 0; ci < corners.length; ci++){
        const c = corners[ci];
        if (c[0] < 1 || c[1] < 1 || c[0] > MAP - 1 || c[1] > MAP - 1) continue;
        if (hash3(bi * 4 + ci, bj, 71) > rate) continue;
        const tt = tType[(c[1] | 0) * MAP + (c[0] | 0)];
        if (tt !== T_WALK) continue;
        props.push({ x: c[0], y: c[1], k: PK_CAM, s: hash3(bi, bj * 4 + ci, 73), r: 0.16 });
      }
    }
  }
  // Street trees go in last, once every other fitting is placed, because a
  // tree on the promenade has to stand clear: nothing beside it to left or
  // right, and no facade within two tiles.
  const occ = new Uint8Array(MAP * MAP);
  for (const q of props){
    const ix = q.x | 0, iy = q.y | 0;
    if (ix >= 0 && iy >= 0 && ix < MAP && iy < MAP) occ[iy * MAP + ix] = 1;
  }
  for (let y = 2; y < MAP - 2; y++)
    for (let x = 2; x < MAP - 2; x++){
      if (tType[y * MAP + x] !== T_ROAD) continue;
      const rx = x % P, ry = y % P;
      const inX = rx < RW;
      if (inX && ry < RW) continue;                   // never in the junction
      if (inX ? rx !== 3 : ry !== 3) continue;        // the centre line only
      if ((inX ? y : x) % 8) continue;                // spaced down the avenue
      const D = DISTRICT[districtAt(x, y)];
      if (hash3(x, y, 61) > D.stree) continue;
      if (nearBuilding(x, y, 2)) continue;
      // sweep out to either side, across the width of the walkway
      const lx = inX ? 1 : 0, ly = inX ? 0 : 1;       // sideways
      const ax = inX ? 0 : 1, ay = inX ? 1 : 0;       // along the avenue
      let flanked = false;
      for (let k = 1; k <= 3 && !flanked; k++)
        for (let m = -1; m <= 1; m++){
          const px = x + lx * k + ax * m, py2 = y + ly * k + ay * m;
          const qx = x - lx * k + ax * m, qy = y - ly * k + ay * m;
          if ((inMap(px, py2) && occ[py2 * MAP + px]) ||
              (inMap(qx, qy) && occ[qy * MAP + qx])){ flanked = true; break; }
        }
      if (flanked) continue;
      props.push({ x: x + 0.5, y: y + 0.5, k: treeKind(x, y), s: hash3(x, y, 63), r: 0.38 });
      occ[y * MAP + x] = 1;                           // and keep the next one off
    }

  // Park and lot trees are dropped while the blocks are still being built, so
  // a later building - or a landmark stamped over the top - can land on one.
  // Prune once at the end, when the geometry is final.
  props = props.filter(q => {
    if (q.k !== PK_TREE && q.k !== PK_APPLE && q.k !== PK_SAKURA && q.k !== PK_CROP) return true;
    return !nearBuilding(q.x | 0, q.y | 0, 1);
  });
  stalls = props.filter(q => q.k === PK_STALL);
}

// Pedestrian navigation grid. Cost x10 so it stays in a Uint8Array.
function buildWalkGrid(){
  for (let i = 0; i < MAP * MAP; i++){
    const t = tType[i];
    // the old carriageway is paving now, so it costs exactly what a
    // sidewalk costs and people spread across the whole boulevard
    walkG[i] = t === T_WALK ? 10 : t === T_BRIDGE ? 10 : t === T_PATH ? 9 :
               t === T_LOT ? 14 : t === T_CROSS ? 10 : t === T_ROAD ? 10 : 0;
  }
}

/*=========================== 9. SPRITE ARTWORK =============================
  Billboards are tiny role maps. A role is resolved per instance to a base
  colour + a surface density, so one template serves every car colour.
============================================================================*/
const ROLE = { '.':0, 'B':1, 'W':2, 'T':3, 'L':4, 'R':5, 'S':6, 'P':7,
               'H':8, 'K':9, 'V':10, 'M':11, 'G':12, 'X':13 };
const NROLE = 14;
// Literal ASCII art: hand-drawn text is rendered with its EXACT characters,
// each cell carrying its own glyph, colour and fallback density. Authoring
// loop: draw in a text file, paste the lines here, give each character class
// a colour with colorOf(ch, x, y). Far distance levels fall back to density
// shading so the art still fades into the fog like everything else.
function parseArtLit(rows, colorOf){
  let w = 0; for (const r of rows) w = Math.max(w, r.length);
  const h = rows.length;
  const data = new Uint8Array(w * h);
  const g = new Int16Array(w * h);
  const cm = new Uint8Array(w * h);
  const dn = new Float32Array(w * h);
  for (let y = 0; y < h; y++)
    for (let x = 0; x < rows[y].length; x++){
      const ch = rows[y][x];
      if (ch === ' ') continue;
      const i = y * w + x;
      const gi = GI[ch];
      data[i] = 1;
      g[i] = gi === undefined ? GI['*'] : gi;
      cm[i] = colorOf(ch, x, y);
      const ri = RAMP.indexOf(ch);
      dn[i] = ri > 0 ? clamp(ri / RMAX, 0.3, 1) : 0.7;
    }
  return { w, h, data, g, cm, dn, lit: 1 };
}
function parseArt(rows){
  let w = 0; for (const r of rows) w = Math.max(w, r.length);
  const h = rows.length, data = new Uint8Array(w * h);
  for (let y = 0; y < h; y++)
    for (let x = 0; x < rows[y].length; x++) data[y * w + x] = ROLE[rows[y][x]] || 0;
  return { w, h, data };
}

/*-------------------------------- the bench --------------------------------
  A park bench is mostly the gaps: slats you can see the street through, a
  back you can see over, and arms at each end. Extruding a flat elevation
  cannot make a hole, so the bench is authored as a volume like the carts -
  legs, a slatted seat, a slatted back, and two arm rails.
  Local frame: u along its length, v from the front edge (0) to the back
  (1), z up from the path.
============================================================================*/
/*---------------------- what a playground is made of ------------------------
  A park used to get three copies of one abstract climbing shape. These are
  three pieces of real equipment, authored as volumes so they read from any
  angle: a hoop on a pole, a swing set with the seats hanging off the bar,
  and a climbing frame with a slide down one side.
============================================================================*/
// backboard, rim and a pole to bolt them to
function hoopArt(){
  const vol = function(aw, vd, ah){
    const H = 3.4, M = ROLE.M, W = ROLE.W, X = ROLE.X;
    const out = new Uint8Array(aw * vd * ah);
    const set = (x, y, z, r) => {
      if (x < 0 || y < 0 || z < 0 || x >= aw || y >= vd || z >= ah) return;
      out[(z * vd + y) * aw + x] = r;
    };
    const zOf = h => Math.round((1 - h / H) * (ah - 1));
    const cx = (aw - 1) / 2;
    const box = (h0, h1, x0, x1, y0, y1, r) => {
      const za = zOf(h1), zb = zOf(h0);
      for (let z = Math.min(za, zb); z <= Math.max(za, zb); z++)
        for (let y = y0; y <= y1; y++)
          for (let x = x0; x <= x1; x++) set(x, y, z, r);
    };
    const bk = vd - 2;                          // the pole stands at the back
    box(0.00, 2.75, cx - 0.5 | 0, cx + 0.5 | 0, bk, bk + 1, M);   // post
    box(0.00, 0.16, cx - 2 | 0, cx + 2 | 0, bk - 1, vd - 1, M);   // ground plate
    box(2.62, 3.38, 1, aw - 2, bk, bk, W);                        // backboard
    box(2.80, 3.18, cx - 2 | 0, cx + 2 | 0, bk - 1, bk - 1, X);   // the square on it
    // the rim, hung off the BOTTOM edge of the board so it stands clear of it
    const cy = bk - 3;
    for (const zr of [zOf(2.50), zOf(2.42)])
      for (let y = 0; y < vd; y++)
        for (let x = 0; x < aw; x++){
          const dx = x - cx, dy = y - cy;
          const d = Math.sqrt(dx * dx + dy * dy);
          if (d > 1.5 && d <= 2.6 && y <= bk - 1) set(x, y, zr, X);
        }
    const zn = zOf(2.42);
    for (let k = 1; k <= 4; k++)                // and a net under it
      for (let y = 0; y < vd; y++)
        for (let x = 0; x < aw; x++){
          const dx = x - cx, dy = y - cy;
          const d = Math.sqrt(dx * dx + dy * dy);
          if (d > 1.9 - k * 0.22 && d <= 2.5 - k * 0.22 && y <= bk - 1 &&
              ((x + y + k) & 1) === 0) set(x, y, zn + k, W);
        }
    return out;
  };
  return { w: 12, h: 22, data: new Uint8Array(12 * 22), vol };
}
// two A-frames, a bar across, and two seats swinging off it
function swingArt(){
  const vol = function(aw, vd, ah){
    const H = 2.4, M = ROLE.M, K = ROLE.K, X = ROLE.X;
    const out = new Uint8Array(aw * vd * ah);
    const set = (x, y, z, r) => {
      if (x < 0 || y < 0 || z < 0 || x >= aw || y >= vd || z >= ah) return;
      out[(z * vd + y) * aw + x] = r;
    };
    const zOf = h => Math.round((1 - h / H) * (ah - 1));
    const cy = (vd - 1) / 2;
    // an A-frame: two legs leaning in toward the bar
    const frame = (fx) => {
      for (let h = 0; h <= 2.2; h += 0.08){
        const t = h / 2.2, spread = (1 - t) * (vd * 0.34);
        const z = zOf(h);
        set(fx, Math.round(cy - spread), z, M);
        set(fx, Math.round(cy + spread), z, M);
        set(fx + 1, Math.round(cy - spread), z, M);
        set(fx + 1, Math.round(cy + spread), z, M);
      }
    };
    frame(1); frame(aw - 3);
    for (let x = 1; x <= aw - 2; x++)          // the bar they all hang from
      for (const h of [2.30, 2.22, 2.14])
        for (let y = Math.round(cy) - 1; y <= Math.round(cy) + 1; y++)
          set(x, y, zOf(h), M);
    // two seats, chains down from the bar
    for (const sx of [(aw * 0.32) | 0, (aw * 0.66) | 0]){
      for (let h = 0.62; h <= 2.12; h += 0.08){
        set(sx, Math.round(cy), zOf(h), K);
        set(sx + 1, Math.round(cy), zOf(h), K);
      }
      for (let x = sx - 1; x <= sx + 2; x++)
        for (let y = Math.round(cy) - 1; y <= Math.round(cy) + 1; y++)
          set(x, y, zOf(0.58), X);
    }
    return out;
  };
  return { w: 18, h: 16, data: new Uint8Array(18 * 16), vol };
}
// a lattice cube to climb, with a slide off the front of it
function climbArt(){
  const vol = function(aw, vd, ah){
    const H = 2.2, M = ROLE.M, X = ROLE.X, W = ROLE.W;
    const out = new Uint8Array(aw * vd * ah);
    const set = (x, y, z, r) => {
      if (x < 0 || y < 0 || z < 0 || x >= aw || y >= vd || z >= ah) return;
      out[(z * vd + y) * aw + x] = r;
    };
    const zOf = h => Math.round((1 - h / H) * (ah - 1));
    const x0 = 1, x1 = (aw * 0.62) | 0, y0 = 1, y1 = vd - 2;
    // four uprights
    for (let h = 0; h <= 2.0; h += 0.07){
      const z = zOf(h);
      set(x0, y0, z, M); set(x1, y0, z, M); set(x0, y1, z, M); set(x1, y1, z, M);
    }
    // rungs at three heights, all the way round
    for (const h of [0.7, 1.35, 2.0]){
      const z = zOf(h);
      for (let x = x0; x <= x1; x++){ set(x, y0, z, M); set(x, y1, z, M); }
      for (let y = y0; y <= y1; y++){ set(x0, y, z, M); set(x1, y, z, M); }
    }
    // a deck at the top of the far side, and the slide down off it
    for (let x = x1 - 3; x <= x1; x++)
      for (let y = y0 + 1; y <= y1 - 1; y++) set(x, y, zOf(1.42), W);
    const sy0 = ((vd - 1) / 2 - 1) | 0;
    for (let k = 0; k <= 10; k++){
      const h = 1.42 - k * 0.13, x = x1 + 1 + ((k * (aw - x1 - 2) / 10) | 0);
      for (let y = sy0; y <= sy0 + 2; y++){
        set(x, y, zOf(h), X);
        set(x, y, zOf(h) + 1, X);
      }
      set(x, sy0 - 1, zOf(h + 0.14), M);        // the rails either side
      set(x, sy0 + 3, zOf(h + 0.14), M);
    }
    return out;
  };
  return { w: 16, h: 16, data: new Uint8Array(16 * 16), vol };
}
/*---------------------- what the river is carrying --------------------------
  The water used to sprinkle single cells of random neon through itself to
  suggest rubbish. At one glyph apiece they read as coloured squares, because
  that is what they were. These are four actual solids drifting half sunk: a
  pallet, an oil drum on its side, a raft of bottles and cans knotted into a
  slick, and a tyre. Each is authored to sit with its waterline about a third
  of the way up, so the river cuts across it.
============================================================================*/
function flotArt(w, h, vol){ return { w, h, data: new Uint8Array(w * h), vol }; }
// a shipping pallet, slats gone grey, riding almost flat
function palletArt(){
  return flotArt(16, 8, function(aw, vd, ah){
    const K = ROLE.K, M = ROLE.M;
    const out = new Uint8Array(aw * vd * ah);
    const set = (x, y, z, r) => {
      if (x >= 0 && y >= 0 && z >= 0 && x < aw && y < vd && z < ah)
        out[(z * vd + y) * aw + x] = r;
    };
    const zTop = (ah * 0.34) | 0, zBot = (ah * 0.62) | 0;
    for (let x = 0; x < aw; x++)
      for (let y = 0; y < vd; y++){
        if ((x % 3) !== 2) set(x, y, zTop, K);          // top slats, gapped
        if ((x % 3) !== 2) set(x, y, zTop + 1, K);
      }
    for (let x = 0; x < aw; x++)                        // the two bearers
      for (const y of [1, (vd >> 1), vd - 2])
        for (let z = zTop + 2; z <= zBot; z++) set(x, y, z, M);
    return out;
  });
}
// an oil drum on its side, one end open to the sky
function drumArt(){
  return flotArt(12, 12, function(aw, vd, ah){
    const M = ROLE.M, X = ROLE.X, K = ROLE.K;
    const out = new Uint8Array(aw * vd * ah);
    const set = (x, y, z, r) => {
      if (x >= 0 && y >= 0 && z >= 0 && x < aw && y < vd && z < ah)
        out[(z * vd + y) * aw + x] = r;
    };
    const cy = (vd - 1) / 2, cz = ah * 0.46, rad = Math.min(vd, ah) * 0.34;
    for (let x = 1; x < aw - 1; x++)
      for (let y = 0; y < vd; y++)
        for (let z = 0; z < ah; z++){
          const dy = y + 0.5 - cy, dz = z + 0.5 - cz;
          const d = Math.sqrt(dy * dy + dz * dz);
          if (d > rad) continue;
          const rib = (x % 4) === 1;                    // rolling hoops
          set(x, y, z, d > rad - 1.1 ? (rib ? K : M) : (x < 2 ? K : M));
        }
    for (let y = 0; y < vd; y++)                        // a band of old paint
      for (let z = 0; z < ah; z++){
        const dy = y + 0.5 - cy, dz = z + 0.5 - cz;
        if (Math.sqrt(dy * dy + dz * dz) <= rad && dz < -rad * 0.25){
          set((aw >> 1) - 1, y, z, X); set(aw >> 1, y, z, X);
        }
      }
    return out;
  });
}
// bottles and cans knotted together in a slick of film
function slickArt(){
  return flotArt(14, 14, function(aw, vd, ah){
    const W = ROLE.W, X = ROLE.X, K = ROLE.K;

function rampArt(){
  return flotArt(36, 10, function(aw, vd, ah){
    const M = ROLE.M, X = ROLE.X, W = ROLE.W, K = ROLE.K;
    const out = new Uint8Array(aw * vd * ah);
    const set = (x, y, z, r) => {

      // as a half-pipe and that was the wrong shape twice over: a U puts its
      // height at the OUTER edges, so coming down the street you meet the
      // back of the near wall, and at any height worth jumping the face is
      // steep enough to read as a wall rather than a ramp. Nine metres of
      // run for barely more than one of rise is about fifteen degrees - it
      // sits down on the tarmac, you can see the whole of it coming, and it
      // still throws you exactly as hard because the launch is proximity,
      // not physics.
      const u = (x - cx) / cx;                    // -1 and 1 at the tarmac

  Every item in the game is its own little solid: the cup noodles is a cup,
  the cola is a can, the pistol is a pistol. Each one is authored as a stack
  of primitives in a 12x12x12 volume - box, cylinder, sphere, rod - in

        vox[(z * vd + y) * aw + x] = r;
    };

      if (k === 'box'){                         // solid block, corners inclusive
        const [, x0, y0, z0, x1, y1, z1, r] = op;
        for (let z = z0; z <= z1; z++)

/*========================= 10. SPATIAL HASH BUCKETS ========================*/
const HG = 8, HW = Math.ceil(MAP / HG);
// Across 4 km^2 the hash has tens of thousands of buckets, so clearing has to
// cost what the agents cost, not what the map costs: only touched buckets are
// reset, tracked as they are filled.
function makeGrid(){
  const g = [];
  for (let i = 0; i < HW * HW; i++) g.push([]);
  g.dirty = [];
  return g;
}
const pedGrid = makeGrid(), carGrid = makeGrid();
function gridClear(g){
  const d = g.dirty;
  for (let i = 0; i < d.length; i++) g[d[i]].length = 0;
  d.length = 0;
}
function gridAdd(g, x, y, o){
  const gx = (x / HG) | 0, gy = (y / HG) | 0;
  if (gx < 0 || gy < 0 || gx >= HW || gy >= HW) return;
  const i = gy * HW + gx, b = g[i];
  if (b.length === 0) g.dirty.push(i);
  b.push(o);
}
function gridQuery(g, x, y, rad, out){
  out.length = 0;
  const x0 = Math.max(0, ((x - rad) / HG) | 0), x1 = Math.min(HW - 1, ((x + rad) / HG) | 0);
  const y0 = Math.max(0, ((y - rad) / HG) | 0), y1 = Math.min(HW - 1, ((y + rad) / HG) | 0);
  for (let gy = y0; gy <= y1; gy++)
    for (let gx = x0; gx <= x1; gx++){
      const b = g[gy * HW + gx];
      for (let i = 0; i < b.length; i++) out.push(b[i]);
    }
  return out;
}
const _q1 = [], _q2 = [];

/*============================ 11. AIR TRAFFIC ==============================
  Cars are set dressing, not physics. They fly, they never collide with the
  player or with anything on the ground, and their only rules are: hold a
  cruising band, climb over whatever is in front of you, and keep out of each
  other's way. The old lane graph, signals and car-following are gone with the
  ground traffic they existed to serve.
============================================================================*/
const DIRV = [[1, 0], [0, 1], [-1, 0], [0, -1]];
const BANDS = [15, 22, 30, 40];
let cars = [];
function pickFlyTarget(f){
  f.tx = rr(8, MAP - 8); f.ty = rr(8, MAP - 8);
  f.ttl = 9 + rnd() * 16;
}
function placeFlyer(f, avoidCam){
  for (let t = 0; t < 30; t++){
    const th = rnd() * Math.PI * 2, rd = 25 + rnd() * 130;
    const x = clamp(cam.x + Math.cos(th) * rd, 6, MAP - 6);
    const y = clamp(cam.y + Math.sin(th) * rd, 6, MAP - 6);
    if (avoidCam && Math.hypot(x - cam.x, y - cam.y) < 40) continue;
    f.x = x; f.y = y;
    f.band = BANDS[(rnd() * BANDS.length) | 0] + rr(-2, 2);
    f.z = f.band;
    const a = rnd() * Math.PI * 2;
    f.dx = Math.cos(a); f.dy = Math.sin(a);
    f.spd = 7 + rnd() * 9;
    f.col = CARC[(rnd() * CARC.length) | 0];
    const sl = slots({ B: [f.col, 0.92], W: [C.glass, 0.52], T: [C.tire, 0.90],
                       L: [C.head, 1.0], R: [C.tail, 1.0] });
    f.sb = sl.base; f.sd = sl.dens;
    pickFlyTarget(f);
    return true;
  }
  return false;
}
function spawnCars(){
  cars = [];
  for (let i = 0; i < CFG.CARS; i++){
    const f = { x: 0, y: 0, z: 20, dx: 1, dy: 0, tx: 0, ty: 0, ttl: 0,
                band: 20, spd: 8, col: 0, len: 4.6, wid: 2.2, blink: 0, v: 8 };
    if (placeFlyer(f, false)) cars.push(f);
  }
}
function updateCar(f, dt){
  if (f.mine){ myCarFrame(f, dt); return; }
  f.ttl -= dt;
  let dxT = f.tx - f.x, dyT = f.ty - f.y;
  const dist = Math.hypot(dxT, dyT);
  if (dist < 7 || f.ttl <= 0){ pickFlyTarget(f); dxT = f.tx - f.x; dyT = f.ty - f.y; }
  let hx = dxT / (dist || 1), hy = dyT / (dist || 1);

  // keep out of each other's way, but only within the same altitude slab
  const near = gridQuery(carGrid, f.x, f.y, 12, _q1);
  for (let i = 0; i < near.length; i++){
    const o = near[i];
    if (o === f || Math.abs(o.z - f.z) > 5) continue;
    const ddx = f.x - o.x, ddy = f.y - o.y;
    const d2 = ddx * ddx + ddy * ddy;
    if (d2 > 0.01 && d2 < 49){
      const d = Math.sqrt(d2);
      hx += ddx / d * 1.6; hy += ddy / d * 1.6;
    }
  }
  const hl = Math.hypot(hx, hy) || 1;
  hx /= hl; hy /= hl;
  const turn = Math.min(1, dt * 1.5);
  f.dx += (hx - f.dx) * turn; f.dy += (hy - f.dy) * turn;
  const l = Math.hypot(f.dx, f.dy) || 1;
  f.dx /= l; f.dy /= l;

  // Climb over whatever is coming up. Downtown towers run past 100 units, so
  // the lookahead has to scale with speed or a flyer meets a wall it cannot
  // out-climb; the floor clamp below is the guarantee.
  let hAhead = 0;
  const look = 12 + f.spd * 2.4;
  for (let k = 1; k <= 5; k++){
    const px = (f.x + f.dx * look * k * 0.2) | 0, py = (f.y + f.dy * look * k * 0.2) | 0;
    for (let oy = -1; oy <= 1; oy++)
      for (let ox = -1; ox <= 1; ox++){
        const th = heightAt(px + ox, py + oy);
        if (th > hAhead) hAhead = th;
      }
  }
  const want = Math.max(f.band, hAhead + 7);
  f.z += clamp(want - f.z, -12 * dt, 30 * dt);
  f.x += f.dx * f.spd * dt; f.y += f.dy * f.spd * dt;
  const under = heightAt(f.x | 0, f.y | 0);       // never inside the geometry,
  if (f.z < under + 2.5) f.z = under + 2.5;       // checked after the step
  f.blink += dt * f.spd;
  if (f.x < 3 || f.y < 3 || f.x > MAP - 4 || f.y > MAP - 4){
    f.x = clamp(f.x, 3, MAP - 4); f.y = clamp(f.y, 3, MAP - 4);
    pickFlyTarget(f);
  }
}

/*======================= 12. PEDESTRIANS + A* PATHING ======================
  Walkable cells are sidewalks, park lots and crosswalks (crosswalks carry a
  heavy cost so a pedestrian only crosses when it genuinely shortens the trip).
  Each pedestrian A*s to a random walkable tile, follows the waypoints, and
  waits at the kerb until the signal is red for traffic and the road is clear.
============================================================================*/
const gCost  = new Float32Array(MAP * MAP);
const came   = new Int32Array(MAP * MAP);
const stampO = new Int32Array(MAP * MAP);
const stampC = new Int32Array(MAP * MAP);
let   asGen = 0;
const HCAP = 40000;
const hpId = new Int32Array(HCAP), hpF = new Float32Array(HCAP);
let hpN = 0;
function hpPush(id, f){
  let i = hpN++;
  if (i >= HCAP) { hpN = HCAP; return; }
  hpId[i] = id; hpF[i] = f;
  while (i > 0){
    const p = (i - 1) >> 1;
    if (hpF[p] <= hpF[i]) break;
    const ti = hpId[p], tf = hpF[p];
    hpId[p] = hpId[i]; hpF[p] = hpF[i]; hpId[i] = ti; hpF[i] = tf; i = p;
  }
}
function hpPop(){
  const top = hpId[0]; hpN--;
  if (hpN > 0){
    hpId[0] = hpId[hpN]; hpF[0] = hpF[hpN];
    let i = 0;
    for (;;){
      const l = 2 * i + 1, r = l + 1; let m = i;
      if (l < hpN && hpF[l] < hpF[m]) m = l;
      if (r < hpN && hpF[r] < hpF[m]) m = r;
      if (m === i) break;
      const ti = hpId[m], tf = hpF[m];
      hpId[m] = hpId[i]; hpF[m] = hpF[i]; hpId[i] = ti; hpF[i] = tf; i = m;
    }
  }
  return top;
}
function astar(sx, sy, tx, ty, limit){
  const start = sy * MAP + sx, goal = ty * MAP + tx;
  if (!walkG[start] || !walkG[goal] || start === goal) return null;
  asGen++; hpN = 0;
  gCost[start] = 0; stampO[start] = asGen; came[start] = -1;
  hpPush(start, 0);
  let expanded = 0;
  while (hpN > 0){
    const cur = hpPop();
    if (stampC[cur] === asGen) continue;
    stampC[cur] = asGen;
    if (cur === goal){
      const path = [];
      let n = cur;
      while (n !== -1){ path.push(n); n = came[n]; }
      path.reverse();
      return path;
    }
    if (++expanded > limit) return null;
    const cx = cur % MAP, cy = (cur / MAP) | 0, g0 = gCost[cur];
    for (let d = 0; d < 4; d++){
      const nx = cx + DIRV[d][0], ny = cy + DIRV[d][1];
      if (nx < 0 || ny < 0 || nx >= MAP || ny >= MAP) continue;
      const ni = ny * MAP + nx, w = walkG[ni];
      if (!w || stampC[ni] === asGen) continue;
      const ng = g0 + w * 0.1;
      if (stampO[ni] === asGen && gCost[ni] <= ng) continue;
      stampO[ni] = asGen; gCost[ni] = ng; came[ni] = cur;
      hpPush(ni, ng + (Math.abs(nx - tx) + Math.abs(ny - ty)) * 1.12);
    }
  }
  return null;
}

let peds = [];
const repathQ = [];
const CROWD = [0.85, 1.00, 0.55, 0.18, 0.30, 0.07, 1.00];  // by district: how busy the street is
function randWalkTile(weighted){
  for (let i = 0; i < 500; i++){
    const x = ri(1, MAP - 2), y = ri(1, MAP - 2);
    if (!walkG[y * MAP + x]) continue;
    if (weighted && rnd() > CROWD[districtAt(x, y)]) continue;
    return [x, y];
  }
  for (let i = 0; i < 400; i++){
    const x = ri(1, MAP - 2), y = ri(1, MAP - 2);
    if (walkG[y * MAP + x]) return [x, y];
  }
  return [RW + SW + 1, RW + SW + 1];
}
// a walkable tile beside a street stall, so crowds have somewhere to gather
function stallTile(nx, ny){
  if (!stalls.length) return null;
  let st = null, bd = 1e9;
  for (let k = 0; k < 24; k++){                 // nearest of a few random stalls
    const c = stalls[(rnd() * stalls.length) | 0];
    const d = Math.abs(c.x - nx) + Math.abs(c.y - ny);
    if (d < bd && d < 90){ bd = d; st = c; }
  }
  if (!st) return null;
  // out in front of the counter - inside the cart is the cook's business
  if (st.yaw === undefined) st.yaw = stallYaw(st);
  const fx = Math.sin(st.yaw), fy = -Math.cos(st.yaw);
  for (let t = 0; t < 12; t++){
    const out = 1.8 + rr(0, 1.8), side = rr(-1.6, 1.6);

function pedIdentity(i){

/* where pedestrian i is in their day. 'home' and 'away' mean OFF the street.

function pedPlan(id, hour){
  const w = id.wake;
  if (id.role === 'worker'){
    if (hour < w || hour >= 23) return { st: 'home' };
    if (hour < w + 1)  return { st: 'out', leg: 'toWork' };
    if (hour < w + 10) return { st: 'away' };
    if (hour < w + 11) return { st: 'out', leg: 'toHome' };
    return { st: 'out', leg: 'errand' };                 // the evening is theirs
  }
  if (id.role === 'student'){
    if (hour < w || hour >= 22) return { st: 'home' };
    if (hour < w + 1) return { st: 'out', leg: 'toWork' };
    if (hour < w + 7) return { st: 'away' };
    if (hour < w + 8) return { st: 'out', leg: 'toHome' };
    return { st: 'out', leg: 'errand' };
  }
  if (id.role === 'nightowl'){
    if (hour >= 11 && hour < 19) return { st: 'home' };  // asleep all day
    if (hour >= 19 && hour < 20) return { st: 'out', leg: 'toWork' };
    // the night crowd: half work the loud rooms, half ARE the street
    if (hour >= 20 || hour < 4)
      return id.wake & 1 ? { st: 'away' } : { st: 'out', leg: 'errand' };
    if (hour < 5) return { st: 'out', leg: 'toHome' };
    return { st: 'home' };
  }
  // homebody: out on errands through the day, home at night
  if (hour < 8 || hour >= 22) return { st: 'home' };
  return { st: 'out', leg: 'errand' };
}

      const d = Math.sqrt(d2), f = (0.6 - d) * 1.6 * dt;
      pedNudge(p, dx / d * f, dy / d * f);
    }
  }
  // A pedestrian must never end a frame on illegal ground - a body parked in a
  // traffic lane would block that lane forever.
  if (!walkG[clamp(p.y | 0, 0, MAP - 1) * MAP + clamp(p.x | 0, 0, MAP - 1)]){
    if (walkG[clamp(y0 | 0, 0, MAP - 1) * MAP + clamp(x0 | 0, 0, MAP - 1)]){
      p.x = x0; p.y = y0;                        // undo the illegal step
    } else {                                     // stranded: walk to legal ground
      let bx = -1, by = -1, bd = 1e9;
      for (let dy = -3; dy <= 3; dy++)
        for (let dx = -3; dx <= 3; dx++){
          const nx = (p.x | 0) + dx, ny = (p.y | 0) + dy;
          if (nx < 0 || ny < 0 || nx >= MAP || ny >= MAP || !walkG[ny * MAP + nx]) continue;
          const d = Math.hypot(nx + 0.5 - p.x, ny + 0.5 - p.y);
          if (d < bd){ bd = d; bx = nx; by = ny; }
        }
      if (bx >= 0){
        const step = Math.min(bd, 3.0 * dt);
        p.x += (bx + 0.5 - p.x) / bd * step;
        p.y += (by + 0.5 - p.y) / bd * step;

}
function serviceRepaths(){
  let budget = 3;
  while (repathQ.length && budget-- > 0){
    const i = repathQ.shift();
    const p = peds[i]; if (!p) continue;
    const sx = clamp(p.x | 0, 0, MAP - 1), sy = clamp(p.y | 0, 0, MAP - 1);
    if (!walkG[sy * MAP + sx]){ p.path = null; continue; }
    let best = null, toStall = false;
    if (rnd() < 0.34){ best = stallTile(sx, sy); toStall = !!best; }
    if (!best) best = randWalkNear(sx, sy, 14, 62);
    if (!best || inPanicZone(best[0], best[1])) continue;   // not back in there
    const path = astar(sx, sy, best[0], best[1], 7000);
    if (path){ p.path = path; p.pi = 1; p.linger = toStall; }
  }
}

/*============================ 12b. ACTORS ==================================
  A persistent layer above the ambient crowd: named characters - NPCs now,
  quest-givers and enemies later. Unlike pedestrians they are never streamed
  away, solid ones block the camera, and each can carry dialog and a small
  brain. ACTORDEF is the species table; an actor is data plus a brain name.

  range of home. Either one stops and faces the player when approached.

const ACTORDEF = {
  citizen:  { speed: 1.1, solid: true, r: 0.34 },
  vendor:   { speed: 0.9, solid: true, r: 0.34 },
  razor:    { speed: 2.35, solid: true, r: 0.34 },

                     S: [o.shirt !== undefined ? o.shirt : SHIRTC[(rnd() * SHIRTC.length) | 0], 0.86],
                     P: [C.pants, 0.82], T: [C.tire, 0.75] });

    id: actors.length, kind, name: o.name || 'STRANGER',

// direct loop - the cast is small; give this a grid if actors ever number 100+
function actorBlocked(x, y, rad){

}
function updateActor(a, dt){
  a.cool -= dt;
  a.moving = 0;
  if (a.hitT) a.hitT = Math.max(0, a.hitT - dt);
  if (a.brain === 'hostile'){ hostileBrain(a, dt); return; }
  const prx = cam.x - a.x, pry = cam.y - a.y;
  const pr = Math.hypot(prx, pry);
  const engaged = pr < 2.6;                    // player close: stop, meet their eye
  if (engaged && pr > 0.001){ a.dx = prx / pr; a.dy = pry / pr; }
  if (pr < 0.9 && pr > 0.001 && !a.pinned){    // and never stand inside them
    const bx = a.x - prx / pr * 1.4 * dt, by = a.y - pry / pr * 1.4 * dt;
    if (walkG[clamp(by | 0, 0, MAP - 1) * MAP + clamp(bx | 0, 0, MAP - 1)]){ a.x = bx; a.y = by; }
  }
  if (a.brain !== 'wander' || engaged) return;
  if ((!a.path || a.pi >= a.path.length) && a.cool <= 0){
    a.cool = 4 + rnd() * 8;
    const t = randWalkNear(a.homeX, a.homeY, 2, a.range);
    if (t){
      const path = astar(clamp(a.x | 0, 0, MAP - 1), clamp(a.y | 0, 0, MAP - 1), t[0], t[1], 3000);
      if (path){ a.path = path; a.pi = 1; }
    }
  }
  if (a.path && a.pi < a.path.length){
    const cell = a.path[a.pi], cx = cell % MAP, cy = (cell / MAP) | 0;
    const dx = cx + 0.5 - a.x, dy = cy + 0.5 - a.y;
    const dist = Math.hypot(dx, dy) || 1;
    a.dx = dx / dist; a.dy = dy / dist;
    a.x += a.dx * a.spd * dt; a.y += a.dy * a.spd * dt;
    a.phase += a.spd * dt * 3.4;
    a.moving = 1;
    if (dist < 0.34) a.pi++;

}

/*======================== 12c. DOORS + INTERIORS ===========================
  Buildings have insides. The trick is that the renderer never finds out: the
  tile arrays (tType / tH / tB / walkG) are swapped by reference for a second
  interior set, the camera teleports into a small room stamped near the array
  origin, and every pass - DDA walls, floor projection, sprites, collision -
  keeps working untouched. A ceiling pass replaces the sky pass indoors.

  Rooms are generated on entry, seeded by the building, so a shop is the same
  shop every visit and nothing is stored. One door per building, cut into a
  street-facing wall, named after the sign the facade already carries.

const INT_CEIL = 3.0, IOX = 10, IOY = 10;

const INTERIOR_KIND = ['lobby', 'shop', 'shop', 'depot', 'home', 'home', 'shop'];
const INT_FLAVOR = {

  lobby: { keeper: 'CONCIERGE', floorA: 0, floorB: 0, lines: [

  depot: { keeper: 'FOREMAN', floorA: 0, floorB: 0, lines: [

  home:  { keeper: 'RESIDENT', floorA: 0, floorB: 0, lines: [

  office:  { keeper: 'CLERK', floorA: 0, floorB: 0, lines: [

  apts:    { keeper: 'TENANT', floorA: 0, floorB: 0, lines: [

  casino:  { keeper: 'PIT BOSS', floorA: 0, floorB: 0, lines: [

  dungeon: { keeper: 'NOBODY', floorA: 0, floorB: 0, lines: [

  myhome:  { keeper: 'NOBODY', floorA: 0, floorB: 0, lines: [] },
  parlor:  { keeper: 'MADAME', floorA: 0, floorB: 0, lines: [

function initInteriorFlavors(){          // palette indices exist by now
  INT_FLAVOR.shop.floorA  = C.walk;   INT_FLAVOR.shop.floorB  = C.deckOld;
  INT_FLAVOR.lobby.floorA = C.deck;   INT_FLAVOR.lobby.floorB = C.dataDk;
  INT_FLAVOR.depot.floorA = C.dataDk; INT_FLAVOR.depot.floorB = C.asphalt;
  INT_FLAVOR.home.floorA  = C.deckOld; INT_FLAVOR.home.floorB = C.trunk;
  INT_FLAVOR.office.floorA = C.deck;   INT_FLAVOR.office.floorB = C.screen;
  INT_FLAVOR.apts.floorA   = C.deckOld; INT_FLAVOR.apts.floorB = C.walk;
  INT_FLAVOR.storage.floorA = C.dataDk; INT_FLAVOR.storage.floorB = C.tire;
}
initInteriorFlavors();
// A building's canonical floors: always the street, sometimes a low floor,
// a couple of hash-picked mid numbers, and the top. Five layouts serve any
// tower - the numbers are the fiction, the seed makes them real.
function bldFloors(b){
  const top = Math.max(1, Math.round(b.h / 3.2));
  if (top < 3) return top === 1 ? [1] : [1, top];
  const list = [1], used = { 1: 1, [top]: 1 };
  const n = Math.min(3, 1 + ((top / 9) | 0));

  while (list.length < n && guard++ < 24){
    const f = 2 + ((hash3(b.seed, list.length * 7 + guard, 55) * (top - 2)) | 0);
    if (!used[f]){ used[f] = 1; list.push(f); }

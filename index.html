  hudBox(x0, y0, MW + 2, MH + 2, 'MAP');
  const cxT = Math.round(cam.x), cyT = Math.round(cam.y);
  const hw = MW >> 1, hh = MH >> 1;
  for (let j = 0; j < MH; j++){
    let line = '';
    const ty = cyT + (j - hh) * 2;      // +y runs down-screen, same as the city map
    for (let i = 0; i < MW; i++){
      const tx = cxT - (i - hw);        // east left, like the view
      if (!inMap(tx, ty)){ line += ' '; continue; }
      const t = tType[ty * MAP + tx];
      line += t === T_BLD ? '#' : t === T_WATER ? '~' : t === T_BRIDGE ? '=' :
              t === T_PATH ? ',' : t === T_WALK ? ':' : t === T_CROSS ? '+' :
              t === T_LOT ? '"' : '.';
    }
    hudStr(x0 + 1, y0 + 1 + j, line, H_GRY);
  }
  const plot = (wx, wy, ch, col) => {
    const i = hw - Math.round(wx - cxT), j = hh + Math.round((wy - cyT) * 0.5);
    if (i >= 0 && i < MW && j >= 0 && j < MH) hudStr(x0 + 1 + i, y0 + 1 + j, ch, col);
  };
  for (const c of cars) if (Math.abs(c.x - cam.x) < hw && Math.abs(c.y - cam.y) < hh * 2) plot(c.x, c.y, 'o', H_YEL);
  for (const p of peds) if (Math.abs(p.x - cam.x) < hw && Math.abs(p.y - cam.y) < hh * 2) plot(p.x, p.y, ',', H_WHT);
  for (const a of actors)
    if (Math.abs(a.x - cam.x) < hw && Math.abs(a.y - cam.y) < hh * 2)
      plot(a.x, a.y, a.brain === 'hostile' ? 'x' : '@', a.brain === 'hostile' ? H_RED : H_PUR);
  if (snifferT > 0){                            // the chip pings loose loot
    for (const p of gridQuery(propGrid, cam.x, cam.y, Math.max(hw, 16), _q2))
      if (p.k === PK_ITEM){
        plot(p.x, p.y, '$', H_YEL);
        if (!snifSeen.has(p)){ snifSeen.add(p); sfx('ui_move', { rate: 2.2, vol: 0.3 }); }
      }
  }
  if (drug && drug.fx.seeAll){                  // mirrorshade: every heartbeat
    const pulse = ((worldTime * 2.2) | 0) & 1;
    for (const p of peds)
      if (Math.abs(p.x - cam.x) < hw && Math.abs(p.y - cam.y) < hh * 2)
        plot(p.x, p.y, pulse ? 'o' : '@', H_RED);
    for (const a of actors)
      if (Math.abs(a.x - cam.x) < hw && Math.abs(a.y - cam.y) < hh * 2)
        plot(a.x, a.y, pulse ? '@' : 'o', H_RED);
  }
  const qm = questTarget();
  if (qm) plot(qm.x, qm.y, '!', H_YEL);
  if (!(drug && drug.fx.ghost)){                // a ghost is not on the grid
    const dirCh = '<v>^'[((Math.round(cam.ang / (Math.PI / 2)) % 4) + 4) % 4];
    plot(cam.x, cam.y, dirCh, H_BLU);

        const kick = muzzleT > 0.06 ? 3 : muzzleT > 0.03 ? 2 : muzzleT > 0 ? 1 : 0;
        const gx = (cols >> 1) - sightX, gy = rows - tr + bob + kick;
        drawViewArt(VM_GUN, gx, gy, tr, CM_GUN);
        if (muzzleT > 0)                        // the flash leaves the bore
          drawViewArt(['\\  *  /', '-* * *-', '/  *  \\'],
                      (cols >> 1) - 3, gy - 3, 3, CM_MUZ);
      } else {
        const mw = meleeStats();
        const hold = mw.id === 'bat' ? VM_BAT_HOLD : mw.id === 'pipe' ? VM_PIPE_HOLD : VM_FIST_R;
        const tr = Math.round(rows * 0.34);
        const tr2 = Math.round(rows * (mw.id === 'fist' ? 0.34 : 0.58));
        const tw = Math.round(tr * viewW(VM_FIST_R) / VM_FIST_R.length);
        const tw2 = Math.round(tr2 * viewW(hold) / hold.length);
        const off = Math.round(cols * 0.19);      // a boxer guard, framing the reticle
        drawViewArt(VM_FIST_L, (cols >> 1) - off - tw, rows - tr + (bob ? 1 : 0), tr, CM_ARM);
        drawViewArt(hold, (cols >> 1) + off, rows - tr2 + (bob ? 0 : 1), tr2,
                    mw.id === 'fist' ? CM_ARM : CM_MELEE);
      }
    }
    if (sitting){
      const msg = '[SPACE] stand      [W] wait until the light changes';
      const x = Math.max(1, (cols - msg.length - 2) >> 1);
      hudPanel(x, (rows >> 1) + 6, msg.length + 2, 1);
      hudStr(x + 1, (rows >> 1) + 6, msg, H_GRN);
    }
    const aim = cam.riding ? null : hostileInSights(30);
    const rr0 = (rows >> 1) + Math.round(cam.pitch);
    hudStr(cols >> 1, rr0, aim ? 'x' : '+',
           aim ? H_RED : player.bling === 'shades' ? H_PUR : H_GRN);
    if (aim){
      const tag = aim.a.name + ' ' + aim.a.hp + '/' + aim.a.maxHp;
      hudStr((cols - tag.length) >> 1, rr0 - 2, tag, H_RED);
    }
  }
  else if (im.draw) im.draw();
  if (drug && drug.fx.glitch){                  // even the UI drops packets
    const n2 = (R.cols * R.rows * 0.003 * (drug.env || 1)) | 0;
    for (let i = 0; i < n2; i++){
      const idx = (Math.random() * hGlyph.length) | 0;
      if (hGlyph[idx] > 0) hGlyph[idx] = 1 + ((Math.random() * 90) | 0);
    }
  }
  // ---- transient message: drawn last, above the arms, so nothing hides it ----
  if (toastT > 0 && toastMsg){
    const x = Math.max(1, (cols - toastMsg.length - 2) >> 1);
    const y = Math.max(1, rows - Math.round(rows * 0.46) - 2);
    hudPanel(x, y, toastMsg.length + 2, 1);
    hudStr(x + 1, y, toastMsg, H_YEL);
  }
  // ---- blit ----
  if (GL) return;                    // the GPU path draws panels and glyphs itself
  if (hurtT > 0.01){
    ctx.fillStyle = 'rgba(230,26,31,' + (hurtT * 0.32).toFixed(3) + ')';
    ctx.fillRect(0, 0, R.W, R.H);
  }
  ctx.fillStyle = 'rgba(3,6,12,0.60)';
  for (let i = 0; i < hudRects.length; i += 4)
    ctx.fillRect(hudRects[i], hudRects[i + 1], hudRects[i + 2], hudRects[i + 3]);
  const cw = R.cellW, ch = R.cellH, ox = R.ox, oy = R.oy;
  for (let r = Math.max(0, hudR0); r <= Math.min(rows - 1, hudR1); r++){
    const py = oy + r * ch, off = r * cols;
    for (let x = 0; x < cols; x++){
      const idx = off + x, g = hGlyph[idx];
      if (g === 0) continue;
      ctx.drawImage(hudAtlas, g * cw, hCol[idx] * ch, cw, ch, ox + x * cw, py, cw, ch);
    }
  }
}

/*========================== 16. WORLD BOOTSTRAP ============================*/
function faceOpenStreet(){
  let bestD = -1, bestA = 0;
  for (let d = 0; d < 4; d++){
    let n = 0;
    for (; n < 44; n++){
      const x = (cam.x | 0) + DIRV[d][0] * (n + 1), y = (cam.y | 0) + DIRV[d][1] * (n + 1);
      if (!inMap(x, y) || tH[y * MAP + x] > 0) break;
    }
    if (n > bestD){ bestD = n; bestA = Math.atan2(DIRV[d][1], DIRV[d][0]); }
  }
  cam.ang = bestA;
}
function placePlayer(){
  cam.x = RW + 1.5; cam.y = RW + 1.5;
  outer:
  for (let r = 0; r < MAP; r++){
    for (let a = 0; a < 24; a++){
      const th = a / 24 * Math.PI * 2;
      const ix = (MAP * 0.5 + Math.cos(th) * r) | 0, iy = (MAP * 0.5 + Math.sin(th) * r) | 0;
      if (!inMap(ix, iy) || tType[iy * MAP + ix] !== T_WALK) continue;
      // A mid-block kerb (walk residue on exactly one axis) looks straight down
      // the street; a block corner dead-ends into the buildings opposite.
      const wx = residue(ix % P) === 1, wy = residue(iy % P) === 1;
      if (wx === wy) continue;
      if (propBlocked(ix + 0.5, iy + 0.5, 1.1)) continue;
      cam.x = ix + 0.5; cam.y = iy + 0.5;
      faceOpenStreet();
      // A lamp post two tiles away is 5 m of pole across the whole screen, so
      // require the first few metres of the view to be clear as well.
      let clear = true;
      for (let k = 1; k <= 6; k++){
        const fx = cam.x + Math.cos(cam.ang) * k, fy = cam.y + Math.sin(cam.ang) * k;
        if (solidAt(fx, fy) || propBlocked(fx, fy, 0.85)){ clear = false; break; }
      }
      if (clear) break outer;
    }
  }
  cam.riding = null; cam.z = 1.62; cam.pitch = 0;
}
function newWorld(seed){
  if (inside){          // never rebuild the city into the room's arrays
    tType = EXT.tType; tH = EXT.tH; tB = EXT.tB; walkG = EXT.walkG;
    props = EXT.props; signs = EXT.signs;
    inside = null;
  }
  worldSeed = seed;
  worldDelta = { taken: {} };
  resetPlayer();
  sitting = null; vAnim = null;
  buildCity(seed);
  bakeKey = -1;                // force the palette to settle on the clock
  indexProps();
  indexSpriteProps();
  spawnCars();
  spawnPeds();
  placePlayer();
  spawnActors();
  worldTime = 0;
  gridClear(carGrid); for (const c of cars) gridAdd(carGrid, c.x, c.y, c);
  gridClear(pedGrid); for (const p of peds) gridAdd(pedGrid, p.x, p.y, p);
  buildBackground();
}

/*============================== 17. MAIN LOOP ==============================*/
function simulate(dt){
  if (!inside){       // the street holds its breath while you are indoors
    gridClear(carGrid); for (let i = 0; i < cars.length; i++) gridAdd(carGrid, cars[i].x, cars[i].y, cars[i]);
    gridClear(pedGrid); for (let i = 0; i < peds.length; i++) gridAdd(pedGrid, peds[i].x, peds[i].y, peds[i]);
    streamAgents();
    serviceRepaths();
    for (let i = 0; i < cars.length; i++) updateCar(cars[i], dt);
    for (let i = 0; i < peds.length; i++) updatePed(peds[i], i, dt);
  }
  for (let i = 0; i < actors.length; i++){
    const a = actors[i];
    if (!!a.interior !== !!inside) continue;
    updateActor(a, dt);
  }
  for (let i = fxs.length - 1; i >= 0; i--){
    fxs[i].t -= dt;
    if (fxs[i].t <= 0) fxs.splice(i, 1);
  }
}
function render(){
  statRays = 0; statCells = 0;
  const cols = R.cols;
  // clear days keep the far skyline solid; haze and darkness dissolve it
  densK = (CFG.timeMode === 2 && weather !== 3) ? 0.4 : 0.74;
  gBuf.fill(0); dBuf.fill(1e30);
  dirX = Math.cos(cam.ang); dirY = Math.sin(cam.ang);
  planeLen = Math.tan(CFG.FOV * 0.5);
  planeX = dirY * planeLen; planeY = -dirX * planeLen;
  projRows = (cols * R.cellW) / (2 * planeLen * R.cellH);
  horizon = R.rows * 0.5 + cam.pitch;
  hzRow = clamp(Math.floor(horizon), 0, R.rows - 1);
  const amp = weather === 2 ? 1.5 : weather === 1 ? 0.9 : 0.55;
  for (let x = 0; x < cols; x++){
    const cxn = 2 * (x + 0.5) / cols - 1;
    rayX[x] = dirX + planeX * cxn;
    rayY[x] = dirY + planeY * cxn;
    refWob[x] = Math.sin(worldTime * 2.1 + x * 0.42) * amp;
  }
  refBuf.fill(0);
  srcBuf.fill(0);
  if (inside) ceilingPass(); else skyPass();
  floorPass();
  wallPass();
  spritePass();
  if (!inside){
    signPass();
    reflectPass();
    rainPass();
  }
  if (GL){
    hudPass();                       // fills the HUD layer; GPU draws it
    glPresent();
  } else {
    blit();
    if (CFG.timeMode !== 2) bloomPass();
    hudPass();
  }
}
let lastT = 0, fpsAcc = 0, fpsN = 0, workAcc = 0, workN = 0, autoRes = false;
function frame(now){
  requestAnimationFrame(frame);
  if (!lastT) lastT = now;
  let dt = (now - lastT) / 1000; lastT = now;
  if (dt > 0.1) dt = 0.1;
  if (dt < 0) dt = 0;
  if (hitStopT > 0){ hitStopT -= dt; dt *= 0.08; }   // impact holds the world
  const w0 = performance.now();
  if (!worldFrozen()){
    drugTick(dt);
    smokeGlow += ((smoking() ? 1 : 0) - smokeGlow) * Math.min(1, dt * 1.6);
    if (jamT > 0) jamT -= dt;
    if (snifferT > 0){
      snifferT -= dt;
      if (snifferT <= 0){
        snifSeen.clear();
        toast('the chip goes quiet');
        sfx('ui_back', { rate: 0.5, vol: 0.4 });
      }
    }
    const ts = drugFx('tScale', 1);       // overclock: the world runs slow, you do not
    worldTime += dt * ts; simulate(dt * ts);
    updateClock(dt * ts);
    wxUpdate(dt * ts);
    if (weather === 2){
      nextBolt -= dt;
      if (nextBolt <= 0){
        flash = 1; nextBolt = 3.5 + Math.random() * 11;
        sfx('thunder', { vol: 0.6 + Math.random() * 0.4,
                         rate: 0.85 + Math.random() * 0.3,
                         pan: Math.random() * 1.6 - 0.8 });
      }
    }
    qAcc += dt;
    if (qAcc > 0.5){ qAcc = 0; checkQuests(); }
    flash *= Math.pow(0.05, dt);
  }
  fade *= Math.pow(0.02, dt);
  muzzleT = Math.max(0, muzzleT - dt);
  shotCool = Math.max(0, shotCool - dt);
  if (punchT > 0){
    const eOld = punchDur - punchT;
    punchT = Math.max(0, punchT - dt);
    if (strikeArmed && eOld < strikeAt && punchDur - punchT >= strikeAt){
      strikeArmed = false;
      strikeLand();                            // damage lands at contact, not click
    }
  }
  hurtT = Math.max(0, hurtT - dt * 2.2 * drugFx('hurtFast', 1));
  if (!topMode() && vAnim){
    vAnim.t += dt;
    if (vAnim.t > vAnim.d.dur){
      if (vAnim.loop) vAnim.t -= vAnim.d.dur;  // draw, exhale, draw again
      else vAnim = null;
    }
  }
  // out in the fields the eye carries much further - and in the wilderness
  // further still, far enough to take in the whole skyline. Fog remains a
  // CEILING on how far you can see at all.
  const pz = zoneAt(clamp((cam.x / P) | 0, 0, NB - 1), clamp((cam.y / P) | 0, 0, NB - 1));
  const wantD = inside ? 13
              : CFG.MAXD * (pz >= 4 ? 3.4 : pz === 3 ? 1.85 : 1) *
                (weather === 3 ? 1 - fogLevel * 1.6 : 1);
  viewD += (wantD - viewD) * Math.min(1, dt * 0.7);
  if (!topMode()) updateCam(dt);
  probeInteract();
  audioFrame(dt);
  buildBackground();
  // the ride leans on the camera: slow sway or stimulant jitter, render-only
  let wo = 0, wp = 0;
  if (drug){
    const wob = drugFx('wob', 0), shk = drugFx('shake', 0);
    wo = wob * 0.045 * Math.sin(worldTime * 0.9) + shk * 0.012 * (Math.random() * 2 - 1);
    wp = wob * 1.7 * Math.sin(worldTime * 0.63 + 1.7) + shk * 0.6 * (Math.random() * 2 - 1);
    cam.ang += wo; cam.pitch += wp;
  }
  render();
  if (wo || wp){ cam.ang -= wo; cam.pitch -= wp; }
  if (toastT > 0) toastT -= dt;
  workAcc += performance.now() - w0; workN++;
  fpsAcc += dt; fpsN++;
  if (fpsAcc > 0.4){ fps = fpsN / fpsAcc; fpsAcc = 0; fpsN = 0; }
  // If a frame's real work stays above ~14 ms this machine cannot hold 60 fps
  // at this character density, so drop one step and try again.
  if (workN >= 90){
    const avg = workAcc / workN; workAcc = 0; workN = 0;
    if (!CFG.manualRes && avg > 14 && CFG.resIdx > 0){
      CFG.resIdx--; autoRes = true; initRender();
      toast('auto-res: frame time high, coarser grid ' + R.cols + 'x' + R.rows + '  ([ ] to override)');
    }
  }
}
let rzT = 0;
addEventListener('resize', () => { clearTimeout(rzT); rzT = setTimeout(initRender, 180); });
function boot(){
  initRender();
  newWorld(20260818);
  document.getElementById('boot').classList.add('hidden');
  requestAnimationFrame(frame);
  try {
    if (!localStorage.getItem('asciiCityMet')){   // a first-run welcome
      localStorage.setItem('asciiCityMet', '1');
      setTimeout(() => openDialog('ASCII CITY', [
        'JAN 13, 2420. You own a coat that is not warm and one hundred twenty ' +
        'credits that will not last. The kiosks sign their trades - TOOLS, ' +
        'THREADS, DISPENSARY, ARMS, GOLD. People with names talk back.',
        'The cameras count you. Stay clean or pay the fixer to forget. ' +
        'Someone by the stalls looks hungrier than you. Start there. ' +
        '[SPACE] to reach anything, TAB for your pockets, M for the map.'
      ]), 700);
    }
  } catch (e){}
}
boot();

<script>
"use strict";
/*==============================================================================
  ASCII CITY
  A grid-world 3D engine rendered exclusively with colored ASCII characters.

  Pipeline, once per frame:
    1. background gradient  sky -> fog -> ground
    2. sky pass             sparse star / horizon-glow glyphs above the horizon
    3. floor pass           per character-cell inverse projection onto the grid
                            (roads, lane paint, crosswalks, sidewalks, grass)
    4. wall pass            one DDA ray per character COLUMN through the tile
                            grid; the first hit sets the near surface, and the
                            march continues so taller buildings behind shorter
                            ones still poke above them
    5. sprite pass          billboards (cars / pedestrians / props) depth-tested
                            per character cell against the wall+floor z-buffer
    6. blit                 every cell is one drawImage from a prebaked glyph
                            atlas: (character x colour) baked per distance level
    7. HUD                  ASCII overlay + minimap

  Distance drives three things at once:
    GLYPH DENSITY : near cells use heavy glyphs (@ % # *), far cells thin out
                    to (. ,) and finally to blank
    GLYPH SIZE    : 8 distance levels, each atlas baked at a smaller font size
    COLOUR        : each level pre-mixes the material colour toward the fog
==============================================================================*/

/*------------------------------- 1. CONFIG ---------------------------------*/
const CFG = {
  MAP:     1000,   // 1000 tiles a side; at ~2 m a tile that is 2 km x 2 km = 4 km^2
  P:         20,   // city block period in tiles
  RW:         6,   // roadway width: one 3-tile lane each way
  SW:         2,   // sidewalk width in tiles
  FOV:       90 * Math.PI / 180,
  MAXD:      96,   // render / fade distance in tiles
  CELLW:  [24, 19, 16, 13, 11, 9, 7],
  resIdx:     6,   // default to the finest grid; auto-res steps down if needed
  manualRes: false,   // set once you pick a grid with [ or ]
  CARS:      54,   // air traffic only - set dressing, never physical
  PEDS:     430,   // streamed: kept near the camera rather than spread thin
  timeMode:   0    // 0 neon night, 1 dusk, 2 day
};
const MAP = CFG.MAP, P = CFG.P, RW = CFG.RW, SW = CFG.SW, NB = (MAP / P) | 0;
const LANE_A = RW * 0.25, LANE_B = RW * 0.75;   // lane centres inside a roadway

/*------------------------------ 2. UTILITIES -------------------------------*/
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
let rngState = 1;
function srand(s){ rngState = (s >>> 0) || 1; }
function rnd(){                                   // mulberry32
  rngState = rngState + 0x6D2B79F5 | 0;
  let t = Math.imul(rngState ^ rngState >>> 15, 1 | rngState);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
  return ((t ^ t >>> 14) >>> 0) / 4294967296;
}
const rr = (a, b) => a + rnd() * (b - a);
const ri = (a, b) => (a + rnd() * (b - a + 1)) | 0;
function hash3(a, b, c){                          // stable per-cell noise
  let h = Math.imul(a | 0, 374761393) ^ Math.imul(b | 0, 668265263) ^ Math.imul(c | 0, 1442695041);
  h = Math.imul(h ^ h >>> 13, 1274126177);
  return ((h ^ h >>> 16) >>> 0) / 4294967296;
}

/*----------------------------- 3. CHARACTER SET ----------------------------*/
// RAMP is ordered by visual weight; a surface's "density" indexes straight in.
const RAMP  = " .',:;-=+ox*#%@&$";
const EXTRA = "|/\\_[]()<>^~`{}";   // note the escaped backslash - it IS a glyph
const ALPHA = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";   // readable signage
const CHARS = RAMP + EXTRA + ALPHA;
const RMAX  = RAMP.length - 1;
const GI = {};                                   // char -> glyph index
for (let i = 0; i < CHARS.length; i++) GI[CHARS[i]] = i;
const G_BAR = GI['|'];

/*------------------------------- 4. PALETTE --------------------------------*/
// Base materials. Distance shading is baked per level, so this stays flat.
const BASE = [];
const C = {};
function mat(name, r, g, b){ C[name] = BASE.length; BASE.push([r, g, b]); }
mat('skyGlow',  92, 40, 96);
mat('asphalt',  22, 22, 32);   mat('lineY',   190,150, 70);
mat('lineW',   172,192,212);   mat('walk',     56, 60, 76);
mat('curb',     98,106,126);   mat('grass',    38, 84, 62);
// Building shells: dark and chromatic, so the neon on them carries the frame.
mat('bldA',     58, 62, 96);   mat('bldB',     78, 66,102);
mat('bldC',     46, 84, 92);   mat('bldD',     62, 66, 74);
mat('bldE',    104, 66, 58);   mat('bldF',     70, 88,116);

mat('bldM',     34, 38, 52);   mat('bldN',    112, 84, 72);
// Neon: window glow, signage, crowns, kerb strips, wet-tarmac reflections.
mat('nCyan',   120,255,240);   mat('nMag',    255,110,220);
mat('nAmber',  255,190, 90);   mat('nGreen',  140,255,150);
mat('nBlue',   110,170,255);   mat('nPink',   255,120,150);

mat('carC',    150,156,168);   mat('carD',     30, 70, 78);
mat('carE',     70, 46, 92);   mat('carF',    186,158, 62);

mat('shirtC',  228,228,228);   mat('shirtD',   96,196,160);
mat('pants',    58, 68,100);   mat('metal',   112,120,132);

mat('signBack', 10, 11, 18);   mat('signCase', 62, 66, 84);
mat('uphols',  122, 58, 46);   mat('upholD',   82, 40, 32);   // worn red-brown
const NBASE  = BASE.length;

                C.bldH, C.bldI, C.bldJ, C.bldK, C.bldL, C.bldM, C.bldN];

const LAMPC  = [C.nCyan, C.nMag, C.nAmber, C.nBlue, C.nViolet, C.nPink];
const CARC   = [C.carA, C.carB, C.carC, C.carD, C.carE, C.carF, C.carA, C.carC];
// Which materials actually emit light - only these are reflected in wet tarmac.
const EMISSIVE = new Uint8Array(64);
[C.nCyan, C.nMag, C.nAmber, C.nGreen, C.nBlue, C.nPink, C.nWhite, C.nViolet,
 C.head, C.tail, C.tlRed, C.tlGrn, C.tlAmb].forEach(i => { EMISSIVE[i] = 1; });
const SHIRTC = [C.shirtA, C.shirtB, C.shirtC, C.shirtD];
const SKINC  = [C.skinA, C.skinB];

// Time of day: fog colour, sky colours, and how many windows are lit.
const TIME = [
  { fog: [ 14, 10, 28], sky: [  4,  4, 14], glow: [ 78, 24, 84], lit: 0.62, amb: 0.94 },
  { fog: [ 64, 38, 58], sky: [ 24, 16, 48], glow: [214, 96, 44], lit: 0.55, amb: 1.00 },
  { fog: [ 96,116,150], sky: [ 30, 88,172], glow: [118,132,152], lit: 0.10, amb: 1.00 }
];

/*----------------------------- 4b. DISTRICTS -------------------------------
  A coarse per-block field picks a ruleset. Everything a district touches is a
  parameter that already existed - palette subset, height curve, how hard the
  block subdivides, prop mix, lit ratio, signage density, fog tint.
============================================================================*/
const D_DOWN = 0, D_STRIP = 1, D_RES = 2, D_IND = 3, D_SUB = 4, D_RURAL = 5, D_RED = 6;
const DISTRICT = [
  { name: 'DOWNTOWN',
    shells: [C.bldA, C.bldF, C.bldI, C.bldM, C.bldL, C.bldD],
    neon:   [C.nCyan, C.nBlue, C.nWhite, C.nViolet, C.nCyan, C.nWhite],
    hBase: [13, 22], hScale: [24, 60], lit: 1.15, wpm: [2, 2, 3, 3],
    split: 2, park: 0.05, alley: 0.30, tier: 0.80, crown: 0.55, stripe: 0.45,
    lamp: 0.098, tree: 0.004, bin: 0.018, hydr: 0.020, sign: 0.55, signV: 0.45,

            'NEXUS', 'GLOBAL', 'FINANCE', 'DATACORP', 'HELIX', 'MERIDIAN'] },
  { name: 'THE STRIP',

    split: 3, park: 0.04, alley: 0.45, tier: 0.25, crown: 0.80, stripe: 0.70,

    words: ['NOODLES', 'RAMEN', 'CLUB', 'ARCADE', 'PACHINKO', 'SUSHI', 'BAR',
            'KARAOKE', 'TATTOO', '24 HRS', 'HOTEL', 'VR DEN', 'CHROME', 'LOANS',
            'PAWN', 'NEON', 'DRINKS', 'LIVE'] },
  { name: 'RESIDENTIAL',
    shells: [C.bldJ, C.bldH, C.bldK, C.bldN, C.bldD, C.bldE],
    neon:   [C.nAmber, C.nWhite, C.nGreen, C.nAmber, C.nPink],
    hBase: [7, 11], hScale: [5, 18], lit: 0.85, wpm: [1.5, 2, 2, 2],
    split: 2, park: 0.26, alley: 0.28, tier: 0.35, crown: 0.18, stripe: 0.10,
    lamp: 0.078, tree: 0.016, bin: 0.022, hydr: 0.018, sign: 0.22, signV: 0.15,
    stall: 0.027, stree: 0.70, cam: 0.014,
    fog: [18, 16, 34],
    words: ['LAUNDRY', 'GROCER', 'PHARMACY', 'CAFE', 'CLINIC', 'MARKET',
            'BAKERY', 'APARTMENTS', 'DELI', 'HARDWARE'] },
  { name: 'INDUSTRIAL',
    shells: [C.bldE, C.bldH, C.bldD, C.bldM, C.bldN],
    neon:   [C.nAmber, C.nGreen, C.nWhite],
    hBase: [6, 9], hScale: [3, 11], lit: 0.45, wpm: [1.5, 1.5, 2],
    split: 1, park: 0.06, alley: 0.20, tier: 0.15, crown: 0.10, stripe: 0.15,
    lamp: 0.065, tree: 0.002, bin: 0.050, hydr: 0.030, sign: 0.30, signV: 0.10,
    stall: 0.009, stree: 0.15, cam: 0.024,
    fog: [24, 22, 28],
    words: ['LOADING', 'DOCK 7', 'SCRAP', 'FUEL', 'WAREHOUSE', 'CARGO',
            'RECYCLING', 'HAZMAT', 'UNIT 12', 'FREIGHT'] },
  { name: 'SUBURBS',
    shells: [C.bldJ, C.bldN, C.bldE, C.bldH, C.bldK],
    neon:   [C.nAmber, C.nWhite, C.nAmber, C.nGreen],
    hBase: [4, 7], hScale: [0, 4], lit: 0.75, wpm: [1.5, 1.5, 2],
    split: 2, park: 0.30, alley: 0.10, tier: 0.05, crown: 0.04, stripe: 0.02,
    lamp: 0.040, tree: 0.045, bin: 0.010, hydr: 0.012, sign: 0.10, signV: 0.02,
    stall: 0.007, inset: 1, fill: 0.72, stree: 0.60, cam: 0.006,
    fog: [20, 22, 32],
    words: ['HOME', 'GARAGE', 'CORNER', 'DELI', 'SCHOOL', 'CHURCH'] },
  { name: 'FARMLAND',
    shells: [C.bldE, C.bldN, C.bldJ, C.bldH],
    neon:   [C.nAmber, C.nWhite],
    hBase: [3, 6], hScale: [0, 2], lit: 0.45, wpm: [1.5, 1.5],
    split: 1, park: 0.62, alley: 0.05, tier: 0, crown: 0.02, stripe: 0,
    lamp: 0.008, tree: 0.030, bin: 0.002, hydr: 0.002, sign: 0.06, signV: 0,
    stall: 0.002, inset: 2, fill: 0.34, stree: 0.10, cam: 0.001,
    fog: [26, 30, 34],
    words: ['BARN', 'FEED', 'GRAIN', 'FARM', 'EGGS'] },
  { name: 'RED LIGHT',
    shells: [C.bldG, C.bldB, C.bldN, C.bldJ, C.bldE],
    neon:   [C.nMag, C.nPink, C.nViolet, C.nPink, C.nMag, C.nCyan],
    hBase: [8, 14], hScale: [6, 20], lit: 1.5, wpm: [2, 3, 3, 3],
    split: 3, park: 0.03, alley: 0.50, tier: 0.20, crown: 0.90, stripe: 0.85,
    lamp: 0.160, tree: 0.002, bin: 0.030, hydr: 0.010, sign: 0.98, signV: 0.70,
    stall: 0.051, stree: 0.25, cam: 0.045,
    fog: [40, 10, 44],
    words: ['LOVE HOTEL', 'CABARET', 'GIRLS GIRLS', 'PEEP SHOW', 'VELVET ROOM',
            'MASSAGE', 'NEON DOLLS', 'PRIVATE', 'AFTER DARK', 'XXX ARCADE',
            'CHERRY CLUB', 'LIPSTICK', 'ROOM SERVICE', 'THE MILE'] }
];
// how far out each ring of the map sits, as a fraction of the half-diagonal
const Z_CORE = 0.15, Z_URBAN = 0.34, Z_SUB = 0.60, Z_RURAL = 0.85;
function zoneAt(bi, bj){
  const zr = Math.hypot(bi + 0.5 - NB * 0.5, bj + 0.5 - NB * 0.5) / (NB * 0.5);
  return zr < Z_CORE ? 0 : zr < Z_URBAN ? 1 : zr < Z_SUB ? 2 : zr < Z_RURAL ? 3 : 4;
}
const distMap = new Uint8Array(NB * NB);
function districtAt(x, y){
  const bi = clamp((x / P) | 0, 0, NB - 1), bj = clamp((y / P) | 0, 0, NB - 1);
  return distMap[bj * NB + bi];
}
// distMap carries the TYPE (behaviour profile); regMap carries the PLACE -
// a contiguous named region like MOSSBROOK or the RED LIGHT wedge
const REGIONS = [];
const regMap = new Uint8Array(NB * NB);
function regionAt(x, y){
  const bi = clamp((x / P) | 0, 0, NB - 1), bj = clamp((y / P) | 0, 0, NB - 1);
  return zoneAt(bi, bj) >= 4 ? 255 : regMap[bj * NB + bi];
}
function regionName(x, y){
  const r = regionAt(x, y);
  return r === 255 ? 'THE WILDS' : REGIONS[r].name;
}

/*--------------------------- 5. DISTANCE LEVELS ----------------------------*/
// One atlas per level: smaller font + more fog the further away it is.
const LV = 8;
const LV_SCALE = [1.00, 0.94, 0.87, 0.79, 0.70, 0.60, 0.50, 0.41];
const LV_FADE  = [0.00, 0.09, 0.19, 0.31, 0.44, 0.58, 0.73, 0.89];
const LV_BOLD  = [1, 1, 1, 0, 0, 0, 0, 0];
function levelOf(t){ return t <= 0 ? 0 : t >= 1 ? LV - 1 : Math.min(LV - 1, (Math.pow(t, 0.90) * LV) | 0); }
// How hard glyphs thin out with distance. On a clear day the far skyline
// stays dense and SOLID - the dissolve-into-dots only suits dark or hazy
// backdrops, where it reads as fog instead of blur. Set per frame in render.
let densK = 0.74;
function densMul(t){ return 1 - densK * Math.pow(t, 1.15); }

/*------------------------------- 6. CANVAS ---------------------------------*/
const cv  = document.getElementById('cv');
const glv = document.getElementById('glv');
const ctx = cv.getContext('2d', { alpha: false });
let view = cv;                       // whichever canvas is actually on screen
const FONT = '"Cascadia Mono","Consolas","Courier New",monospace';
const R = { cols: 0, rows: 0, cellW: 11, cellH: 20, ox: 0, oy: 0, W: 0, H: 0 };
let gBuf, bBuf, lBuf, dBuf, refBuf, srcBuf;  // glyph / colour / level / depth / wet / mirrorable
let hGlyph, hCol;                    // HUD layer
let atlas = [], hudAtlas = null, bgGrad = null, glTried = false;
const HUDC = ['#8ff0c0', '#4fbf8a', '#dfe8ef', '#ffd166', '#ff6b6b', '#7fc8ff', '#6d7a88', '#c39bff',
              '#d8a276', '#46566e', '#3a4158', '#232a36'];   // skin, jacket, pants, dark
const H_GRN = 0, H_DIM = 1, H_WHT = 2, H_YEL = 3, H_RED = 4, H_BLU = 5, H_GRY = 6, H_PUR = 7,
      H_SKIN = 8, H_JKT = 9, H_PNT = 10, H_DRK = 11;

function buildAtlases(){
  const cw = R.cellW, ch = R.cellH;
  const fbase = Math.min(ch * 0.99, cw / 0.575);
  const T = curTime();
  atlas = [];
  for (let l = 0; l < LV; l++){
    const cn = document.createElement('canvas');
    cn.width = CHARS.length * cw; cn.height = NBASE * ch;
    const g = cn.getContext('2d');
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.font = (LV_BOLD[l] ? 'bold ' : '') + (fbase * LV_SCALE[l]).toFixed(2) +
             'px "Cascadia Mono","Consolas","Courier New",monospace';
    const f = LV_FADE[l] * fogScale();
    const dim = 1 - 0.22 * f;
    const sat = (CFG.timeMode === 2 ? 1.5 : 1) * drugFx('sat', 1);
    const hueK = drugFx('hue', 0);              // the ride bends the palette
    const hueM = (hueK ? hueK * (0.25 + 0.75 * (0.5 + 0.5 * Math.sin(worldTime * 0.35))) : 0)
               + drugFx('hueC', 0);
    const warm = drugFx('warm', 0);
    for (let b = 0; b < NBASE; b++){            // shells that were cut for night
      const c = BASE[b];
      let r0 = c[0] * dim * T.amb, g0 = c[1] * dim * T.amb, b0 = c[2] * dim * T.amb;
      if (sat !== 1){
        const lum = r0 * 0.3 + g0 * 0.59 + b0 * 0.11;
        r0 = lum + (r0 - lum) * sat; g0 = lum + (g0 - lum) * sat; b0 = lum + (b0 - lum) * sat;
      }
      if (warm){ r0 *= 1 + 0.15 * warm; b0 *= 1 - 0.12 * warm; }
      if (hueM){
        const hm2 = hueM * (1 + Math.max(0, 1 - T.amb) * 1.2);
        const r1 = r0 + (g0 - r0) * hm2, g1 = g0 + (b0 - g0) * hm2, b1 = b0 + (r0 - b0) * hm2;
        r0 = r1; g0 = g1; b0 = b1;
      }
      const rC = Math.round(clamp(r0, 0, 255) * (1 - f) + T.fog[0] * f);
      const gC = Math.round(clamp(g0, 0, 255) * (1 - f) + T.fog[1] * f);
      const bC = Math.round(clamp(b0, 0, 255) * (1 - f) + T.fog[2] * f);
      g.fillStyle = 'rgb(' + rC + ',' + gC + ',' + bC + ')';
      const y = b * ch + ch * 0.5;
      for (let i = 1; i < CHARS.length; i++) g.fillText(CHARS[i], i * cw + cw * 0.5, y);
    }
    atlas.push(cn);
  }
  // HUD atlas: full printable ASCII, one row per HUD colour.
  const hcv = document.createElement('canvas');
  hcv.width = 95 * cw; hcv.height = HUDC.length * ch;
  const hg = hcv.getContext('2d');
  hg.textAlign = 'center'; hg.textBaseline = 'middle';
  hg.font = 'bold ' + (fbase * 0.94).toFixed(2) + 'px "Cascadia Mono","Consolas","Courier New",monospace';
  for (let k = 0; k < HUDC.length; k++){
    hg.fillStyle = HUDC[k];
    for (let i = 1; i < 95; i++) hg.fillText(String.fromCharCode(32 + i), i * cw + cw * 0.5, k * ch + ch * 0.5);
  }
  hudAtlas = hcv;
}

let bgPitch = NaN, bgTime = -1, bgDist = -1, bgIns = -1;
function buildBackground(){
  const dn = distMap.length ? districtAt(cam.x, cam.y) : 0;
  const ins = inside ? 1 : 0;
  if (bgGrad && cam.pitch === bgPitch && bakeKey === bgTime && dn === bgDist && ins === bgIns) return;
  bgPitch = cam.pitch; bgTime = bakeKey; bgDist = dn; bgIns = ins;
  if (ins){                                  // indoors: a flat near-black
    const g = ctx.createLinearGradient(0, 0, 0, R.H || 1);
    g.addColorStop(0, 'rgb(8,9,14)');
    g.addColorStop(1, 'rgb(4,5,8)');
    bgGrad = g;
    return;
  }
  const T0 = curTime(), DF = DISTRICT[dn].fog;
  // grade the horizon toward the district you are standing in
  const T = { sky: T0.sky, glow: T0.glow,
              fog: T0.fog.map((v, i) => Math.round(v * 0.66 + DF[i] * 0.34)) };
  const g = ctx.createLinearGradient(0, 0, 0, R.H || 1);
  const hz = clamp(0.5 + cam.pitch / Math.max(1, R.rows), 0.03, 0.97);
  g.addColorStop(0, 'rgb(' + T.sky.join(',') + ')');
  g.addColorStop(Math.max(0.001, hz - 0.16),     // no glow band in the backdrop -
    'rgb(' + T.sky.map((v, i) => Math.round(v * 0.35 + T.fog[i] * 0.65)).join(',') + ')');
  g.addColorStop(hz, 'rgb(' + T.fog.join(',') + ')');
  g.addColorStop(1, 'rgb(' + T.fog.map(v =>
    Math.round(v * (CFG.timeMode === 2 ? 0.22 : 0.42))).join(',') + ')');
  bgGrad = g;
}

/*=============================== 7. THE GRID ================================
  Everything in the world is decided by tile residues inside a block period P:
      residue 0 .. RW-1          -> roadway (one lane each way)
      residue RW .. RW+SW-1      -> sidewalk, kerb side
      residue P-SW .. P-1        -> sidewalk, far side
      residue RW+SW .. P-SW-1    -> buildable lot interior
  A road residue crossed with a sidewalk residue is a crosswalk.
============================================================================*/
const T_ROAD = 0, T_CROSS = 1, T_WALK = 2, T_LOT = 3, T_BLD = 4,
      T_WATER = 5, T_BRIDGE = 6, T_PATH = 7, T_INF = 8;   // T_INF: interior floor
const PK_LAMP = 0, PK_TREE = 1, PK_HYDR = 2, PK_TLIGHT = 3, PK_BIN = 4,
      PK_RAIL = 5, PK_STALL = 6, PK_BENCH = 7, PK_CAM = 8, PK_PLAY = 9,
      PK_METRO = 10, PK_APPLE = 11, PK_TURBINE = 12, PK_ITEM = 13,
      PK_SAKURA = 14, PK_CROP = 15, PK_ROCK = 16, PK_STAIR = 17, PK_RACK = 18,
      PK_FURN = 19, PK_HOOP = 20, PK_SWING = 21, PK_CLIMB = 22,
      PK_FLOTSAM = 23, PK_RAMP = 24;

// `let`, not `const`: entering a building swaps these references to a second
// interior array set and back, so the renderer never learns scenes exist.
let tType = new Uint8Array(MAP * MAP);
let tH    = new Float32Array(MAP * MAP);
let tB    = new Int16Array(MAP * MAP);
let walkG = new Uint8Array(MAP * MAP);   // 0 blocked, else step cost x10
/* Where the CHANNEL is, as opposed to where the water shows. A bridge writes
   its deck over the river tiles and the water was simply gone underneath -
   so the deep pass, finding a bridge tile where it expected water, drew the
   stone channel wall and plugged the river with masonry at every crossing.
   The riverbed is recorded once when it is cut, and nothing overwrites it. */
const riverBed = new Uint8Array(MAP * MAP);
const DECK_T = 1.9;                      // how deep a bridge deck is, in metres
function inChannel(ix, iy){
  return tType[iy * MAP + ix] === T_WATER || riverBed[iy * MAP + ix] === 1;
}
let buildings = [], props = [], signs = [], stalls = [];

function residue(r){ return r < RW ? 0 : (r < RW + SW || r >= P - SW ? 1 : 2); }
function baseType(x, y){
  const rx = residue(x % P), ry = residue(y % P);
  if (rx === 0 && ry === 0) return T_ROAD;               // intersection
  if (rx === 0) return ry === 1 ? T_CROSS : T_ROAD;      // north-south street
  if (ry === 0) return rx === 1 ? T_CROSS : T_ROAD;      // east-west street
  if (rx === 1 || ry === 1) return T_WALK;               // sidewalk ring
  return T_LOT;
}
const inMap = (x, y) => x >= 0 && y >= 0 && x < MAP && y < MAP;
const tileAt = (x, y) => inMap(x, y) ? tType[y * MAP + x] : T_BLD;
const heightAt = (x, y) => inMap(x, y) ? tH[y * MAP + x] : 0;
function solidAt(wx, wy){
  const x = wx | 0, y = wy | 0;
  if (!inMap(x, y)) return true;
  return tH[y * MAP + x] > 0;
}
function wetAt(x, y){ return inMap(x, y) && tType[y * MAP + x] === T_WATER; }

/*--------------------- recursive lot subdivision (BSP) ---------------------*/
function bsp(x0, y0, x1, y1, depth, out){
  const w = x1 - x0 + 1, h = y1 - y0 + 1;
  const canW = w >= 7, canH = h >= 7;
  if (depth <= 0 || (!canW && !canH) || (w <= 6 && h <= 6 && rnd() < 0.45)){
    out.push([x0, y0, x1, y1]); return;
  }
  let vertical;
  if (canW && canH) vertical = w > h ? rnd() < 0.78 : rnd() < 0.22;
  else vertical = canW;
  if (vertical){
    const cut = x0 + 3 + ((rnd() * (w - 6)) | 0);
    bsp(x0, y0, cut, y1, depth - 1, out); bsp(cut + 1, y0, x1, y1, depth - 1, out);
  } else {
    const cut = y0 + 3 + ((rnd() * (h - 6)) | 0);
    bsp(x0, y0, x1, cut, depth - 1, out); bsp(x0, cut + 1, x1, y1, depth - 1, out);
  }
}

// The map is laid out as named, contiguous places: a finance core, then an
// urban ring split into red-light / strip / downtown wedges with two
// industrial yards clamped to its outer edge, five residential
// neighbourhoods filling the suburban ring, and the fields beyond. The whole
// compass spins per seed, so no two cities put MOSSBROOK in the same corner.
const RES_NAMES = ['SAKURA HEIGHTS', 'MOSSBROOK', 'KANDA GARDENS', 'EMBER ROW',
                   'LOWMARSH', 'HALCYON PARK', 'WILLOW COURTS', 'GREYFIELD',
                   'ASHVALE', 'NORIKO FLATS'];
const IND_NAMES = ['THE FOUNDRIES', 'RUSTYARD', 'SLAGROW', 'GANTRY ROW',
                   'COKEWORKS', 'THE SMELTERS'];
function angDist(a, b){
  const TAU = Math.PI * 2;
  const d = Math.abs(a - b) % TAU;
  return Math.min(d, TAU - d);
}
function buildDistricts(){
  const TAU = Math.PI * 2;
  REGIONS.length = 0;
  const reg = (name, type) => REGIONS.push({ name, type }) - 1;
  const deal = pool => pool.splice((rnd() * pool.length) | 0, 1)[0];
  const resPool = RES_NAMES.slice(), indPool = IND_NAMES.slice();
  const rFin   = reg('FINANCE DISTRICT', D_DOWN);
  const rDown  = reg('DOWNTOWN', D_DOWN);
  const rStrip = reg('THE STRIP', D_STRIP);
  const rRed   = reg('RED LIGHT', D_RED);
  const rInd   = [reg(deal(indPool), D_IND), reg(deal(indPool), D_IND)];
  const rRes   = [];
  for (let i = 0; i < 5; i++) rRes.push(reg(deal(resPool), i & 1 ? D_RES : D_SUB));
  const rFields = reg('THE FIELDS', D_RURAL);
  const rot = rnd() * TAU;
  for (let bj = 0; bj < NB; bj++)
    for (let bi = 0; bi < NB; bi++){
      const id = bj * NB + bi;
      const z = zoneAt(bi, bj);
      if (z >= 4){ regMap[id] = 255; distMap[id] = D_RURAL; continue; }
      const a = ((Math.atan2(bj + 0.5 - NB / 2, bi + 0.5 - NB / 2) - rot) % TAU + TAU) % TAU;
      const zr = Math.hypot(bi + 0.5 - NB * 0.5, bj + 0.5 - NB * 0.5) / (NB * 0.5);
      let r;
      if (z === 0) r = rFin;
      else if (z === 1){
        const indBand = zr > Z_URBAN - 0.075;    // the urban ring's outer edge
        if (indBand && angDist(a, TAU * 0.25) < TAU * 0.14) r = rInd[0];
        else if (indBand && angDist(a, TAU * 0.75) < TAU * 0.14) r = rInd[1];
        else if (a < TAU * 0.42) r = rRed;       // one unified wedge, contained
        else if (a < TAU * 0.66) r = rStrip;
        else r = rDown;
      }
      else if (z === 2) r = rRes[Math.min(4, (a / TAU * 5) | 0)];
      else r = rFields;
      regMap[id] = r;
      distMap[id] = REGIONS[r].type;
    }
}

/*=========================== 7b. LANDMARKS =================================
  Everything below is stamped over the lattice after it is generated. A stamp
  may overwrite tiles, register its own building record so facades still work,
  and drop props and signage of its own.
============================================================================*/
let landmarks = [];
function lmBuilding(o){
  const b = Object.assign({
    id: buildings.length, x0: 0, y0: 0, x1: 0, y1: 0, h: 10, dist: D_DOWN,
    col: C.bldD, winA: C.nCyan, winB: C.nWhite, sign: C.nCyan,
    crown: -1, stripe: -1, stripePh: 0, litP: 0.4,
    fh: 1.4, wpm: 2, seed: (rnd() * 65535) | 0, landmark: true
  }, o);
  buildings.push(b);
  return b;
}
function lmFill(x0, y0, x1, y1, type, h, bid){
  for (let y = Math.max(0, y0); y <= Math.min(MAP - 1, y1); y++)
    for (let x = Math.max(0, x0); x <= Math.min(MAP - 1, x1); x++){
      const id = y * MAP + x;
      tType[id] = type;
      tH[id] = h || 0;
      tB[id] = bid === undefined ? -1 : bid;
    }
}
function lmSign(x, y, z, nx, ny, txt, col, vert){
  // a landmark says one thing and means it - no tenants, no patter
  const pan = signPanel([{ col, ch: null, ph: [{ txt }] }], !!vert);
  const pix = Math.min(0.22, 6.0 / pan.pw);
  const axis = nx !== 0 ? 0 : 1, n = nx !== 0 ? nx : ny;
  pushSign(axis, n, axis === 0 ? x : y, axis === 0 ? y : x,
           pan.pw * pix, pan.ph * pix, z, nx, ny, pan, !!vert, 0);
}

// The river meanders east-west and cuts the map in two.
const RIVER_Y = MAP * 0.5;
const RIVER_DEPTH = 3.0;          // how far the water sits below the street
function riverMid(x){ return RIVER_Y + Math.sin(x * 0.042) * 9 + Math.sin(x * 0.017 + 1.7) * 5; }
function riverHalf(x){ return 6.5 + Math.sin(x * 0.061 + 0.5) * 1.9; }
function carveRiver(){
  for (let x = 0; x < MAP; x++){
    const mid = riverMid(x), hw = riverHalf(x);
    for (let y = Math.max(0, Math.floor(mid - hw)); y <= Math.min(MAP - 1, Math.ceil(mid + hw)); y++){
      const id = y * MAP + x;
      tType[id] = T_WATER; tH[id] = 0; tB[id] = -1;
      riverBed[id] = 1;                        // the water still runs here
    }
  }
}
// A bridge carries a whole boulevard - roadway plus both sidewalks - across.
function carveBridge(k, worn){
  const x0 = k * P - SW, x1 = k * P + RW + SW - 1;
  let yTop = MAP, yBot = -1;
  for (let x = x0; x <= x1; x++){
    if (x < 0 || x >= MAP) continue;
    const mid = riverMid(x), hw = riverHalf(x);
    yTop = Math.min(yTop, Math.floor(mid - hw) - 3);
    yBot = Math.max(yBot, Math.ceil(mid + hw) + 3);
  }
  const wx0 = worn ? x0 + 2 : x0, wx1 = worn ? x1 - 2 : x1;
  /* Lay the whole deck. This used to convert only the tiles that were WATER
     once it was two rows past the abutment, and the river MEANDERS - so the
     span between the end of the approach and the water's edge at that column
     stayed as street, and the deck came and went along its own length:
     street, bridge, street, bridge, with a staircase of an edge where it met
     the bank. Six transitions down every column where there should be two.
     A bridge is a straight thing between two straight abutments; the ground
     under the middle of it is nobody's business. Buildings are placed long
     after this runs, so there is nothing here to pave over but road. */
  for (let y = Math.max(0, yTop); y <= Math.min(MAP - 1, yBot); y++)
    for (let x = Math.max(0, wx0); x <= Math.min(MAP - 1, wx1); x++){
      const id = y * MAP + x;
      tType[id] = T_BRIDGE; tH[id] = 0; tB[id] = -1;
    }
  // railings down both edges, and lamps along the primary deck
  for (let y = Math.max(0, yTop); y <= Math.min(MAP - 1, yBot); y += 2){
    for (const ex of [wx0, wx1]){
      if (ex < 0 || ex >= MAP) continue;
      if (tType[y * MAP + ex] !== T_BRIDGE) continue;
      props.push({ x: ex + 0.5, y: y + 0.5, k: PK_RAIL, s: worn ? 1 : 0, r: 0.14 });
    }
    if (!worn && (y % 8) === 0 && tType[y * MAP + wx0 + 1] === T_BRIDGE)
      props.push({ x: wx0 + 1.5, y: y + 0.5, k: PK_LAMP, s: 0.05, r: 0.16 });
  }
  landmarks.push({ name: worn ? placeWord() + ' CROSSING' : 'CENTRAL BRIDGE',
                   x: (wx0 + wx1) * 0.5, y: (yTop + yBot) * 0.5 });
  return { x0: wx0, x1: wx1, yTop, yBot };
}
// Toll plaza on the northern approach of the main bridge.
function tollBooth(br){
  const y = Math.max(2, br.yTop - 2);
  for (const bx of [br.x0 + 1, br.x1 - 2]){
    if (bx < 1 || bx + 1 >= MAP) continue;
    const b = lmBuilding({ x0: bx, y0: y, x1: bx + 1, y1: y + 1, h: 3.4,
                           col: C.bldJ, sign: C.nAmber, winA: C.nAmber, winB: C.nWhite,
                           litP: 0.9, fh: 1.6, wpm: 2, crown: C.nAmber });
    lmFill(bx, y, bx + 1, y + 1, T_BLD, 3.4, b.id);
    lmSign(bx + 1, y - 0.6, 3.9, 0, -1, 'TOLL', C.nAmber, false);
  }
}

/*------------------------- the rest of the landmarks -----------------------*/
const blockUsed = new Uint8Array(NB * NB);
function blockFree(bi, bj, bw, bh){
  if (bi < 0 || bj < 0 || bi + bw > NB || bj + bh > NB) return false;
  for (let y = bj; y < bj + bh; y++)              // already claimed by a landmark
    for (let x = bi; x < bi + bw; x++) if (blockUsed[y * NB + x]) return false;
  for (let y = bj * P; y < (bj + bh) * P; y++)
    for (let x = bi * P; x < (bi + bw) * P; x++){
      if (!inMap(x, y)) return false;
      const t = tType[y * MAP + x];
      if (t === T_WATER || t === T_BRIDGE) return false;
    }
  return true;
}
function findBlock(bw, bh, want, zone){
  const c = [];
  for (let bj = 1; bj < NB - bh; bj++)
    for (let bi = 1; bi < NB - bw; bi++){
      if (!blockFree(bi, bj, bw, bh)) continue;
      if (want !== undefined && distMap[bj * NB + bi] !== want) continue;
      if (zone !== undefined && zoneAt(bi, bj) !== zone) continue;
      let zOk = true;                 // no span may touch the wilderness ring
      for (let zj = bj; zOk && zj < bj + bh; zj++)
        for (let zi = bi; zi < bi + bw; zi++)
          if (zoneAt(zi, zj) >= 4){ zOk = false; break; }
      if (!zOk) continue;
      c.push([bi, bj]);
    }
  if (!c.length) return null;
  const pick = c[(rnd() * c.length) | 0];
  for (let y = pick[1]; y < pick[1] + bh; y++)     // reserve it so nothing lands on top
    for (let x = pick[0]; x < pick[0] + bw; x++) blockUsed[y * NB + x] = 1;
  return pick;
}
function clearArea(x0, y0, x1, y1, type){
  for (let y = Math.max(0, y0); y <= Math.min(MAP - 1, y1); y++)
    for (let x = Math.max(0, x0); x <= Math.min(MAP - 1, x1); x++){
      const id = y * MAP + x;
      if (tType[id] === T_WATER || tType[id] === T_BRIDGE) continue;
      tType[id] = type; tH[id] = 0; tB[id] = -1;
    }
}

// --- the sphere: a stepped hemisphere whose whole skin is one display -----
//
// Tile heights follow h = H * sqrt(1 - (r/R)^2), so the dome is a voxel
// hemisphere. Every wall cell on it maps to a point on that sphere - longitude
// around, height for latitude - and samples the current frame, which may ask
// for a specific character rather than a density. The image wraps twice, so a
// whole face reads from any approach.
function domeFrame(rows, c1, c2, scroll){
  let w = 0;
  for (const r of rows) w = Math.max(w, r.length);
  const padded = rows.map(r => r + ' '.repeat(w - r.length));
  return { rows: padded, w, h: padded.length, c1, c2, scroll: !!scroll };
}

function textFrame(lines, c1, c2){

  for (let y = 0; y < H; y++) grid.push(new Array(W).fill('.'));
  let y0 = Math.max(0, ((H - (lines.length * 7 - 2)) * 0.5) | 0);
  for (const line of lines){
    let x0 = Math.max(0, ((W - (line.length * 4 - 1)) * 0.5) | 0);
    for (let i = 0; i < line.length; i++){
      const gl = (MINIFONT[line[i]] || MINIFONT[' ']).split('|');

          if (gl[r][c] === '#' && y0 + r < H && x0 + c < W) grid[y0 + r][x0 + c] = '#';
      x0 += 4;

  return domeFrame(grid.map(r => r.join('')), c1, c2);

function domeSurface(b, z, hx, hy){
  const lon = Math.atan2(hy - b.cy, hx - b.cx);
  let u = (lon / (Math.PI * 2) + 0.5) * 2;         // two copies around
  u -= Math.floor(u);
  const v = clamp(z / b.domeH, 0, 0.9999);
  const fr = DOME_FRAMES[((worldTime / 4.0) | 0) % DOME_FRAMES.length];
  let fx = (u * fr.w) | 0;
  if (fr.scroll) fx = (fx + ((worldTime * 4) | 0)) % fr.w;
  const fy = Math.min(fr.h - 1, ((1 - v) * fr.h) | 0);
  const ch = fr.rows[fy].charAt(fx);
  if (ch === '.' || ch === ' '){ _wd = 0.26; _wb = C.signBack; }
  else if (ch === '#'){ _wd = 0.97; _wb = fr.c1; }
  else { _wd = 1.0; _wb = fr.c2; const g = GI[ch]; if (g !== undefined) _wg = g; }
}
function stampDome(){
  const b = findBlock(2, 2);
  if (!b) return;
  const [bi, bj] = b;
  const cx = bi * P + P, cy = bj * P + P;
  const Rr = 16, HK = 22;
  clearArea(bi * P, bj * P, (bi + 2) * P - 1, (bj + 2) * P - 1, T_WALK);
  const rec = lmBuilding({ x0: Math.round(cx - Rr), y0: Math.round(cy - Rr),
                           x1: Math.round(cx + Rr), y1: Math.round(cy + Rr),
                           h: HK, col: C.signCase, litP: 0 });
  rec.dome = true; rec.cx = cx; rec.cy = cy; rec.domeH = HK;
  for (let y = Math.round(cy - Rr); y <= Math.round(cy + Rr); y++)
    for (let x = Math.round(cx - Rr); x <= Math.round(cx + Rr); x++){
      if (!inMap(x, y)) continue;
      const dx = x + 0.5 - cx, dy = y + 0.5 - cy;
      const rr = Math.hypot(dx, dy) / Rr;
      if (rr > 1) continue;
      const id = y * MAP + x;
      if (tType[id] === T_WATER || tType[id] === T_BRIDGE) continue;
      tType[id] = T_BLD;
      tH[id] = Math.max(1.5, HK * Math.sqrt(1 - rr * rr));
      tB[id] = rec.id;
    }
  // a ring of lamps so the plaza reads as a forecourt
  for (let a = 0; a < 16; a++){
    const th = a / 16 * Math.PI * 2;
    const px = cx + Math.cos(th) * (Rr + 2.5), py = cy + Math.sin(th) * (Rr + 2.5);
    if (inMap(px | 0, py | 0) && tType[(py | 0) * MAP + (px | 0)] === T_WALK)
      props.push({ x: px, y: py, k: PK_LAMP, s: a / 16, r: 0.16 });
  }
  landmarks.push({ name: 'THE SPHERE', x: cx, y: cy - Rr - 5 });
}

// --- parks --------------------------------------------------------------
function stampPark(bi, bj, bw, bh, kind){
  const x0 = bi * P, y0 = bj * P, x1 = x0 + bw * P - 1, y1 = y0 + bh * P - 1;
  clearArea(x0, y0, x1, y1, T_LOT);
  // a path that wanders from one side to the other
  for (let x = x0; x <= x1; x++){
    const py = Math.round((y0 + y1) * 0.5 + Math.sin((x - x0) * 0.19) * (y1 - y0) * 0.24);
    for (let w = -1; w <= 1; w++){
      const y = py + w;
      if (y < y0 || y > y1) continue;
      const id = y * MAP + x;
      if (tType[id] === T_LOT) tType[id] = T_PATH;
    }
  }
  for (let y = y0; y <= y1; y++)
    for (let x = x0; x <= x1; x++){
      if (tType[y * MAP + x] !== T_LOT) continue;
      const r = rnd();
      if (nearBuilding(x, y, 1)) continue;
      if (kind === 'main'){
        if (r < 0.022) props.push({ x: x + 0.5, y: y + 0.5, k: PK_APPLE, s: rnd(), r: 0.4 });
        else if (r < 0.062) props.push({ x: x + 0.5, y: y + 0.5,
          k: rnd() < 0.55 ? PK_SAKURA : PK_TREE, s: rnd(), r: 0.42 });
        else if (r < 0.075) props.push({ x: x + 0.5, y: y + 0.5,
          k: PK_BENCH, s: 0, r: 0.35 });        // somewhere to sit in a big park
      } else {
        if (r < 0.040) props.push({ x: x + 0.5, y: y + 0.5,
          k: rnd() < 0.55 ? PK_SAKURA : PK_TREE, s: rnd(), r: 0.42 });
        else if (r < 0.065) props.push({ x: x + 0.5, y: y + 0.5, k: PK_BENCH, s: 0, r: 0.35 });
      }
    }
  let title;
  if (kind === 'main'){
    title = placeWord() + ' ' + ['PARK', 'GARDENS', 'COMMONS', 'GREEN',
                                 'MEADOW'][(rnd() * 5) | 0];
  } else {
    // Three kinds of small park, and the equipment decides which one it is.
    const px = (x0 + x1) * 0.5, py = (y0 + y1) * 0.5;
    const theme = (rnd() * 3) | 0;
    const place = placeWord();
    if (theme === 0){
      // a half court: two hoops facing each other down the long axis, a rail
      // along the touchline, and somewhere to sit and wait for next game
      title = place + ' COURTS';
      const along = (x1 - x0) >= (y1 - y0);
      const half = (along ? (x1 - x0) : (y1 - y0)) * 0.5 - 2.5;
      for (const sgn of [-1, 1]){
        const hx = px + (along ? sgn * half : 0), hy = py + (along ? 0 : sgn * half);
        // a hoop faces down the court, which is back the way it came
        const yaw = along ? (sgn > 0 ? Math.PI : 0) : (sgn > 0 ? -Math.PI / 2 : Math.PI / 2);
        props.push({ x: hx, y: hy, k: PK_HOOP, s: rnd(), r: 0.55, fix: yaw });
      }
      const rw2 = (along ? half : 4.5), rh2 = (along ? 4.5 : half);
      for (let t = -rh2; t <= rh2; t += 2.4){
        props.push({ x: px - rw2 - 0.6, y: py + t, k: PK_RAIL, s: 1, r: 0.14 });
        props.push({ x: px + rw2 + 0.6, y: py + t, k: PK_RAIL, s: 1, r: 0.14 });
      }
      for (let k = 0; k < 3; k++)
        props.push({ x: px + rr(-7, 7), y: py + rr(-6, 6), k: PK_BENCH, s: 0, r: 0.35 });
    } else if (theme === 1){
      // a swing set, and the trees you sit under while somebody else swings
      title = place + ' SWINGS';
      for (let k = 0; k < 2; k++)
        props.push({ x: px + (k ? 2.6 : -2.6), y: py + rr(-1, 1),
                     k: PK_SWING, s: rnd(), r: 0.9, fix: 0 });
      for (let k = 0; k < 4; k++)
        props.push({ x: px + rr(-7, 7), y: py + rr(-6, 6), k: PK_BENCH, s: 0, r: 0.35 });
      for (let k = 0; k < 3; k++)
        props.push({ x: px + rr(-8, 8), y: py + rr(-7, 7),
                     k: rnd() < 0.6 ? PK_SAKURA : PK_TREE, s: rnd(), r: 0.42 });
    } else {
      // a frame to climb, a slide off it, and a couple of things to sit on
      title = place + ' ADVENTURE';
      props.push({ x: px, y: py, k: PK_CLIMB, s: rnd(), r: 1.4, fix: 0 });
      if ((x1 - x0) > 14)
        props.push({ x: px + 5.5, y: py + rr(-2, 2), k: PK_CLIMB, s: rnd(),
                     r: 1.4, fix: Math.PI });
      for (let k = 0; k < 2; k++)
        props.push({ x: px + rr(-7, 7), y: py + rr(-6, 6), k: PK_SWING, s: rnd(),
                     r: 0.9, fix: Math.PI / 2 });
      for (let k = 0; k < 4; k++)
        props.push({ x: px + rr(-7, 7), y: py + rr(-6, 6), k: PK_BENCH, s: 0, r: 0.35 });
    }
  }
  landmarks.push({ name: title, x: (x0 + x1) * 0.5, y: (y0 + y1) * 0.5 });
}

const RED_WORDS = ['GIRLS', 'LIVE', 'PEEP', 'XXX', 'ROOMS', 'BAR', 'SHOW',

function stampRedLight(){
  const b = findBlock(1, 2, D_RED) || findBlock(1, 2, D_STRIP) || findBlock(1, 2);
  if (!b) return;
  const [bi, bj] = b;
  const sx = bi * P + RW * 0.5;                        // the street itself
  const y0 = bj * P, y1 = (bj + 2) * P - 1;

  for (const bd of buildings){
    if (bd.landmark) continue;

  }
  for (let y = y0; y <= y1; y += 3){
    for (const dx of [-RW * 0.5 - SW, RW * 0.5 + SW]){
      const px = sx + dx, py = y + 0.5;
      if (!inMap(px | 0, py | 0)) continue;
      if (tType[(py | 0) * MAP + (px | 0)] !== T_WALK) continue;

// --- fields: the ring outside the city proper ---------------------------
function stampFields(){
  for (let bj = 0; bj < NB; bj++)
    for (let bi = 0; bi < NB; bi++){
      if (zoneAt(bi, bj) < 4) continue;
      for (let y = bj * P; y < (bj + 1) * P; y++)
        for (let x = bi * P; x < (bi + 1) * P; x++){
          if (!inMap(x, y)) continue;
          const id = y * MAP + x;
          const t = tType[id];
          if (t === T_WATER || t === T_BRIDGE) continue;
          if (t === T_BLD){ tType[id] = T_LOT; tH[id] = 0; tB[id] = -1; }
          else if (t === T_WALK || t === T_CROSS) tType[id] = T_LOT;
          else if (t === T_ROAD) tType[id] = T_PATH;
          if (tType[id] === T_LOT && hash3(x, y, 71) < 0.007 && !nearBuilding(x, y, 1))
            props.push({ x: x + 0.5, y: y + 0.5, k: treeKind(x, y), s: hash3(x, y, 73), r: 0.42 });
        }
    }
}

// --- metro: four entrances, evenly spread, that link to each other -------
function stampMetro(){
  buildWalkGrid();          // entrances are chosen by walkability, so build it first
  const spots = [[0.50, 0.22], [0.78, 0.32], [0.86, 0.55], [0.72, 0.78],
                 [0.46, 0.84], [0.22, 0.70], [0.15, 0.44], [0.30, 0.24]];
  const names = ['NORTH GATE', 'NORTHEAST', 'EAST GATE', 'SOUTHEAST',
                 'SOUTH GATE', 'SOUTHWEST', 'WEST GATE', 'NORTHWEST'];
  metroStops = [];
  for (let i = 0; i < spots.length; i++){
    const tx = MAP * spots[i][0], ty = MAP * spots[i][1];
    let best = null, bd = 1e9;
    for (let t = 0; t < 1400; t++){
      const x = clamp((tx + rr(-P * 2, P * 2)) | 0, 2, MAP - 3), y = clamp((ty + rr(-P * 2, P * 2)) | 0, 2, MAP - 3);
      const tt = tType[y * MAP + x];
      if (tt !== T_WALK && tt !== T_ROAD) continue;
      let open = 0;                                   // needs elbow room
      for (let oy = -2; oy <= 2; oy++)
        for (let ox = -2; ox <= 2; ox++)
          if (walkG[clamp(y + oy, 0, MAP - 1) * MAP + clamp(x + ox, 0, MAP - 1)]) open++;
      if (open < 20) continue;
      const d = Math.hypot(x - tx, y - ty);
      if (d < bd){ bd = d; best = [x, y]; }
    }
    if (!best) continue;
    props.push({ x: best[0] + 0.5, y: best[1] + 0.5, k: PK_METRO, s: 0, r: 0.34 });
    metroStops.push({ x: best[0] + 0.5, y: best[1] + 0.5, name: names[i] });
    lmSign(best[0] + 0.5, best[1] - 0.1, 2.6, 0, -1, 'METRO', C.nGreen, false);
    landmarks.push({ name: 'METRO ' + names[i], x: best[0] + 0.5, y: best[1] + 0.5 });
  }
}

function stampLake(){

  const cx = bi * P + P, cy = bj * P + P, rr = P * 0.8;
  for (let y = Math.round(cy - rr); y <= Math.round(cy + rr); y++)
    for (let x = Math.round(cx - rr); x <= Math.round(cx + rr); x++){
      if (!inMap(x, y)) continue;
      const d = Math.hypot(x + 0.5 - cx, y + 0.5 - cy) / rr;

      tType[id] = T_WATER; tH[id] = 0; tB[id] = -1;

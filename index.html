/*============================== 14. RENDERER ===============================*/
let dirX = 1, dirY = 0, planeX = 0, planeY = -1, planeLen = 1;
let projRows = 40, horizon = 0, hzRow = 0;
let rayX = null, rayY = null, skyA = null, sunD = null, refWob = null;
let _wd = 0, _wb = 0, _wwet = 0, _wg = -1;  // surface sample out-params
let bloomOn = true, weather = 0, flash = 0, nextBolt = 5, fade = 0;
let fogLevel = 0.25;    // rolled fresh each time fog weather arrives
// Distance fog: night and dusk carry their haze always; a clear day carries
// none at all. Fog weather lays a rolled thickness over the day - capped at
// two thirds of the haze the old daytime look used.
function fogScale(){
  const base = CFG.timeMode === 2 ? 0 : 1;
  return weather === 3 ? Math.max(base, fogLevel) : base;
}
let viewD = CFG.MAXD;                    // eases outward once you leave the city
let metroStops = [];
function inFields(x, y){
  return zoneAt(clamp((x / P) | 0, 0, NB - 1), clamp((y / P) | 0, 0, NB - 1)) >= 3;
}
let bloomCv = [];
const G_SLASH = GI['/'], G_TICK = GI[String.fromCharCode(39)];
let statRays = 0, statCells = 0, statSprites = 0;
const CELL_BUDGET = 17000;

function initRender(){
  R.W = cv.width  = Math.max(320, window.innerWidth  | 0);
  R.H = cv.height = Math.max(240, window.innerHeight | 0);
  cv.style.width = R.W + 'px'; cv.style.height = R.H + 'px';
  if (GL === null && !glTried){ glTried = true; GL = glInit(); }
  const budget = GL ? 140000 : CELL_BUDGET;   // the GPU does not care about cell count
  let ri = CFG.resIdx, cw, ch;
  for (;;){
    cw = CFG.CELLW[ri]; ch = Math.max(7, Math.round(cw / 0.56));
    if (CFG.manualRes || ri === 0) break;   // an explicit choice always wins
    if (Math.floor(R.W / cw) * Math.floor(R.H / ch) <= budget) break;
    ri--;                        // first run on a big display: start coarser
  }
  CFG.resIdx = ri;
  R.cellW = cw; R.cellH = ch;
  R.cols = Math.max(24, Math.floor(R.W / cw));
  R.rows = Math.max(14, Math.floor(R.H / ch));
  R.ox = ((R.W - R.cols * cw) * 0.5) | 0;
  R.oy = ((R.H - R.rows * ch) * 0.5) | 0;
  bgGrad = null;
  const n = R.cols * R.rows;
  gBuf = new Uint8Array(n); bBuf = new Uint8Array(n);
  lBuf = new Uint8Array(n); dBuf = new Float32Array(n);
  hGlyph = new Uint8Array(n); hCol = new Uint8Array(n);
  refBuf = new Uint8Array(n);
  srcBuf = new Uint8Array(n);
  rayX = new Float32Array(R.cols); rayY = new Float32Array(R.cols);
  skyA = new Int32Array(R.cols);
  sunD = new Float32Array(R.cols);
  refWob = new Float32Array(R.cols);
  ctx.imageSmoothingEnabled = false;
  if (GL){
    view = glv; cv.style.display = 'none'; glv.style.display = 'block';
    glResize();
  } else {
    initBloom();
    buildAtlases();
  }
  buildBackground();
}

/*------------------------------- sky ---------------------------------------*/
function skyPass(){
  const cols = R.cols, rows = R.rows;
  const hz = clamp(Math.floor(horizon), 0, rows);
  const night = CFG.timeMode === 0 ? 1 : CFG.timeMode === 1 ? 0.5 : 0;
  // The sun hangs at a fixed world azimuth: high and white by day, low and
  // burning on the horizon at dusk. Never at night.
  const SUN_AZ = 2.35, sunOn = CFG.timeMode !== 0;
  // the sun rides an arc: low at 06:30, high at noon, low again by 18:30
  const elev = Math.sin(clamp((clock - 6.5) / 12, 0, 1) * Math.PI);
  const sunRow = CFG.timeMode === 2 ? hz * (1 - 0.72 * elev) : hz * 0.9;
  const sunCol = sunOn ? C.nWhite : 0;
  const sunGlow = CFG.timeMode === 2 ? C.nWhite : C.nAmber;
  const colPerRad = cols / CFG.FOV;
  // the ray angle only varies across columns, so hoist it out of the row loop
  for (let x = 0; x < cols; x++){
    const a = Math.atan2(rayY[x], rayX[x]);
    skyA[x] = (a * 96) | 0;
    let da = a - SUN_AZ;
    da = Math.atan2(Math.sin(da), Math.cos(da));
    sunD[x] = da * colPerRad;
  }
  // The horizon glow lives HERE, as sky cells, so buildings occlude it - the
  // background gradient itself carries no glow band to shine through them.
  const glowMat = CFG.timeMode === 1 ? C.glowDusk : CFG.timeMode === 2 ? C.lineW : C.skyGlow;
  const glowAmp = CFG.timeMode === 2 ? 0.14 : 0.8;
  for (let r = 0; r < hz; r++){
    const up = (hz - r) / Math.max(1, hz);          // 0 at horizon, 1 at zenith
    const glowD = Math.pow(1 - up, 2.5) * glowAmp;
    for (let x = 0; x < cols; x++){
      const idx = r * cols + x;
      const hs = hash3(skyA[x], (r - horizon) | 0, 11);
      let dens = glowD, base = glowMat;
      if (night > 0 && hs < 0.007 * up * night){ dens = 0.45 + hs * 24; base = C.nWhite; }
      else if (night > 0 && hs < 0.05) dens += 0.05;   // texture suits dark skies only
      if (sunOn){
        const day = CFG.timeMode === 2;
        const dy = (r - sunRow) * 2, q = sunD[x] * sunD[x] + dy * dy;
        if (q < (day ? 9 : 24)){ dens = 1; base = day ? C.nWhite : C.nAmber; }
        else if (q < (day ? 34 : 170)){
          const halo = (day ? 0.3 : 0.55) - q / (day ? 160 : 380);
          if (halo > dens){ dens = halo; base = day ? C.lineW : sunGlow; }
        }
      }
      const g = Math.round(clamp(dens, 0, 1) * RMAX);
      if (g === 0) continue;
      gBuf[idx] = g; bBuf[idx] = base; lBuf[idx] = 3;
    }
  }
}

/*------------------------- floor / ground plane ----------------------------*/
function floorSample(wx, wy, ix, iy){
  const t = tType[iy * MAP + ix];
  _wwet = (t === T_ROAD || t === T_CROSS) ? 1 : 0;   // 1 wet-when-raining, 2 always
  if (t === T_INF){                                  // interior floor: dry slabs
    _wwet = 0;
    const ck = (ix + iy) & 1;
    _wb = ck ? intFloorA : intFloorB;
    _wd = 0.32 + hash3(ix, iy, 91) * 0.08 + (ck ? 0.07 : 0);
    if (wx - ix < 0.05 || wy - iy < 0.05) _wd = 0.44; // slab joints
    return;
  }
  const rx = wx - Math.floor(wx / P) * P, ry = wy - Math.floor(wy / P) * P;
  const fx = wx - ix, fy = wy - iy;
  if (t === T_ROAD || t === T_CROSS){
    // A pedestrianised boulevard: the same slabs as the sidewalk, with an
    // inlaid strip running down the spine where the centre line used to be.
    _wb = C.walk; _wd = 0.27 + hash3(ix, iy, 5) * 0.09;
    const jx = (wx * 0.5) % 1, jy = (wy * 0.5) % 1;
    if (jx < 0.05 || jy < 0.05) _wd = 0.44;               // slab joints
    const inX = rx < RW, inY = ry < RW;
    if (!(inX && inY)){
      const off = inX ? Math.abs(rx - RW * 0.5) : Math.abs(ry - RW * 0.5);
      if (off < 0.6){ _wb = C.curb; _wd = 0.38; }
      else if (Math.abs(off - 2.1) < 0.12){ _wb = C.curb; _wd = 0.30; }
    }
    _wwet = 1;
    return;
  }
  if (t === T_WALK){
    const pc = signFloor[iy * MAP + ix];       // intersection id, painted on
    if (pc !== undefined){                     // the slabs like road markings
      const gl = MINIFONT[pc];
      if (gl && fx >= 0.14 && fy >= 0.10){
        const gc = 2 - (((fx - 0.14) * 4.17) | 0), gr = ((fy - 0.10) * 6.25) | 0;
        if (gc >= 0 && gr < 5 && gl[gr * 4 + gc] === '#'){
          _wb = C.nAmber; _wd = 0.95; _wwet = 1;
          return;
        }
      }
    }
    _wb = C.walk; _wd = 0.27 + hash3(ix, iy, 5) * 0.09;
    const jx = (wx * 0.5) % 1, jy = (wy * 0.5) % 1;
    if (jx < 0.05 || jy < 0.05) _wd = 0.44;
    _wwet = 1;
    return;
  }
  if (t === T_WATER){
    // Two perpendicular sines cross into a field of blobs. Waves instead run
    // as long crests parallel to the banks, so the coordinate that varies
    // fast is the one across the channel, and it meanders slowly along it.
    const cross = wy - riverMid(wx);
    const band = cross * 1.05
               + Math.sin(wx * 0.055 + worldTime * 0.33) * 1.8
               + Math.sin(wx * 0.131 - worldTime * 0.61) * 0.7;
    const w1 = Math.sin(band * 1.55 + worldTime * 0.85)
             + 0.55 * Math.sin(band * 3.7 - worldTime * 1.55);
    _wb = w1 > 0.45 ? C.water : C.waterD;
    _wd = 0.23 + w1 * 0.10;
    const gl = hash3((wx * 1.7) | 0, (wy * 1.7) | 0, 61);
    if (gl > 0.952){ _wb = NEONC[(gl * 887) % NEONC.length | 0]; _wd = 0.52; }
    _wwet = 2;                                  // water always reflects
    return;
  }
  if (t === T_BRIDGE){
    _wb = hash3(ix, iy, 23) > 0.5 ? C.deck : C.deckOld;
    _wd = 0.32 + hash3(ix, iy, 13) * 0.10;
    if (fx < 0.09 || fy < 0.09) _wd = 0.54;               // plate seams
    _wwet = 1;
    return;
  }
  if (t === T_PATH){
    _wb = C.path; _wd = 0.30 + hash3(ix, iy, 31) * 0.12;
    return;
  }
  if (t === T_LOT){
    if (districtAt(ix, iy) === D_RURAL){
      if (zoneAt((ix / P) | 0, (iy / P) | 0) >= 4){    // open wilderness
        _wb = C.turf; _wd = 0.20 + hash3(ix, iy, 12) * 0.16;
        if (hash3(ix, iy, 44) > 0.985){ _wb = C.rail; _wd = 0.5; }   // stones
        return;
      }
      // worked land: crop rows, soil between
      if (iy % 3 === 0){ _wb = C.path;  _wd = 0.26 + hash3(ix, iy, 7) * 0.08; }
      else             { _wb = C.grass; _wd = 0.40 + hash3(ix, iy, 8) * 0.20; }
      return;
    }
    _wb = C.turf; _wd = 0.28 + hash3(ix, iy, (wx * 3) | 0) * 0.22;
    return;
  }
  const b = buildings[tB[iy * MAP + ix]];
  _wb = b ? b.col : C.asphalt; _wd = 0.5;
}
function floorPass(){
  const cols = R.cols, rows = R.rows;
  const r0 = clamp(Math.ceil(horizon), 0, rows);
  for (let r = r0; r < rows; r++){
    const d = cam.z * projRows / (r + 0.5 - horizon);
    if (!(d > 0) || d > viewD) continue;
    const t = d / viewD, lvl = levelOf(t), dm = densMul(t);
    // the water plane sits RIVER_DEPTH below the street, so a ray through the
    // hole in the street plane carries further before it lands
    const dW = (cam.z + RIVER_DEPTH) * projRows / (r + 0.5 - horizon);
    // counters carry a worktop: a second plane at counter height, projected
    // the way the river projects its lower one - just upward instead
    const dC = (cam.z - 1.05) * projRows / (r + 0.5 - horizon);
    const rowOff = r * cols;
    for (let x = 0; x < cols; x++){
      const wx = cam.x + rayX[x] * d, wy = cam.y + rayY[x] * d;
      const ix = wx | 0, iy = wy | 0;
      if (wx < 0 || wy < 0 || ix >= MAP || iy >= MAP) continue;
      if (inside && dC > 0 && dC < d){
        const cwx = cam.x + rayX[x] * dC, cwy = cam.y + rayY[x] * dC;
        const cix = cwx | 0, ciy = cwy | 0;
        if (cwx >= 0 && cwy >= 0 && cix < MAP && ciy < MAP){
          const chh = tH[ciy * MAP + cix];
          if (chh > 0.95 && chh < 1.15){
            const tC = dC / viewD, dmC = densMul(tC);
            const fx2 = cwx - cix, fy2 = cwy - ciy;
            let dd = 0.62 + hash3(cix, ciy, 77) * 0.12;
            if (fx2 < 0.07 || fy2 < 0.07 || fx2 > 0.93 || fy2 > 0.93) dd = 0.85;
            const gC = Math.round(clamp(dd * dmC, 0, 1) * RMAX);
            const idxC = rowOff + x;
            dBuf[idxC] = dC; refBuf[idxC] = 0;
            if (gC){ gBuf[idxC] = gC; bBuf[idxC] = C.worktop; lBuf[idxC] = levelOf(tC); statCells++; }
            continue;
          }
        }
      }
      let uD = d, lv = lvl, dmm = dm;
      if (tType[iy * MAP + ix] === T_WATER){
        if (dW > viewD) continue;
        const wx2 = cam.x + rayX[x] * dW, wy2 = cam.y + rayY[x] * dW;
        const ix2 = wx2 | 0, iy2 = wy2 | 0;
        if (wx2 < 0 || wy2 < 0 || ix2 >= MAP || iy2 >= MAP) continue;
        const tw = dW / viewD; lv = levelOf(tw); dmm = densMul(tw); uD = dW;
        if (tType[iy2 * MAP + ix2] === T_WATER){
          floorSample(wx2, wy2, ix2, iy2);
        } else {                                   // the channel wall
          _wb = C.bank; _wd = 0.40 + hash3(ix2, iy2, 17) * 0.14; _wwet = 0;
        }
      } else {
        floorSample(wx, wy, ix, iy);
      }
      const g = Math.round(clamp(_wd * dmm, 0, 1) * RMAX);
      const idx = rowOff + x;
      dBuf[idx] = uD;
      refBuf[idx] = _wwet;
      if (g === 0) continue;
      gBuf[idx] = g; bBuf[idx] = _wb; lBuf[idx] = lv;
      statCells++;
    }
  }
}

/*------------------------- ceiling (interiors) -----------------------------
  The mirror of the floor pass: rows above the horizon inverse-project onto
  the plane z = INT_CEIL. Panel joints on the tile grid, a sparse lattice of
  tube lights bright enough for the bloom to catch. Walls draw afterwards
  and overwrite their span, exactly as they do over the floor.
----------------------------------------------------------------------------*/
function ceilingPass(){
  const cols = R.cols, rows = R.rows;
  const r1 = clamp(Math.floor(horizon), 0, rows);
  for (let r = 0; r < r1; r++){
    const d = (INT_CEIL - cam.z) * projRows / (horizon - (r + 0.5));
    if (!(d > 0) || d > viewD) continue;
    const t = d / viewD, lvl = levelOf(t), dm = densMul(t);
    const rowOff = r * cols;
    for (let x = 0; x < cols; x++){
      const wx = cam.x + rayX[x] * d, wy = cam.y + rayY[x] * d;
      const ix = wx | 0, iy = wy | 0;
      if (wx < 0 || wy < 0 || ix >= MAP || iy >= MAP) continue;
      let dd, bb;
      if (ix % 3 === 1 && iy % 3 === 1){
        dd = 0.92;
        bb = inside && inside.shop === 'dispensary' ? C.nGreen
           : inside && inside.shop === 'armory' ? C.camRed : C.nWhite;
      }
      else {
        dd = 0.22 + hash3(ix, iy, 51) * 0.08; bb = C.screen;
        if (wx - ix < 0.06 || wy - iy < 0.06) dd = 0.32;   // panel joints
      }
      const g = Math.round(clamp(dd * dm, 0, 1) * RMAX);
      const idx = rowOff + x;
      dBuf[idx] = d; refBuf[idx] = 0;
      if (!g) continue;
      gBuf[idx] = g; bBuf[idx] = bb; lBuf[idx] = lvl;
      statCells++;
    }
  }
}

/*----------------------------- facades -------------------------------------*/
// Interior walls: skirting, cornice, the odd poster - and the way out drawn
// as a real door, dark panel in a bright frame with an amber handle.
function interiorWall(b, gu, z, side, hitX, hitY){
  if (b.interior === 2){                              // counter / low furniture
    _wb = b.col;
    _wd = z > 1.0 ? 0.85 : 0.60 + hash3((gu * 3) | 0, 3, b.seed) * 0.1;
    if (z > 1.0) _wb = C.worktop;                     // just the rounded lip
    return;
  }
  // the way out, clamped to exactly the door tile's inner face - the door
  // outranks any shelf dressing, so no band ever paints across the exit
  if (side === 1 && Math.abs(hitY - b.doorY) < 0.08){
    const du = gu - b.doorX;                          // 0..1 across the door
    if (du >= 0 && du <= 1 && z < 2.25){
      if (du < 0.14 || du > 0.86){ _wb = C.signCase; _wd = 0.9; _wg = G_BAR; }
      else if (z > 2.05){ _wb = C.signCase; _wd = 0.9; }
      else if (z > 0.95 && z < 1.12 && du > 0.68 && du < 0.80){ _wb = C.nAmber; _wd = 1; }
      else { _wb = C.trunk; _wd = 0.72; }
      return;
    }
    if (du > -0.3 && du < 1.3){                       // no posters against the frame
      _wb = b.col; _wd = z < 0.42 ? 0.55 : 0.32;
      if (z < 0.42) _wb = C.trunk;
      return;
    }
  }
  if (inside && inside.shop && SHOP_FLAVOR[inside.shop] &&
      SHOP_FLAVOR[inside.shop].band !== undefined && z > 1.2 && z < 1.7){
    _wb = SHOP_FLAVOR[inside.shop].band; _wd = 0.8;   // the trade's shelf band
    return;
  }
  if (z < 0.42){ _wb = C.trunk; _wd = 0.55; }         // skirting board
  else if (z > INT_CEIL - 0.3){ _wb = C.signCase; _wd = 0.5; }   // cornice
  else {
    const col = Math.floor(gu * 2), hp = hash3(col, 7, b.seed);
    _wb = b.col; _wd = 0.30 + hash3((gu * 5) | 0, (z * 4) | 0, 13) * 0.07;
    if (hp < 0.16 && z > 1.15 && z < 2.1){            // a poster
      const u = gu * 2 - col;
      if (u > 0.2 && u < 0.8){ _wb = NEONC[((hp * 50) | 0) % NEONC.length]; _wd = 0.5; }
    }
  }
  if (side === 1) _wd *= 0.85;
}
function facade(b, gu, z, side, hh, hitX, hitY){
  _wg = -1;
  if (b.dome){ domeSurface(b, z, hitX, hitY); return; }
  if (b.interior){ interiorWall(b, gu, z, side, hitX, hitY); return; }
  // burned graffiti: a bright stencil piece holding on the wall for a few days
  const tg = tags[(hitY | 0) * MAP + (hitX | 0)];
  if (tg && z > 0.8 && z < 2.4){
    const art = TAG_ART[tg.art];
    if (art){
      const fu = (side === 0 ? hitY : hitX) % 1;
      const gc = Math.min(9, (((tg.seg + fu) / tg.spanN) * 10) | 0);
      const gr = Math.min(7, ((2.4 - z) / 1.6 * 8) | 0);
      const chq = art[gr][gc];
      if (chq !== '.'){
        const age = dayCount - tg.day;
        _wb = chq === '+' ? C.nCyan : C.nMag;
        _wd = age >= 2 ? 0.55 : 1;              // old pieces fade before they go
        return;
      }
    }
  }
  // the entrance, drawn where the interact point is - clamped to exactly the
  // door tile's face, with a band of plain wall around it so no window or
  // signage butts against the frame
  if (b.doorNX !== undefined && (side === 0 ? b.doorNX !== 0 : b.doorNY !== 0)){
    const face = side === 0 ? b.doorX + (b.doorNX > 0 ? 1 : 0)
                            : b.doorY + (b.doorNY > 0 ? 1 : 0);
    if (Math.abs((side === 0 ? hitX : hitY) - face) < 0.08){
      const du = gu - (side === 0 ? b.doorY : b.doorX);   // 0..1 across the door
      if (du >= 0 && du <= 1 && z < 2.25){
        if (du < 0.14 || du > 0.86){ _wd = 0.95; _wb = b.sign; _wg = G_BAR; }  // lit frame
        else if (z > 2.05){ _wd = 0.95; _wb = b.sign; }                       // lit lintel
        else if (z > 0.95 && z < 1.12 && du > 0.68 && du < 0.80){ _wd = 1; _wb = C.nAmber; }
        else { _wd = 0.72; _wb = C.trunk; }
        if (side === 1) _wd *= 0.8;
        return;
      }
      if (du > -0.3 && du < 1.3 && z < Math.ceil(2.26 / b.fh) * b.fh){
        _wd = side === 1 ? 0.45 : 0.56; _wb = b.col;      // clear margin
        return;
      }
    }
  }
  const fzf = z / b.fh, fz = Math.floor(fzf), zf = fzf - fz;
  const wu = gu * b.wpm, wcol = Math.floor(wu), wf = wu - wcol;
  let dens, base;
  if (z > hh - 0.34){                                   // parapet, often a crown
    dens = 0.94; base = b.crown >= 0 ? b.crown : b.col;
  } else if (b.stripe >= 0 && wcol % 6 === b.stripePh && wf > 0.40 && wf < 0.60){
    dens = 0.90; base = b.stripe;                       // vertical neon strip
  } else if (fz === 0){                                 // street level signage
    if (z > 0.30 && z < 1.70 && wf > 0.10 && wf < 0.90){ dens = 0.95; base = b.sign; }
    else { dens = 0.58; base = b.col; }
  } else if (wf > 0.18 && wf < 0.82 && zf > 0.24 && zf < 0.80){
    // Every window lives its own life: a personal period of 25-90 s, a fresh
    // lit roll each period (so rooms go dark and wake out of sync across the
    // city), and a tube that is about to die flickers out its last seconds.
    const h1 = hash3(b.seed, wcol, fz);                 // stable identity
    const per = 25 + h1 * 65;
    const tOff = worldTime + h1 * 997;                  // desync the clocks
    const bk = (tOff / per) | 0;
    const wid = wcol * 92821 + fz;
    let lit = hash3(wid, b.seed, bk) < b.litP;
    if (lit){
      // most windows simply switch off; once in a while one dies flickering
      if (per - (tOff - bk * per) < 1.8 &&
          hash3(wid, b.seed, bk + 1) >= b.litP &&
          hash3(wid, bk, 1337) < 0.14)                  // rare, for flavour
        lit = hash3((worldTime * 17) | 0, wcol, fz) < 0.55;
      else {
        // now and then one bulb per facade fails for a moment and sputters
        const fper = 9 + (b.seed % 7);                  // this building's rhythm
        const ft = worldTime + (b.seed % 89);
        const fep = (ft / fper) | 0;
        if (ft - fep * fper < 1.4 &&
            hash3(fep, b.seed, 5) < 0.6 &&
            ((wcol * 7 + fz * 13) & 31) === ((hash3(fep, b.seed, 9) * 32) | 0))
          lit = hash3((worldTime * 19) | 0, wcol, fz) < 0.6;
      }
    }
    if (lit){ dens = 0.98; base = h1 < b.litP * 0.28 ? b.winB : b.winA; }
    else { dens = 0.17; base = C.winDark; }             // lights off
  } else {
    dens = 0.56 + ((fz & 1) ? 0.05 : 0); base = b.col;
  }
  if (side === 1) dens *= 0.80;                                    // face shading
  _wd = dens; _wb = base;
}

/*--------------------- wall pass: one DDA ray per column -------------------*/
function wallPass(){
  const cols = R.cols, rows = R.rows, px = cam.x, py = cam.y;
  const hzRow = clamp(Math.floor(horizon), 0, rows - 1);
  for (let x = 0; x < cols; x++){
    const rdx = rayX[x], rdy = rayY[x];
    let mapX = Math.floor(px), mapY = Math.floor(py);
    const ddx = rdx === 0 ? 1e30 : Math.abs(1 / rdx);
    const ddy = rdy === 0 ? 1e30 : Math.abs(1 / rdy);
    let stepX, stepY, sdx, sdy;
    if (rdx < 0){ stepX = -1; sdx = (px - mapX) * ddx; } else { stepX = 1; sdx = (mapX + 1 - px) * ddx; }
    if (rdy < 0){ stepY = -1; sdy = (py - mapY) * ddy; } else { stepY = 1; sdy = (mapY + 1 - py) * ddy; }
    let ceilLimit = rows - 1, side = 0, guard = 0;
    statRays++;
    while (ceilLimit >= 0 && guard++ < 1700){
      if (sdx < sdy){ sdx += ddx; mapX += stepX; side = 0; }
      else          { sdy += ddy; mapY += stepY; side = 1; }
      const d = side === 0 ? sdx - ddx : sdy - ddy;
      if (d > viewD) break;
      if (mapX < 0 || mapY < 0 || mapX >= MAP || mapY >= MAP) break;
      const id = mapY * MAP + mapX, h = tH[id];
      if (h <= 0) continue;
      const unitRows = projRows / d;
      const rowB = horizon + cam.z * unitRows;
      const rowT = horizon + (cam.z - h) * unitRows;
      let r0 = Math.ceil(rowT - 0.5), r1 = Math.floor(rowB - 0.5);
      if (r0 < 0) r0 = 0;
      if (r1 > ceilLimit) r1 = ceilLimit;
      const b = buildings[tB[id]];
      if (r0 <= r1 && b){
        const gu = side === 0 ? py + d * rdy : px + d * rdx;
        const hitX = px + d * rdx, hitY = py + d * rdy;
        const t = d / viewD, lvl = levelOf(t), dm = densMul(t);
        // vertical corner posts at the real building edges
        const fu = gu - Math.floor(gu);
        let edge = false;
        if (!b.dome && (fu < 0.06 || fu > 0.94)){
          const back = fu < 0.5 ? -1 : 1;
          const nx = side === 0 ? mapX : mapX + back;
          const ny = side === 0 ? mapY + back : mapY;
          edge = !inMap(nx, ny) || tB[ny * MAP + nx] !== b.id ||
                 Math.abs(tH[ny * MAP + nx] - h) > 0.6;
        }
        for (let r = r0; r <= r1; r++){
          const idx = r * cols + x;
          const z = cam.z - (r + 0.5 - horizon) / unitRows;
          facade(b, gu, z, side, h, hitX, hitY);
          let g;
          if (_wg >= 0) g = _wg;
          else if (edge && lvl < 4) g = G_BAR;
          else g = Math.round(clamp(_wd * dm, 0, 1) * RMAX);
          gBuf[idx] = g; bBuf[idx] = _wb; lBuf[idx] = lvl; dBuf[idx] = d;
          refBuf[idx] = 0;
          srcBuf[idx] = EMISSIVE[_wb] ? 2 : 0;
          statCells++;
        }
      }
      // A tower's upper floors leave the frame long before its reflection
      // does. Screen-space mirroring alone loses them the moment you look
      // down, so the rows above the frame are mirrored straight from here.
      if (b){
        const mb = 2 * horizon + 2 * cam.z * unitRows;
        let s0 = Math.ceil(rowT - 0.5), s1 = Math.floor(rowB - 0.5);
        const lo = Math.ceil(mb - rows + 1), hi = Math.floor(mb - hzRow - 1);
        if (s0 < lo) s0 = lo;
        if (s1 > hi) s1 = hi;
        if (s1 > -1) s1 = -1;                    // only what is off the top
        if (s0 <= s1){
          const gu2 = side === 0 ? py + d * rdy : px + d * rdx;
          const hx2 = px + d * rdx, hy2 = py + d * rdy;
          const wobx = refWob[x];
          for (let r = s0; r <= s1; r++){
            const rr = Math.round(mb - r + wobx);
            if (rr <= hzRow || rr >= rows) continue;
            const j = rr * cols + x;
            if (!reflects(j)) continue;
            const z = cam.z - (r + 0.5 - horizon) / unitRows;
            facade(b, gu2, z, side, h, hx2, hy2);
            if (!EMISSIVE[_wb]) continue;
            const g2 = Math.round(clamp(_wd * 0.5, 0, 1) * RMAX);
            if (!g2) continue;
            gBuf[j] = g2; bBuf[j] = _wb;
            statCells++;
          }
        }
      }
      if (h >= cam.z){
        if (r0 - 1 < ceilLimit) ceilLimit = r0 - 1;
      } else {
        // A wall below eye level occludes only above its FAR top edge - the
        // rows between its near and far edge are its own visible top surface
        // (the worktop the floor pass draws), not cover for what is behind.
        const dExit = Math.min(sdx, sdy);
        const rFar = Math.ceil(horizon + (cam.z - h) * projRows / dExit - 0.5) - 1;
        if (rFar < ceilLimit) ceilLimit = rFar;
      }
    }
  }
}

/*----------------------------- billboards ----------------------------------*/
function drawSprite(sx, sy, zb, wW, wH, art, sb, sd, mirror, dyn){
  const relX = sx - cam.x, relY = sy - cam.y;
  const tY = relX * dirX + relY * dirY;
  if (tY < 0.30 || tY > viewD) return;
  const tX = (dirY * relX - dirX * relY) / planeLen;
  const cols = R.cols, rows = R.rows;
  const unitCols = (cols * 0.5 / planeLen) / tY;
  const unitRows = projRows / tY;
  const cc = cols * 0.5 * (1 + tX / tY);
  const wc = Math.max(0.6, wW * unitCols), hr = Math.max(0.6, wH * unitRows);
  const left = cc - wc * 0.5;
  const rowB = horizon + (cam.z - zb) * unitRows, rowT = rowB - hr;
  let c0 = Math.round(left), c1 = Math.round(left + wc) - 1; if (c1 < c0) c1 = c0;
  let r0 = Math.round(rowT),  r1 = Math.round(rowB) - 1;     if (r1 < r0) r1 = r0;
  if (c1 < 0 || c0 >= cols) return;
  if (c0 < 0) c0 = 0; if (c1 > cols - 1) c1 = cols - 1;
  const t = tY / viewD, lvl = levelOf(t), dm = densMul(t);
  const aw = art.w, ah = art.h, data = art.data;
  const invHs = 1 / Math.max(0.0001, hr);

  // the same for anything tall enough to leave the top of the frame
  {
    const mb = 2 * horizon + 2 * cam.z * unitRows;
    let s0 = r0, s1 = Math.min(r1, -1);
    const lo = Math.ceil(mb - rows + 1), hi = Math.floor(mb - hzRow - 1);
    if (s0 < lo) s0 = lo;
    if (s1 > hi) s1 = hi;
    if (s0 <= s1){
      for (let c = c0; c <= c1; c++){
        let u = clamp((c + 0.5 - left) / wc, 0, 0.9999);
        if (mirror) u = 0.9999 - u;
        const ax2 = (u * aw) | 0;
        const wobx = refWob[c];
        for (let r = s0; r <= s1; r++){
          const rr = Math.round(mb - r + wobx);
          if (rr <= hzRow || rr >= rows) continue;
          const j = rr * cols + c;
          if (!reflects(j)) continue;
          const v = clamp((r + 0.5 - rowT) * invHs, 0, 0.9999);
          const ai2 = ((v * ah) | 0) * aw + ax2;
          const role = data[ai2];
          if (role === 0) continue;
          let base, g0;
          if (art.lit){ base = art.cm[ai2]; g0 = Math.round(clamp(art.dn[ai2] * dm, 0, 1) * RMAX); }
          else {
            base = sb[role]; if (base < 0) base = dyn;
            g0 = Math.round(clamp(sd[role] * dm, 0, 1) * RMAX);
          }
          const ng = (g0 * (EMISSIVE[base] ? 0.55 : 0.42)) | 0;
          if (ng < 1) continue;
          gBuf[j] = ng; bBuf[j] = base; srcBuf[j] = 0;
          statCells++;
        }
      }
    }
  }

  if (r1 < 0 || r0 >= rows) return;
  if (r0 < 0) r0 = 0; if (r1 > rows - 1) r1 = rows - 1;
  for (let c = c0; c <= c1; c++){
    let u = clamp((c + 0.5 - left) / wc, 0, 0.9999);
    if (mirror) u = 0.9999 - u;
    const axp = (u * aw) | 0;
    for (let r = r0; r <= r1; r++){
      const idx = r * cols + c;
      if (dBuf[idx] < tY - 0.06) continue;
      const v = clamp((r + 0.5 - rowT) / hr, 0, 0.9999);
      const ai = ((v * ah) | 0) * aw + axp;
      const role = data[ai];
      if (role === 0) continue;
      let base, g;
      if (art.lit){                       // literal art: the exact character
        base = art.cm[ai];
        g = lvl < 4 ? art.g[ai] : Math.round(clamp(art.dn[ai] * dm, 0, 1) * RMAX);
      } else {
        base = sb[role]; if (base < 0) base = dyn;
        g = Math.round(clamp(sd[role] * dm, 0, 1) * RMAX);
      }
      if (g === 0) continue;
      gBuf[idx] = g; bBuf[idx] = base; lBuf[idx] = lvl; dBuf[idx] = tY;
      refBuf[idx] = 0;
      srcBuf[idx] = EMISSIVE[base] ? 2 : 1;
      statCells++;
    }
  }
}

// Props are static and there are tens of thousands of them across 4 km^2, so
// the sprite pass pulls only the buckets the view can reach.
const PSG = 16;
let psgW = 1, spriteGrid = [];
function indexSpriteProps(){
  psgW = Math.ceil(MAP / PSG);
  spriteGrid = [];
  for (let i = 0; i < psgW * psgW; i++) spriteGrid.push([]);
  for (const q of props){
    const gx = (q.x / PSG) | 0, gy = (q.y / PSG) | 0;
    if (gx >= 0 && gy >= 0 && gx < psgW && gy < psgW) spriteGrid[gy * psgW + gx].push(q);
  }
}
const _vis = [];
function visibleProps(){
  _vis.length = 0;
  const r = viewD + 6;
  const x0 = Math.max(0, ((cam.x - r) / PSG) | 0), x1 = Math.min(psgW - 1, ((cam.x + r) / PSG) | 0);
  const y0 = Math.max(0, ((cam.y - r) / PSG) | 0), y1 = Math.min(psgW - 1, ((cam.y + r) / PSG) | 0);
  for (let gy = y0; gy <= y1; gy++)
    for (let gx = x0; gx <= x1; gx++){
      const b = spriteGrid[gy * psgW + gx];
      for (let i = 0; i < b.length; i++) _vis.push(b[i]);
    }
  return _vis;
}


/*------------------------- volumetric models -------------------------------
  Not billboards, and not crossed planes either - actual solids. Each sprite
  is inflated into a voxel volume: every horizontal run of the artwork
  becomes a rounded (or square) cross-section with real depth, so a torso is
  a barrel, a leg is a post and a canopy is a blob. The volume is then ray
  marched per screen cell in the object's own local frame, which means it
  rotates with the thing it belongs to, occludes itself, occludes its
  neighbours, and takes the same depth buffer the walls write to. Faces are
  shaded by which side of a voxel the ray came through, the way the wall
  pass shades its two sides.
============================================================================*/
function voxelize(art, depthScale, round){
  const key = depthScale.toFixed(2) + (round ? 'r' : 'b');
  if (!art._vox) art._vox = {};
  if (art._vox[key]) return art._vox[key];
  const aw = art.w, ah = art.h, data = art.data;
  const vd = Math.max(2, Math.round(aw * depthScale));
  const vox = new Uint8Array(aw * vd * ah);
  for (let z = 0; z < ah; z++){
    let x = 0;
    while (x < aw){
      if (!data[z * aw + x]){ x++; continue; }
      let x1 = x;                                // one solid run of the row
      while (x1 + 1 < aw && data[z * aw + x1 + 1]) x1++;
      const cx = (x + x1 + 1) * 0.5, a = (x1 - x + 1) * 0.5;
      const b = Math.max(0.6, a * vd / Math.max(0.001, aw * depthScale));
      for (let xx = x; xx <= x1; xx++){
        const role = data[z * aw + xx];
        const nx = (xx + 0.5 - cx) / a;
        for (let y = 0; y < vd; y++){
          const ny = (y + 0.5 - vd * 0.5) / b;
          const solid = round ? (nx * nx + ny * ny <= 1.0) : (Math.abs(ny) <= 1.0);
          if (solid) vox[(z * vd + y) * aw + xx] = role;
        }
      }
      x = x1 + 1;
    }
  }
  // the artwork usually has empty margins - find the real extent so rays
  // are never marched through padding
  let x0 = aw, x1 = -1, y0 = vd, y1 = -1, z0 = ah, z1 = -1;
  for (let z = 0; z < ah; z++)
    for (let y = 0; y < vd; y++)
      for (let x = 0; x < aw; x++)
        if (vox[(z * vd + y) * aw + x]){
          if (x < x0) x0 = x; if (x > x1) x1 = x;
          if (y < y0) y0 = y; if (y > y1) y1 = y;
          if (z < z0) z0 = z; if (z > z1) z1 = z;
        }
  if (x1 < 0){ x0 = y0 = z0 = 0; x1 = aw - 1; y1 = vd - 1; z1 = ah - 1; }
  return (art._vox[key] = { aw, vd, ah, vox,
    fx0: x0 / aw, fx1: (x1 + 1) / aw,
    fy0: y0 / vd, fy1: (y1 + 1) / vd,
    fz0: z0 / ah, fz1: (z1 + 1) / ah });
}
const FACE_DIM = [1.0, 0.84, 1.14];             // side, front/back, top
function drawModel(ox, oy, zb, wW, hW, art, sb, sd, dyn, yaw, depthScale, boxy){
  const cols = R.cols, rows = R.rows;
  const relX = ox - cam.x, relY = oy - cam.y;
  const tC = relX * dirX + relY * dirY;
  if (tC < 0.15 || tC - 1 > viewD) return;
  const m = voxelize(art, depthScale, !boxy);
  const aw = m.aw, vd = m.vd, ah = m.ah, vox = m.vox;
  const dW = wW * depthScale;
  // the solid's true extent in its own frame
  const bu0 = -wW * 0.5 + wW * m.fx0, bu1 = -wW * 0.5 + wW * m.fx1;
  const bv0 = -dW * 0.5 + dW * m.fy0, bv1 = -dW * 0.5 + dW * m.fy1;
  const bz0 = hW * (1 - m.fz1), bz1 = hW * (1 - m.fz0);
  const rad = 0.5 * Math.max(bu1 - bu0, bv1 - bv0) +
              Math.max(Math.abs(bu0 + bu1), Math.abs(bv0 + bv1)) * 0.5;
  const tNear = Math.max(0.2, tC - rad);
  // the cells this solid can possibly touch
  const tX = (dirY * relX - dirX * relY) / planeLen;
  const ccC = cols * 0.5 * (1 + tX / tC);
  const halfC = rad * (cols * 0.5 / planeLen) / tNear;
  let c0 = Math.floor(ccC - halfC) - 1, c1 = Math.ceil(ccC + halfC) + 1;
  if (c1 < 0 || c0 >= cols) return;
  if (c0 < 0) c0 = 0; if (c1 > cols - 1) c1 = cols - 1;
  // a solid below eye level shows its top at its FAR edge and its base at
  // its near one, so the row span has to cover both ends of its depth
  const tFar = tC + rad;
  const eTop = cam.z - zb - bz1, eBot = cam.z - zb - bz0;
  const rA = horizon + eTop * projRows / tNear, rB = horizon + eTop * projRows / tFar;
  const rC = horizon + eBot * projRows / tNear, rD = horizon + eBot * projRows / tFar;
  let r0 = Math.floor(Math.min(rA, rB, rC, rD)) - 1;
  let r1 = Math.ceil(Math.max(rA, rB, rC, rD)) + 1;
  if (r1 < -rows || r0 >= rows) return;
  if (r0 < -rows) r0 = -rows; if (r1 > rows - 1) r1 = rows - 1;
  // a close, tall solid can cover the screen; drop its reflection rows
  // rather than dropping the solid itself
  if ((c1 - c0 + 1) * (r1 - r0 + 1) > 40000 && r0 < 0) r0 = 0;
  const cy = Math.cos(yaw), sy = Math.sin(yaw);
  // camera in the solid's own frame
  const ex = cam.x - ox, ey = cam.y - oy;
  const Ou =  ex * cy + ey * sy, Ov = -ex * sy + ey * cy, Oz = cam.z - zb;
  const hu = wW * 0.5, hv = dW * 0.5;   // voxel space still spans the full box
  const sxw = wW / aw, syw = dW / vd, szw = hW / ah;
  // sample finely up close, coarsely at range - nobody can see the
  // difference at thirty tiles and it is most of the cost
  const step = Math.min(sxw, syw, szw) * (0.7 + tC * 0.05);
  const tn = tC / viewD, lvl = levelOf(tn), dm = densMul(tn);
  const lit = art.lit;
  const tCap = Math.min(viewD, tC + rad + 1);
  for (let x = c0; x <= c1; x++){
    const rx = rayX[x], ry = rayY[x];
    const Du =  rx * cy + ry * sy, Dv = -rx * sy + ry * cy;
    // the width and depth slabs depend only on the column - solve them once
    let cu0 = 0.15, cu1 = tCap, colOk = 1;
    for (let ax = 0; ax < 2 && colOk; ax++){
      const o = ax === 0 ? Ou : Ov;
      const d = ax === 0 ? Du : Dv;
      const lo = ax === 0 ? bu0 : bv0, hi = ax === 0 ? bu1 : bv1;
      if (Math.abs(d) < 1e-9){ if (o < lo || o > hi) colOk = 0; continue; }
      let ta = (lo - o) / d, tb = (hi - o) / d;
      if (ta > tb){ const sw = ta; ta = tb; tb = sw; }
      if (ta > cu0) cu0 = ta;
      if (tb < cu1) cu1 = tb;
      if (cu0 > cu1) colOk = 0;
    }
    if (!colOk) continue;                       // this column misses entirely
    for (let r = r0; r <= r1; r++){
      const onScreen = r >= 0;
      const idx = onScreen ? r * cols + x : -1;
      const k = (r - horizon) / projRows;       // the ray's fall per unit depth
      const Dz = -k;
      let t0 = cu0, t1 = cu1;                   // only the height slab is left
      if (Math.abs(Dz) < 1e-9){ if (Oz < bz0 || Oz > bz1) continue; }
      else {
        let ta = (bz0 - Oz) / Dz, tb = (bz1 - Oz) / Dz;
        if (ta > tb){ const sw = ta; ta = tb; tb = sw; }
        if (ta > t0) t0 = ta;
        if (tb < t1) t1 = tb;
        if (t0 > t1) continue;
      }
      if (onScreen && dBuf[idx] < t0 - 0.02) continue;   // a wall already won
      const L = Math.hypot(rx, ry, k) || 1;
      const dt = step / L;
      let hit = -1, hx = 0, hy = 0, hz = 0, face = 0, ht = 0;
      let px = -1, py = -1, pz = -1;
      for (let t = t0 + dt * 0.5, n = 0; t <= t1 && n < 64; t += dt, n++){
        const u = Ou + Du * t, v = Ov + Dv * t, w = Oz + Dz * t;
        const ix = ((u + hu) / wW * aw) | 0;
        const iy = ((v + hv) / dW * vd) | 0;
        const iz = ((1 - w / hW) * ah) | 0;      // art row 0 is the top
        if (ix < 0 || ix >= aw || iy < 0 || iy >= vd || iz < 0 || iz >= ah){
          px = ix; py = iy; pz = iz; continue;
        }
        const role = vox[(iz * vd + iy) * aw + ix];
        if (!role){ px = ix; py = iy; pz = iz; continue; }
        hit = role; hx = ix; hy = iy; hz = iz;
        face = ix !== px ? 0 : iy !== py ? 1 : 2;
        ht = t;
        break;
      }
      if (hit < 0) continue;
      const t = ht;
      let base, dens;
      if (lit){
        const ai = hz * aw + hx;
        base = art.cm[ai]; dens = art.dn[ai];
      } else {
        base = sb[hit]; if (base < 0) base = dyn;
        dens = sd[hit];
      }
      const g = Math.round(clamp(dens * FACE_DIM[face] * dm, 0, 1) * RMAX);
      if (!g) continue;
      if (onScreen){
        if (dBuf[idx] < t - 0.02) continue;
        gBuf[idx] = g; bBuf[idx] = base; lBuf[idx] = lvl; dBuf[idx] = t;
        refBuf[idx] = 0;
        srcBuf[idx] = EMISSIVE[base] ? 2 : 1;
        statCells++;
      }
      // and what the wet street gives back
      const ur = projRows / t;
      const mb = 2 * horizon + 2 * cam.z * ur;
      const rr = Math.round(mb - r + refWob[x]);
      if (rr > hzRow && rr < rows){
        const j = rr * cols + x;
        if (reflects(j)){
          const ng = (g * (EMISSIVE[base] ? 0.55 : 0.42)) | 0;
          if (ng >= 1){ gBuf[j] = ng; bBuf[j] = base; srcBuf[j] = 0; statCells++; }
        }
      }
    }
  }
}

/*------------------------- plane helpers (signage) -------------------------
  A billboard turns to face you, which is why street furniture used to
  swivel as you walked past it. These are drawn the way the signs are: as
  fixed vertical planes standing in the world, intersected per column,
  depth-tested against the walls. Two crossed planes per object give it
  substance from every angle - look along one and the other is square on -
  so nothing rotates, nothing has to be squashed, and the perspective is
  the same one the buildings get.
============================================================================*/
function drawPlane(axis, plane, a0, a1, zb, hm, art, sb, sd, dyn, flip){
  const cols = R.cols, rows = R.rows;
  const camA = axis === 0 ? cam.x : cam.y;
  const far = camA < plane;                    // which face is toward you
  const aw = art.w, ah = art.h, data = art.data;
  const lit = art.lit;
  const span = a1 - a0;
  if (span <= 0) return;
  const invLen = 1 / span;
  // only walk the columns the plane can actually cover
  let x0 = 0, x1 = cols - 1;
  {
    const ex = [], ey = [];
    if (axis === 0){ ex.push(plane, plane); ey.push(a0, a1); }
    else { ex.push(a0, a1); ey.push(plane, plane); }
    let lo = 1e9, hi = -1e9, ok = 1;
    for (let i = 0; i < 2; i++){
      const rx = ex[i] - cam.x, ry = ey[i] - cam.y;
      const tY = rx * dirX + ry * dirY;
      if (tY < 0.25){ ok = 0; break; }
      const tX = (dirY * rx - dirX * ry) / planeLen;
      const cc = cols * 0.5 * (1 + tX / tY);
      if (cc < lo) lo = cc;
      if (cc > hi) hi = cc;
    }
    if (ok){
      x0 = Math.max(0, Math.floor(lo) - 1);
      x1 = Math.min(cols - 1, Math.ceil(hi) + 1);
      if (x1 < x0) return;
    }
  }
  for (let x = x0; x <= x1; x++){
    const rp = axis === 0 ? rayX[x] : rayY[x];
    if (rp === 0) continue;
    const t = (plane - camA) / rp;
    if (t < 0.25 || t > viewD) continue;
    const hitB = axis === 0 ? cam.y + rayY[x] * t : cam.x + rayX[x] * t;
    let u = (hitB - a0) * invLen;
    if (u < 0 || u >= 1) continue;
    if (far !== !!flip) u = 0.9999 - u;         // the back face reads mirrored
    const ur = projRows / t;
    const rowB = horizon + (cam.z - zb) * ur;
    const rowT = rowB - hm * ur;
    let r0 = Math.round(rowT), r1 = Math.round(rowB) - 1;
    if (r1 < r0) r1 = r0;
    const tn = t / viewD, lvl = levelOf(tn), dm = densMul(tn);
    const axp = Math.min(aw - 1, (u * aw) | 0);
    const invH = 1 / Math.max(0.0001, rowB - rowT);
    // the reflection of anything that leaves the top of the frame
    {
      const mb = 2 * horizon + 2 * cam.z * ur;
      let s0 = r0, s1 = Math.min(r1, -1);
      const lo2 = Math.ceil(mb - rows + 1), hi2 = Math.floor(mb - hzRow - 1);
      if (s0 < lo2) s0 = lo2;
      if (s1 > hi2) s1 = hi2;
      if (s0 <= s1){
        const wobx = refWob[x];
        for (let r = s0; r <= s1; r++){
          const rr = Math.round(mb - r + wobx);
          if (rr <= hzRow || rr >= rows) continue;
          const j = rr * cols + x;
          if (!reflects(j)) continue;
          const v = clamp((r + 0.5 - rowT) * invH, 0, 0.9999);
          const ai = ((v * ah) | 0) * aw + axp;
          const role = data[ai];
          if (!role) continue;
          let base, g0;
          if (lit){ base = art.cm[ai]; g0 = Math.round(clamp(art.dn[ai] * dm, 0, 1) * RMAX); }
          else {
            base = sb[role]; if (base < 0) base = dyn;
            g0 = Math.round(clamp(sd[role] * dm, 0, 1) * RMAX);
          }
          const ng = (g0 * (EMISSIVE[base] ? 0.55 : 0.42)) | 0;
          if (ng < 1) continue;
          gBuf[j] = ng; bBuf[j] = base; srcBuf[j] = 0;
          statCells++;
        }
      }
    }
    if (r1 < 0 || r0 >= rows) continue;
    if (r0 < 0) r0 = 0;
    if (r1 > rows - 1) r1 = rows - 1;
    for (let r = r0; r <= r1; r++){
      const idx = r * cols + x;
      if (dBuf[idx] < t - 0.02) continue;       // a wall in front wins
      const v = clamp((r + 0.5 - rowT) * invH, 0, 0.9999);
      const ai = ((v * ah) | 0) * aw + axp;
      const role = data[ai];
      if (!role) continue;
      let base, g;
      if (lit){ base = art.cm[ai]; g = Math.round(clamp(art.dn[ai] * dm, 0, 1) * RMAX); }
      else {
        base = sb[role]; if (base < 0) base = dyn;
        g = Math.round(clamp(sd[role] * dm, 0, 1) * RMAX);
      }
      if (!g) continue;
      gBuf[idx] = g; bBuf[idx] = base; lBuf[idx] = lvl; dBuf[idx] = t;
      refBuf[idx] = 0;
      srcBuf[idx] = EMISSIVE[base] ? 2 : 1;
      statCells++;
    }
  }
}
/* two crossed planes: substance from any angle, fixed in the world */
function drawCross(cx, cy, zb, wW, wH, art, sb, sd, dyn, flip){
  const hw = wW * 0.5;
  drawPlane(0, cx, cy - hw, cy + hw, zb, wH, art, sb, sd, dyn, flip);
  drawPlane(1, cy, cx - hw, cx + hw, zb, wH, art, sb, sd, dyn, flip);
}
/* a box with a different face along each axis - what a car actually is */
function drawBox(cx, cy, zb, lenA, lenB, hW, artSide, artEnd, sb, sd, dyn, axis, flip){
  const ha = lenA * 0.5, hb = lenB * 0.5;
  if (axis === 0){                              // travelling along x
    drawPlane(1, cy, cx - ha, cx + ha, zb, hW, artSide, sb, sd, dyn, flip);
    drawPlane(0, cx, cy - hb, cy + hb, zb, hW, artEnd, sb, sd, dyn, flip);
  } else {
    drawPlane(0, cx, cy - ha, cy + ha, zb, hW, artSide, sb, sd, dyn, flip);
    drawPlane(1, cy, cx - hb, cx + hb, zb, hW, artEnd, sb, sd, dyn, flip);
  }
}

/* how solid each thing is: depth as a fraction of its width, and whether
   the cross-section is rounded (bodies, poles, foliage) or square
   (furniture, crates, machines) */
const MODEL_DEPTH = [];
const MODEL_BOXY = [];
const MODEL_TURN = [];                        // extra quarter turns, per kind
(function(){
  const set = (k, d, b) => { MODEL_DEPTH[k] = d; MODEL_BOXY[k] = b; };
  set(PK_LAMP, 1.0, 0);   set(PK_TREE, 1.0, 0);    set(PK_HYDR, 1.0, 0);
  set(PK_TLIGHT, 0.9, 0); set(PK_BIN, 0.95, 0);    set(PK_RAIL, 0.5, 1);
  set(PK_STALL, 0.8, 1);  set(PK_BENCH, 0.75, 1);  set(PK_CAM, 0.9, 1);
  set(PK_PLAY, 0.35, 1);  set(PK_METRO, 0.8, 1);   set(PK_APPLE, 1.0, 0);
  set(PK_TURBINE, 0.5, 0);set(PK_ITEM, 0.9, 1);    set(PK_SAKURA, 1.0, 0);
  set(PK_CROP, 0.9, 0);   set(PK_ROCK, 1.0, 0);    set(PK_STAIR, 0.9, 1);
  set(PK_RACK, 0.6, 1);
  MODEL_TURN[PK_BENCH] = Math.PI / 2;         // benches run along the kerb
  MODEL_TURN[PK_STALL] = Math.PI / 2;         // carts open onto the pavement
})();
function propYaw(o){                          // square to the nearer roadway
  const rx = ((o.x % P) + P) % P, ry = ((o.y % P) + P) % P;
  const dx = rx < RW ? 0 : Math.min(rx - RW, P - rx);
  const dy = ry < RW ? 0 : Math.min(ry - RW, P - ry);
  return dx <= dy ? 0 : Math.PI / 2;
}
const drawList = [];
const HIT_SB = new Int16Array(NROLE).fill(C.nWhite);   // struck: white silhouette
const WIND_SB = new Int16Array(NROLE).fill(C.camRed);  // winding up: red tell
function spritePass(){
  drawList.length = 0;
  const MD = viewD;
  for (let i = 0; i < cars.length; i++){
    const c = cars[i];
    const rx = c.x - cam.x, ry = c.y - cam.y;
    const f = rx * dirX + ry * dirY;
    if (f < 0.3 || f > MD) continue;
    if (Math.abs(dirY * rx - dirX * ry) > f * planeLen + 6) continue;
    drawList.push({ d: f, k: 0, o: c });
  }
  for (let i = 0; i < peds.length; i++){
    const p = peds[i];
    const rx = p.x - cam.x, ry = p.y - cam.y;
    const f = rx * dirX + ry * dirY;
    if (f < 0.3 || f > MD) continue;
    if (Math.abs(dirY * rx - dirX * ry) > f * planeLen + 2) continue;
    drawList.push({ d: f, k: 1, o: p });
  }
  for (let i = 0; i < actors.length; i++){
    const a = actors[i];
    const rx = a.x - cam.x, ry = a.y - cam.y;
    const f = rx * dirX + ry * dirY;
    if (f < 0.3 || f > MD) continue;
    if (Math.abs(dirY * rx - dirX * ry) > f * planeLen + 2) continue;
    drawList.push({ d: f, k: 1, o: a });       // drawn exactly like a pedestrian
  }
  for (let i = 0; i < fxs.length; i++){
    const s = fxs[i];
    const rx = s.x - cam.x, ry = s.y - cam.y;
    const f = rx * dirX + ry * dirY;
    if (f < 0.3 || f > MD) continue;
    drawList.push({ d: f, k: 3, o: s });
  }
  const vp = visibleProps();
  for (let i = 0; i < vp.length; i++){
    const p = vp[i];
    const rx = p.x - cam.x, ry = p.y - cam.y;
    const f = rx * dirX + ry * dirY;
    if (f < 0.3 || f > MD || f > 170) continue;   // sub-cell past 170 anyway
    if (Math.abs(dirY * rx - dirX * ry) > f * planeLen + 3) continue;
    drawList.push({ d: f, k: 2, o: p });
  }
  drawList.sort((a, b) => b.d - a.d);          // far to near
  statSprites = drawList.length;
  for (let i = 0; i < drawList.length; i++){
    const it = drawList[i], o = it.o;
    if (it.k === 0){
      if (cam.riding === o) continue;
      // the side profile extruded across the car's own width
      drawModel(o.x, o.y, o.z, o.len, 1.55, ART.carSide, o.sb, o.sd, 0,
                Math.atan2(o.dy, o.dx), o.wid / o.len, 1);
    } else if (it.k === 1){
      // a struck body flashes white; a body winding up to hit you glows red
      const sbUse = o.hitT > 0 ? HIT_SB : (o.windup > 0 ? WIND_SB : o.sb);
      // a body, turned the way it is walking - the legs are real posts
      const fy = Math.atan2(o.dy, o.dx) + Math.PI / 2;
      if (o.sit){
        drawModel(o.x, o.y, 0, 0.6, 1.15, ART.pedSit, sbUse, o.sd, 0, fy, 0.85, 0);
      } else {
        const fr = o.moving && ((o.phase | 0) & 1) ? 1 : 0;
        drawModel(o.x, o.y, 0, 0.62, 1.76, ART.ped[fr], sbUse, o.sd, 0, fy, 0.85, 0);
      }
    } else if (it.k === 3){
      drawSprite(o.x, o.y, o.z, 0.36, 0.32, ART.spark,
                 SPARK_SL.base, SPARK_SL.dens, false, C.nAmber);
    } else {
      let def = PROPDEF[o.k];
      let dyn = 0;
      if (o.k === PK_LAMP){
        dyn = o.dead ? C.tire : LAMPC[(o.s * LAMPC.length) | 0];
      } else if (o.k === PK_STALL){
        // flavour by district: the strip leans ramen, homes lean produce,
        // downtown and the belt lean tech
        const dn2 = o.dist !== undefined ? o.dist : districtAt(o.x | 0, o.y | 0);
        const bias = (dn2 === D_STRIP || dn2 === D_RED) ? 0 : (dn2 === D_RES || dn2 === D_SUB || dn2 === D_RURAL) ? 1 : 2;
        def = STALL_VARIANTS[(((o.s * 5) | 0) + bias) % 3];
        dyn = NEONC[(o.s * NEONC.length) | 0];
      } else if (o.k === PK_METRO){
        dyn = C.nGreen;
      } else if (o.k === PK_TURBINE){
        dyn = ((worldTime * 0.9 + o.s * 6) % 1) < 0.5 ? C.nWhite : C.rail;
      } else if (o.k === PK_CAM){
        dyn = o.dead ? C.tire                   // a stump: dark, blind, honest
          : jamT > 0                            // jammed cams stutter in a panic
          ? (((worldTime * 7 + o.s * 3) % 1) < 0.3 ? C.nWhite : C.dataDk)
          : ((worldTime * 1.3 + o.s * 7) % 1) < 0.5 ? C.camRed : C.dataDk;
      } else if (o.k === PK_ITEM){
        dyn = ITEMS[o.item].pcol;
      }
      const pz = (o.z || 0) +                          // pickups hover and bob
                 (o.k === PK_ITEM ? 0.14 + Math.sin(worldTime * 2.2 + o.x * 3) * 0.06 : 0);
      if (o.yaw === undefined) o.yaw = propYaw(o) + (MODEL_TURN[o.k] || 0);
      const dep = MODEL_DEPTH[o.k] !== undefined ? MODEL_DEPTH[o.k] : 0.9;
      drawModel(o.x, o.y, pz, def.w, def.h, def.art, def.sl.base, def.sl.dens,
                dyn, o.yaw, dep, MODEL_BOXY[o.k] ? 1 : 0);
    }
  }
}

/*----------------------------- readable signage ----------------------------
  Anchored in the world, drawn in screen space at one character per cell, so a
  sign stays sharp at any distance instead of smearing across the facade.
============================================================================*/
// A sign is a flat panel fixed in a wall plane, so it is drawn the way a wall
// is: intersect each column's ray with the plane and read across the artwork.
// Perspective then foreshortens it for free, and it can never turn to face you.
function drawSignPlane(sg){
  const cols = R.cols, rows = R.rows;
  const camA = sg.axis === 0 ? cam.x : cam.y;
  if ((camA - sg.plane) * sg.n <= 0.05) return;          // behind it, or edge on
  const art = sg.art, aw = art.w, ah = art.h, data = art.data;
  const invLen = 1 / (sg.a1 - sg.a0);
  for (let x = 0; x < cols; x++){
    const rp = sg.axis === 0 ? rayX[x] : rayY[x];
    if (rp === 0) continue;
    const t = (sg.plane - camA) / rp;
    if (t < 0.25 || t > viewD) continue;
    const hitB = sg.axis === 0 ? cam.y + rayY[x] * t : cam.x + rayX[x] * t;
    const u = (hitB - sg.a0) * invLen;
    if (u < 0 || u >= 1) continue;
    const ur = projRows / t;
    const rowB = horizon + (cam.z - sg.z) * ur;
    const rowT = rowB - sg.hm * ur;
    let r0 = Math.round(rowT), r1 = Math.round(rowB) - 1;
    if (r1 < r0) r1 = r0;
    const tn = t / viewD, lvl = levelOf(tn), dm = densMul(tn);
    const axp = Math.min(aw - 1, (u * aw) | 0);
    const invH = 1 / Math.max(0.0001, rowB - rowT);

    // A sign mounted high leaves the top of the frame as soon as you tilt
    // down, but its reflection does not. Mirror the rows above the frame
    // straight from here, the same way the wall pass does.
    {
      const mb = 2 * horizon + 2 * cam.z * ur;
      let s0 = r0, s1 = Math.min(r1, -1);
      const lo = Math.ceil(mb - rows + 1), hi = Math.floor(mb - hzRow - 1);
      if (s0 < lo) s0 = lo;
      if (s1 > hi) s1 = hi;
      if (s0 <= s1){
        const wobx = refWob[x];
        for (let r = s0; r <= s1; r++){
          const rr = Math.round(mb - r + wobx);
          if (rr <= hzRow || rr >= rows) continue;
          const j = rr * cols + x;
          if (!reflects(j)) continue;
          const v = clamp((r + 0.5 - rowT) * invH, 0, 0.9999);
          const role = data[((v * ah) | 0) * aw + axp];
          if (!role) continue;
          const base = sg.sb[role];
          const g0 = Math.round(clamp(sg.sd[role] * dm, 0, 1) * RMAX);
          const ng = (g0 * (EMISSIVE[base] ? 0.55 : 0.42)) | 0;
          if (ng < 1) continue;
          gBuf[j] = ng; bBuf[j] = base; srcBuf[j] = 0;
          statCells++;
        }
      }
    }

    if (r1 < 0 || r0 >= rows) continue;
    if (r0 < 0) r0 = 0;
    if (r1 > rows - 1) r1 = rows - 1;
    for (let r = r0; r <= r1; r++){
      const idx = r * cols + x;
      if (dBuf[idx] < t - 0.02) continue;
      const v = clamp((r + 0.5 - rowT) * invH, 0, 0.9999);
      const role = data[((v * ah) | 0) * aw + axp];
      if (!role) continue;
      const g = Math.round(clamp(sg.sd[role] * dm, 0, 1) * RMAX);
      if (!g) continue;
      gBuf[idx] = g; bBuf[idx] = sg.sb[role]; lBuf[idx] = lvl; dBuf[idx] = t;
      refBuf[idx] = 0;
      srcBuf[idx] = EMISSIVE[sg.sb[role]] ? 2 : 1;
      statCells++;
    }
  }
}
function signPass(){
  for (let i = 0; i < signs.length; i++){
    const sg = signs[i];
    const rx = sg.x - cam.x, ry = sg.y - cam.y;
    if (rx < -viewD || rx > viewD || ry < -viewD || ry > viewD) continue;
    const d = rx * dirX + ry * dirY;
    if (d < 0.3 || d > viewD || d > 130) continue;       // unreadable past 130
    if (rx * sg.nx + ry * sg.ny > 0) continue;           // facing away
    if (Math.abs(dirY * rx - dirX * ry) > d * planeLen + sg.wm + 2) continue;
    if (sg.blink && ((worldTime / sg.blink) % 1) < 0.26) continue;
    drawSignPlane(sg);
  }
}

/*--------------------- screen-space reflections in wet tarmac --------------
  A surface at height z reflects to row  2*horizon + 2*camZ*unitRows - r,
  which is just the mirror of the wall row about the ground plane.
============================================================================*/
function reflects(j){                          // is this cell a mirror right now?
  const rf = refBuf[j];
  return rf === 2 || (rf === 1 && weather !== 0);
}
function reflectPass(){
  const cols = R.cols, rows = R.rows;
  const hz = clamp(Math.floor(horizon), 0, rows - 1);
  // A person is 1.76 tall against a 1.62 eye height, so nearly all of them
  // sits BELOW the horizon - scanning only the sky half would mirror towers
  // and neon but never anyone standing in front of you. The whole column is
  // swept instead, and srcBuf keeps it to things worth mirroring.
  for (let x = 0; x < cols; x++){
    const wob = refWob[x];
    for (let r = 0; r < rows; r++){
      const idx = r * cols + x;
      const g = gBuf[idx];
      if (!g) continue;
      const d = dBuf[idx];
      if (d > 60) continue;
      const sv = srcBuf[idx];
      if (!sv) continue;
      const rr = Math.round(2 * horizon + 2 * cam.z * (projRows / d) - r + wob);
      if (rr <= hz || rr >= rows) continue;
      const j = rr * cols + x;
      if (!reflects(j)) continue;
      // a ramp glyph dims by stepping down the ramp; a letter has to stay a
      // letter or the index arithmetic turns it into punctuation
      // light mirrors brighter than a silhouette does
      const fall = sv === 2 ? 0.55 : 0.42;
      let ng;
      if (g > RMAX) ng = g;
      else { ng = (g * fall) | 0; if (ng < 1) continue; }
      gBuf[j] = ng; bBuf[j] = bBuf[idx]; srcBuf[j] = 0;
      statCells++;
    }
  }
}

/*------------------------------- rain --------------------------------------*/
function rainPass(){
  if (weather !== 1 && weather !== 2) return;   // fog is quiet
  const cols = R.cols, rows = R.rows;
  const perCol = weather === 2 ? 3 : 2;
  for (let x = 0; x < cols; x++){
    for (let k = 0; k < perCol; k++){
      const h1 = hash3(x, k, 5);
      const y = (h1 * rows + worldTime * (24 + h1 * 40)) % rows;
      const r = y | 0;
      const xx = (x + ((y * 0.22) | 0)) % cols;
      const i0 = r * cols + xx;
      gBuf[i0] = G_SLASH; bBuf[i0] = C.nWhite; lBuf[i0] = 3; srcBuf[i0] = 0;
      if (r + 1 < rows && xx > 0){
        const i1 = (r + 1) * cols + xx - 1;
        gBuf[i1] = G_TICK; bBuf[i1] = C.nWhite; lBuf[i1] = 5; srcBuf[i1] = 0;
      }
    }
  }
}

/*------------------------------- bloom -------------------------------------
  Two taps. Each is a downscale, cubed to crush everything that is not neon,
  then added back with 'lighter' - the upscale is the blur.
============================================================================*/
function initBloom(){
  bloomCv = [];
  for (const [sh, al] of [[3, 0.50], [5, 0.75]]){
    const w = Math.max(2, R.W >> sh), h = Math.max(2, R.H >> sh);
    const a = document.createElement('canvas'), b = document.createElement('canvas');
    a.width = w; a.height = h; b.width = w; b.height = h;
    bloomCv.push({ a, b, w, h, al, actx: a.getContext('2d'), bctx: b.getContext('2d') });
  }
}
function bloomPass(){
  if (!bloomOn) return;
  ctx.save();
  for (let i = 0; i < bloomCv.length; i++){
    const t = bloomCv[i], ac = t.actx, bc = t.bctx;
    ac.globalCompositeOperation = 'source-over';
    ac.clearRect(0, 0, t.w, t.h);
    ac.imageSmoothingEnabled = true;
    ac.drawImage(cv, 0, 0, R.W, R.H, 0, 0, t.w, t.h);
    bc.globalCompositeOperation = 'source-over';
    bc.clearRect(0, 0, t.w, t.h);
    bc.imageSmoothingEnabled = true;
    bc.drawImage(t.a, 0, 0);
    bc.globalCompositeOperation = 'multiply';
    bc.drawImage(t.a, 0, 0);
    bc.drawImage(t.a, 0, 0);
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = t.al * (1 + smokeGlow * 1.1);
    ctx.imageSmoothingEnabled = true;
    ctx.drawImage(t.b, 0, 0, t.w, t.h, 0, 0, R.W, R.H);
  }
  ctx.restore();
  ctx.imageSmoothingEnabled = false;
}

/*========================= 14c. GPU PRESENTATION ===========================
  Every geometry pass still fills gBuf / bBuf / lBuf exactly as before. Only
  the way those cells reach the screen changes: one instanced draw for the
  whole character grid instead of one drawImage per lit cell. Measured at max
  resolution that is 0.7 ms against 75 ms.

  The glyph atlas holds shapes only - white on transparent, one row per
  distance level plus a row of full ASCII for the HUD - and the final colour
  rides along as a per-instance byte quad, so nothing has to be re-baked when
  the time of day changes.
============================================================================*/
let GL = null;
const VS_FULL = `#version 300 es
out vec2 vT;
void main(){
  // one oversized triangle: the vertices sit outside the viewport so the
  // visible area is fully covered, and vT lands on 0..1 across the screen
  vec2 p = vec2(float((gl_VertexID << 1) & 2), float(gl_VertexID & 2));
  vT = p;
  gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0);
}`;
const FS_BG = `#version 300 es
precision mediump float;
in vec2 vT; out vec4 o;
uniform vec3 uSky, uMid, uFog, uGround; uniform float uHz;
void main(){
  float t = 1.0 - vT.y;
  float a = max(0.001, uHz - 0.16);
  vec3 c;
  if (t < a) c = mix(uSky, uMid, t / a);
  else if (t < uHz) c = mix(uMid, uFog, (t - a) / max(0.001, uHz - a));
  else c = mix(uFog, uGround, (t - uHz) / max(0.001, 1.0 - uHz));
  o = vec4(c, 1.0);
}`;
const VS_GLYPH = `#version 300 es
in vec3 aCell;            // cell index, glyph, atlas row
in vec4 aCol;             // final colour, already faded
uniform vec2 uGrid, uCell, uOrigin, uRes, uAtlas;
out vec2 vUV; out vec4 vCol;
void main(){
  vec2 corner = vec2(float(gl_VertexID & 1), float((gl_VertexID >> 1) & 1));
  vec2 cxy = vec2(mod(aCell.x, uGrid.x), floor(aCell.x / uGrid.x));
  vec2 px = uOrigin + (cxy + corner) * uCell;
  vec2 ndc = px / uRes * 2.0 - 1.0;
  gl_Position = vec4(ndc.x, -ndc.y, 0.0, 1.0);
  vUV = vec2((aCell.y + corner.x) / uAtlas.x, (aCell.z + corner.y) / uAtlas.y);
  vCol = aCol;
}`;
const FS_GLYPH = `#version 300 es
precision mediump float;
in vec2 vUV; in vec4 vCol; out vec4 o;
uniform sampler2D uTex;
void main(){
  float a = texture(uTex, vUV).a;
  if (a < 0.01) discard;
  o = vec4(vCol.rgb, a * vCol.a);
}`;
const VS_QUAD = `#version 300 es
uniform vec4 uRect; uniform vec2 uRes;
void main(){
  vec2 corner = vec2(float(gl_VertexID & 1), float((gl_VertexID >> 1) & 1));
  vec2 px = uRect.xy + corner * uRect.zw;
  vec2 ndc = px / uRes * 2.0 - 1.0;
  gl_Position = vec4(ndc.x, -ndc.y, 0.0, 1.0);
}`;
const FS_QUAD = `#version 300 es
precision mediump float;
uniform vec4 uColor; out vec4 o;
void main(){ o = uColor; }`;
const FS_POST = `#version 300 es
precision mediump float;
in vec2 vT; out vec4 o;
uniform sampler2D uTex; uniform float uBright;
void main(){
  vec3 c = texture(uTex, vT).rgb;
  if (uBright > 0.5) c = c * c * c;      // crush everything that is not neon
  o = vec4(c, 1.0);
}`;

function glInit(){
  let gl = null;
  try {
    gl = glv.getContext('webgl2', { alpha: false, antialias: false, depth: false,
                                    stencil: false, powerPreference: 'high-performance' });
  } catch (e){ gl = null; }
  if (!gl) return null;
  const mkShader = (t, src) => {
    const sh = gl.createShader(t); gl.shaderSource(sh, src); gl.compileShader(sh);
    if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(sh));
    return sh;
  };
  const mkProg = (v, f) => {
    const pr = gl.createProgram();
    gl.attachShader(pr, mkShader(gl.VERTEX_SHADER, v));
    gl.attachShader(pr, mkShader(gl.FRAGMENT_SHADER, f));
    gl.linkProgram(pr);
    if (!gl.getProgramParameter(pr, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(pr));
    return pr;
  };
  const G = { gl };
  try {
    G.pBG = mkProg(VS_FULL, FS_BG);
    G.pGlyph = mkProg(VS_GLYPH, FS_GLYPH);
    G.pQuad = mkProg(VS_QUAD, FS_QUAD);
    G.pPost = mkProg(VS_FULL, FS_POST);
  } catch (e){ return null; }
  G.uBG = {};
  for (const k of ['uSky', 'uMid', 'uFog', 'uGround', 'uHz']) G.uBG[k] = gl.getUniformLocation(G.pBG, k);
  G.uG = {};
  for (const k of ['uGrid', 'uCell', 'uOrigin', 'uRes', 'uAtlas', 'uTex']) G.uG[k] = gl.getUniformLocation(G.pGlyph, k);
  G.uQ = {};
  for (const k of ['uRect', 'uRes', 'uColor']) G.uQ[k] = gl.getUniformLocation(G.pQuad, k);
  G.uP = {};
  for (const k of ['uTex', 'uBright']) G.uP[k] = gl.getUniformLocation(G.pPost, k);
  G.vao = gl.createVertexArray();
  G.ibuf = gl.createBuffer();
  G.tex = gl.createTexture();
  G.empty = gl.createVertexArray();
  gl.disable(gl.DEPTH_TEST);
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
  return G;
}

// shapes only: LV distance rows plus one full-ASCII row for the HUD
const GL_COLS = 95;
function glBuildAtlas(){
  const gl = GL.gl, cw = R.cellW, ch = R.cellH;
  const cn = document.createElement('canvas');
  cn.width = GL_COLS * cw; cn.height = (LV + 1) * ch;
  const g = cn.getContext('2d');
  g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillStyle = '#fff';
  const fbase = Math.min(ch * 0.99, cw / 0.575);
  for (let l = 0; l < LV; l++){
    g.font = (LV_BOLD[l] ? 'bold ' : '') + (fbase * LV_SCALE[l]).toFixed(2) + 'px ' + FONT;
    for (let i = 1; i < CHARS.length; i++) g.fillText(CHARS[i], i * cw + cw * 0.5, l * ch + ch * 0.5);
  }
  g.font = 'bold ' + (fbase * 0.94).toFixed(2) + 'px ' + FONT;
  for (let i = 1; i < GL_COLS; i++)
    g.fillText(String.fromCharCode(32 + i), i * cw + cw * 0.5, LV * ch + ch * 0.5);
  gl.bindTexture(gl.TEXTURE_2D, GL.tex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, cn);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
}

// final colour per (material, level), packed once per palette change
let glPal = null;
function glBuildPalette(){
  const T = curTime();
  const n = NBASE + HUDC.length;
  glPal = new Uint32Array(n * (LV + 1));
  for (let b = 0; b < NBASE; b++){
    const c = BASE[b];
    for (let l = 0; l < LV; l++){
      const f = LV_FADE[l] * fogScale();
      const dim = 1 - 0.22 * f;
      const sat = (CFG.timeMode === 2 ? 1.5 : 1) * drugFx('sat', 1);
      const hueK = drugFx('hue', 0);
      const hueM = (hueK ? hueK * (0.25 + 0.75 * (0.5 + 0.5 * Math.sin(worldTime * 0.35))) : 0)
                 + drugFx('hueC', 0);
      const warm = drugFx('warm', 0);
      let r0 = c[0] * dim * T.amb, g0 = c[1] * dim * T.amb, b0 = c[2] * dim * T.amb;
      if (sat !== 1){
        const lum = r0 * 0.3 + g0 * 0.59 + b0 * 0.11;
        r0 = lum + (r0 - lum) * sat; g0 = lum + (g0 - lum) * sat; b0 = lum + (b0 - lum) * sat;
      }
      if (warm){ r0 *= 1 + 0.15 * warm; b0 *= 1 - 0.12 * warm; }
      if (hueM){
        const hm2 = hueM * (1 + Math.max(0, 1 - T.amb) * 1.2);
        const r1 = r0 + (g0 - r0) * hm2, g1 = g0 + (b0 - g0) * hm2, b1 = b0 + (r0 - b0) * hm2;
        r0 = r1; g0 = g1; b0 = b1;
      }
      const r = Math.round(clamp(r0, 0, 255) * (1 - f) + T.fog[0] * f);
      const g = Math.round(clamp(g0, 0, 255) * (1 - f) + T.fog[1] * f);
      const bl = Math.round(clamp(b0, 0, 255) * (1 - f) + T.fog[2] * f);
      glPal[b * (LV + 1) + l] = (255 << 24) | (bl << 16) | (g << 8) | r;
    }
  }
  for (let k = 0; k < HUDC.length; k++){
    const h = HUDC[k];
    const r = parseInt(h.substr(1, 2), 16), g = parseInt(h.substr(3, 2), 16), b = parseInt(h.substr(5, 2), 16);
    glPal[(NBASE + k) * (LV + 1) + LV] = (255 << 24) | (b << 16) | (g << 8) | r;
  }
}

function glResize(){
  const gl = GL.gl;
  glv.width = R.W; glv.height = R.H;
  const n = R.cols * R.rows * 2 + 16;
  GL.data = new ArrayBuffer(n * 16);
  GL.f32 = new Float32Array(GL.data);
  GL.u32 = new Uint32Array(GL.data);
  gl.bindVertexArray(GL.vao);
  gl.bindBuffer(gl.ARRAY_BUFFER, GL.ibuf);
  gl.bufferData(gl.ARRAY_BUFFER, GL.data.byteLength, gl.STREAM_DRAW);
  GL.aCell = gl.getAttribLocation(GL.pGlyph, 'aCell');
  gl.enableVertexAttribArray(GL.aCell);
  gl.vertexAttribPointer(GL.aCell, 3, gl.FLOAT, false, 16, 0);
  gl.vertexAttribDivisor(GL.aCell, 1);
  GL.aCol = gl.getAttribLocation(GL.pGlyph, 'aCol');
  gl.enableVertexAttribArray(GL.aCol);
  gl.vertexAttribPointer(GL.aCol, 4, gl.UNSIGNED_BYTE, true, 16, 12);
  gl.vertexAttribDivisor(GL.aCol, 1);
  gl.bindVertexArray(null);
  // scene target plus two bloom taps
  const mkTarget = (w, h) => {
    const t = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, t);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    const f = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, f);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, t, 0);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    return { t, f, w, h };
  };
  GL.scene = mkTarget(R.W, R.H);
  GL.tap = [mkTarget(Math.max(2, R.W >> 3), Math.max(2, R.H >> 3)),
            mkTarget(Math.max(2, R.W >> 5), Math.max(2, R.H >> 5))];
  glBuildAtlas();
  glBuildPalette();
}

function glQuad(x, y, w, h, r, g, b, a){
  const gl = GL.gl;
  gl.useProgram(GL.pQuad);
  gl.uniform2f(GL.uQ.uRes, R.W, R.H);
  gl.uniform4f(GL.uQ.uRect, x, y, w, h);
  gl.uniform4f(GL.uQ.uColor, r, g, b, a);
  gl.bindVertexArray(GL.empty);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
}

// pack the character grid into instances; returns how many
function glPackWorld(){
  const f32 = GL.f32, u32 = GL.u32, pal = glPal, span = LV + 1;
  const n = R.cols * R.rows;
  let k = 0;
  for (let i = 0; i < n; i++){
    const g = gBuf[i];
    if (!g) continue;
    const o = k << 2;
    f32[o] = i; f32[o + 1] = g; f32[o + 2] = lBuf[i];
    u32[o + 3] = pal[bBuf[i] * span + lBuf[i]];
    k++;
  }
  return k;
}
function glPackHud(start){
  const f32 = GL.f32, u32 = GL.u32, pal = glPal, span = LV + 1;
  const n = R.cols * R.rows;
  let k = start;
  for (let i = 0; i < n; i++){
    const g = hGlyph[i];
    if (!g) continue;
    const o = k << 2;
    f32[o] = i; f32[o + 1] = g; f32[o + 2] = LV;
    u32[o + 3] = pal[(NBASE + hCol[i]) * span + LV];
    k++;
  }
  return k - start;
}
function glDrawGlyphs(first, count){
  if (!count) return;
  const gl = GL.gl;
  gl.useProgram(GL.pGlyph);
  gl.uniform2f(GL.uG.uGrid, R.cols, R.rows);
  gl.uniform2f(GL.uG.uCell, R.cellW, R.cellH);
  gl.uniform2f(GL.uG.uOrigin, R.ox, R.oy);
  gl.uniform2f(GL.uG.uRes, R.W, R.H);
  gl.uniform2f(GL.uG.uAtlas, GL_COLS, LV + 1);
  gl.uniform1i(GL.uG.uTex, 0);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, GL.tex);
  gl.bindVertexArray(GL.vao);
  gl.bindBuffer(gl.ARRAY_BUFFER, GL.ibuf);
  const base = first * 16;                 // drawArraysInstanced has no baseInstance
  gl.vertexAttribPointer(GL.aCell, 3, gl.FLOAT, false, 16, base);
  gl.vertexAttribPointer(GL.aCol, 4, gl.UNSIGNED_BYTE, true, 16, base + 12);
  gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, count);
}

function glPresent(){
  const gl = GL.gl, T = curTime();
  const dn = distMap.length ? districtAt(cam.x, cam.y) : 0;
  const DF = DISTRICT[dn].fog;
  const ins = !!inside;                        // indoors the horizon is a wall
  const fog = ins ? [0.028, 0.032, 0.05]
                  : T.fog.map((v, i) => (v * 0.66 + DF[i] * 0.34) / 255);
  const hz = clamp(0.5 + cam.pitch / Math.max(1, R.rows), 0.03, 0.97);

  const nw = glPackWorld();
  const nh = glPackHud(nw);
  gl.bindVertexArray(GL.vao);
  gl.bindBuffer(gl.ARRAY_BUFFER, GL.ibuf);
  gl.bufferSubData(gl.ARRAY_BUFFER, 0, GL.f32, 0, (nw + nh) * 4);

  // --- scene into a texture so bloom has something to read ---
  gl.bindFramebuffer(gl.FRAMEBUFFER, GL.scene.f);
  gl.viewport(0, 0, R.W, R.H);
  gl.disable(gl.BLEND);
  gl.clearColor(0, 0, 0, 1); gl.clear(gl.COLOR_BUFFER_BIT);
  gl.useProgram(GL.pBG);
  if (ins){
    gl.uniform3f(GL.uBG.uSky, 0.03, 0.035, 0.055);
    gl.uniform3f(GL.uBG.uMid, 0.028, 0.032, 0.05);
  } else {
    gl.uniform3f(GL.uBG.uSky, T.sky[0] / 255, T.sky[1] / 255, T.sky[2] / 255);
    gl.uniform3f(GL.uBG.uMid, (T.sky[0] * 0.35 + T.fog[0] * 0.65) / 255,
                              (T.sky[1] * 0.35 + T.fog[1] * 0.65) / 255,
                              (T.sky[2] * 0.35 + T.fog[2] * 0.65) / 255);
  }
  gl.uniform3f(GL.uBG.uFog, fog[0], fog[1], fog[2]);
  const gnd = CFG.timeMode === 2 && !ins ? 0.22 : 0.42;   // day ground stays dark
  gl.uniform3f(GL.uBG.uGround, fog[0] * gnd, fog[1] * gnd, fog[2] * gnd);
  gl.uniform1f(GL.uBG.uHz, hz);
  gl.bindVertexArray(GL.empty);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  gl.enable(gl.BLEND);
  glDrawGlyphs(0, nw);

  // --- to the screen, then bloom taps on top ---
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, R.W, R.H);
  gl.disable(gl.BLEND);
  gl.useProgram(GL.pPost);
  gl.uniform1i(GL.uP.uTex, 0);
  gl.uniform1f(GL.uP.uBright, 0);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, GL.scene.t);
  gl.bindVertexArray(GL.empty);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  if (bloomOn && CFG.timeMode !== 2){        // daylight drowns the neon anyway
    for (let i = 0; i < GL.tap.length; i++){
      const tp = GL.tap[i];
      gl.bindFramebuffer(gl.FRAMEBUFFER, tp.f);
      gl.viewport(0, 0, tp.w, tp.h);
      gl.useProgram(GL.pPost);
      gl.uniform1f(GL.uP.uBright, 1);
      gl.bindTexture(gl.TEXTURE_2D, GL.scene.t);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
      gl.bindFramebuffer(gl.FRAMEBUFFER, null);
      gl.viewport(0, 0, R.W, R.H);
      gl.enable(gl.BLEND);
      gl.blendFunc(gl.SRC_ALPHA, gl.ONE);
      gl.uniform1f(GL.uP.uBright, 0);
      gl.bindTexture(gl.TEXTURE_2D, tp.t);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
      if (smokeGlow > 0.02){                  // the haze doubles the halo
        for (let k = smokeGlow; k > 0.02; k -= 0.5)
          gl.drawArrays(gl.TRIANGLES, 0, 3);
      }
      gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
      gl.disable(gl.BLEND);
    }
  }
  gl.enable(gl.BLEND);

  if (flash > 0.01){
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE);
    glQuad(0, 0, R.W, R.H, 0.55, 0.63, 0.84, flash * 0.5);
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
  }
  if (fade > 0.01) glQuad(0, 0, R.W, R.H, 0.008, 0.012, 0.035, fade);
  if (hurtT > 0.01) glQuad(0, 0, R.W, R.H, 0.9, 0.1, 0.12, hurtT * 0.32);
  for (let i = 0; i < hudRects.length; i += 4)
    glQuad(hudRects[i], hudRects[i + 1], hudRects[i + 2], hudRects[i + 3], 0.012, 0.023, 0.047, 0.60);
  glDrawGlyphs(nw, nh);
}

/*-------------------------------- blit -------------------------------------*/
function blit(){
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, R.W, R.H);
  const cw = R.cellW, ch = R.cellH, ox = R.ox, oy = R.oy, cols = R.cols, rows = R.rows;
  for (let r = 0; r < rows; r++){
    const py = oy + r * ch, off = r * cols;
    for (let x = 0; x < cols; x++){
      const idx = off + x, g = gBuf[idx];
      if (g === 0) continue;
      ctx.drawImage(atlas[lBuf[idx]], g * cw, bBuf[idx] * ch, cw, ch, ox + x * cw, py, cw, ch);
    }
  }
  if (flash > 0.01){
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = 'rgba(140,160,215,' + (flash * 0.5).toFixed(3) + ')';
    ctx.fillRect(0, 0, R.W, R.H);
    ctx.globalCompositeOperation = 'source-over';
  }
  if (fade > 0.01){
    ctx.fillStyle = 'rgba(2,3,9,' + fade.toFixed(3) + ')';
    ctx.fillRect(0, 0, R.W, R.H);
  }
}

/*=============================== 15. HUD ===================================*/
let toastMsg = '', toastT = 0;
function toast(m){ toastMsg = m; toastT = 2.6; }
let hudR0 = 1e9, hudR1 = -1;
function hudStr(col, row, s, ci){
  if (row < 0 || row >= R.rows) return;
  if (row < hudR0) hudR0 = row;
  if (row > hudR1) hudR1 = row;
  for (let i = 0; i < s.length; i++){
    const c = col + i;
    if (c < 0 || c >= R.cols) continue;
    const code = s.charCodeAt(i) - 32;
    if (code < 0 || code > 94) continue;
    const idx = row * R.cols + c;
    hGlyph[idx] = code; hCol[idx] = ci;
  }
}
const hudRects = [];
function hudPanel(x, y, w, h){
  hudRects.push(R.ox + x * R.cellW, R.oy + y * R.cellH, w * R.cellW, h * R.cellH);
  // a panel owns its cells: clear whatever the HUD drew under it
  const x1 = Math.min(R.cols, x + w), y1 = Math.min(R.rows, y + h);
  for (let r = Math.max(0, y); r < y1; r++){
    const off = r * R.cols;
    for (let c = Math.max(0, x); c < x1; c++){ hGlyph[off + c] = 0; }
  }
  if (y < hudR0) hudR0 = Math.max(0, y);
  if (y1 - 1 > hudR1) hudR1 = y1 - 1;
}
function hudBox(x, y, w, h, title){
  hudStr(x, y, '+' + '-'.repeat(Math.max(0, w - 2)) + '+', H_DIM);
  hudStr(x, y + h - 1, '+' + '-'.repeat(Math.max(0, w - 2)) + '+', H_DIM);
  for (let r = y + 1; r < y + h - 1; r++){ hudStr(x, r, '|', H_DIM); hudStr(x + w - 1, r, '|', H_DIM); }
  if (title) hudStr(x + 2, y, ' ' + title + ' ', H_GRN);
}
// Renders any list-menu mode: centred card, live right-aligned values, the
// selected item's hint along the bottom. Scrolls when the card cannot hold
// every item, which small grids and long inventories will both hit.
function drawListMenu(m){
  const items = m.items, cols = R.cols, rows = R.rows;
  let w = m.title.length + 8;
  for (const it of items){
    if (it.sep) continue;
    if (it.info){ w = Math.max(w, String(it.info).length + 8); continue; }
    const vl = it.value ? String(it.value()).length + 8 : 0;
    w = Math.max(w, it.label.length + vl + 8);
    if (it.hint) w = Math.max(w, it.hint.length + 4);
  }
  w = Math.min(w, cols - 2);
  const h = Math.min(rows - 2, items.length + 4);
  const x = (cols - w) >> 1, y = Math.max(1, ((rows - h) >> 1) - 1);
  hudPanel(0, 0, cols, rows);       // dim the whole frame behind the card
  hudPanel(x, y, w, h);             // and stack a second layer over the card
  hudBox(x, y, w, h, m.title);
  const maxIt = h - 4;
  const first = items.length > maxIt
    ? clamp(m.cursor - (maxIt >> 1), 0, items.length - maxIt) : 0;
  m.hit = { x, y, w, h, first };    // where the rows landed, for tapping
  for (let i = 0; i < Math.min(items.length, maxIt); i++){
    const it = items[first + i], r = y + 1 + i, sel = first + i === m.cursor;
    if (it.sep){ hudStr(x + 2, r, '-'.repeat(Math.max(0, w - 4)), H_DIM); continue; }
    if (it.info){ hudStr(x + 4, r, String(it.info).slice(0, w - 6), H_DIM); continue; }
    hudStr(x + 2, r, ((sel ? '> ' : '  ') + it.label).slice(0, w - 4), sel ? H_YEL : H_WHT);
    if (it.value){
      let v = String(it.value());
      if (it.adj) v = sel ? '< ' + v + ' >' : '  ' + v;
      hudStr(x + w - 3 - v.length, r, v, sel ? H_YEL : H_DIM);
    }
  }
  const cur = items[m.cursor];
  if (cur && cur.hint) hudStr(x + 2, y + h - 2, cur.hint.slice(0, w - 4), H_DIM);
}
function wrapText(s, w){
  const words = s.split(' '), lines = [];
  let cur = '';
  for (const wd of words){
    if (cur && cur.length + 1 + wd.length > w){ lines.push(cur); cur = wd; }
    else cur = cur ? cur + ' ' + wd : wd;
  }
  if (cur) lines.push(cur);
  return lines;
}

  const h = lines.length + 4;
  const x = (cols - w) >> 1;
  const y = TOUCH.on ? Math.max(1, ((rows - h) >> 1) - 2) : Math.max(1, rows - h - 8);
  hudPanel(x, y, w, h); hudPanel(x, y, w, h);
  hudBox(x, y, w, h, m.title);
  let shown = m.t0 < 0 ? 1e9 : ((performance.now() - m.t0) * 0.06) | 0;
  for (let i = 0; i < lines.length; i++){
    const take = clamp(shown, 0, lines[i].length);
    hudStr(x + 3, y + 1 + i, lines[i].slice(0, take), H_WHT);
    shown -= lines[i].length + 1;               // the swallowed space counts
  }
  const hint = !m.pageDone() ? '[SPACE] skip'
             : m.idx < m.pages.length - 1 ? '[SPACE] more' : '[SPACE] end';
  hudStr(x + w - hint.length - 3, y + h - 2, hint, H_DIM);
}
function drawTree(m){
  const cols = R.cols, rows = R.rows;
  const w = Math.min(cols - 6, 74);
  const node = m.cur();
  const lines = wrapText(nodeText(node), w - 6);
  const done = m.pageDone();
  const opts = done ? m.visibleOpts() : [];
  if (m.cursor >= opts.length) m.cursor = Math.max(0, opts.length - 1);
  const h = lines.length + (opts.length ? opts.length + 1 : 0) + 4;
  // on touch the card centres, clear of thumbs; on desktop it sits low
  const x = (cols - w) >> 1;
  const y = TOUCH.on ? Math.max(1, ((rows - h) >> 1) - 2) : Math.max(1, rows - h - 8);
  m.hit = { x, y, w, h, optStart: y + 2 + lines.length };
  hudPanel(x, y, w, h); hudPanel(x, y, w, h);
  hudBox(x, y, w, h, m.title);
  let shown = m.t0 < 0 ? 1e9 : ((performance.now() - m.t0) * 0.06) | 0;
  for (let i = 0; i < lines.length; i++){
    const take = clamp(shown, 0, lines[i].length);
    hudStr(x + 3, y + 1 + i, lines[i].slice(0, take), H_WHT);
    shown -= lines[i].length + 1;
  }
  for (let i = 0; i < opts.length; i++){
    const sel = i === m.cursor;
    hudStr(x + 3, y + 2 + lines.length + i,
           ((sel ? '> ' : '  ') + opts[i].t).slice(0, w - 5), sel ? H_YEL : H_GRN);
  }
  if (!opts.length){
    const hint = !done ? '[SPACE] skip' : node.next ? '[SPACE] more' : '[SPACE] end';
    hudStr(x + w - hint.length - 3, y + h - 2, hint, H_DIM);
  }
}

function drawMinimap(x0, y0){

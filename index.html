  /* A solid whose CENTRE is beside you still has half of itself in front of
     you - a car passing at arm's length, the bench you are sitting on. The
     near cull used to drop anything whose centre was not 0.3 ahead, which
     is why those vanished exactly when they filled the corner of the eye.
     Every test now allows the object's own reach. */
  for (let i = 0; i < cars.length; i++){
    const c = cars[i];
    const rx = c.x - cam.x, ry = c.y - cam.y;
    const f = rx * dirX + ry * dirY;
    const cr = c.len * 0.5 + 0.4;
    if (f < -cr || f > MD) continue;
    if (Math.abs(dirY * rx - dirX * ry) > f * planeLen + cr + 4) continue;
    drawList.push({ d: f, k: 0, o: c });
  }
  for (let i = 0; i < peds.length; i++){
    const p = peds[i];
    if (p.off) continue;                        // living their off-screen hours
    const rx = p.x - cam.x, ry = p.y - cam.y;
    const f = rx * dirX + ry * dirY;
    if (f < -0.6 || f > MD) continue;
    if (Math.abs(dirY * rx - dirX * ry) > f * planeLen + 2) continue;
    drawList.push({ d: f, k: 1, o: p });
  }
  for (let i = 0; i < actors.length; i++){
    const a = actors[i];
    const rx = a.x - cam.x, ry = a.y - cam.y;
    const f = rx * dirX + ry * dirY;
    if (f < -0.6 || f > MD) continue;
    if (Math.abs(dirY * rx - dirX * ry) > f * planeLen + 2) continue;
    drawList.push({ d: f, k: 1, o: a });       // drawn exactly like a pedestrian
  }
  for (let i = 0; i < fxs.length; i++){
    const s = fxs[i];
    const rx = s.x - cam.x, ry = s.y - cam.y;
    const f = rx * dirX + ry * dirY;
    if (f < -0.5 || f > MD) continue;
    drawList.push({ d: f, k: 3, o: s });
  }
  // you, seen from outside: only while something is looking at you
  if (player.bx !== undefined && topMode() && topMode().name === 'camjack'){
    const rx = player.bx - cam.x, ry = player.by - cam.y;
    const f = rx * dirX + ry * dirY;
    if (f > -1.2 && f < MD) drawList.push({ d: f, k: 4, o: null });
  }
  const vp = visibleProps();
  for (let i = 0; i < vp.length; i++){
    const p = vp[i];
    const rx = p.x - cam.x, ry = p.y - cam.y;
    const f = rx * dirX + ry * dirY;
    // Enough reach that a bench you are sitting on or a rack at your elbow
    // still draws, but no more: a tree whose trunk is behind you has only
    // canopy overhead, and paying full screen width for it is how the parks
    // went from three milliseconds to eight.
    // Small furniture is the stuff you stand beside - a bench under you, a
    // rack at your elbow - and it earns the reach. A tree does not: its
    // bounding sphere is the whole canopy, so letting one behind you into
    // the list drags the entire screen width through the marcher, which is
    // what took the parks from four milliseconds to seven.
    // Small furniture earns the reach - the bench under you, the rack at
    // your elbow. Big foliage does not: a canopy you are standing inside
    // fills the frame and costs two milliseconds on its own, and what it
    // renders is leaves directly overhead.
    const pw = (PROPDEF[p.k] && PROPDEF[p.k].w) || 1;
    const nearR = pw <= 2.6 ? -(pw * 0.5 + 0.3) : 0.15;
    if (f < nearR || f > MD || f > (MODEL_FAR[p.k] || 170)) continue;
    if (Math.abs(dirY * rx - dirX * ry) > f * planeLen + Math.min(pw * 0.6, 3)) continue;
    drawList.push({ d: f, k: 2, o: p });
  }
  drawList.sort((a, b) => b.d - a.d);          // far to near
  statSprites = drawList.length;
  for (let i = 0; i < drawList.length; i++){
    const it = drawList[i], o = it.o;
    if (it.k === 0){
      if (cam.riding === o) continue;
      // the side profile extruded across the car's own width
      drawModel(o.x, o.y, o.z, o.len, 1.55, ART.carSide, o.sb, o.sd, 0,
                Math.atan2(o.dy, o.dx), o.wid / o.len, 1);
    } else if (it.k === 1){
      // a struck body flashes white; a body winding up to hit you glows red
      const sbUse = o.hitT > 0 ? HIT_SB : (o.windup > 0 ? WIND_SB : o.sb);
      // a body, turned the way it is walking - the legs are real posts
      const fy = Math.atan2(o.dy, o.dx) + Math.PI / 2;
      if (o.sit){
        drawModel(o.x, o.y, 0, 0.6, 1.15, ART.pedSit, sbUse, o.sd, 0, fy, 0.85, 0);
      } else {
        const fr = o.moving && ((o.phase | 0) & 1) ? 1 : 0;
        drawModel(o.x, o.y, 0, 0.62, 1.76, ART.ped[fr], sbUse, o.sd, 0, fy, 0.85, 0);
      }
    } else if (it.k === 4){
      drawPlayerBody();
    } else if (it.k === 3){
      drawSprite(o.x, o.y, o.z, 0.36, 0.32, ART.spark,
                 SPARK_SL.base, SPARK_SL.dens, false, C.nAmber);
    } else {
      let def = PROPDEF[o.k];
      let dyn = 0;
      if (o.k === PK_LAMP){
        dyn = o.dead ? C.tire : LAMPC[(o.s * LAMPC.length) | 0];
      } else if (o.k === PK_STALL){
        // flavour by district: the strip leans ramen, homes lean produce,
        // downtown and the belt lean tech
        const dn2 = o.dist !== undefined ? o.dist : districtAt(o.x | 0, o.y | 0);
        const bias = (dn2 === D_STRIP || dn2 === D_RED) ? 0 : (dn2 === D_RES || dn2 === D_SUB || dn2 === D_RURAL) ? 1 : 2;
        def = STALL_VARIANTS[(((o.s * 5) | 0) + bias) % 3];
        dyn = NEONC[(o.s * NEONC.length) | 0];
      } else if (o.k === PK_METRO){
        dyn = C.nGreen;
      } else if (o.k === PK_TURBINE){
        dyn = ((worldTime * 0.9 + o.s * 6) % 1) < 0.5 ? C.nWhite : C.rail;
      } else if (o.k === PK_CAM){
        dyn = o.dead ? C.tire                   // a stump: dark, blind, honest
          : jamT > 0                            // jammed cams stutter in a panic
          ? (((worldTime * 7 + o.s * 3) % 1) < 0.3 ? C.nWhite : C.dataDk)
          : ((worldTime * 1.3 + o.s * 7) % 1) < 0.5 ? C.camRed : C.dataDk;
      } else if (o.k === PK_ITEM){
        dyn = ITEMS[o.item].pcol;
        const idf = ITEM_DEF[o.item];
        if (idf) def = idf;                     // every item is its own solid
      } else if (o.k === PK_FURN){
        def = FURN_DEF[o.fid] || PROPDEF[PK_BIN];
      } else if (o.k === PK_FLOTSAM){
        def = FLOTSAM[(o.s * FLOTSAM.length) | 0] || FLOTSAM[0];
      }
      const pz = (o.z || 0) +                          // pickups hover and bob
                 (o.k === PK_ITEM ? 0.14 + Math.sin(worldTime * 2.2 + o.x * 3) * 0.06 : 0) +
                 // and rubbish rides the swell it is sitting in
                 (o.k === PK_FLOTSAM
                    ? Math.sin(worldTime * 0.75 + o.x * 0.6 + o.y * 0.3) * 0.075 : 0);
      if (o.k === PK_FLOTSAM) o.yaw = (o.fix || 0) + worldTime * (0.05 + o.s * 0.07);
      else if (o.yaw === undefined) o.yaw = propFacing(o);
      // a post over the river has no business reflecting in the road's mirror
      _noRef = tType[(o.y | 0) * MAP + (o.x | 0)] === T_BRIDGE ? 1 : 0;
      const dep = def.dep !== undefined ? def.dep
                : MODEL_DEPTH[o.k] !== undefined ? MODEL_DEPTH[o.k] : 0.9;
      drawModel(o.x, o.y, pz, def.w, def.h, def.art, def.sl.base, def.sl.dens,
                dyn, o.yaw, dep, MODEL_BOXY[o.k] ? 1 : 0);
      _noRef = 0;
    }
  }
}

/*----------------------------- readable signage ----------------------------
  Anchored in the world, drawn in screen space at one character per cell, so a
  sign stays sharp at any distance instead of smearing across the facade.
============================================================================*/
// A sign is a flat panel fixed in a wall plane, so it is drawn the way a wall
// is: intersect each column's ray with the plane and read across the artwork.
// Perspective then foreshortens it for free, and it can never turn to face you.
/* Which entry the panel is showing this instant, how far a crawl has run,
   and where the border lights have got to. Called once per visible sign. */
function signNow(sg){
  const seq = sg.seq;
  let u = (worldTime + sg.phase) % sg.cyc;
  if (u < 0) u += sg.cyc;
  let i = 0;
  for (; i < seq.length - 1; i++){
    if (u < seq[i].dur) break;
    u -= seq[i].dur;
  }
  const e = seq[i];
  if (!e.tx) e.tx = bakeText(e.txt, sg.iw, sg.ih, sg.vert, e.scroll);
  sg._tx = e.tx; sg._sc = e.scroll;
  sg._off = e.scroll ? ((u * SIGN_SPEED) | 0) % e.tx.w : 0;
  sg.sb = e.sb; sg.sd = e.sd;
  // the flash takes the lettering only - the frame and its lights stay lit
  sg._ink = !(sg.blink && ((worldTime / sg.blink) % 1) < 0.22);
  const ch = e.ch;
  sg._chC = ch ? ch.c : null;
  sg._chD = ch ? ch.d : null;
  sg._chN = ch ? ch.n : 0;
  sg._chOff = ch ? (worldTime * sg.spin) | 0 : 0;
}
function drawSignPlane(sg){
  const cols = R.cols, rows = R.rows;
  const camA = sg.axis === 0 ? cam.x : cam.y;
  if ((camA - sg.plane) * sg.n <= 0.05) return;          // behind it, or edge on
  const aw = sg.pw, ah = sg.ph;
  const txt = sg._tx, tw = txt.w, th = txt.h, tdat = txt.data;
  const chC = sg._chC, chD = sg._chD, chN = sg._chN, chO = sg._chOff;
  const per2 = 2 * (aw - 1) + (ah - 1);        // start of the left-hand run
  const invLen = 1 / (sg.a1 - sg.a0);
  for (let x = 0; x < cols; x++){
    const rp = sg.axis === 0 ? rayX[x] : rayY[x];
    if (rp === 0) continue;
    const t = (sg.plane - camA) / rp;
    if (t < 0.25 || t > viewD) continue;
    const hitB = sg.axis === 0 ? cam.y + rayY[x] * t : cam.x + rayX[x] * t;
    let u = (hitB - sg.a0) * invLen;
    if (u < 0 || u >= 1) continue;
    // a0 is always the lower world coordinate, so which way the lettering
    // runs across the screen depends on which side of the panel you stand.
    // That is the sign's own normal, which is fixed for its lifetime. Keying
    // it to the camera's heading gives the same answer in every view a sign
    // is actually drawn in - the front-face cull guarantees it - but it is
    // true by luck rather than by construction, so read the invariant.
    if (sg.axis === 0 ? sg.n > 0 : sg.n < 0) u = 0.9999 - u;
    const ur = projRows / t;
    const rowB = horizon + (cam.z - sg.z) * ur;
    const rowT = rowB - sg.hm * ur;
    let r0 = Math.round(rowT), r1 = Math.round(rowB) - 1;
    if (r1 < r0) r1 = r0;
    const tn = t / viewD, lvl = levelOf(tn), dm = densMul(tn);
    const axp = Math.min(aw - 1, (u * aw) | 0);
    const invH = 1 / Math.max(0.0001, rowB - rowT);
    // both of these are fixed for the whole of this screen column, so the
    // per-cell work below is a couple of compares and an array read
    const edge = (axp === 0 || axp === aw - 1);
    let sx = -1;
    if (!edge && sg._ink){
      const ix = axp - 2;
      if (ix >= 0) sx = sg._sc ? (ix + sg._off) % tw : (ix < tw ? ix : -1);
    }

    // A sign mounted high leaves the top of the frame as soon as you tilt
    // down, but its reflection does not. Mirror the rows above the frame
    // straight from here, the same way the wall pass does.
    {
      const mb = 2 * horizon + 2 * cam.z * ur;
      let s0 = r0, s1 = Math.min(r1, -1);
      const lo = Math.ceil(mb - rows + 1), hi = Math.floor(mb - hzRow - 1);
      if (s0 < lo) s0 = lo;
      if (s1 > hi) s1 = hi;
      if (s0 <= s1){
        const wobx = refWob[x];
        for (let r = s0; r <= s1; r++){
          const rr = Math.round(mb - r + wobx);
          if (rr <= hzRow || rr >= rows) continue;
          const j = rr * cols + x;
          if (!reflects(j)) continue;
          const v = clamp((r + 0.5 - rowT) * invH, 0, 0.9999);
          const ay = (v * ah) | 0;
          let base, dens;
          if (edge || ay === 0 || ay === ah - 1){
            if (chC){
              const pi = ay === 0 ? axp
                       : ay === ah - 1 ? (aw - 1) + (ah - 1) + (aw - 1 - axp)
                       : axp === aw - 1 ? (aw - 1) + ay
                       : per2 + (ah - 1 - ay);
              let k = (pi - chO) % chN; if (k < 0) k += chN;
              base = chC[k]; dens = chD[k];
            } else { base = sg.sb[2]; dens = sg.sd[2]; }
          } else if (sx >= 0 && ay >= 2 && ay - 2 < th && tdat[(ay - 2) * tw + sx]){
            base = sg.sb[3]; dens = sg.sd[3];
          } else { base = sg.sb[1]; dens = sg.sd[1]; }
          const g0 = Math.round(clamp(dens * dm, 0, 1) * RMAX);
          const ng = (g0 * (EMISSIVE[base] ? 0.55 : 0.42)) | 0;
          if (ng < 1) continue;
          gBuf[j] = ng; bBuf[j] = base; srcBuf[j] = 0;
          statCells++;
        }
      }
    }

    if (r1 < 0 || r0 >= rows) continue;
    if (r0 < 0) r0 = 0;
    if (r1 > rows - 1) r1 = rows - 1;
    for (let r = r0; r <= r1; r++){
      const idx = r * cols + x;
      if (dBuf[idx] < t - 0.02) continue;
      const v = clamp((r + 0.5 - rowT) * invH, 0, 0.9999);
      const ay = (v * ah) | 0;
      let base, dens;
      if (edge || ay === 0 || ay === ah - 1){
        // where this cell sits along the border ring, shifted a lamp at a
        // time, is the whole of the spinning-lights trick
        if (chC){
          const pi = ay === 0 ? axp
                   : ay === ah - 1 ? (aw - 1) + (ah - 1) + (aw - 1 - axp)
                   : axp === aw - 1 ? (aw - 1) + ay
                   : per2 + (ah - 1 - ay);
          let k = (pi - chO) % chN; if (k < 0) k += chN;
          base = chC[k]; dens = chD[k];
        } else { base = sg.sb[2]; dens = sg.sd[2]; }
      } else if (sx >= 0 && ay >= 2 && ay - 2 < th && tdat[(ay - 2) * tw + sx]){
        base = sg.sb[3]; dens = sg.sd[3];
      } else { base = sg.sb[1]; dens = sg.sd[1]; }
      const g = Math.round(clamp(dens * dm, 0, 1) * RMAX);
      if (!g) continue;
      gBuf[idx] = g; bBuf[idx] = base; lBuf[idx] = lvl; dBuf[idx] = t;
      refBuf[idx] = 0;
      srcBuf[idx] = EMISSIVE[base] ? 2 : 1;
      statCells++;
    }
  }
}
function signPass(){
  for (let i = 0; i < signs.length; i++){
    const sg = signs[i];
    const rx = sg.x - cam.x, ry = sg.y - cam.y;
    if (rx < -viewD || rx > viewD || ry < -viewD || ry > viewD) continue;
    const d = rx * dirX + ry * dirY;
    if (d < 0.3 || d > viewD || d > 130) continue;       // unreadable past 130
    if (rx * sg.nx + ry * sg.ny > 0) continue;           // facing away
    if (Math.abs(dirY * rx - dirX * ry) > d * planeLen + sg.wm + 2) continue;
    signNow(sg);
    drawSignPlane(sg);
  }
}

/*--------------------- screen-space reflections in wet tarmac --------------
  A surface at height z reflects to row  2*horizon + 2*camZ*unitRows - r,
  which is just the mirror of the wall row about the ground plane.
============================================================================*/
function reflects(j){                          // is this cell a mirror right now?
  const rf = refBuf[j];
  return rf === 2 || (rf === 1 && weather !== 0);
}
function reflectPass(){
  const cols = R.cols, rows = R.rows;
  const hz = clamp(Math.floor(horizon), 0, rows - 1);
  // A person is 1.76 tall against a 1.62 eye height, so nearly all of them
  // sits BELOW the horizon - scanning only the sky half would mirror towers
  // and neon but never anyone standing in front of you. The whole column is
  // swept instead, and srcBuf keeps it to things worth mirroring.
  for (let x = 0; x < cols; x++){
    const wob = refWob[x];
    for (let r = 0; r < rows; r++){
      const idx = r * cols + x;
      const g = gBuf[idx];
      if (!g) continue;
      const d = dBuf[idx];
      if (d > 60) continue;
      const sv = srcBuf[idx];
      if (!sv) continue;
      const rr = Math.round(2 * horizon + 2 * cam.z * (projRows / d) - r + wob);
      if (rr <= hz || rr >= rows) continue;
      const j = rr * cols + x;
      if (!reflects(j)) continue;
      // a ramp glyph dims by stepping down the ramp; a letter has to stay a
      // letter or the index arithmetic turns it into punctuation
      // light mirrors brighter than a silhouette does
      const fall = sv === 2 ? 0.55 : 0.42;
      let ng;
      if (g > RMAX) ng = g;
      else { ng = (g * fall) | 0; if (ng < 1) continue; }
      gBuf[j] = ng; bBuf[j] = bBuf[idx]; srcBuf[j] = 0;
      statCells++;
    }
  }
}

/*------------------------------- rain --------------------------------------*/
function rainPass(){
  if (weather !== 1 && weather !== 2) return;   // fog is quiet
  const cols = R.cols, rows = R.rows;
  const perCol = weather === 2 ? 3 : 2;
  for (let x = 0; x < cols; x++){
    for (let k = 0; k < perCol; k++){
      const h1 = hash3(x, k, 5);
      const y = (h1 * rows + worldTime * (24 + h1 * 40)) % rows;
      const r = y | 0;
      const xx = (x + ((y * 0.22) | 0)) % cols;
      const i0 = r * cols + xx;
      gBuf[i0] = G_SLASH; bBuf[i0] = C.nWhite; lBuf[i0] = 3; srcBuf[i0] = 0;
      if (r + 1 < rows && xx > 0){
        const i1 = (r + 1) * cols + xx - 1;
        gBuf[i1] = G_TICK; bBuf[i1] = C.nWhite; lBuf[i1] = 5; srcBuf[i1] = 0;
      }
    }
  }
}

/*------------------------------- bloom -------------------------------------
  Two taps. Each is a downscale, cubed to crush everything that is not neon,
  then added back with 'lighter' - the upscale is the blur.
============================================================================*/
function initBloom(){
  bloomCv = [];
  for (const [sh, al] of [[3, 0.50], [5, 0.75]]){
    const w = Math.max(2, R.W >> sh), h = Math.max(2, R.H >> sh);
    const a = document.createElement('canvas'), b = document.createElement('canvas');
    a.width = w; a.height = h; b.width = w; b.height = h;
    bloomCv.push({ a, b, w, h, al, actx: a.getContext('2d'), bctx: b.getContext('2d') });
  }
}
function bloomPass(){
  if (!bloomOn) return;
  ctx.save();
  for (let i = 0; i < bloomCv.length; i++){
    const t = bloomCv[i], ac = t.actx, bc = t.bctx;
    ac.globalCompositeOperation = 'source-over';
    ac.clearRect(0, 0, t.w, t.h);
    ac.imageSmoothingEnabled = true;
    ac.drawImage(cv, 0, 0, R.W, R.H, 0, 0, t.w, t.h);
    bc.globalCompositeOperation = 'source-over';
    bc.clearRect(0, 0, t.w, t.h);
    bc.imageSmoothingEnabled = true;
    bc.drawImage(t.a, 0, 0);
    bc.globalCompositeOperation = 'multiply';
    bc.drawImage(t.a, 0, 0);
    bc.drawImage(t.a, 0, 0);
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = t.al * (1 + smokeGlow * 1.1);
    ctx.imageSmoothingEnabled = true;
    ctx.drawImage(t.b, 0, 0, t.w, t.h, 0, 0, R.W, R.H);
  }
  ctx.restore();
  ctx.imageSmoothingEnabled = false;
}

/*========================= 14c. GPU PRESENTATION ===========================
  Every geometry pass still fills gBuf / bBuf / lBuf exactly as before. Only
  the way those cells reach the screen changes: one instanced draw for the
  whole character grid instead of one drawImage per lit cell. Measured at max
  resolution that is 0.7 ms against 75 ms.

  The glyph atlas holds shapes only - white on transparent, one row per
  distance level plus a row of full ASCII for the HUD - and the final colour
  rides along as a per-instance byte quad, so nothing has to be re-baked when
  the time of day changes.
============================================================================*/
let GL = null;
const VS_FULL = `#version 300 es
out vec2 vT;
void main(){
  // one oversized triangle: the vertices sit outside the viewport so the
  // visible area is fully covered, and vT lands on 0..1 across the screen
  vec2 p = vec2(float((gl_VertexID << 1) & 2), float(gl_VertexID & 2));
  vT = p;
  gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0);
}`;
const FS_BG = `#version 300 es
precision mediump float;
in vec2 vT; out vec4 o;
uniform vec3 uSky, uMid, uFog, uGround; uniform float uHz;
void main(){
  float t = 1.0 - vT.y;
  float a = max(0.001, uHz - 0.16);
  vec3 c;
  if (t < a) c = mix(uSky, uMid, t / a);
  else if (t < uHz) c = mix(uMid, uFog, (t - a) / max(0.001, uHz - a));
  else c = mix(uFog, uGround, (t - uHz) / max(0.001, 1.0 - uHz));
  o = vec4(c, 1.0);
}`;
const VS_GLYPH = `#version 300 es
in vec3 aCell;            // cell index, glyph, atlas row
in vec4 aCol;             // final colour, already faded
uniform vec2 uGrid, uCell, uOrigin, uRes, uAtlas;
out vec2 vUV; out vec4 vCol;
void main(){
  vec2 corner = vec2(float(gl_VertexID & 1), float((gl_VertexID >> 1) & 1));
  vec2 cxy = vec2(mod(aCell.x, uGrid.x), floor(aCell.x / uGrid.x));
  vec2 px = uOrigin + (cxy + corner) * uCell;
  vec2 ndc = px / uRes * 2.0 - 1.0;
  gl_Position = vec4(ndc.x, -ndc.y, 0.0, 1.0);
  vUV = vec2((aCell.y + corner.x) / uAtlas.x, (aCell.z + corner.y) / uAtlas.y);
  vCol = aCol;
}`;
const FS_GLYPH = `#version 300 es
precision mediump float;
in vec2 vUV; in vec4 vCol; out vec4 o;
uniform sampler2D uTex;
void main(){
  float a = texture(uTex, vUV).a;
  if (a < 0.01) discard;
  o = vec4(vCol.rgb, a * vCol.a);
}`;
const VS_QUAD = `#version 300 es
uniform vec4 uRect; uniform vec2 uRes;
void main(){
  vec2 corner = vec2(float(gl_VertexID & 1), float((gl_VertexID >> 1) & 1));
  vec2 px = uRect.xy + corner * uRect.zw;
  vec2 ndc = px / uRes * 2.0 - 1.0;
  gl_Position = vec4(ndc.x, -ndc.y, 0.0, 1.0);
}`;
const FS_QUAD = `#version 300 es
precision mediump float;
uniform vec4 uColor; out vec4 o;
void main(){ o = uColor; }`;
const FS_POST = `#version 300 es
precision mediump float;
in vec2 vT; out vec4 o;
uniform sampler2D uTex; uniform float uBright;
void main(){
  vec3 c = texture(uTex, vT).rgb;
  if (uBright > 0.5) c = c * c * c;      // crush everything that is not neon
  o = vec4(c, 1.0);
}`;

function glInit(){
  let gl = null;
  try {
    gl = glv.getContext('webgl2', { alpha: false, antialias: false, depth: false,
                                    stencil: false, powerPreference: 'high-performance' });
  } catch (e){ gl = null; }
  if (!gl) return null;
  const mkShader = (t, src) => {
    const sh = gl.createShader(t); gl.shaderSource(sh, src); gl.compileShader(sh);
    if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(sh));
    return sh;
  };
  const mkProg = (v, f) => {
    const pr = gl.createProgram();
    gl.attachShader(pr, mkShader(gl.VERTEX_SHADER, v));
    gl.attachShader(pr, mkShader(gl.FRAGMENT_SHADER, f));
    gl.linkProgram(pr);
    if (!gl.getProgramParameter(pr, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(pr));
    return pr;
  };
  const G = { gl };
  try {
    G.pBG = mkProg(VS_FULL, FS_BG);
    G.pGlyph = mkProg(VS_GLYPH, FS_GLYPH);
    G.pQuad = mkProg(VS_QUAD, FS_QUAD);
    G.pPost = mkProg(VS_FULL, FS_POST);
  } catch (e){ return null; }
  G.uBG = {};
  for (const k of ['uSky', 'uMid', 'uFog', 'uGround', 'uHz']) G.uBG[k] = gl.getUniformLocation(G.pBG, k);
  G.uG = {};
  for (const k of ['uGrid', 'uCell', 'uOrigin', 'uRes', 'uAtlas', 'uTex']) G.uG[k] = gl.getUniformLocation(G.pGlyph, k);
  G.uQ = {};
  for (const k of ['uRect', 'uRes', 'uColor']) G.uQ[k] = gl.getUniformLocation(G.pQuad, k);
  G.uP = {};
  for (const k of ['uTex', 'uBright']) G.uP[k] = gl.getUniformLocation(G.pPost, k);
  G.vao = gl.createVertexArray();
  G.ibuf = gl.createBuffer();
  G.tex = gl.createTexture();
  G.empty = gl.createVertexArray();
  gl.disable(gl.DEPTH_TEST);
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
  return G;
}

// shapes only: LV distance rows plus one full-ASCII row for the HUD
const GL_COLS = 95;
function glBuildAtlas(){
  const gl = GL.gl, cw = R.cellW, ch = R.cellH;
  const cn = document.createElement('canvas');
  cn.width = GL_COLS * cw; cn.height = (LV + 1) * ch;
  const g = cn.getContext('2d');
  g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillStyle = '#fff';
  const fbase = Math.min(ch * 0.99, cw / 0.575);
  for (let l = 0; l < LV; l++){
    g.font = (LV_BOLD[l] ? 'bold ' : '') + (fbase * LV_SCALE[l]).toFixed(2) + 'px ' + FONT;
    for (let i = 1; i < CHARS.length; i++) g.fillText(CHARS[i], i * cw + cw * 0.5, l * ch + ch * 0.5);
  }
  g.font = 'bold ' + (fbase * 0.94).toFixed(2) + 'px ' + FONT;
  for (let i = 1; i < GL_COLS; i++)
    g.fillText(String.fromCharCode(32 + i), i * cw + cw * 0.5, LV * ch + ch * 0.5);
  gl.bindTexture(gl.TEXTURE_2D, GL.tex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, cn);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
}

// final colour per (material, level), packed once per palette change
let glPal = null;
function glBuildPalette(){
  const T = curTime();
  const n = NBASE + HUDC.length;
  glPal = new Uint32Array(n * (LV + 1));
  for (let b = 0; b < NBASE; b++){
    const c = BASE[b];
    for (let l = 0; l < LV; l++){
      const f = LV_FADE[l] * fogScale();
      const dim = 1 - 0.22 * f;
      const sat = (CFG.timeMode === 2 ? 1.5 : 1) * drugFx('sat', 1);
      const hueK = drugFx('hue', 0);
      const hueM = (hueK ? hueK * (0.25 + 0.75 * (0.5 + 0.5 * Math.sin(worldTime * 0.35))) : 0)
                 + drugFx('hueC', 0);
      const warm = drugFx('warm', 0);
      let r0 = c[0] * dim * T.amb, g0 = c[1] * dim * T.amb, b0 = c[2] * dim * T.amb;
      if (sat !== 1){
        const lum = r0 * 0.3 + g0 * 0.59 + b0 * 0.11;
        r0 = lum + (r0 - lum) * sat; g0 = lum + (g0 - lum) * sat; b0 = lum + (b0 - lum) * sat;
      }
      if (warm){ r0 *= 1 + 0.15 * warm; b0 *= 1 - 0.12 * warm; }
      if (hueM){
        const hm2 = hueM * (1 + Math.max(0, 1 - T.amb) * 1.2);
        const r1 = r0 + (g0 - r0) * hm2, g1 = g0 + (b0 - g0) * hm2, b1 = b0 + (r0 - b0) * hm2;
        r0 = r1; g0 = g1; b0 = b1;
      }
      const r = Math.round(clamp(r0, 0, 255) * (1 - f) + T.fog[0] * f);
      const g = Math.round(clamp(g0, 0, 255) * (1 - f) + T.fog[1] * f);
      const bl = Math.round(clamp(b0, 0, 255) * (1 - f) + T.fog[2] * f);
      glPal[b * (LV + 1) + l] = (255 << 24) | (bl << 16) | (g << 8) | r;
    }
  }
  for (let k = 0; k < HUDC.length; k++){
    const h = HUDC[k];
    const r = parseInt(h.substr(1, 2), 16), g = parseInt(h.substr(3, 2), 16), b = parseInt(h.substr(5, 2), 16);
    glPal[(NBASE + k) * (LV + 1) + LV] = (255 << 24) | (b << 16) | (g << 8) | r;
  }
}

function glResize(){
  const gl = GL.gl;
  glv.width = R.W; glv.height = R.H;
  const n = R.cols * R.rows * 2 + 16;
  GL.data = new ArrayBuffer(n * 16);
  GL.f32 = new Float32Array(GL.data);
  GL.u32 = new Uint32Array(GL.data);
  gl.bindVertexArray(GL.vao);
  gl.bindBuffer(gl.ARRAY_BUFFER, GL.ibuf);
  gl.bufferData(gl.ARRAY_BUFFER, GL.data.byteLength, gl.STREAM_DRAW);
  GL.aCell = gl.getAttribLocation(GL.pGlyph, 'aCell');
  gl.enableVertexAttribArray(GL.aCell);
  gl.vertexAttribPointer(GL.aCell, 3, gl.FLOAT, false, 16, 0);
  gl.vertexAttribDivisor(GL.aCell, 1);
  GL.aCol = gl.getAttribLocation(GL.pGlyph, 'aCol');
  gl.enableVertexAttribArray(GL.aCol);
  gl.vertexAttribPointer(GL.aCol, 4, gl.UNSIGNED_BYTE, true, 16, 12);
  gl.vertexAttribDivisor(GL.aCol, 1);
  gl.bindVertexArray(null);
  // scene target plus two bloom taps
  const mkTarget = (w, h) => {
    const t = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, t);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    const f = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, f);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, t, 0);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    return { t, f, w, h };
  };
  GL.scene = mkTarget(R.W, R.H);
  GL.tap = [mkTarget(Math.max(2, R.W >> 3), Math.max(2, R.H >> 3)),
            mkTarget(Math.max(2, R.W >> 5), Math.max(2, R.H >> 5))];
  glBuildAtlas();
  glBuildPalette();
}

function glQuad(x, y, w, h, r, g, b, a){
  const gl = GL.gl;
  gl.useProgram(GL.pQuad);
  gl.uniform2f(GL.uQ.uRes, R.W, R.H);
  gl.uniform4f(GL.uQ.uRect, x, y, w, h);
  gl.uniform4f(GL.uQ.uColor, r, g, b, a);
  gl.bindVertexArray(GL.empty);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
}

// pack the character grid into instances; returns how many
function glPackWorld(){
  const f32 = GL.f32, u32 = GL.u32, pal = glPal, span = LV + 1;
  const n = R.cols * R.rows;
  let k = 0;
  for (let i = 0; i < n; i++){
    const g = gBuf[i];
    if (!g) continue;
    const o = k << 2;
    f32[o] = i; f32[o + 1] = g; f32[o + 2] = lBuf[i];
    u32[o + 3] = pal[bBuf[i] * span + lBuf[i]];
    k++;
  }
  return k;
}
function glPackHud(start){
  const f32 = GL.f32, u32 = GL.u32, pal = glPal, span = LV + 1;
  const n = R.cols * R.rows;
  let k = start;
  for (let i = 0; i < n; i++){
    const g = hGlyph[i];
    if (!g) continue;
    const o = k << 2;
    f32[o] = i; f32[o + 1] = g; f32[o + 2] = LV;
    u32[o + 3] = pal[(NBASE + hCol[i]) * span + LV];
    k++;
  }
  return k - start;
}
function glDrawGlyphs(first, count){
  if (!count) return;
  const gl = GL.gl;
  gl.useProgram(GL.pGlyph);
  gl.uniform2f(GL.uG.uGrid, R.cols, R.rows);
  gl.uniform2f(GL.uG.uCell, R.cellW, R.cellH);
  gl.uniform2f(GL.uG.uOrigin, R.ox, R.oy);
  gl.uniform2f(GL.uG.uRes, R.W, R.H);
  gl.uniform2f(GL.uG.uAtlas, GL_COLS, LV + 1);
  gl.uniform1i(GL.uG.uTex, 0);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, GL.tex);
  gl.bindVertexArray(GL.vao);
  gl.bindBuffer(gl.ARRAY_BUFFER, GL.ibuf);
  const base = first * 16;                 // drawArraysInstanced has no baseInstance
  gl.vertexAttribPointer(GL.aCell, 3, gl.FLOAT, false, 16, base);
  gl.vertexAttribPointer(GL.aCol, 4, gl.UNSIGNED_BYTE, true, 16, base + 12);
  gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, count);
}

function glPresent(){
  const gl = GL.gl, T = curTime();
  const dn = distMap.length ? districtAt(cam.x, cam.y) : 0;
  const DF = DISTRICT[dn].fog;
  const ins = !!inside;                        // indoors the horizon is a wall
  const fog = ins ? [0.028, 0.032, 0.05]
                  : T.fog.map((v, i) => (v * 0.66 + DF[i] * 0.34) / 255);
  const hz = clamp(0.5 + cam.pitch / Math.max(1, R.rows), 0.03, 0.97);

  const nw = glPackWorld();
  const nh = glPackHud(nw);
  gl.bindVertexArray(GL.vao);
  gl.bindBuffer(gl.ARRAY_BUFFER, GL.ibuf);
  gl.bufferSubData(gl.ARRAY_BUFFER, 0, GL.f32, 0, (nw + nh) * 4);

  // --- scene into a texture so bloom has something to read ---
  gl.bindFramebuffer(gl.FRAMEBUFFER, GL.scene.f);
  gl.viewport(0, 0, R.W, R.H);
  gl.disable(gl.BLEND);
  gl.clearColor(0, 0, 0, 1); gl.clear(gl.COLOR_BUFFER_BIT);
  gl.useProgram(GL.pBG);
  if (ins){
    gl.uniform3f(GL.uBG.uSky, 0.03, 0.035, 0.055);
    gl.uniform3f(GL.uBG.uMid, 0.028, 0.032, 0.05);
  } else {
    gl.uniform3f(GL.uBG.uSky, T.sky[0] / 255, T.sky[1] / 255, T.sky[2] / 255);
    gl.uniform3f(GL.uBG.uMid, (T.sky[0] * 0.35 + T.fog[0] * 0.65) / 255,
                              (T.sky[1] * 0.35 + T.fog[1] * 0.65) / 255,
                              (T.sky[2] * 0.35 + T.fog[2] * 0.65) / 255);
  }
  gl.uniform3f(GL.uBG.uFog, fog[0], fog[1], fog[2]);
  const gnd = CFG.timeMode === 2 && !ins ? 0.22 : 0.42;   // day ground stays dark
  gl.uniform3f(GL.uBG.uGround, fog[0] * gnd, fog[1] * gnd, fog[2] * gnd);
  gl.uniform1f(GL.uBG.uHz, hz);
  gl.bindVertexArray(GL.empty);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  gl.enable(gl.BLEND);
  glDrawGlyphs(0, nw);

  // --- to the screen, then bloom taps on top ---
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, R.W, R.H);
  gl.disable(gl.BLEND);
  gl.useProgram(GL.pPost);
  gl.uniform1i(GL.uP.uTex, 0);
  gl.uniform1f(GL.uP.uBright, 0);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, GL.scene.t);
  gl.bindVertexArray(GL.empty);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  if (bloomOn && CFG.timeMode !== 2){        // daylight drowns the neon anyway
    for (let i = 0; i < GL.tap.length; i++){
      const tp = GL.tap[i];
      gl.bindFramebuffer(gl.FRAMEBUFFER, tp.f);
      gl.viewport(0, 0, tp.w, tp.h);
      gl.useProgram(GL.pPost);
      gl.uniform1f(GL.uP.uBright, 1);
      gl.bindTexture(gl.TEXTURE_2D, GL.scene.t);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
      gl.bindFramebuffer(gl.FRAMEBUFFER, null);
      gl.viewport(0, 0, R.W, R.H);
      gl.enable(gl.BLEND);
      gl.blendFunc(gl.SRC_ALPHA, gl.ONE);
      gl.uniform1f(GL.uP.uBright, 0);
      gl.bindTexture(gl.TEXTURE_2D, tp.t);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
      if (smokeGlow > 0.02){                  // the haze doubles the halo
        for (let k = smokeGlow; k > 0.02; k -= 0.5)
          gl.drawArrays(gl.TRIANGLES, 0, 3);
      }
      gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
      gl.disable(gl.BLEND);
    }
  }
  gl.enable(gl.BLEND);

  if (flash > 0.01){
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE);
    glQuad(0, 0, R.W, R.H, 0.55, 0.63, 0.84, flash * 0.5);
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
  }
  if (fade > 0.01) glQuad(0, 0, R.W, R.H, 0.008, 0.012, 0.035, fade);
  if (hurtT > 0.01) glQuad(0, 0, R.W, R.H, 0.9, 0.1, 0.12, hurtT * 0.32);
  for (let i = 0; i < hudSolids.length; i += 4)
    glQuad(hudSolids[i], hudSolids[i + 1], hudSolids[i + 2], hudSolids[i + 3],
           0.012, 0.023, 0.047, 1);
  for (let i = 0; i < hudRects.length; i += 4)
    glQuad(hudRects[i], hudRects[i + 1], hudRects[i + 2], hudRects[i + 3], 0.012, 0.023, 0.047, 0.60);
  glDrawGlyphs(nw, nh);
}

/*-------------------------------- blit -------------------------------------*/
function blit(){
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, R.W, R.H);
  const cw = R.cellW, ch = R.cellH, ox = R.ox, oy = R.oy, cols = R.cols, rows = R.rows;
  for (let r = 0; r < rows; r++){
    const py = oy + r * ch, off = r * cols;
    for (let x = 0; x < cols; x++){
      const idx = off + x, g = gBuf[idx];
      if (g === 0) continue;
      ctx.drawImage(atlas[lBuf[idx]], g * cw, bBuf[idx] * ch, cw, ch, ox + x * cw, py, cw, ch);
    }
  }
  if (flash > 0.01){
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = 'rgba(140,160,215,' + (flash * 0.5).toFixed(3) + ')';
    ctx.fillRect(0, 0, R.W, R.H);
    ctx.globalCompositeOperation = 'source-over';
  }
  if (fade > 0.01){
    ctx.fillStyle = 'rgba(2,3,9,' + fade.toFixed(3) + ')';
    ctx.fillRect(0, 0, R.W, R.H);
  }
}

/*=============================== 15. HUD ===================================*/
let toastMsg = '', toastT = 0;
function toast(m){ toastMsg = m; toastT = 2.6; }
let hudR0 = 1e9, hudR1 = -1;
function hudStr(col, row, s, ci){
  if (row < 0 || row >= R.rows) return;
  if (row < hudR0) hudR0 = row;
  if (row > hudR1) hudR1 = row;
  for (let i = 0; i < s.length; i++){
    const c = col + i;
    if (c < 0 || c >= R.cols) continue;
    const code = s.charCodeAt(i) - 32;
    if (code < 0 || code > 94) continue;
    const idx = row * R.cols + c;
    hGlyph[idx] = code; hCol[idx] = ci;
  }
}
/* Panels only DIM what is behind them - sixty percent of a near-black over
   the world. That is right for a menu card you want the city faintly alive
   behind, and wrong for the thing in your hands: a glyph is mostly empty
   pixels, so at any lesser opacity the street shows through the gun you are
   holding. Anything in this list is painted flat first, at full opacity, so
   what sits on top of it is looked at rather than through.

   Runs, not cells: a weapon covers several hundred cells and that many
   fillRect calls a frame is a cost with nothing to show for it. One rect per
   unbroken horizontal span backs exactly the cells that were painted, so
   real gaps in the art - between the fingers, inside the trigger guard -
   stay gaps. */
const hudSolids = [];
function hudSolidRun(x, y, w){
  if (w > 0) hudSolids.push(R.ox + x * R.cellW, R.oy + y * R.cellH,
                            w * R.cellW, R.cellH);
}
const hudRects = [];
function hudPanel(x, y, w, h){
  hudRects.push(R.ox + x * R.cellW, R.oy + y * R.cellH, w * R.cellW, h * R.cellH);
  // a panel owns its cells: clear whatever the HUD drew under it
  const x1 = Math.min(R.cols, x + w), y1 = Math.min(R.rows, y + h);
  for (let r = Math.max(0, y); r < y1; r++){
    const off = r * R.cols;
    for (let c = Math.max(0, x); c < x1; c++){ hGlyph[off + c] = 0; }
  }
  if (y < hudR0) hudR0 = Math.max(0, y);
  if (y1 - 1 > hudR1) hudR1 = y1 - 1;
}
function hudBox(x, y, w, h, title){
  hudStr(x, y, '+' + '-'.repeat(Math.max(0, w - 2)) + '+', H_DIM);
  hudStr(x, y + h - 1, '+' + '-'.repeat(Math.max(0, w - 2)) + '+', H_DIM);
  for (let r = y + 1; r < y + h - 1; r++){ hudStr(x, r, '|', H_DIM); hudStr(x + w - 1, r, '|', H_DIM); }
  if (title) hudStr(x + 2, y, ' ' + title + ' ', H_GRN);
}
// Renders any list-menu mode: centred card, live right-aligned values, the
// selected item's hint along the bottom. Scrolls when the card cannot hold
// every item, which small grids and long inventories will both hit.
function drawListMenu(m){
  const items = m.items, cols = R.cols, rows = R.rows;
  let w = m.title.length + 8;
  for (const it of items){
    if (it.sep) continue;
    if (it.info){ w = Math.max(w, String(it.info).length + 8); continue; }
    const vl = it.value ? String(it.value()).length + 8 : 0;
    w = Math.max(w, it.label.length + vl + 8);
    if (it.hint) w = Math.max(w, it.hint.length + 4);
  }
  w = Math.min(w, cols - 2);
  const h = Math.min(rows - 2, items.length + 4);
  const x = (cols - w) >> 1, y = Math.max(1, ((rows - h) >> 1) - 1);
  hudPanel(0, 0, cols, rows);       // dim the whole frame behind the card
  hudPanel(x, y, w, h);             // and stack a second layer over the card
  hudBox(x, y, w, h, m.title);
  const maxIt = h - 4;
  const first = items.length > maxIt
    ? clamp(m.cursor - (maxIt >> 1), 0, items.length - maxIt) : 0;
  m.hit = { x, y, w, h, first };    // where the rows landed, for tapping
  for (let i = 0; i < Math.min(items.length, maxIt); i++){
    const it = items[first + i], r = y + 1 + i, sel = first + i === m.cursor;
    if (it.sep){ hudStr(x + 2, r, '-'.repeat(Math.max(0, w - 4)), H_GRN); continue; }
    if (it.info){ hudStr(x + 4, r, String(it.info).slice(0, w - 6), H_DIM); continue; }
    hudStr(x + 2, r, ((sel ? '> ' : '  ') + it.label).slice(0, w - 4), sel ? H_YEL : H_WHT);
    if (it.value){
      let v = String(it.value());
      if (it.adj) v = sel ? '< ' + v + ' >' : '  ' + v;
      hudStr(x + w - 3 - v.length, r, v, sel ? H_YEL : H_DIM);
    }
  }
  const cur = items[m.cursor];
  if (cur && cur.hint) hudStr(x + 2, y + h - 2, cur.hint.slice(0, w - 4), H_DIM);
}
function wrapText(s, w){
  const words = s.split(' '), lines = [];
  let cur = '';
  for (const wd of words){
    if (cur && cur.length + 1 + wd.length > w){ lines.push(cur); cur = wd; }
    else cur = cur ? cur + ' ' + wd : wd;
  }
  if (cur) lines.push(cur);
  return lines;
}
function drawDialog(m){
  const cols = R.cols, rows = R.rows;
  const w = Math.min(cols - 6, 72);
  const lines = wrapText(m.pages[m.idx], w - 6);
  const h = lines.length + 4;
  const x = (cols - w) >> 1;
  const y = TOUCH.on ? Math.max(1, ((rows - h) >> 1) - 2) : Math.max(1, rows - h - 8);
  hudPanel(x, y, w, h); hudPanel(x, y, w, h);
  hudBox(x, y, w, h, m.title);
  let shown = m.t0 < 0 ? 1e9 : ((performance.now() - m.t0) * 0.06) | 0;

    const x = Math.max(1, (cols - msg.length - 2) >> 1);
    hudPanel(x, (rows >> 1) + 3, msg.length + 2, 1);
    hudStr(x + 1, (rows >> 1) + 3, msg, H_GRN);
  }
  if (!topMode() && lookTarget){
    const msg = lookTarget.prompt;
    const x = Math.max(1, (cols - msg.length - 2) >> 1);
    hudPanel(x, (rows >> 1) + 5, msg.length + 2, 1);
    hudStr(x + 1, (rows >> 1) + 5, msg, H_GRN);
  }
  // ---- the run's clock: big, centre-top, counting down in your face ----
  if (RUN && !inside){
    const left = Math.max(0, RUN.t);
    const txt = left.toFixed(1) + 's';
    const sub2 = RUN.tricks ? RUN.tricks + ' tricks  +' + RUN.gained + 's' : 'hit the pipes';
    const w = Math.max(txt.length, sub2.length) + 2;
    const x = Math.max(1, (cols - w) >> 1);
    hudPanel(x, 1, w, 2);
    hudStr(x + 1 + ((w - 2 - txt.length) >> 1), 1, txt,
           left < 8 ? H_RED : left < 20 ? H_YEL : H_GRN);
    hudStr(x + 1 + ((w - 2 - sub2.length) >> 1), 2, sub2, H_DIM);
  }
  // ---- transient message: drawn last, above the arms, so nothing hides it ----
  if (toastT > 0 && toastMsg){
    const x = Math.max(1, (cols - toastMsg.length - 2) >> 1);
    const y = Math.max(1, rows - Math.round(rows * 0.46) - 2);
    hudPanel(x, y, toastMsg.length + 2, 1);
    hudStr(x + 1, y, toastMsg, H_YEL);
  }
  // ---- blit ----
  if (GL) return;                    // the GPU path draws panels and glyphs itself
  if (hurtT > 0.01){
    ctx.fillStyle = 'rgba(230,26,31,' + (hurtT * 0.32).toFixed(3) + ')';
    ctx.fillRect(0, 0, R.W, R.H);
  }
  ctx.fillStyle = 'rgb(3,6,12)';
  for (let i = 0; i < hudSolids.length; i += 4)
    ctx.fillRect(hudSolids[i], hudSolids[i + 1], hudSolids[i + 2], hudSolids[i + 3]);
  ctx.fillStyle = 'rgba(3,6,12,0.60)';
  for (let i = 0; i < hudRects.length; i += 4)
    ctx.fillRect(hudRects[i], hudRects[i + 1], hudRects[i + 2], hudRects[i + 3]);
  const cw = R.cellW, ch = R.cellH, ox = R.ox, oy = R.oy;
  for (let r = Math.max(0, hudR0); r <= Math.min(rows - 1, hudR1); r++){
    const py = oy + r * ch, off = r * cols;
    for (let x = 0; x < cols; x++){
      const idx = off + x, g = hGlyph[idx];
      if (g === 0) continue;
      ctx.drawImage(hudAtlas, g * cw, hCol[idx] * ch, cw, ch, ox + x * cw, py, cw, ch);
    }
  }
}

/*========================== 16. WORLD BOOTSTRAP ============================*/
function faceOpenStreet(){
  let bestD = -1, bestA = 0;
  for (let d = 0; d < 4; d++){
    let n = 0;
    for (; n < 44; n++){
      const x = (cam.x | 0) + DIRV[d][0] * (n + 1), y = (cam.y | 0) + DIRV[d][1] * (n + 1);
      if (!inMap(x, y) || tH[y * MAP + x] > 0) break;
    }
    if (n > bestD){ bestD = n; bestA = Math.atan2(DIRV[d][1], DIRV[d][0]); }
  }
  cam.ang = bestA;
}
function placePlayer(){
  cam.x = RW + 1.5; cam.y = RW + 1.5;
  outer:
  for (let r = 0; r < MAP; r++){
    for (let a = 0; a < 24; a++){
      const th = a / 24 * Math.PI * 2;
      const ix = (MAP * 0.5 + Math.cos(th) * r) | 0, iy = (MAP * 0.5 + Math.sin(th) * r) | 0;
      if (!inMap(ix, iy) || tType[iy * MAP + ix] !== T_WALK) continue;
      // A mid-block kerb (walk residue on exactly one axis) looks straight down
      // the street; a block corner dead-ends into the buildings opposite.
      const wx = residue(ix % P) === 1, wy = residue(iy % P) === 1;
      if (wx === wy) continue;
      if (propBlocked(ix + 0.5, iy + 0.5, 1.1)) continue;
      cam.x = ix + 0.5; cam.y = iy + 0.5;
      faceOpenStreet();
      // A lamp post two tiles away is 5 m of pole across the whole screen, so
      // require the first few metres of the view to be clear as well.
      let clear = true;
      for (let k = 1; k <= 6; k++){
        const fx = cam.x + Math.cos(cam.ang) * k, fy = cam.y + Math.sin(cam.ang) * k;
        if (solidAt(fx, fy) || propBlocked(fx, fy, 0.85)){ clear = false; break; }
      }
      if (clear) break outer;
    }
  }
  cam.riding = null; cam.z = 1.62; cam.pitch = 0;
}
function newWorld(seed){
  if (inside){          // never rebuild the city into the room's arrays
    tType = EXT.tType; tH = EXT.tH; tB = EXT.tB; walkG = EXT.walkG;
    props = EXT.props; signs = EXT.signs;
    inside = null;
  }
  worldSeed = seed;
  worldDelta = { taken: {} };
  // A race is state held outside the save file, pinned to a route through a
  // city that is about to stop existing. Starting or loading a game with one
  // still running leaves ramps indexed against a map that has been rebuilt
  // underneath them. loadGame comes through here too, so this covers both.
  RUN = null;
  resetPlayer();
  sitting = null; vAnim = null;
  buildCity(seed);
  bakeKey = -1;                // force the palette to settle on the clock
  indexProps();
  indexSpriteProps();
  spawnCars();
  spawnPeds();
  placePlayer();
  spawnActors();
  worldTime = 0;
  gridClear(carGrid); for (const c of cars) gridAdd(carGrid, c.x, c.y, c);
  gridClear(pedGrid); for (const p of peds) gridAdd(pedGrid, p.x, p.y, p);
  buildBackground();
}

/*============================== 17. MAIN LOOP ==============================*/
function simulate(dt){
  if (!inside){       // the street holds its breath while you are indoors
    gridClear(carGrid); for (let i = 0; i < cars.length; i++) gridAdd(carGrid, cars[i].x, cars[i].y, cars[i]);
    gridClear(pedGrid); for (let i = 0; i < peds.length; i++) gridAdd(pedGrid, peds[i].x, peds[i].y, peds[i]);
    streamAgents();
    serviceRepaths();
    for (let i = 0; i < cars.length; i++) updateCar(cars[i], dt);
    for (let i = 0; i < peds.length; i++) updatePed(peds[i], i, dt);
  }
  for (let i = 0; i < actors.length; i++){
    const a = actors[i];
    if (!!a.interior !== !!inside) continue;
    updateActor(a, dt);
  }
  for (let i = fxs.length - 1; i >= 0; i--){
    fxs[i].t -= dt;
    if (fxs[i].t <= 0) fxs.splice(i, 1);
  }
  if (!inside){ heliFrame(dt); hideFrame(dt); wayTick(dt); runFrame(dt); }
  if (player.car && !myCar && DEALER)           // the save remembers the keys
    spawnMyCar(player.car === 'lux' ? 'lux' : 'runner',
               player.carX || DEALER.lot.x, player.carY || DEALER.lot.y);
}
function render(){
  statRays = 0; statCells = 0;
  const cols = R.cols;
  // clear days keep the far skyline solid; haze and darkness dissolve it
  densK = (CFG.timeMode === 2 && weather !== 3) ? 0.4 : 0.74;
  gBuf.fill(0); dBuf.fill(1e30);
  dirX = Math.cos(cam.ang); dirY = Math.sin(cam.ang);
  planeLen = Math.tan(CFG.FOV * 0.5);
  // The camera plane used to point the wrong way round, so the whole world
  // rendered as its own mirror image: facing north put world-EAST on the
  // left of the screen. Everything downstream had been bent to match - the
  // maps drew east-left, the controls strafed backwards, the painted street
  // numbers were reversed. This is the one sign that caused all of it.
  planeX = -dirY * planeLen; planeY = dirX * planeLen;
  projRows = (cols * R.cellW) / (2 * planeLen * R.cellH);
  horizon = R.rows * 0.5 + cam.pitch;
  hzRow = clamp(Math.floor(horizon), 0, R.rows - 1);
  const amp = weather === 2 ? 1.5 : weather === 1 ? 0.9 : 0.55;
  for (let x = 0; x < cols; x++){
    const cxn = 2 * (x + 0.5) / cols - 1;
    rayX[x] = dirX + planeX * cxn;
    rayY[x] = dirY + planeY * cxn;
    refWob[x] = Math.sin(worldTime * 2.1 + x * 0.42) * amp;
  }
  refBuf.fill(0);
  srcBuf.fill(0);
  if (inside) ceilingPass(); else skyPass();
  floorPass();
  wallPass();
  spritePass();
  if (!inside){
    signPass();
    reflectPass();
    rainPass();
  }
  if (GL){
    hudPass();                       // fills the HUD layer; GPU draws it
    glPresent();
  } else {
    blit();
    if (CFG.timeMode !== 2) bloomPass();
    hudPass();
  }
}
let lastT = 0, fpsAcc = 0, fpsN = 0, workAcc = 0, workN = 0, autoRes = false;
function frame(now){
  requestAnimationFrame(frame);
  if (!lastT) lastT = now;
  let dt = (now - lastT) / 1000; lastT = now;
  if (dt > 0.1) dt = 0.1;
  if (dt < 0) dt = 0;
  if (hitStopT > 0){ hitStopT -= dt; dt *= 0.08; }   // impact holds the world
  const w0 = performance.now();
  if (!worldFrozen()){
    drugTick(dt);
    smokeGlow += ((smoking() ? 1 : 0) - smokeGlow) * Math.min(1, dt * 1.6);
    if (jamT > 0) jamT -= dt;
    if (snifferT > 0){
      snifferT -= dt;
      if (snifferT <= 0){
        snifSeen.clear();
        toast('the chip goes quiet');
        sfx('ui_back', { rate: 0.5, vol: 0.4 });
      }
    }
    const ts = drugFx('tScale', 1);       // overclock: the world runs slow, you do not
    worldTime += dt * ts; simulate(dt * ts);
    updateClock(dt * ts);
    wxUpdate(dt * ts);
    if (weather === 2){
      nextBolt -= dt;
      if (nextBolt <= 0){
        flash = 1; nextBolt = 3.5 + Math.random() * 11;
        sfx('thunder', { vol: 0.6 + Math.random() * 0.4,
                         rate: 0.85 + Math.random() * 0.3,
                         pan: Math.random() * 1.6 - 0.8 });
      }
    }
    qAcc += dt;
    if (qAcc > 0.5){ qAcc = 0; checkQuests(); }
    flash *= Math.pow(0.05, dt);
  }
  fade *= Math.pow(0.02, dt);
  muzzleT = Math.max(0, muzzleT - dt);
  shotCool = Math.max(0, shotCool - dt);
  if (punchT > 0){
    const eOld = punchDur - punchT;
    punchT = Math.max(0, punchT - dt);
    if (strikeArmed && eOld < strikeAt && punchDur - punchT >= strikeAt){
      strikeArmed = false;
      strikeLand();                            // damage lands at contact, not click
    }
  }
  hurtT = Math.max(0, hurtT - dt * 2.2 * drugFx('hurtFast', 1));
  if (!topMode() && vAnim){
    vAnim.t += dt;
    if (vAnim.t > vAnim.d.dur){
      if (vAnim.loop) vAnim.t -= vAnim.d.dur;  // draw, exhale, draw again
      else vAnim = null;
    }
  }
  // out in the fields the eye carries much further - and in the wilderness
  // further still, far enough to take in the whole skyline. Fog remains a
  // CEILING on how far you can see at all.
  const pz = zoneAt(clamp((cam.x / P) | 0, 0, NB - 1), clamp((cam.y / P) | 0, 0, NB - 1));
  const wantD = inside ? 13
              : CFG.MAXD * (pz >= 4 ? 3.4 : pz === 3 ? 1.85 : 1) *
                (weather === 3 ? 1 - fogLevel * 1.6 : 1);
  viewD += (wantD - viewD) * Math.min(1, dt * 0.7);
  if (!topMode()) updateCam(dt);
  probeInteract();
  audioFrame(dt);
  buildBackground();
  // the ride leans on the camera: slow sway or stimulant jitter, render-only
  let wo = 0, wp = 0;
  if (drug){
    const wob = drugFx('wob', 0), shk = drugFx('shake', 0);
    wo = wob * 0.045 * Math.sin(worldTime * 0.9) + shk * 0.012 * (Math.random() * 2 - 1);
    wp = wob * 1.7 * Math.sin(worldTime * 0.63 + 1.7) + shk * 0.6 * (Math.random() * 2 - 1);
    cam.ang += wo; cam.pitch += wp;
  }
  render();
  if (wo || wp){ cam.ang -= wo; cam.pitch -= wp; }
  if (toastT > 0) toastT -= dt;
  workAcc += performance.now() - w0; workN++;
  fpsAcc += dt; fpsN++;
  if (fpsAcc > 0.4){ fps = fpsN / fpsAcc; fpsAcc = 0; fpsN = 0; }
  // If a frame's real work stays above ~14 ms this machine cannot hold 60 fps
  // at this character density, so drop one step and try again.
  if (workN >= 90){
    const avg = workAcc / workN; workAcc = 0; workN = 0;
    if (!CFG.manualRes && avg > 14 && CFG.resIdx > 0){
      CFG.resIdx--; autoRes = true; initRender();
      toast('auto-res: frame time high, coarser grid ' + R.cols + 'x' + R.rows + '  ([ ] to override)');
    }
  }
}
let rzT = 0;
addEventListener('resize', () => { clearTimeout(rzT); rzT = setTimeout(initRender, 180); });
function boot(){
  initRender();
  newWorld(20260818);
  document.getElementById('boot').classList.add('hidden');
  requestAnimationFrame(frame);
  try {
    if (!localStorage.getItem('asciiCityMet')){   // a first-run welcome
      localStorage.setItem('asciiCityMet', '1');
      setTimeout(() => openDialog('ASCII CITY', [
        'JAN 13, 2420. You own a coat that is not warm and one hundred twenty ' +
        'credits that will not last. The kiosks sign their trades - TOOLS, ' +
        'THREADS, DISPENSARY, ARMS, GOLD. People with names talk back.',
        'The cameras count you. Stay clean or pay the fixer to forget. ' +
        'Someone by the stalls looks hungrier than you. Start there. ' +
        '[SPACE] to reach anything, TAB for your pockets, M for the map.'
      ]), 700);
    }
  } catch (e){}
}
boot();
</script>

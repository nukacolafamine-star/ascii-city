/*=========================== 13i2. THE CITY MAP ============================
  A full-screen chart of all 4 km2: pan with WASD or a drag, zoom with Q/E,
  read the street names. Avenues run east-west and carry names hashed from
  the seed; the numbered streets run north-south. Landmarks and districts
  label themselves at the right zooms. M opens it; the corner minimap stays
  a pause-menu toggle.
============================================================================*/
/* the lattice names itself: avenues are letters, streets are numbers, and
   every crossing is an id like C7 - painted on the sidewalk at the corner */
let signFloor = Object.create(null);       // tile id -> character painted there
function aveLetter(k){
  let s = ''; k--;
  do { s = String.fromCharCode(65 + k % 26) + s; k = ((k / 26) | 0) - 1; } while (k >= 0);
  return s;
}
function xingId(k2, k){ return aveLetter(k) + k2; }
function stampIntersectionIds(){
  signFloor = Object.create(null);
  for (let k = 1; k < NB; k++)             // avenues run east-west (y lattice)
    for (let k2 = 1; k2 < NB; k2++){       // streets run north-south (x lattice)
      if (zoneAt(k2, k) >= 4) continue;
      const rx = k2 * P + (RW >> 1), ry = k * P + (RW >> 1);
      const tc = tType[ry * MAP + rx];     // the crossing must actually exist
      if (tc !== T_CROSS && tc !== T_ROAD) continue;
      const id = xingId(k2, k);
      // dead centre of the crossing: the one place in the city nothing is
      // ever built on, planted in, or parked over
      const y0 = k * P + (RW >> 1);
      const x0 = k2 * P + (RW >> 1) - (id.length >> 1);
      let ok = true;
      for (let i = 0; i < id.length; i++){
        const tt = tType[y0 * MAP + x0 + i];
        if (tt !== T_CROSS && tt !== T_ROAD){ ok = false; break; }
      }
      if (!ok) continue;
      for (let i = 0; i < id.length; i++)
        signFloor[y0 * MAP + x0 + i] = id[i];
    }
}
function openMap(){
  // region labels: the centroid of each named place's blocks
  const acc = {};
  for (let bj = 0; bj < NB; bj++)
    for (let bi = 0; bi < NB; bi++){
      if (zoneAt(bi, bj) >= 4) continue;
      const r = regMap[bj * NB + bi];
      (acc[r] = acc[r] || { x: 0, y: 0, n: 0 });
      acc[r].x += bi; acc[r].y += bj; acc[r].n++;
    }
  const dlbl = Object.keys(acc).map(r => ({
    r: +r, name: REGIONS[r].name,
    x: (acc[r].x / acc[r].n + 0.5) * P, y: (acc[r].y / acc[r].n + 0.5) * P }));
  // a ring's centroid lands outside itself (THE FIELDS sits on the city
  // centre) - shove such labels onto the region's northern arm instead
  for (const L of dlbl){
    const bi = clamp((L.x / P) | 0, 0, NB - 1), bj = clamp((L.y / P) | 0, 0, NB - 1);
    if (zoneAt(bi, bj) < 4 && regMap[bj * NB + bi] === L.r) continue;
    let x = 0, y = 0, n = 0;
    for (let bj2 = 0; bj2 < NB >> 1; bj2++)
      for (let bi2 = 0; bi2 < NB; bi2++)
        if (zoneAt(bi2, bj2) < 4 && regMap[bj2 * NB + bi2] === L.r){ x += bi2; y += bj2; n++; }
    if (n){ L.x = (x / n + 0.5) * P; L.y = (y / n + 0.5) * P; }
  }
  pushMode({
    name: 'map', pausesWorld: true,
    cx: cam.x, cy: cam.y, z: 2, dlbl,
    onKey(code){
      // a tap nudges one tile; only a HELD key builds up speed
      const now = performance.now();
      if (now - (this.panT || 0) > 260) this.panN = 0;
      const step = this.panN < 3 ? 1 : this.panN < 9 ? this.z * 2 : this.z * 6;
      const pan = () => { this.panT = now; this.panN = (this.panN || 0) + 1; };
      switch (code){
        case 'KeyW': case 'ArrowUp':    this.cy -= step; pan(); break;
        case 'KeyS': case 'ArrowDown':  this.cy += step; pan(); break;
        case 'KeyA': case 'ArrowLeft':  this.cx -= step; pan(); break;
        case 'KeyD': case 'ArrowRight': this.cx += step; pan(); break;
        case 'KeyQ': case 'BracketLeft':  this.z = Math.min(8, this.z * 2); sfx('ui_move', { vol: 0.4 }); break;
        case 'KeyE': case 'BracketRight': this.z = Math.max(1, this.z / 2); sfx('ui_move', { vol: 0.4 }); break;
        case 'Enter':                          // drop the line at the crosshair
          setWaypoint(this.cx, this.cy); break;
        case 'KeyX':
          clearWaypoint(true); toast('waypoint cleared'); break;
        case 'KeyM': case 'Escape': case 'Space': case 'Tab':
          popMode(); sfx('ui_back', { vol: 0.5 }); break;
      }
      this.cx = clamp(this.cx, 0, MAP); this.cy = clamp(this.cy, 0, MAP);
    },
    drag(dx, dy){                              // grab the paper and pull it
      this.cx = clamp(this.cx - dx / R.cellW * this.z, 0, MAP);
      this.cy = clamp(this.cy - dy / R.cellH * this.z * 1.8, 0, MAP);
    },
    tap(cx, cy){
      if (cy <= 4 && cx >= R.cols - 8){         // the corner zoom buttons
        if (cy <= 2) this.onKey('KeyQ'); else this.onKey('KeyE');
        return;
      }
      if (cy >= R.rows - 3){ this.onKey('Escape'); return; }
      // anywhere else: that is where you want to go
      const wx = this.cx + (cx - R.cols / 2) * this.z;
      const wy = this.cy + (cy - R.rows / 2) * this.z * 1.8;
      setWaypoint(wx, wy);
    },
    draw(){ drawMapMode(this); }
  });
  sfx('ui_select', { vol: 0.5 });
}
/* what one door means on a map: a letter and a colour, or nothing when the
   room behind it is just somebody's hallway */
const TRADE_TAG = { tools: ['T', H_GRN], armory: ['A', H_RED],
                    dispensary: ['D', H_PUR], jeweler: ['J', H_YEL],
                    clothier: ['C', H_BLU], grocery: ['M', H_GRN],
                    bodega: ['B', H_GRN], general: ['G', H_WHT] };
function doorTag(bldId){
  const b = buildings[bldId];
  if (!b) return null;
  if (homeAt(bldId)) return ['H', H_WHT];
  const sw = specialWordFor(b);
  if (sw){
    if (sw === 'LUCKY LUCKY' || sw === 'VELVET WHEEL' ||
        sw === 'PACHINKO' || sw === 'HIGH-LOW') return ['$', H_YEL];
    if (sw === 'VELVET ROOM' || sw === 'NEON GARDEN' ||
        sw === 'SIGNAL HOUSE' || sw === 'STEAM SILK') return ['X', H_PUR];
    return ['W', H_RED];                        // the condemned towers
  }
  const u = buildingUse(b);
  if (u && USES[u] && USES[u].trade) return TRADE_TAG[USES[u].trade] || null;
  return u && !USES[u].kind ? ['?', H_DIM] : null;   // a door onto nothing yet
}
/* One map cell covers a patch of city, and at anything past the closest zoom
   that patch is many tiles wide. Reading a single tile out of the middle of
   it meant a tower was drawn only if the lattice happened to land on it - so
   panning re-diced every block and the structures appeared to squirm. The
   cell now takes the MAJORITY type under its whole footprint: a block stays
   a block, a street stays a street, and the picture is the same picture
   however you arrive at it. Ties go to the heavier structure. */
const MAP_RANK = new Int8Array(16);
(function(){ MAP_RANK[T_BLD] = 6; MAP_RANK[T_WATER] = 5; MAP_RANK[T_BRIDGE] = 4;
             MAP_RANK[T_CROSS] = 3; MAP_RANK[T_ROAD] = 3; MAP_RANK[T_WALK] = 2;
             MAP_RANK[T_PATH] = 1; MAP_RANK[T_LOT] = 0; })();
const _mapCnt = new Int32Array(16), _mapSeen = new Int32Array(16);
function mapTileAt(wx, wy, sw, sh){
  const nx = sw < 2 ? 1 : sw < 3 ? 2 : sw < 4 ? 3 : 4;
  const ny = sh < 2 ? 1 : sh < 3 ? 2 : sh < 4 ? 3 : 4;
  if (nx === 1 && ny === 1){                   // one tile under it, one answer
    const tx = (wx + sw * 0.5) | 0, ty = (wy + sh * 0.5) | 0;
    return inMap(tx, ty) ? tType[ty * MAP + tx] : -1;
  }
  let best = -1, bn = 0, nt = 0;
  for (let j = 0; j < ny; j++){
    const ty = (wy + (j + 0.5) * sh / ny) | 0;
    for (let i = 0; i < nx; i++){
      const tx = (wx + (i + 0.5) * sw / nx) | 0;
      if (!inMap(tx, ty)) continue;
      const t = tType[ty * MAP + tx];
      if (!_mapCnt[t]) _mapSeen[nt++] = t;
      const c = ++_mapCnt[t];
      if (c > bn || (c === bn && best >= 0 && MAP_RANK[t] > MAP_RANK[best])){
        bn = c; best = t;
      }
    }
  }
  while (nt) _mapCnt[_mapSeen[--nt]] = 0;      // clear only what we touched
  return bn ? best : -1;
}
function drawMapMode(m){
  const cols = R.cols, rows = R.rows;
  hudPanel(0, 0, cols, rows); hudPanel(0, 0, cols, rows);
  const za = m.z * 1.8;                        // cells are tall; rows cover more
  // Pin the sample lattice to the world rather than the screen, so panning
  // slides the map rigidly instead of resampling it under your thumb.
  const ox = Math.round(m.cx / m.z) * m.z, oy = Math.round(m.cy / za) * za;
  for (let r = 1; r < rows - 1; r++){
    const wy = oy + (r - rows / 2) * za;
    for (let x = 0; x < cols; x++){
      // east right, the same way round as the view and as every symbol that
      // gets drawn on top of this - these two used to disagree, and the
      // terrain was mirrored under the doors, landmarks and the player
      const wx = ox + (x - cols / 2) * m.z;
      const t = mapTileAt(wx, wy, m.z, za);
      if (t < 0) continue;
      if (t === T_BLD) hudCell(x, r, '#', H_GRY);
      else if (t === T_WATER) hudCell(x, r, '~', H_BLU);
      else if (t === T_BRIDGE) hudCell(x, r, '=', H_DIM);
      else if (t === T_ROAD || t === T_CROSS) hudCell(x, r, '.', H_DIM);
      else if (t === T_WALK) hudCell(x, r, ':', H_DRK);
      else if (t === T_PATH) hudCell(x, r, ',', H_GRN);
      else if (t === T_LOT) hudCell(x, r, '"', H_DRK);
    }
  }
  const sx = wx => ((wx - m.cx) / m.z + cols / 2) | 0;
  const sy = wy => ((wy - m.cy) / za + rows / 2) | 0;
  // intersection ids at close zoom
  if (m.z <= 2){
    for (let k = 1; k < NB; k++)
      for (let k2 = 1; k2 < NB; k2++){
        if (zoneAt(k2, k) >= 4) continue;
        const x = sx(k2 * P + RW / 2), y = sy(k * P + RW / 2);
        if (y <= 2 || y >= rows - 2 || x < 1 || x >= cols - 5) continue;
        hudStr(x + 1, y, xingId(k2, k), H_DIM);
      }
  }
  // district names at far zoom - drawn whole and never over each other
  if (m.z >= 4){
    const placed = [];
    for (const d of m.dlbl){
      const x = sx(d.x) - (d.name.length >> 1), y = sy(d.y);
      if (y <= 1 || y >= rows - 2 || x < 1 || x + d.name.length > cols - 1) continue;
      if (placed.some(p => Math.abs(p.y - y) < 2 && x < p.x1 + 2 && x + d.name.length > p.x0 - 2)) continue;
      placed.push({ x0: x, x1: x + d.name.length, y });
      hudStr(x, y, d.name, H_PUR);
    }
  }
  // every trade and venue announces itself at close zoom - a symbol per
  // door, coloured by what is behind it
  if (m.z <= 2){
    for (const d of doors){
      const x = sx(d.x), y = sy(d.y);
      if (x < 1 || x >= cols - 1 || y < 2 || y >= rows - 2) continue;
      const t = doorTag(d.b);
      if (t) hudCell(x, y, t[0], t[1]);
    }
    const leg = 'T tools  A arms  D disp  J gold  C threads  M market  ' +
                'B bodega  G goods  $ casino  X parlor  W condemned  H home';
    hudStr(Math.max(1, (cols - leg.length) >> 1), rows - 2, leg.slice(0, cols - 2), H_DIM);
  }
  // landmarks
  if (m.z <= 4)
    for (const l of landmarks){
      const x = sx(l.x), y = sy(l.y);
      if (x < 1 || x >= cols - 1 || y < 2 || y >= rows - 2) continue;
      hudCell(x, y, '*', H_YEL);
      if (m.z <= 2) hudStr(x + 2, y, l.name, H_YEL);
    }
  // the player, and the trail you should follow
  // the pan crosshair: where ENTER will drop the line
  hudCell(cols >> 1, (rows >> 1), '+', H_DIM);
  if (waypoint){
    const wxs = sx(waypoint.x), wys = sy(waypoint.y);
    if (wxs >= 1 && wxs < cols - 1 && wys >= 2 && wys < rows - 2)
      hudCell(wxs, wys, 'O', H_RED);
  }
  const px2 = sx(cam.x), py2 = sy(cam.y);
  if (px2 >= 0 && px2 < cols && py2 >= 1 && py2 < rows - 1){
    const pc2 = ((Date.now() / 280) | 0) & 1 ? H_YEL : H_WHT;
    const ring = [[-3, 0, '('], [3, 0, ')'], [0, -2, '-'], [0, 2, '-'],
                  [-2, -1, '.'], [2, -1, '.'], [-2, 1, '.'], [2, 1, '.']];
    for (const [dx2, dy2, ch2] of ring){
      const rx2 = px2 + dx2, ry2 = py2 + dy2;
      if (rx2 >= 0 && rx2 < cols && ry2 >= 1 && ry2 < rows - 1) hudCell(rx2, ry2, ch2, pc2);
    }
    // ang 0 is +x, which is EAST, which is now screen right
    const dirCh = '>v<^'[((Math.round(cam.ang / (Math.PI / 2)) % 4) + 4) % 4];
    hudCell(px2, py2, dirCh, pc2);
  }

  const qt = questTarget();
  if (qt){
    const pulse = ((Date.now() / 300) | 0) & 1;     // world is paused in here
    const x = sx(qt.x), y = sy(qt.y);
    if (x >= 1 && x < cols - 1 && y >= 2 && y < rows - 2){
      hudCell(x, y, pulse ? '!' : '*', H_YEL);
      if (qt.name && x + 2 + qt.name.length < cols - 1)
        hudStr(x + 2, y, qt.name, H_YEL);
    } else {                                        // off the edge: point at it
      const cx2 = clamp(x, 1, cols - 2), cy2 = clamp(y, 2, rows - 3);
      const dx2 = x - cx2, dy2 = y - cy2;
      const ch = Math.abs(dx2) >= Math.abs(dy2) ? (dx2 < 0 ? '<' : '>') : (dy2 < 0 ? '^' : 'v');
      hudCell(cx2, cy2, pulse ? ch : '!', H_YEL);
    }
  }
  // chrome
  hudStr(2, 0, ' CITY MAP  x' + m.z + ' ', H_GRN);
  hudStr(cols - 8, 1, '[ + ]', H_GRN);
  hudStr(cols - 8, 3, '[ - ]', H_GRN);
  const foot = 'WASD pan   Q/E zoom   tap/ENTER set waypoint   X clear   M close';
  hudStr((cols - foot.length) >> 1, rows - 1, foot, H_DIM);
}

/*=========================== 13i. TOUCH ====================================
  The whole game on glass. A floating analog stick on the left thumb (push
  to the rim to sprint), drag anywhere else to look, and a small cluster of
  buttons: FIRE, ACT (context-aware - it knows when you are seated), and a
  utility row. Menus and dialogs are tapped directly - every row is a
  button - and a tap past the card backs out. Enabled automatically on
  coarse-pointer devices; DOM overlay, so the engine never knows.
============================================================================*/
const TOUCH = { on: false, f: 0, s: 0 };
function touchWanted(){
  try { return matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window; }
  catch (e){ return false; }
}
function touchCell(px, py){ return [((px - R.ox) / R.cellW) | 0, ((py - R.oy) / R.cellH) | 0]; }
function touchTap(px, py){
  const m = topMode();
  if (m){
    const c = touchCell(px, py);
    if (m.tap) m.tap(c[0], c[1]);
    else if (m.onKey) m.onKey('Space');
    return;
  }
  if (!sitting && lookTarget) tryInteract();
}
let touchUI = null;
function buildTouchUI(){
  if (touchUI) return;
  TOUCH.on = true;
  showHelp = false;                          // keyboard help is noise on glass
  showMap = false;                           // the MAP button brings it back
  const root = document.createElement('div');
  root.id = 'touchui';
  root.style.cssText = 'position:fixed;inset:0;pointer-events:none;z-index:20;' +
    'font:11px "Cascadia Mono","Consolas",monospace;-webkit-user-select:none;user-select:none;';
  const mkBtn = (label, css, fn, hold, passthru) => {
    const b = document.createElement('div');
    b.textContent = label;
    b.style.cssText = 'position:absolute;pointer-events:auto;display:flex;align-items:center;' +
      'justify-content:center;color:#8ff0c0;background:rgba(4,8,14,.55);' +
      'border:1px solid rgba(143,240,192,.5);border-radius:50%;touch-action:none;' +
      'letter-spacing:.5px;' + css;
    let rep = null;
    b.addEventListener('pointerdown', e => {
      e.preventDefault(); e.stopPropagation();
      audioUnlock();
      if (passthru && topMode()){            // a card is open: the tap is FOR the card
        touchTap(e.clientX, e.clientY);
        return;
      }
      b.style.background = 'rgba(143,240,192,.25)';
      fn();
      if (hold) rep = setInterval(fn, 270);
    });
    const up = () => { b.style.background = 'rgba(4,8,14,.55)'; if (rep){ clearInterval(rep); rep = null; } };
    b.addEventListener('pointerup', up);
    b.addEventListener('pointercancel', up);
    root.appendChild(b);
    return b;
  };
  // ---- the stick: floats to wherever the thumb lands ----------------------
  const zone = document.createElement('div');
  zone.style.cssText = 'position:absolute;left:0;bottom:0;width:44vw;height:46vh;' +
    'pointer-events:auto;touch-action:none;';
  const base = document.createElement('div');
  base.style.cssText = 'position:absolute;width:104px;height:104px;border-radius:50%;' +
    'border:1px solid rgba(143,240,192,.4);background:rgba(4,8,14,.3);display:none;' +
    'margin:-52px 0 0 -52px;pointer-events:none;';

    act.style.borderColor = (!menuUp && (lookTarget || sitting)) ? '#ffd166' : 'rgba(143,240,192,.5)';

/*============================== 14. RENDERER ===============================*/
let dirX = 1, dirY = 0, planeX = 0, planeY = -1, planeLen = 1;
let projRows = 40, horizon = 0, hzRow = 0;
let rayX = null, rayY = null, skyA = null, sunD = null, refWob = null;
let _wd = 0, _wb = 0, _wwet = 0, _wg = -1;  // surface sample out-params
let bloomOn = true, weather = 0, flash = 0, nextBolt = 5, fade = 0;
let fogLevel = 0.25;    // rolled fresh each time fog weather arrives
// Distance fog: night and dusk carry their haze always; a clear day carries
// none at all. Fog weather lays a rolled thickness over the day - capped at
// two thirds of the haze the old daytime look used.
function fogScale(){
  const base = CFG.timeMode === 2 ? 0 : 1;
  return weather === 3 ? Math.max(base, fogLevel) : base;
}
let viewD = CFG.MAXD;                    // eases outward once you leave the city
let metroStops = [];
function inFields(x, y){
  return zoneAt(clamp((x / P) | 0, 0, NB - 1), clamp((y / P) | 0, 0, NB - 1)) >= 3;
}
let bloomCv = [];
const G_SLASH = GI['/'], G_TICK = GI[String.fromCharCode(39)];
let statRays = 0, statCells = 0, statSprites = 0;
const CELL_BUDGET = 17000;

function initRender(){
  R.W = cv.width  = Math.max(320, window.innerWidth  | 0);
  R.H = cv.height = Math.max(240, window.innerHeight | 0);
  cv.style.width = R.W + 'px'; cv.style.height = R.H + 'px';
  if (GL === null && !glTried){ glTried = true; GL = glInit(); }
  const budget = GL ? 140000 : CELL_BUDGET;   // the GPU does not care about cell count
  let ri = CFG.resIdx, cw, ch;
  for (;;){
    cw = CFG.CELLW[ri]; ch = Math.max(7, Math.round(cw / 0.56));
    if (CFG.manualRes || ri === 0) break;   // an explicit choice always wins
    if (Math.floor(R.W / cw) * Math.floor(R.H / ch) <= budget) break;
    ri--;                        // first run on a big display: start coarser
  }
  CFG.resIdx = ri;
  R.cellW = cw; R.cellH = ch;
  R.cols = Math.max(24, Math.floor(R.W / cw));
  R.rows = Math.max(14, Math.floor(R.H / ch));
  R.ox = ((R.W - R.cols * cw) * 0.5) | 0;
  R.oy = ((R.H - R.rows * ch) * 0.5) | 0;
  bgGrad = null;
  const n = R.cols * R.rows;
  gBuf = new Uint8Array(n); bBuf = new Uint8Array(n);
  lBuf = new Uint8Array(n); dBuf = new Float32Array(n);
  hGlyph = new Uint8Array(n); hCol = new Uint8Array(n);
  refBuf = new Uint8Array(n);
  srcBuf = new Uint8Array(n);
  rayX = new Float32Array(R.cols); rayY = new Float32Array(R.cols);
  skyA = new Int32Array(R.cols);
  sunD = new Float32Array(R.cols);
  refWob = new Float32Array(R.cols);
  ctx.imageSmoothingEnabled = false;
  if (GL){
    view = glv; cv.style.display = 'none'; glv.style.display = 'block';
    glResize();
  } else {
    initBloom();
    buildAtlases();
  }
  buildBackground();
}

/*------------------------------- sky ---------------------------------------*/
function skyPass(){
  const cols = R.cols, rows = R.rows;
  const hz = clamp(Math.floor(horizon), 0, rows);
  const night = CFG.timeMode === 0 ? 1 : CFG.timeMode === 1 ? 0.5 : 0;
  // The sun hangs at a fixed world azimuth: high and white by day, low and
  // burning on the horizon at dusk. Never at night.
  const SUN_AZ = 2.35, sunOn = CFG.timeMode !== 0;
  // the sun rides an arc: low at 06:30, high at noon, low again by 18:30
  const elev = Math.sin(clamp((clock - 6.5) / 12, 0, 1) * Math.PI);
  const sunRow = CFG.timeMode === 2 ? hz * (1 - 0.72 * elev) : hz * 0.9;
  const sunCol = sunOn ? C.nWhite : 0;
  const sunGlow = CFG.timeMode === 2 ? C.nWhite : C.nAmber;
  const colPerRad = cols / CFG.FOV;
  // the ray angle only varies across columns, so hoist it out of the row loop
  for (let x = 0; x < cols; x++){
    const a = Math.atan2(rayY[x], rayX[x]);
    skyA[x] = (a * 96) | 0;
    let da = a - SUN_AZ;
    da = Math.atan2(Math.sin(da), Math.cos(da));
    sunD[x] = da * colPerRad;
  }
  // The horizon glow lives HERE, as sky cells, so buildings occlude it - the
  // background gradient itself carries no glow band to shine through them.
  const glowMat = CFG.timeMode === 1 ? C.glowDusk : CFG.timeMode === 2 ? C.lineW : C.skyGlow;
  const glowAmp = CFG.timeMode === 2 ? 0.14 : 0.8;
  for (let r = 0; r < hz; r++){
    const up = (hz - r) / Math.max(1, hz);          // 0 at horizon, 1 at zenith
    const glowD = Math.pow(1 - up, 2.5) * glowAmp;
    for (let x = 0; x < cols; x++){
      const idx = r * cols + x;
      const hs = hash3(skyA[x], (r - horizon) | 0, 11);
      let dens = glowD, base = glowMat;
      if (night > 0 && hs < 0.007 * up * night){ dens = 0.45 + hs * 24; base = C.nWhite; }
      else if (night > 0 && hs < 0.05) dens += 0.05;   // texture suits dark skies only
      if (sunOn){
        const day = CFG.timeMode === 2;
        const dy = (r - sunRow) * 2, q = sunD[x] * sunD[x] + dy * dy;
        if (q < (day ? 9 : 24)){ dens = 1; base = day ? C.nWhite : C.nAmber; }
        else if (q < (day ? 34 : 170)){
          const halo = (day ? 0.3 : 0.55) - q / (day ? 160 : 380);
          if (halo > dens){ dens = halo; base = day ? C.lineW : sunGlow; }
        }
      }
      const g = Math.round(clamp(dens, 0, 1) * RMAX);
      if (g === 0) continue;
      gBuf[idx] = g; bBuf[idx] = base; lBuf[idx] = 3;
    }
  }
}

/*------------------------- floor / ground plane ----------------------------*/
/* Two perpendicular sines cross into a field of blobs. Waves instead run as
   long crests parallel to the banks, so the coordinate that varies fast is
   the one across the channel, and it meanders slowly along it. Lifted out of
   floorSample so the deep pass can shade the river where the surface tile
   says BRIDGE - the water runs under a deck, it does not stop at one. */
function waterShade(wx, wy){
  const cross = wy - riverMid(wx);
  const band = cross * 1.05
             + Math.sin(wx * 0.055 + worldTime * 0.33) * 1.8
             + Math.sin(wx * 0.131 - worldTime * 0.61) * 0.7;
  const w1 = Math.sin(band * 1.55 + worldTime * 0.85)
           + 0.55 * Math.sin(band * 3.7 - worldTime * 1.55);
  _wb = w1 > 0.45 ? C.water : C.waterD;
  _wd = 0.23 + w1 * 0.10;
  // a thread of neon off the banks, caught on the ripple - a tint on the
  // water rather than the lone coloured cells that used to stand in for
  // rubbish. The rubbish is solid now and floats on top.
  const gl = hash3((wx * 1.7) | 0, (wy * 1.7) | 0, 61);
  if (gl > 0.984){ _wd += 0.14; }
  _wwet = 2;                                  // water always reflects
}
function floorSample(wx, wy, ix, iy){
  const t = tType[iy * MAP + ix];
  _wwet = (t === T_ROAD || t === T_CROSS) ? 1 : 0;   // 1 wet-when-raining, 2 always
  if (t === T_INF){                                  // interior floor: dry slabs
    _wwet = 0;
    const ck = (ix + iy) & 1;
    _wb = ck ? intFloorA : intFloorB;
    _wd = 0.32 + hash3(ix, iy, 91) * 0.08 + (ck ? 0.07 : 0);
    if (wx - ix < 0.05 || wy - iy < 0.05) _wd = 0.44; // slab joints
    return;
  }
  const rx = wx - Math.floor(wx / P) * P, ry = wy - Math.floor(wy / P) * P;
  const fx = wx - ix, fy = wy - iy;
  if (wayOn && wayG[iy * MAP + ix]){            // the red line home, on ANY ground
    const cfx = fx - 0.5, cfy = fy - 0.5;
    if (cfx * cfx + cfy * cfy < 0.10){ _wb = C.camRed; _wd = 0.95; _wwet = 1; return; }
  }
  if (t === T_ROAD || t === T_CROSS){
    const pc = signFloor[iy * MAP + ix];        // the crossing's own number
    if (pc !== undefined){
      const gl = MINIFONT[pc];
      if (gl && fx >= 0.14 && fy >= 0.10){
        const gc = ((fx - 0.14) * 4.17) | 0, gr = ((fy - 0.10) * 6.25) | 0;
        if (gc >= 0 && gr < 5 && gl[gr * 4 + gc] === '#'){
          _wb = C.nAmber; _wd = 0.95; _wwet = 1;
          return;
        }
      }
    }
    // A pedestrianised boulevard: the same slabs as the sidewalk, with an
    // inlaid strip running down the spine where the centre line used to be.
    _wb = C.walk; _wd = 0.27 + hash3(ix, iy, 5) * 0.09;
    const jx = (wx * 0.5) % 1, jy = (wy * 0.5) % 1;
    if (jx < 0.05 || jy < 0.05) _wd = 0.44;               // slab joints
    const inX = rx < RW, inY = ry < RW;
    if (!(inX && inY)){
      const off = inX ? Math.abs(rx - RW * 0.5) : Math.abs(ry - RW * 0.5);
      if (off < 0.6){ _wb = C.curb; _wd = 0.38; }
      else if (Math.abs(off - 2.1) < 0.12){ _wb = C.curb; _wd = 0.30; }
    }
    _wwet = 1;
    return;
  }
  if (t === T_WALK){
    _wb = C.walk; _wd = 0.27 + hash3(ix, iy, 5) * 0.09;
    const jx = (wx * 0.5) % 1, jy = (wy * 0.5) % 1;
    if (jx < 0.05 || jy < 0.05) _wd = 0.44;
    _wwet = 1;
    return;
  }
  if (t === T_WATER){ waterShade(wx, wy); return; }
  if (t === T_BRIDGE){
    _wb = hash3(ix, iy, 23) > 0.5 ? C.deck : C.deckOld;
    _wd = 0.32 + hash3(ix, iy, 13) * 0.10;
    if (fx < 0.09 || fy < 0.09) _wd = 0.54;               // plate seams
    _wwet = 1;
    return;
  }
  if (t === T_PATH){
    _wb = C.path; _wd = 0.30 + hash3(ix, iy, 31) * 0.12;
    return;
  }
  if (t === T_LOT){
    if (districtAt(ix, iy) === D_RURAL){
      if (zoneAt((ix / P) | 0, (iy / P) | 0) >= 4){    // open wilderness
        _wb = C.turf; _wd = 0.20 + hash3(ix, iy, 12) * 0.16;
        if (hash3(ix, iy, 44) > 0.985){ _wb = C.rail; _wd = 0.5; }   // stones
        return;
      }
      // worked land: crop rows, soil between
      if (iy % 3 === 0){ _wb = C.path;  _wd = 0.26 + hash3(ix, iy, 7) * 0.08; }
      else             { _wb = C.grass; _wd = 0.40 + hash3(ix, iy, 8) * 0.20; }
      return;
    }
    _wb = C.turf; _wd = 0.28 + hash3(ix, iy, (wx * 3) | 0) * 0.22;
    return;
  }
  const b = buildings[tB[iy * MAP + ix]];
  _wb = b ? b.col : C.asphalt; _wd = 0.5;
}
function floorPass(){
  const cols = R.cols, rows = R.rows;
  const r0 = clamp(Math.ceil(horizon), 0, rows);
  for (let r = r0; r < rows; r++){
    const d = cam.z * projRows / (r + 0.5 - horizon);
    if (!(d > 0) || d > viewD) continue;
    const t = d / viewD, lvl = levelOf(t), dm = densMul(t);
    // the water plane sits RIVER_DEPTH below the street, so a ray through the
    // hole in the street plane carries further before it lands
    const dW = (cam.z + RIVER_DEPTH) * projRows / (r + 0.5 - horizon);
    // counters carry a worktop: a second plane at counter height, projected
    // the way the river projects its lower one - just upward instead
    const dC = (cam.z - 1.05) * projRows / (r + 0.5 - horizon);
    const rowOff = r * cols;
    for (let x = 0; x < cols; x++){
      const wx = cam.x + rayX[x] * d, wy = cam.y + rayY[x] * d;
      const ix = wx | 0, iy = wy | 0;
      if (wx < 0 || wy < 0 || ix >= MAP || iy >= MAP) continue;
      if (inside && dC > 0 && dC < d){
        const cwx = cam.x + rayX[x] * dC, cwy = cam.y + rayY[x] * dC;
        const cix = cwx | 0, ciy = cwy | 0;
        if (cwx >= 0 && cwy >= 0 && cix < MAP && ciy < MAP){
          const chh = tH[ciy * MAP + cix];
          if (chh > 0.95 && chh < 1.15){
            const tC = dC / viewD, dmC = densMul(tC);
            const fx2 = cwx - cix, fy2 = cwy - ciy;
            let dd = 0.62 + hash3(cix, ciy, 77) * 0.12;
            if (fx2 < 0.07 || fy2 < 0.07 || fx2 > 0.93 || fy2 > 0.93) dd = 0.85;
            const gC = Math.round(clamp(dd * dmC, 0, 1) * RMAX);
            const idxC = rowOff + x;
            dBuf[idxC] = dC; refBuf[idxC] = 0;
            if (gC){ gBuf[idxC] = gC; bBuf[idxC] = C.worktop; lBuf[idxC] = levelOf(tC); statCells++; }
            continue;
          }
        }
      }
      let uD = d, lv = lvl, dmm = dm;
      if (tType[iy * MAP + ix] === T_WATER){
        if (dW > viewD) continue;
        const wx2 = cam.x + rayX[x] * dW, wy2 = cam.y + rayY[x] * dW;
        const ix2 = wx2 | 0, iy2 = wy2 | 0;
        if (wx2 < 0 || wy2 < 0 || ix2 >= MAP || iy2 >= MAP) continue;
        /* The ray has dropped through the hole in the street. Walk the gap
           between the lip and the bed and find the first bank it passes: THAT
           is the wall it stops against. It used to be coloured from the tile
           at the far end of the ray instead, which put the wall's depth and
           its fog twenty tiles behind where the wall actually stands - a
           three-metre cut bank rendered like distant haze, which is what made
           the edges look like paper rather than ground. */
        let wallD = -1, wix = ix2, wiy = iy2;
        const span = dW - d;
        const nStep = Math.min(40, Math.max(2, Math.ceil(span * 0.8)));
        for (let sI = 1; sI <= nStep; sI++){
          const ds = d + span * (sI / nStep);
          const sx2 = cam.x + rayX[x] * ds, sy2 = cam.y + rayY[x] * ds;
          const six = sx2 | 0, siy = sy2 | 0;
          if (sx2 < 0 || sy2 < 0 || six >= MAP || siy >= MAP){ wallD = ds; break; }
          // a deck overhead is not the bed - the river runs under it, and its
          // SIDE is a vertical face drawn by the wall pass, not a colour
          // smeared across whichever floor row this ray happened to land in
          if (!inChannel(six, siy)){ wallD = ds; wix = six; wiy = siy; break; }
        }
        if (wallD < 0){                            // clear all the way down
          const tw = dW / viewD; lv = levelOf(tw); dmm = densMul(tw); uD = dW;
          // the bed is the bed whatever is built over it - shade the river,
          // not whatever the surface tile happens to say
          waterShade(wx2, wy2);
          // a deck overhead puts the water in its shadow
          if (tType[iy2 * MAP + ix2] === T_BRIDGE) _wd *= 0.62;
        } else {                                   // the channel wall, in place
          const tw = wallD / viewD; lv = levelOf(tw); dmm = densMul(tw); uD = wallD;
          const f = clamp((wallD - d) / Math.max(0.001, span), 0, 1);
          _wb = f < 0.16 ? C.curb : C.bank;        // a kerbstone lip on the top
          _wd = 0.46 - f * 0.14 + hash3(wix, wiy, 17) * 0.12;
          if (((wiy * 3 + wix) & 3) === 0) _wd += 0.07;   // coursing in the stone
          _wwet = 0;
        }
      } else {
        floorSample(wx, wy, ix, iy);
      }
      const g = Math.round(clamp(_wd * dmm, 0, 1) * RMAX);
      const idx = rowOff + x;
      dBuf[idx] = uD;
      refBuf[idx] = _wwet;
      if (g === 0) continue;
      gBuf[idx] = g; bBuf[idx] = _wb; lBuf[idx] = lv;
      statCells++;
    }
  }
}

/*------------------------- ceiling (interiors) -----------------------------
  The mirror of the floor pass: rows above the horizon inverse-project onto
  the plane z = INT_CEIL. Panel joints on the tile grid, a sparse lattice of
  tube lights bright enough for the bloom to catch. Walls draw afterwards
  and overwrite their span, exactly as they do over the floor.
----------------------------------------------------------------------------*/
function ceilingPass(){
  const cols = R.cols, rows = R.rows;
  const r1 = clamp(Math.floor(horizon), 0, rows);
  for (let r = 0; r < r1; r++){
    const d = (INT_CEIL - cam.z) * projRows / (horizon - (r + 0.5));
    if (!(d > 0) || d > viewD) continue;
    const t = d / viewD, lvl = levelOf(t), dm = densMul(t);
    const rowOff = r * cols;
    for (let x = 0; x < cols; x++){
      const wx = cam.x + rayX[x] * d, wy = cam.y + rayY[x] * d;
      const ix = wx | 0, iy = wy | 0;
      if (wx < 0 || wy < 0 || ix >= MAP || iy >= MAP) continue;
      let dd, bb;
      if (ix % 3 === 1 && iy % 3 === 1){
        dd = 0.92;
        bb = inside && inside.shop === 'dispensary' ? C.nGreen
           : inside && inside.shop === 'armory' ? C.camRed : C.nWhite;
      }
      else {
        dd = 0.22 + hash3(ix, iy, 51) * 0.08; bb = C.screen;
        if (wx - ix < 0.06 || wy - iy < 0.06) dd = 0.32;   // panel joints
      }
      const g = Math.round(clamp(dd * dm, 0, 1) * RMAX);
      const idx = rowOff + x;
      dBuf[idx] = d; refBuf[idx] = 0;
      if (!g) continue;
      gBuf[idx] = g; bBuf[idx] = bb; lBuf[idx] = lvl;
      statCells++;
    }
  }
}

/*----------------------------- facades -------------------------------------*/
// Interior walls: skirting, cornice, the odd poster - and the way out drawn
// as a real door, dark panel in a bright frame with an amber handle.
function interiorWall(b, gu, z, side, hitX, hitY){
  if (b.interior === 2){                              // counter / low furniture
    _wb = b.col;
    _wd = z > 1.0 ? 0.85 : 0.60 + hash3((gu * 3) | 0, 3, b.seed) * 0.1;
    if (z > 1.0) _wb = C.worktop;                     // just the rounded lip
    return;
  }
  // the way out, clamped to exactly the door tile's inner face - the door
  // outranks any shelf dressing, so no band ever paints across the exit
  if (side === 1 && Math.abs(hitY - b.doorY) < 0.08){
    const du = gu - b.doorX;                          // 0..1 across the door
    if (du >= 0 && du <= 1 && z < 2.25){
      if (du < 0.14 || du > 0.86){ _wb = C.signCase; _wd = 0.9; _wg = G_BAR; }
      else if (z > 2.05){ _wb = C.signCase; _wd = 0.9; }
      else if (z > 0.95 && z < 1.12 && du > 0.68 && du < 0.80){ _wb = C.nAmber; _wd = 1; }
      else { _wb = C.trunk; _wd = 0.72; }
      return;
    }
    if (du > -0.3 && du < 1.3){                       // no posters against the frame
      _wb = b.col; _wd = z < 0.42 ? 0.55 : 0.32;
      if (z < 0.42) _wb = C.trunk;
      return;
    }
  }
  if (inside && inside.shop && SHOP_FLAVOR[inside.shop] &&
      SHOP_FLAVOR[inside.shop].band !== undefined && z > 1.2 && z < 1.7){
    _wb = SHOP_FLAVOR[inside.shop].band; _wd = 0.8;   // the trade's shelf band
    return;
  }
  if (z < 0.42){ _wb = C.trunk; _wd = 0.55; }         // skirting board
  else if (z > INT_CEIL - 0.3){ _wb = C.signCase; _wd = 0.5; }   // cornice
  else {
    const col = Math.floor(gu * 2), hp = hash3(col, 7, b.seed);
    _wb = b.col; _wd = 0.30 + hash3((gu * 5) | 0, (z * 4) | 0, 13) * 0.07;
    if (hp < 0.16 && z > 1.15 && z < 2.1){            // a poster
      const u = gu * 2 - col;
      if (u > 0.2 && u < 0.8){ _wb = NEONC[((hp * 50) | 0) % NEONC.length]; _wd = 0.5; }
    }
  }
  if (side === 1) _wd *= 0.85;
}
function facade(b, gu, z, side, hh, hitX, hitY){
  _wg = -1;
  if (b.dome){ domeSurface(b, z, hitX, hitY); return; }
  if (b.interior){ interiorWall(b, gu, z, side, hitX, hitY); return; }
  // burned graffiti: a bright stencil piece holding on the wall for a few days
  const tg = tags[(hitY | 0) * MAP + (hitX | 0)];
  if (tg && z > 0.8 && z < 2.4){
    const art = TAG_ART[tg.art];
    if (art){
      const fu = (side === 0 ? hitY : hitX) % 1;
      const gc = Math.min(9, (((tg.seg + fu) / tg.spanN) * 10) | 0);
      const gr = Math.min(7, ((2.4 - z) / 1.6 * 8) | 0);
      const chq = art[gr][gc];
      if (chq !== '.'){
        const age = dayCount - tg.day;
        _wb = chq === '+' ? C.nCyan : C.nMag;
        _wd = age >= 2 ? 0.55 : 1;              // old pieces fade before they go
        return;
      }
    }
  }
  // the entrance, drawn where the interact point is - clamped to exactly the
  // door tile's face, with a band of plain wall around it so no window or
  // signage butts against the frame
  if (b.doorNX !== undefined && (side === 0 ? b.doorNX !== 0 : b.doorNY !== 0)){
    const face = side === 0 ? b.doorX + (b.doorNX > 0 ? 1 : 0)
                            : b.doorY + (b.doorNY > 0 ? 1 : 0);
    if (Math.abs((side === 0 ? hitX : hitY) - face) < 0.08){
      const du = gu - (side === 0 ? b.doorY : b.doorX);   // 0..1 across the door
      if (du >= 0 && du <= 1 && z < 2.25){
        if (du < 0.14 || du > 0.86){ _wd = 0.95; _wb = b.sign; _wg = G_BAR; }  // lit frame
        else if (z > 2.05){ _wd = 0.95; _wb = b.sign; }                       // lit lintel
        else if (z > 0.95 && z < 1.12 && du > 0.68 && du < 0.80){ _wd = 1; _wb = C.nAmber; }
        else { _wd = 0.72; _wb = C.trunk; }
        if (side === 1) _wd *= 0.8;
        return;
      }
      if (du > -0.3 && du < 1.3 && z < Math.ceil(2.26 / b.fh) * b.fh){
        _wd = side === 1 ? 0.45 : 0.56; _wb = b.col;      // clear margin
        return;
      }
    }
  }
  const fzf = z / b.fh, fz = Math.floor(fzf), zf = fzf - fz;
  const wu = gu * b.wpm, wcol = Math.floor(wu), wf = wu - wcol;
  let dens, base;
  if (z > hh - 0.34){                                   // parapet, often a crown
    dens = 0.94; base = b.crown >= 0 ? b.crown : b.col;
  } else if (b.stripe >= 0 && wcol % 6 === b.stripePh && wf > 0.40 && wf < 0.60){
    dens = 0.90; base = b.stripe;                       // vertical neon strip
  } else if (fz === 0){                                 // street level signage
    if (z > 0.30 && z < 1.70 && wf > 0.10 && wf < 0.90){ dens = 0.95; base = b.sign; }
    else { dens = 0.58; base = b.col; }
  } else if (wf > 0.18 && wf < 0.82 && zf > 0.24 && zf < 0.80){
    // Every window lives its own life: a personal period of 25-90 s, a fresh
    // lit roll each period (so rooms go dark and wake out of sync across the
    // city), and a tube that is about to die flickers out its last seconds.
    const h1 = hash3(b.seed, wcol, fz);                 // stable identity
    const per = 25 + h1 * 65;
    const tOff = worldTime + h1 * 997;                  // desync the clocks
    const bk = (tOff / per) | 0;
    const wid = wcol * 92821 + fz;
    let lit = hash3(wid, b.seed, bk) < b.litP;
    if (lit){
      // most windows simply switch off; once in a while one dies flickering
      if (per - (tOff - bk * per) < 1.8 &&
          hash3(wid, b.seed, bk + 1) >= b.litP &&
          hash3(wid, bk, 1337) < 0.14)                  // rare, for flavour
        lit = hash3((worldTime * 17) | 0, wcol, fz) < 0.55;
      else {
        // now and then one bulb per facade fails for a moment and sputters
        const fper = 9 + (b.seed % 7);                  // this building's rhythm
        const ft = worldTime + (b.seed % 89);
        const fep = (ft / fper) | 0;
        if (ft - fep * fper < 1.4 &&
            hash3(fep, b.seed, 5) < 0.6 &&
            ((wcol * 7 + fz * 13) & 31) === ((hash3(fep, b.seed, 9) * 32) | 0))
          lit = hash3((worldTime * 19) | 0, wcol, fz) < 0.6;
      }
    }
    if (lit){ dens = 0.98; base = h1 < b.litP * 0.28 ? b.winB : b.winA; }
    else { dens = 0.17; base = C.winDark; }             // lights off
  } else {
    dens = 0.56 + ((fz & 1) ? 0.05 : 0); base = b.col;
  }
  if (side === 1) dens *= 0.80;                                    // face shading
  _wd = dens; _wb = base;
}

/*--------------------- wall pass: one DDA ray per column -------------------*/
function wallPass(){
  const cols = R.cols, rows = R.rows, px = cam.x, py = cam.y;
  const hzRow = clamp(Math.floor(horizon), 0, rows - 1);
  for (let x = 0; x < cols; x++){
    const rdx = rayX[x], rdy = rayY[x];
    let mapX = Math.floor(px), mapY = Math.floor(py);
    const ddx = rdx === 0 ? 1e30 : Math.abs(1 / rdx);
    const ddy = rdy === 0 ? 1e30 : Math.abs(1 / rdy);
    let stepX, stepY, sdx, sdy;
    if (rdx < 0){ stepX = -1; sdx = (px - mapX) * ddx; } else { stepX = 1; sdx = (mapX + 1 - px) * ddx; }
    if (rdy < 0){ stepY = -1; sdy = (py - mapY) * ddy; } else { stepY = 1; sdy = (mapY + 1 - py) * ddy; }
    let ceilLimit = rows - 1, side = 0, guard = 0;
    statRays++;
    while (ceilLimit >= 0 && guard++ < 1700){
      if (sdx < sdy){ sdx += ddx; mapX += stepX; side = 0; }
      else          { sdy += ddy; mapY += stepY; side = 1; }
      const d = side === 0 ? sdx - ddx : sdy - ddy;
      if (d > viewD) break;
      if (mapX < 0 || mapY < 0 || mapX >= MAP || mapY >= MAP) break;
      const id = mapY * MAP + mapX, h = tH[id];
      /* A BRIDGE DECK is a slab, and its side is a vertical face standing on
         the tile boundary you just crossed. It has to be drawn here, in the
         wall pass, for the same reason every other vertical surface is: the
         floor pass picks one surface per screen cell from where the ray meets
         a HORIZONTAL plane, so a face pushed through it lands in whatever row
         the water would have been in. That is what made the deck edges shear
         into diagonal bands and drop out as you walked past a corner.
         Only where the ray comes off open water - inside the deck, and at the
         abutments where it meets the bank, there is nothing to see. */
      if (tType[id] === T_BRIDGE){
        const pmx = side === 0 ? mapX - stepX : mapX;
        const pmy = side === 0 ? mapY : mapY - stepY;
        if (inMap(pmx, pmy) && tType[pmy * MAP + pmx] === T_WATER){
          const uR = projRows / d;
          const fT = horizon + cam.z * uR;               // z = 0, the deck top
          const fB = horizon + (cam.z + DECK_T) * uR;    // and its soffit
          let a0 = Math.ceil(fT - 0.5), a1 = Math.floor(fB - 0.5);
          if (a0 < 0) a0 = 0;
          if (a1 > rows - 1) a1 = rows - 1;
          const tt = d / viewD, lv2 = levelOf(tt), dm2 = densMul(tt);
          const span = Math.max(0.001, fB - fT);
          for (let r = a0; r <= a1; r++){
            const idx = r * cols + x;
            if (dBuf[idx] < d - 0.02) continue;
            const f = clamp((r + 0.5 - fT) / span, 0, 1);
            let dd = 0.54 - f * 0.26 + hash3(mapX, mapY, 29) * 0.06;
            if (((mapX + mapY) & 3) === 0) dd += 0.05;   // girders across it
            const g = Math.round(clamp(dd * dm2, 0, 1) * RMAX);
            if (!g) continue;
            gBuf[idx] = g; bBuf[idx] = f < 0.28 ? C.deck : C.deckOld;
            lBuf[idx] = lv2; dBuf[idx] = d;
            refBuf[idx] = 0; srcBuf[idx] = 0;
            statCells++;
          }
        }
      }
      if (h <= 0) continue;
      const unitRows = projRows / d;
      const rowB = horizon + cam.z * unitRows;
      const rowT = horizon + (cam.z - h) * unitRows;
      let r0 = Math.ceil(rowT - 0.5), r1 = Math.floor(rowB - 0.5);
      if (r0 < 0) r0 = 0;
      if (r1 > ceilLimit) r1 = ceilLimit;
      const b = buildings[tB[id]];
      if (r0 <= r1 && b){
        const gu = side === 0 ? py + d * rdy : px + d * rdx;
        const hitX = px + d * rdx, hitY = py + d * rdy;
        const t = d / viewD, lvl = levelOf(t), dm = densMul(t);
        // vertical corner posts at the real building edges
        const fu = gu - Math.floor(gu);
        let edge = false;
        if (!b.dome && (fu < 0.06 || fu > 0.94)){
          const back = fu < 0.5 ? -1 : 1;
          const nx = side === 0 ? mapX : mapX + back;
          const ny = side === 0 ? mapY + back : mapY;
          edge = !inMap(nx, ny) || tB[ny * MAP + nx] !== b.id ||
                 Math.abs(tH[ny * MAP + nx] - h) > 0.6;
        }
        for (let r = r0; r <= r1; r++){
          const idx = r * cols + x;
          const z = cam.z - (r + 0.5 - horizon) / unitRows;
          facade(b, gu, z, side, h, hitX, hitY);
          let g;
          if (_wg >= 0) g = _wg;
          else if (edge && lvl < 4) g = G_BAR;
          else g = Math.round(clamp(_wd * dm, 0, 1) * RMAX);
          gBuf[idx] = g; bBuf[idx] = _wb; lBuf[idx] = lvl; dBuf[idx] = d;
          refBuf[idx] = 0;
          srcBuf[idx] = EMISSIVE[_wb] ? 2 : 0;
          statCells++;
        }
      }
      // A tower's upper floors leave the frame long before its reflection
      // does. Screen-space mirroring alone loses them the moment you look
      // down, so the rows above the frame are mirrored straight from here.
      if (b){
        const mb = 2 * horizon + 2 * cam.z * unitRows;
        let s0 = Math.ceil(rowT - 0.5), s1 = Math.floor(rowB - 0.5);
        const lo = Math.ceil(mb - rows + 1), hi = Math.floor(mb - hzRow - 1);
        if (s0 < lo) s0 = lo;
        if (s1 > hi) s1 = hi;
        if (s1 > -1) s1 = -1;                    // only what is off the top
        if (s0 <= s1){
          const gu2 = side === 0 ? py + d * rdy : px + d * rdx;
          const hx2 = px + d * rdx, hy2 = py + d * rdy;
          const wobx = refWob[x];
          for (let r = s0; r <= s1; r++){
            const rr = Math.round(mb - r + wobx);
            if (rr <= hzRow || rr >= rows) continue;
            const j = rr * cols + x;
            if (!reflects(j)) continue;
            const z = cam.z - (r + 0.5 - horizon) / unitRows;
            facade(b, gu2, z, side, h, hx2, hy2);
            if (!EMISSIVE[_wb]) continue;
            const g2 = Math.round(clamp(_wd * 0.5, 0, 1) * RMAX);
            if (!g2) continue;
            gBuf[j] = g2; bBuf[j] = _wb;
            statCells++;
          }
        }
      }
      if (h >= cam.z){
        if (r0 - 1 < ceilLimit) ceilLimit = r0 - 1;
      } else {
        // A wall below eye level occludes only above its FAR top edge - the
        // rows between its near and far edge are its own visible top surface
        // (the worktop the floor pass draws), not cover for what is behind.
        const dExit = Math.min(sdx, sdy);
        const rFar = Math.ceil(horizon + (cam.z - h) * projRows / dExit - 0.5) - 1;
        if (rFar < ceilLimit) ceilLimit = rFar;
      }
    }
  }
}

/*----------------------------- billboards ----------------------------------*/
function drawSprite(sx, sy, zb, wW, wH, art, sb, sd, mirror, dyn){
  const relX = sx - cam.x, relY = sy - cam.y;
  const tY = relX * dirX + relY * dirY;
  if (tY < 0.30 || tY > viewD) return;
  const tX = (dirY * relX - dirX * relY) / planeLen;
  const cols = R.cols, rows = R.rows;
  const unitCols = (cols * 0.5 / planeLen) / tY;
  const unitRows = projRows / tY;
  const cc = cols * 0.5 * (1 - tX / tY);
  const wc = Math.max(0.6, wW * unitCols), hr = Math.max(0.6, wH * unitRows);
  const left = cc - wc * 0.5;
  const rowB = horizon + (cam.z - zb) * unitRows, rowT = rowB - hr;
  let c0 = Math.round(left), c1 = Math.round(left + wc) - 1; if (c1 < c0) c1 = c0;
  let r0 = Math.round(rowT),  r1 = Math.round(rowB) - 1;     if (r1 < r0) r1 = r0;
  if (c1 < 0 || c0 >= cols) return;
  if (c0 < 0) c0 = 0; if (c1 > cols - 1) c1 = cols - 1;
  const t = tY / viewD, lvl = levelOf(t), dm = densMul(t);
  const aw = art.w, ah = art.h, data = art.data;
  const invHs = 1 / Math.max(0.0001, hr);

  // the same for anything tall enough to leave the top of the frame
  {
    const mb = 2 * horizon + 2 * cam.z * unitRows;
    let s0 = r0, s1 = Math.min(r1, -1);
    const lo = Math.ceil(mb - rows + 1), hi = Math.floor(mb - hzRow - 1);
    if (s0 < lo) s0 = lo;
    if (s1 > hi) s1 = hi;
    if (s0 <= s1){
      for (let c = c0; c <= c1; c++){
        let u = clamp((c + 0.5 - left) / wc, 0, 0.9999);
        if (mirror) u = 0.9999 - u;
        const ax2 = (u * aw) | 0;
        const wobx = refWob[c];
        for (let r = s0; r <= s1; r++){
          const rr = Math.round(mb - r + wobx);
          if (rr <= hzRow || rr >= rows) continue;
          const j = rr * cols + c;
          if (!reflects(j)) continue;
          const v = clamp((r + 0.5 - rowT) * invHs, 0, 0.9999);
          const ai2 = ((v * ah) | 0) * aw + ax2;
          const role = data[ai2];
          if (role === 0) continue;
          let base, g0;
          if (art.lit){ base = art.cm[ai2]; g0 = Math.round(clamp(art.dn[ai2] * dm, 0, 1) * RMAX); }
          else {
            base = sb[role]; if (base < 0) base = dyn;
            g0 = Math.round(clamp(sd[role] * dm, 0, 1) * RMAX);
          }
          const ng = (g0 * (EMISSIVE[base] ? 0.55 : 0.42)) | 0;
          if (ng < 1) continue;
          gBuf[j] = ng; bBuf[j] = base; srcBuf[j] = 0;
          statCells++;
        }
      }
    }
  }

  if (r1 < 0 || r0 >= rows) return;
  if (r0 < 0) r0 = 0; if (r1 > rows - 1) r1 = rows - 1;
  for (let c = c0; c <= c1; c++){
    let u = clamp((c + 0.5 - left) / wc, 0, 0.9999);
    if (mirror) u = 0.9999 - u;
    const axp = (u * aw) | 0;
    for (let r = r0; r <= r1; r++){
      const idx = r * cols + c;
      if (dBuf[idx] < tY - 0.06) continue;
      const v = clamp((r + 0.5 - rowT) / hr, 0, 0.9999);
      const ai = ((v * ah) | 0) * aw + axp;
      const role = data[ai];
      if (role === 0) continue;
      let base, g;
      if (art.lit){                       // literal art: the exact character
        base = art.cm[ai];
        g = lvl < 4 ? art.g[ai] : Math.round(clamp(art.dn[ai] * dm, 0, 1) * RMAX);
      } else {
        base = sb[role]; if (base < 0) base = dyn;
        g = Math.round(clamp(sd[role] * dm, 0, 1) * RMAX);
      }
      if (g === 0) continue;
      gBuf[idx] = g; bBuf[idx] = base; lBuf[idx] = lvl; dBuf[idx] = tY;
      refBuf[idx] = 0;
      srcBuf[idx] = EMISSIVE[base] ? 2 : 1;
      statCells++;
    }
  }
}

// Props are static and there are tens of thousands of them across 4 km^2, so
// the sprite pass pulls only the buckets the view can reach.
const PSG = 16;
let psgW = 1, spriteGrid = [];
function indexSpriteProps(){
  psgW = Math.ceil(MAP / PSG);
  spriteGrid = [];
  for (let i = 0; i < psgW * psgW; i++) spriteGrid.push([]);
  for (const q of props){
    const gx = (q.x / PSG) | 0, gy = (q.y / PSG) | 0;
    if (gx >= 0 && gy >= 0 && gx < psgW && gy < psgW) spriteGrid[gy * psgW + gx].push(q);
  }
}
const _vis = [];
function visibleProps(){
  _vis.length = 0;
  const r = viewD + 6;
  const x0 = Math.max(0, ((cam.x - r) / PSG) | 0), x1 = Math.min(psgW - 1, ((cam.x + r) / PSG) | 0);
  const y0 = Math.max(0, ((cam.y - r) / PSG) | 0), y1 = Math.min(psgW - 1, ((cam.y + r) / PSG) | 0);
  for (let gy = y0; gy <= y1; gy++)
    for (let gx = x0; gx <= x1; gx++){
      const b = spriteGrid[gy * psgW + gx];
      for (let i = 0; i < b.length; i++) _vis.push(b[i]);
    }
  return _vis;
}


/*------------------------- volumetric models -------------------------------
  Not billboards, and not crossed planes either - actual solids. Each sprite
  is inflated into a voxel volume: every horizontal run of the artwork
  becomes a rounded (or square) cross-section with real depth, so a torso is
  a barrel, a leg is a post and a canopy is a blob. The volume is then ray
  marched per screen cell in the object's own local frame, which means it
  rotates with the thing it belongs to, occludes itself, occludes its
  neighbours, and takes the same depth buffer the walls write to. Faces are
  shaded by which side of a voxel the ray came through, the way the wall
  pass shades its two sides.
============================================================================*/
function voxelize(art, depthScale, round){
  const key = depthScale.toFixed(2) + (round ? 'r' : 'b');
  if (!art._vox) art._vox = {};
  if (art._vox[key]) return art._vox[key];
  const aw = art.w, ah = art.h, data = art.data;
  const vd = Math.max(2, Math.round(aw * depthScale));
  // A few things - the market stalls - are authored as real volumes rather
  // than inflated from an elevation, because they have to be hollow.
  const hollow = !!art.vol;
  const vox = hollow ? art.vol(aw, vd, ah) : new Uint8Array(aw * vd * ah);
  if (!hollow) for (let z = 0; z < ah; z++){
    let x = 0;
    while (x < aw){
      if (!data[z * aw + x]){ x++; continue; }
      let x1 = x;                                // one solid run of the row
      while (x1 + 1 < aw && data[z * aw + x1 + 1]) x1++;
      const cx = (x + x1 + 1) * 0.5, a = (x1 - x + 1) * 0.5;
      const b = Math.max(0.6, a * vd / Math.max(0.001, aw * depthScale));
      for (let xx = x; xx <= x1; xx++){
        const role = data[z * aw + xx];
        const nx = (xx + 0.5 - cx) / a;
        for (let y = 0; y < vd; y++){
          const ny = (y + 0.5 - vd * 0.5) / b;
          const solid = round ? (nx * nx + ny * ny <= 1.0) : (Math.abs(ny) <= 1.0);
          if (solid) vox[(z * vd + y) * aw + xx] = role;
        }
      }
      x = x1 + 1;
    }
  }
  // the artwork usually has empty margins - find the real extent so rays
  // are never marched through padding
  let x0 = aw, x1 = -1, y0 = vd, y1 = -1, z0 = ah, z1 = -1;
  for (let z = 0; z < ah; z++)
    for (let y = 0; y < vd; y++)
      for (let x = 0; x < aw; x++)
        if (vox[(z * vd + y) * aw + x]){
          if (x < x0) x0 = x; if (x > x1) x1 = x;
          if (y < y0) y0 = y; if (y > y1) y1 = y;
          if (z < z0) z0 = z; if (z > z1) z1 = z;
        }
  if (x1 < 0){ x0 = y0 = z0 = 0; x1 = aw - 1; y1 = vd - 1; z1 = ah - 1; }
  return (art._vox[key] = { aw, vd, ah, vox, hollow,

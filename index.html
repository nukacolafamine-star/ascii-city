/*============================== 13c. AUDIO =================================
  Sound comes from local files in audio/ - free-use mp3 / wav the repo does
  not ship. Every slot is optional: a missing file is a silent no-op, so the
  game runs fine with no audio folder at all.

  Two tiers, picked once at the first user gesture:
    tier 1  WebAudio - fetch + decodeAudioData, per-bus gains, stereo pan.
            Available when the page is served over http(s).
    tier 2  <audio> elements - file:// blocks fetch, media elements are
            exempt, so each slot becomes an element. Volume and playback
            rate work; panning does not. Same city, flatter stage.

  A slot tries name.mp3 first, then name.wav, so a curated mp3 dropped next
  to a placeholder wav wins without deleting anything. Buses: music, ambient
  and weather (rain, thunder, wind) duck to 30% while the world is frozen;
  fx does not, so menu blips stay crisp. The slot list and every hook that
  fires one live here and in audio/AUDIO.md.
============================================================================*/
const AUD = {
  music_night:     { loop: 1, bus: 'music' },
  music_dusk:      { loop: 1, bus: 'music' },
  music_day:       { loop: 1, bus: 'music' },
  amb_downtown:    { loop: 1, bus: 'ambient' },
  amb_strip:       { loop: 1, bus: 'ambient' },
  amb_residential: { loop: 1, bus: 'ambient' },
  amb_industrial:  { loop: 1, bus: 'ambient' },
  amb_suburbs:     { loop: 1, bus: 'ambient' },
  amb_farmland:    { loop: 1, bus: 'ambient' },
  rain_loop:       { loop: 1, bus: 'weather' },
  wind_loop:       { loop: 1, bus: 'weather' },
  thunder:         { bus: 'weather' },
  footstep:        { bus: 'fx' },
  metro:           { bus: 'fx' },
  door:            { bus: 'fx' },
  shot:            { bus: 'fx' },
  hit:             { bus: 'fx' },
  hurt:            { bus: 'fx' },
  ui_move:         { bus: 'fx' },
  ui_select:       { bus: 'fx' },
  ui_back:         { bus: 'fx' }
};
const AMB_BY_DISTRICT = ['amb_downtown', 'amb_strip', 'amb_residential',
                         'amb_industrial', 'amb_suburbs', 'amb_farmland', 'amb_strip'];
const MUSIC_BY_TIME = ['music_night', 'music_dusk', 'music_day'];

let audioCtx = null;
const audio = {
  tier: 0, force: 0, unlocked: false, loaded: 0,
  vol: { master: 0.8, music: 0.7, ambient: 0.8, weather: 0.8, fx: 0.8 },
  duck: 1, buffers: {}, els: {}, missing: {}, loops: {},
  master: null, bus: null, oneShots: 0, stepN: 0
};
try { const v = JSON.parse(localStorage.getItem('asciiCityVol')); if (v) Object.assign(audio.vol, v); } catch (e){}
function saveVol(){ try { localStorage.setItem('asciiCityVol', JSON.stringify(audio.vol)); } catch (e){} }
function volBar(k){ const n = Math.round(audio.vol[k] * 10); return '#'.repeat(n) + '.'.repeat(10 - n); }
function stepVol(k, d){ audio.vol[k] = clamp(Math.round((audio.vol[k] + d * 0.1) * 10) / 10, 0, 1); saveVol(); }

// Browsers refuse sound until the page is touched, so the first click or
// keypress does all the startup work: context, tier probe, every load.
function audioUnlock(){
  if (audio.unlocked) return;
  audio.unlocked = true;
  const AC = window.AudioContext || window.webkitAudioContext;
  audioCtx = AC ? new AC() : null;
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
  // fetch resolves (even 404) over http, rejects outright on file://
  const probe = audio.force ? Promise.resolve(audio.force)
    : (audioCtx ? fetch('audio/.probe').then(() => 1, () => 2) : Promise.resolve(2));
  probe.then(t => {
    audio.tier = t;
    if (t === 1){
      audio.master = audioCtx.createGain();
      audio.master.connect(audioCtx.destination);
      audio.bus = {};
      for (const b of ['music', 'ambient', 'weather', 'fx']){
        const g = audioCtx.createGain(); g.connect(audio.master); audio.bus[b] = g;
      }
    }
    for (const name in AUD) audioLoad(name);
  });
  setTimeout(() => {
    if (audio.loaded === 0) toast('no audio files found - see audio/AUDIO.md');
  }, 4000);
}
function audioLoad(name){
  const exts = ['.mp3', '.wav'];
  if (audio.tier === 1){
    (function tryExt(i){
      if (i >= exts.length){ audio.missing[name] = 1; return; }
      fetch('audio/' + name + exts[i])
        .then(r => { if (!r.ok) throw 0; return r.arrayBuffer(); })
        .then(ab => audioCtx.decodeAudioData(ab))
        .then(buf => { audio.buffers[name] = buf; audio.loaded++; })
        .catch(() => tryExt(i + 1));
    })(0);
  } else {
    const el = new Audio();
    let i = 0;
    el.onerror = () => { if (++i < exts.length) el.src = 'audio/' + name + exts[i]; else audio.missing[name] = 1; };
    el.oncanplaythrough = () => { if (!audio.els[name]){ audio.els[name] = el; audio.loaded++; } };
    el.preload = 'auto';
    el.src = 'audio/' + name + exts[0];
  }
}

/* fire-and-forget one-shot; o = { vol, rate, pan } */
function sfx(name, o){
  if (!audio.tier || audio.missing[name]) return;
  o = o || {};
  // the ride warps the ears: pitch bend, plus jitter on static
  const aw = drugFx('aud', 1), aj = drugFx('audJit', 0);
  if (aw !== 1 || aj) o = Object.assign({}, o,
    { rate: (o.rate || 1) * aw * (1 + (aj ? (Math.random() * 2 - 1) * aj : 0)) });
  const bus = AUD[name] ? AUD[name].bus : 'fx';
  if (audio.tier === 1){
    const buf = audio.buffers[name]; if (!buf) return;
    const s = audioCtx.createBufferSource(); s.buffer = buf;
    if (o.rate) s.playbackRate.value = o.rate;
    const g = audioCtx.createGain(); g.gain.value = o.vol !== undefined ? o.vol : 1;
    s.connect(g);
    if (o.pan !== undefined && audioCtx.createStereoPanner){
      const p = audioCtx.createStereoPanner(); p.pan.value = clamp(o.pan, -1, 1);
      g.connect(p); p.connect(audio.bus[bus]);
    } else g.connect(audio.bus[bus]);
    s.start();
  } else {
    const base = audio.els[name];
    if (!base || audio.oneShots > 14) return;      // cap runaway overlaps
    const el = base.cloneNode();
    el.loop = false;
    el.volume = clamp((o.vol !== undefined ? o.vol : 1) * audio.vol[bus] * audio.vol.master, 0, 1);
    if (o.rate){ el.preservesPitch = false; el.playbackRate = o.rate; }
    audio.oneShots++;
    el.onended = () => { audio.oneShots--; };
    el.play().catch(() => { audio.oneShots--; });
  }
}
/* one-shot at a world position: distance attenuation, panned by bearing */
function sfxAt(name, x, y, o){
  const dx = x - cam.x, dy = y - cam.y, d = Math.hypot(dx, dy);
  if (d > 46) return;
  o = Object.assign({}, o);
  o.vol = (o.vol !== undefined ? o.vol : 1) / (1 + d * 0.22);
  o.pan = clamp((dirY * dx - dirX * dy) / Math.max(0.001, d) * 0.9, -1, 1);
  sfx(name, o);
}

/* Looping beds never restart - they hold gain targets and chase them, so a
   district border or a weather change is a crossfade, not a cut. */
function loopVol(name, target){
  let L = audio.loops[name];
  if (!L) L = audio.loops[name] = { g: 0, t: 0, node: null };
  L.t = target;
}
function audioFrame(dt){
  if (!audio.tier) return;
  audio.duck += ((worldFrozen() ? 0.3 : 1) - audio.duck) * Math.min(1, dt * 4);
  if (audio.tier === 1){
    audio.master.gain.value = audio.vol.master;
    audio.bus.music.gain.value = audio.vol.music * audio.duck;
    audio.bus.ambient.gain.value = audio.vol.ambient * audio.duck;
    audio.bus.weather.gain.value = audio.vol.weather * audio.duck;
    audio.bus.fx.gain.value = audio.vol.fx;
  }
  // indoors the street bed goes muffled but does not change district
  const dn = inside ? inside.district : districtAt(cam.x, cam.y);
  const ambT = inside ? 0.45 : 0.9;
  for (let i = 0; i < AMB_BY_DISTRICT.length; i++) loopVol(AMB_BY_DISTRICT[i], i === dn ? ambT : 0);
  for (let i = 0; i < MUSIC_BY_TIME.length; i++) loopVol(MUSIC_BY_TIME[i], i === CFG.timeMode ? 0.9 : 0);
  loopVol('rain_loop', (weather === 2 ? 0.85 : weather === 1 ? 0.45 : 0) * (inside ? 0.3 : 1));
  loopVol('wind_loop', cam.riding ? 0.8 : skating ? clamp((skV - 4) / 6, 0, 0.5) : 0);
  const K = Math.min(1, dt * 1.3);
  for (const name in audio.loops){
    const L = audio.loops[name];
    L.g += (L.t - L.g) * K;
    if (audio.tier === 1){
      if (!L.node && audio.buffers[name]){
        const s = audioCtx.createBufferSource();
        s.buffer = audio.buffers[name]; s.loop = true;
        const g = audioCtx.createGain(); g.gain.value = 0;
        s.connect(g); g.connect(audio.bus[AUD[name].bus]); s.start();
        L.node = g;
      }
      if (L.node) L.node.gain.value = L.g;
    } else {
      const el = audio.els[name];
      if (el){
        el.loop = true;
        const v = clamp(L.g * audio.vol[AUD[name].bus] * audio.vol.master * audio.duck, 0, 1);
        el.volume = v;
        if (v > 0.004 && el.paused) el.play().catch(() => {});
        else if (v <= 0.004 && !el.paused) el.pause();
      }
    }
  }
}

    drug.beatT = (drug.beatT || 0) - dt;

function burnTag(){
  if (inside){ toast('the burner wants open walls'); return false; }
  const vx = Math.cos(cam.ang), vy = Math.sin(cam.ang);
  for (let d = 0.6; d < 4.2; d += 0.25){
    const x = (cam.x + vx * d) | 0, y = (cam.y + vy * d) | 0;
    if (!inMap(x, y)) break;
    if (tH[y * MAP + x] > 1.6){
      const names = Object.keys(TAG_ART);
      const art = names[(Math.random() * names.length) | 0];
      const axX = Math.abs(vx) >= Math.abs(vy);     // the wall face runs across you
      // the renderer floors the hit point: approaching from +x/+y the hit
      // lands in the AIR tile on this side of the wall - key the tag there
      const kx = axX ? (vx >= 0 ? x : x + 1) : x;
      const ky = axX ? y : (vy >= 0 ? y : y + 1);
      // the piece spans along the face; take whichever neighbor has wall
      const sx2 = axX ? kx : kx + 1, sy2 = axX ? ky + 1 : ky;
      const wx2 = axX ? x : x + 1,  wy2 = axX ? y + 1 : y;
      let ok2 = inMap(wx2, wy2) && tH[wy2 * MAP + wx2] > 1.6;
      const spanN = ok2 ? 2 : 1;
      tags[ky * MAP + kx] = { art, day: dayCount, seg: 0, spanN };
      if (ok2) tags[sy2 * MAP + sx2] = { art, day: dayCount, seg: 1, spanN };
      toast('burned in - ' + art.toUpperCase() + ' holds for a few days');
      sfx('ui_select', { rate: 0.6, vol: 0.7 });
      sfx('ui_move', { rate: 0.4, vol: 0.4 });
      player.qvar.vandal = (player.qvar.vandal || 0) + 1;

      return true;
    }

function saveGame(n){
  const pos = inside
    ? { x: EXT.camX, y: EXT.camY, ang: EXT.camAng, pitch: EXT.camPitch }
    : { x: cam.x, y: cam.y, ang: cam.ang, pitch: cam.pitch };
  const s = { v: 1, at: Date.now(), seed: worldSeed, timeMode: CFG.timeMode, weather,
              clock, dayCount, fogLevel,
              cam: pos, player, delta: worldDelta, tags };
  try {
    localStorage.setItem(saveKey(n), JSON.stringify(s));
    sfx('ui_select', { vol: 0.5 });

  } catch (e){ toast('save failed - storage unavailable'); }
}
function loadGame(n){
  const s = readSlot(n);
  if (!s){ toast('no save in slot ' + n); return; }
  closeMenus();
  CFG.timeMode = s.timeMode | 0;
  clock = s.clock !== undefined ? s.clock : 20;
  dayCount = s.dayCount | 0;
  weather = s.weather | 0; flash = 0;
  if (s.fogLevel) fogLevel = s.fogLevel;
  newWorld(s.seed);                          // deterministic rebuild, fresh delta
  worldDelta = s.delta || { taken: {} };
  applyDeltaToProps();
  tags = s.tags || {};                          // your marks outlive the rewind
  if (worldDelta.cut)                           // and the cut poles stay dead
    for (const p of props)
      if ((p.k === PK_CAM || p.k === PK_LAMP) &&
          worldDelta.cut[(p.y | 0) * MAP + (p.x | 0)]) p.dead = 1;
  Object.assign(player, s.player);
  if (!player.quests) player.quests = {};      // saves from before quests existed
  if (!player.qvar) player.qvar = {};
  cam.x = s.cam.x; cam.y = s.cam.y; cam.ang = s.cam.ang; cam.pitch = s.cam.pitch;
  cam.riding = null; cam.z = 1.62; sitting = null; skating = false; resetSkate();
  if (!walkG[clamp(cam.y | 0, 0, MAP - 1) * MAP + clamp(cam.x | 0, 0, MAP - 1)]){
    const sp = freeSpotNear(cam.x, cam.y);
    cam.x = sp[0]; cam.y = sp[1]; faceClear();
  }
  if (!player.worn){                          // saves from before layering
    player.worn = [];
    if (player.outfit) player.worn.push(player.outfit);
    if (player.bling && player.bling !== player.outfit) player.worn.push(player.bling);
  }
  refreshWear();                              // the arms wear what was saved
  if (!player.hotbar) player.hotbar = [null, null, null];
  drug = null; jamT = 0; snifferT = 0; bakeKey = -1;   // no ride survives a rewind
  if (GL) glBuildPalette(); else buildAtlases();
  bgGrad = null; buildBackground();
  fade = 1;
  toast('save loaded');
}

function questStage(id){ return player.quests[id]; }
function startQuest(id){

}
function advanceQuest(id){
  const q = QUESTS[id];

    player.quests[id] = 'done';
    sfx('ui_select', { vol: 0.7, rate: 0.7 });
    toast('completed: ' + q.name);

      player.track = Object.keys(player.quests).find(k => typeof player.quests[k] === 'number') || null;

function questTarget(){

  const st = QUESTS[id].stages[player.quests[id]];

let hurtT = 0, muzzleT = 0, panicT = 0, panicX = 0, panicY = 0;

function flockSees(){

function crimeEvent(n, why){

function pedCrime(n, why){

function dayTick(){                           // called once per day rollover

const SPARK_SL = slots({ X: [-1, 1.0] });
function addFx(x, y, z){ fxs.push({ x, y, z, t: 0.12 }); }
function sightClear(x0, y0, x1, y1){
  const dx = x1 - x0, dy = y1 - y0, d = Math.hypot(dx, dy);
  const steps = Math.ceil(d * 2);
  for (let s = 1; s < steps; s++){
    const t = s / steps;
    const ix = (x0 + dx * t) | 0, iy = (y0 + dy * t) | 0;
    if (!inMap(ix, iy) || tH[iy * MAP + ix] > 1.4) return false;
  }
  return true;
}
// how far a bullet travels before masonry stops it (chest height, 1.3)
function wallDist(maxD){
  const rdx = Math.cos(cam.ang), rdy = Math.sin(cam.ang);
  let mapX = cam.x | 0, mapY = cam.y | 0;
  const ddx = rdx === 0 ? 1e30 : Math.abs(1 / rdx);
  const ddy = rdy === 0 ? 1e30 : Math.abs(1 / rdy);
  let stepX, stepY, sdx, sdy;
  if (rdx < 0){ stepX = -1; sdx = (cam.x - mapX) * ddx; } else { stepX = 1; sdx = (mapX + 1 - cam.x) * ddx; }
  if (rdy < 0){ stepY = -1; sdy = (cam.y - mapY) * ddy; } else { stepY = 1; sdy = (mapY + 1 - cam.y) * ddy; }
  let guard = 0;
  while (guard++ < 200){
    let d;
    if (sdx < sdy){ d = sdx; sdx += ddx; mapX += stepX; } else { d = sdy; sdy += ddy; mapY += stepY; }
    if (d > maxD) return maxD;
    if (mapX < 0 || mapY < 0 || mapX >= MAP || mapY >= MAP) return d;
    if (tH[mapY * MAP + mapX] > 1.3) return d;
  }

}
function hostileInSights(maxD, halfW){

    const a = actors[i];
    if (a.brain !== 'hostile' || !!a.interior !== !!inside) continue;
    const rx = a.x - cam.x, ry = a.y - cam.y;
    const f = rx * vx + ry * vy;
    if (f < 0.3 || f > wd) continue;
    if (Math.abs(vy * rx - vx * ry) > halfW) continue;

                           cam.y + vy * Math.min(12, maxD * 0.4), 16, _q1);

      const p = near[i];
      const rx = p.x - cam.x, ry = p.y - cam.y;
      const f = rx * vx + ry * vy;
      if (f < 0.3 || f > wd) continue;

/*=========================== 13g. THE LIVING CLOCK =========================
  Time and weather run themselves now. The clock is continuous - one game
  day is 24 real minutes - and the three TIME looks became keyframes: dawn
  passes through the dusk palette on its way to day, evening runs it in
  reverse, and the palettes chase the blend as it moves. The old T and X
  keys are gone; benches are how you hurry time along.

  The calendar starts JAN 12 2420 and counts on from there.
============================================================================*/
let clock = 20, dayCount = 0;              // the city wakes at night
let bakeKey = -1, lastAtlasT = 0;
// blend segments: night ends at 05:00, day runs 06:30-18:30, night by 20:00
function timeBlend(){
  const c = clock;
  if (c >= 20 || c < 5) return { a: 0, b: 0, u: 0 };
  if (c < 5.75)  return { a: 0, b: 1, u: (c - 5) / 0.75 };
  if (c < 6.5)   return { a: 1, b: 2, u: (c - 5.75) / 0.75 };
  if (c < 18.5)  return { a: 2, b: 2, u: 0 };
  if (c < 19.25) return { a: 2, b: 1, u: (c - 18.5) / 0.75 };
  return { a: 1, b: 0, u: (c - 19.25) / 0.75 };
}
function curTime(){
  const t = timeBlend();
  if (t.a === t.b || t.u <= 0) return TIME[t.a];
  const A = TIME[t.a], B = TIME[t.b], u = t.u;
  const mv = (p, q) => p + (q - p) * u;
  const m3 = (P, Q) => [mv(P[0], Q[0]), mv(P[1], Q[1]), mv(P[2], Q[2])];
  return { fog: m3(A.fog, B.fog), sky: m3(A.sky, B.sky), glow: m3(A.glow, B.glow),
           lit: mv(A.lit, B.lit), amb: mv(A.amb, B.amb) };
}
function updateClock(dt){
  clock += dt / 60;
  if (clock >= 24){ clock -= 24; dayTick(); }
  const t = timeBlend();
  const dom = t.u < 0.5 ? t.a : t.b;
  if (dom !== CFG.timeMode){                // the gameplay flags snap here
    CFG.timeMode = dom;
    for (const b of buildings)
      b.litP = clamp(curTime().lit * (0.45 + hash3(b.id, 3, 9)), 0.05, 0.95);
  }
  const key = t.a * 1000 + t.b * 100 + ((t.u * 24) | 0)
            + (drug && (drug.fx.hue || drug.fx.hueC || drug.fx.sat || drug.fx.warm)
                 ? 100000 + (((worldTime * 20) | 0) % 997) * 101 : 0);
  if (key !== bakeKey){                     // the palette chases the blend
    bakeKey = key;
    bgGrad = null;
    if (GL) glBuildPalette();
    else if ((t.u === 0 && !drug) ||

    }
  }

const MONTHS = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];

}

/* ---- weather drifts on its own: dwell in a state, then move on ---------- */
let wxT = 4000;
function applyWeather(n){

  if (n === 3) fogLevel = 0.12 + Math.random() * 0.25;
  if (n === 3 || was === 3){ if (GL) glBuildPalette(); else buildAtlases(); }

function wxUpdate(dt){

  // grow out of rain, and fog only settles after rain or a storm

  const sp = freeSpotNear(cam.x, cam.y);
  cam.x = sp[0]; cam.y = sp[1];
}
function waitOnBench(){
  // stops sit ON the looks: full dawn glow, full day, full dusk, full night
  const edges = [5.75, 6.5, 19.25, 20];
  let next = edges.find(e => e > clock + 0.02);
  if (next === undefined) next = edges[0] + 24;
  const dh = next - clock;                 // a game hour is 60 real seconds
  clock = next;
  if (clock >= 24){ clock -= 24; dayTick(); }
  fade = 1;
  wxUpdate(dh * 60);                       // the sky moves on while you doze
  updateClock(0);
  toast('time passes - ' + clockStr());
}

/*=========================== 13h. THE BODY =================================
  A real first-person body. View art is authored as plain text at native
  size and drawn literally - each character is its own glyph, coloured by a
  small per-piece map - then nearest-neighbour scaled to a share of the
  screen so the proportions hold on every grid. The body below you is not
  squashed by pitch: it rises into frame from the bottom edge as you look
  further down, the way a body does.
============================================================================*/
function hudCell(cx, cy2, ch, ci){
  if (cx < 0 || cx >= R.cols || cy2 < 0 || cy2 >= R.rows) return;
  const code = ch.charCodeAt(0) - 32;
  if (code <= 0 || code > 94) return;
  if (cy2 < hudR0) hudR0 = cy2;
  if (cy2 > hudR1) hudR1 = cy2;
  const i = cy2 * R.cols + cx;
  hGlyph[i] = code; hCol[i] = ci;
}
function viewW(rows){ let w = 0; for (const r of rows) w = Math.max(w, r.length); return w; }
function drawViewArt(rows, ax, ay, tr, cmap){
  rows = groundArt(rows);                    // always planted on the screen edge
  const ah = rows.length, aw = viewW(rows);
  const want = tr;
  tr = Math.min(tr, Math.round(ah * 3.5));   // chunky upscale beats a crushed one
  ay += want - tr;                           // a clamped pose still meets the floor
  const tc = Math.max(2, Math.round(tr * aw / ah));
  for (let y = 0; y < tr; y++){
    const sr = rows[(y * ah / tr) | 0];
    for (let x = 0; x < tc; x++){
      const ch = sr[(x * aw / tc) | 0];
      if (!ch || ch === ' ') continue;
      hudCell(ax + x, ay + y, ch, cmap[ch] !== undefined ? cmap[ch] : H_DRK);
    }
  }
  return tc;
}
function shiftArt(rows, dx, dy){              // slide a pose for an in-between
  const w = viewW(rows), out = [];
  for (let i = 0; i < rows.length; i++){
    let src = i - dy;
    if (src < 0){ out.push(' '.repeat(w)); continue; }   // sky above is fine
    if (src >= rows.length) src = rows.length - 1;       // but never float the arms
    const r = rows[src].padEnd(w);
    out.push(dx >= 0 ? ' '.repeat(dx) + r.slice(0, w - dx)
                     : r.slice(-dx) + ' '.repeat(-dx));
  }
  return out;
}
// the body is drawn bottom-anchored, so any blank rows under the last real
// one would hang it in mid-air. Trim them once and remember the result.
function groundArt(rows){
  if (rows._g) return rows._g;
  let n = rows.length;
  while (n > 1 && !rows[n - 1].trim()) n--;
  const g = n === rows.length ? rows : rows.slice(0, n);
  try { Object.defineProperty(rows, '_g', { value: g, enumerable: false }); }
  catch (e){ /* frozen art: just use the trim */ }
  return g;
}
// twice the frames at the same tempo: between every authored pose, the next
// one arriving a row low - the eye reads the travel instead of a cut
function tweenFrames(frames){
  if (!frames || frames.length < 2) return frames;
  const out = [];
  for (let i = 0; i < frames.length; i++){
    out.push(frames[i]);
    // the next pose arriving a row low, or - on the last - this one settling
    out.push(shiftArt(frames[i + 1] || frames[i], 0, 1));
  }
  return out;                                 // exactly twice the frames
}
function mirrorView(rows){
  const w = viewW(rows);
  const M = { '/': '\\', '\\': '/', '(': ')', ')': '(', '[': ']', ']': '[' };
  return rows.map(r => r.padEnd(w).split('').reverse().map(c => M[c] || c).join(''));
}

/*=========================== 13i2. THE CITY MAP ============================
  A full-screen chart of all 4 km2: pan with WASD or a drag, zoom with Q/E,
  read the street names. Avenues run east-west and carry names hashed from
  the seed; the numbered streets run north-south. Landmarks and districts
  label themselves at the right zooms. M opens it; the corner minimap stays
  a pause-menu toggle.
============================================================================*/
/* the lattice names itself: avenues are letters, streets are numbers, and
   every crossing is an id like C7 - painted on the sidewalk at the corner */
let signFloor = Object.create(null);       // tile id -> character painted there
function aveLetter(k){
  let s = ''; k--;
  do { s = String.fromCharCode(65 + k % 26) + s; k = ((k / 26) | 0) - 1; } while (k >= 0);
  return s;
}
function xingId(k2, k){ return aveLetter(k) + k2; }
function stampIntersectionIds(){
  signFloor = Object.create(null);
  for (let k = 1; k < NB; k++)             // avenues run east-west (y lattice)
    for (let k2 = 1; k2 < NB; k2++){       // streets run north-south (x lattice)
      if (zoneAt(k2, k) >= 4) continue;
      const rx = k2 * P + (RW >> 1), ry = k * P + (RW >> 1);
      const tc = tType[ry * MAP + rx];     // the crossing must actually exist
      if (tc !== T_CROSS && tc !== T_ROAD) continue;
      const id = xingId(k2, k);
      const x0 = k2 * P + RW, y0 = k * P + RW;   // SE corner of the crossing
      let ok = true;
      for (let i = 0; i < id.length; i++)
        if (tType[y0 * MAP + x0 + i] !== T_WALK){ ok = false; break; }
      if (!ok) continue;
      // the raycast view mirrors east-west relative to world axes, so the
      // paint goes down as a mirror image: reversed run, flipped glyphs
      for (let i = 0; i < id.length; i++)
        signFloor[y0 * MAP + x0 + i] = id[id.length - 1 - i];
    }
}
function openMap(){
  // region labels: the centroid of each named place's blocks
  const acc = {};
  for (let bj = 0; bj < NB; bj++)
    for (let bi = 0; bi < NB; bi++){
      if (zoneAt(bi, bj) >= 4) continue;
      const r = regMap[bj * NB + bi];
      (acc[r] = acc[r] || { x: 0, y: 0, n: 0 });
      acc[r].x += bi; acc[r].y += bj; acc[r].n++;
    }
  const dlbl = Object.keys(acc).map(r => ({
    r: +r, name: REGIONS[r].name,
    x: (acc[r].x / acc[r].n + 0.5) * P, y: (acc[r].y / acc[r].n + 0.5) * P }));
  // a ring's centroid lands outside itself (THE FIELDS sits on the city
  // centre) - shove such labels onto the region's northern arm instead
  for (const L of dlbl){
    const bi = clamp((L.x / P) | 0, 0, NB - 1), bj = clamp((L.y / P) | 0, 0, NB - 1);
    if (zoneAt(bi, bj) < 4 && regMap[bj * NB + bi] === L.r) continue;
    let x = 0, y = 0, n = 0;
    for (let bj2 = 0; bj2 < NB >> 1; bj2++)
      for (let bi2 = 0; bi2 < NB; bi2++)
        if (zoneAt(bi2, bj2) < 4 && regMap[bj2 * NB + bi2] === L.r){ x += bi2; y += bj2; n++; }
    if (n){ L.x = (x / n + 0.5) * P; L.y = (y / n + 0.5) * P; }
  }
  pushMode({
    name: 'map', pausesWorld: true,
    cx: cam.x, cy: cam.y, z: 2, dlbl,
    onKey(code){
      const step = this.z * 5;
      switch (code){
        case 'KeyW': case 'ArrowUp':    this.cy -= step; break;
        case 'KeyS': case 'ArrowDown':  this.cy += step; break;
        case 'KeyA': case 'ArrowLeft':  this.cx += step; break;   // east is left now
        case 'KeyD': case 'ArrowRight': this.cx -= step; break;
        case 'KeyQ': case 'BracketLeft':  this.z = Math.min(8, this.z * 2); sfx('ui_move', { vol: 0.4 }); break;
        case 'KeyE': case 'BracketRight': this.z = Math.max(1, this.z / 2); sfx('ui_move', { vol: 0.4 }); break;
        case 'KeyM': case 'Escape': case 'Space': case 'Tab':
          popMode(); sfx('ui_back', { vol: 0.5 }); break;
      }
      this.cx = clamp(this.cx, 0, MAP); this.cy = clamp(this.cy, 0, MAP);
    },
    drag(dx, dy){
      this.cx = clamp(this.cx + dx / R.cellW * this.z, 0, MAP);
      this.cy = clamp(this.cy - dy / R.cellH * this.z * 1.8, 0, MAP);
    },
    tap(cx, cy){
      if (cy <= 4 && cx >= R.cols - 8){         // the corner zoom buttons
        if (cy <= 2) this.onKey('KeyQ'); else this.onKey('KeyE');
        return;
      }
      if (cy >= R.rows - 3) this.onKey('Escape');
    },
    draw(){ drawMapMode(this); }
  });
  sfx('ui_select', { vol: 0.5 });
}
function drawMapMode(m){
  const cols = R.cols, rows = R.rows;
  hudPanel(0, 0, cols, rows); hudPanel(0, 0, cols, rows);
  const za = m.z * 1.8;                        // cells are tall; rows cover more
  for (let r = 1; r < rows - 1; r++){
    const ty = (m.cy + (r - rows / 2) * za) | 0;
    for (let x = 0; x < cols; x++){
      const tx = (m.cx - (x - cols / 2) * m.z) | 0;   // east left, like the view
      if (!inMap(tx, ty)) continue;
      const t = tType[ty * MAP + tx];
      if (t === T_BLD) hudCell(x, r, '#', H_GRY);
      else if (t === T_WATER) hudCell(x, r, '~', H_BLU);
      else if (t === T_BRIDGE) hudCell(x, r, '=', H_DIM);
      else if (t === T_ROAD || t === T_CROSS) hudCell(x, r, '.', H_DIM);
      else if (t === T_WALK) hudCell(x, r, ':', H_DRK);
      else if (t === T_PATH) hudCell(x, r, ',', H_GRN);
      else if (t === T_LOT) hudCell(x, r, '"', H_DRK);
    }
  }
  const sx = wx => ((m.cx - wx) / m.z + cols / 2) | 0;
  const sy = wy => ((wy - m.cy) / za + rows / 2) | 0;
  // intersection ids at close zoom
  if (m.z <= 2){
    for (let k = 1; k < NB; k++)
      for (let k2 = 1; k2 < NB; k2++){
        if (zoneAt(k2, k) >= 4) continue;
        const x = sx(k2 * P + RW / 2), y = sy(k * P + RW / 2);
        if (y <= 2 || y >= rows - 2 || x < 1 || x >= cols - 5) continue;
        hudStr(x + 1, y, xingId(k2, k), H_DIM);
      }
  }
  // district names at far zoom - drawn whole and never over each other
  if (m.z >= 4){
    const placed = [];
    for (const d of m.dlbl){
      const x = sx(d.x) - (d.name.length >> 1), y = sy(d.y);
      if (y <= 1 || y >= rows - 2 || x < 1 || x + d.name.length > cols - 1) continue;
      if (placed.some(p => Math.abs(p.y - y) < 2 && x < p.x1 + 2 && x + d.name.length > p.x0 - 2)) continue;
      placed.push({ x0: x, x1: x + d.name.length, y });
      hudStr(x, y, d.name, H_PUR);
    }
  }
  // shops you have walked into, remembered by trade
  if (m.z <= 2 && worldDelta.seen){
    const TAG = { tools: 'T', armory: 'A', dispensary: 'D', jeweler: '$',
                  clothier: 'C', grocery: 'M', bodega: 'B', general: 'G' };
    for (const b in worldDelta.seen){
      const d = doors.find(dd => dd.b === +b);
      if (!d) continue;
      const x = sx(d.x), y = sy(d.y);
      if (x < 1 || x >= cols - 1 || y < 2 || y >= rows - 2) continue;
      hudCell(x, y, TAG[worldDelta.seen[b]] || 'G', H_GRN);
    }
  }
  // landmarks
  if (m.z <= 4)
    for (const l of landmarks){
      const x = sx(l.x), y = sy(l.y);
      if (x < 1 || x >= cols - 1 || y < 2 || y >= rows - 2) continue;
      hudCell(x, y, '*', H_YEL);
      if (m.z <= 2) hudStr(x + 2, y, l.name, H_YEL);
    }
  // the player, and the trail you should follow
  const px2 = sx(cam.x), py2 = sy(cam.y);
  if (px2 >= 0 && px2 < cols && py2 >= 1 && py2 < rows - 1){
    const dirCh = '<v>^'[((Math.round(cam.ang / (Math.PI / 2)) % 4) + 4) % 4];
    hudCell(px2, py2, dirCh, H_WHT);
  }
  const qt = questTarget();
  if (qt){
    const x = sx(qt.x), y = sy(qt.y);
    if (x >= 0 && x < cols && y >= 1 && y < rows - 1) hudCell(x, y, '!', H_YEL);
  }
  // chrome
  hudStr(2, 0, ' CITY MAP  x' + m.z + ' ', H_GRN);
  hudStr(cols - 8, 1, '[ + ]', H_GRN);
  hudStr(cols - 8, 3, '[ - ]', H_GRN);
  const foot = 'WASD/drag pan   Q/E zoom   M close';
  hudStr((cols - foot.length) >> 1, rows - 1, foot, H_DIM);
}

/*=========================== 13i. TOUCH ====================================
  The whole game on glass. A floating analog stick on the left thumb (push
  to the rim to sprint), drag anywhere else to look, and a small cluster of
  buttons: FIRE, ACT (context-aware - it knows when you are seated), and a
  utility row. Menus and dialogs are tapped directly - every row is a
  button - and a tap past the card backs out. Enabled automatically on
  coarse-pointer devices; DOM overlay, so the engine never knows.
============================================================================*/
const TOUCH = { on: false, f: 0, s: 0 };
function touchWanted(){
  try { return matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window; }
  catch (e){ return false; }
}
function touchCell(px, py){ return [((px - R.ox) / R.cellW) | 0, ((py - R.oy) / R.cellH) | 0]; }
function touchTap(px, py){
  const m = topMode();
  if (m){
    const c = touchCell(px, py);
    if (m.tap) m.tap(c[0], c[1]);
    else if (m.onKey) m.onKey('Space');
    return;
  }
  if (!sitting && lookTarget) tryInteract();
}
let touchUI = null;
function buildTouchUI(){
  if (touchUI) return;
  TOUCH.on = true;
  showHelp = false;                          // keyboard help is noise on glass
  showMap = false;                           // the MAP button brings it back
  const root = document.createElement('div');
  root.id = 'touchui';
  root.style.cssText = 'position:fixed;inset:0;pointer-events:none;z-index:20;' +
    'font:11px "Cascadia Mono","Consolas",monospace;-webkit-user-select:none;user-select:none;';
  const mkBtn = (label, css, fn, hold, passthru) => {
    const b = document.createElement('div');
    b.textContent = label;
    b.style.cssText = 'position:absolute;pointer-events:auto;display:flex;align-items:center;' +
      'justify-content:center;color:#8ff0c0;background:rgba(4,8,14,.55);' +
      'border:1px solid rgba(143,240,192,.5);border-radius:50%;touch-action:none;' +
      'letter-spacing:.5px;' + css;
    let rep = null;
    b.addEventListener('pointerdown', e => {
      e.preventDefault(); e.stopPropagation();
      audioUnlock();
      if (passthru && topMode()){            // a card is open: the tap is FOR the card
        touchTap(e.clientX, e.clientY);
        return;
      }
      b.style.background = 'rgba(143,240,192,.25)';
      fn();
      if (hold) rep = setInterval(fn, 270);
    });
    const up = () => { b.style.background = 'rgba(4,8,14,.55)'; if (rep){ clearInterval(rep); rep = null; } };
    b.addEventListener('pointerup', up);
    b.addEventListener('pointercancel', up);
    root.appendChild(b);
    return b;
  };
  // ---- the stick: floats to wherever the thumb lands ----------------------
  const zone = document.createElement('div');
  zone.style.cssText = 'position:absolute;left:0;bottom:0;width:44vw;height:46vh;' +
    'pointer-events:auto;touch-action:none;';
  const base = document.createElement('div');
  base.style.cssText = 'position:absolute;width:104px;height:104px;border-radius:50%;' +
    'border:1px solid rgba(143,240,192,.4);background:rgba(4,8,14,.3);display:none;' +
    'margin:-52px 0 0 -52px;pointer-events:none;';
  const nub = document.createElement('div');
  nub.style.cssText = 'position:absolute;width:44px;height:44px;border-radius:50%;' +
    'background:rgba(143,240,192,.35);border:1px solid rgba(143,240,192,.7);display:none;' +
    'margin:-22px 0 0 -22px;pointer-events:none;';
  zone.appendChild(base); zone.appendChild(nub);
  root.appendChild(zone);
  let stickId = null, sx = 0, sy = 0;
  const RAD = 52;
  const stickReset = () => {
    stickId = null; TOUCH.f = 0; TOUCH.s = 0; keys.ShiftLeft = 0;
    base.style.display = nub.style.display = 'none';
  };
  zone.addEventListener('pointerdown', e => {
    e.preventDefault(); e.stopPropagation();
    audioUnlock();
    if (topMode()){                          // a card is open: taps go to the card
      touchTap(e.clientX, e.clientY);
      return;
    }
    stickId = e.pointerId; sx = e.clientX; sy = e.clientY;
    zone.setPointerCapture(e.pointerId);
    base.style.left = nub.style.left = sx + 'px';
    base.style.top = nub.style.top = sy + 'px';
    base.style.display = nub.style.display = 'block';
  });
  zone.addEventListener('pointermove', e => {
    if (e.pointerId !== stickId) return;
    let dx = e.clientX - sx, dy = e.clientY - sy;
    const d = Math.hypot(dx, dy);
    if (d > RAD){ dx = dx / d * RAD; dy = dy / d * RAD; }
    nub.style.left = (sx + dx) + 'px'; nub.style.top = (sy + dy) + 'px';
    TOUCH.f = -dy / RAD; TOUCH.s = dx / RAD;
    keys.ShiftLeft = d > RAD * 0.85 ? 1 : 0;          // rim = sprint
  });
  const stickUp = e => { if (e.pointerId === stickId) stickReset(); };

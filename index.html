/*============================ 11. AIR TRAFFIC ==============================
  Cars are set dressing, not physics. They fly, they never collide with the
  player or with anything on the ground, and their only rules are: hold a
  cruising band, climb over whatever is in front of you, and keep out of each
  other's way. The old lane graph, signals and car-following are gone with the
  ground traffic they existed to serve.
============================================================================*/
const DIRV = [[1, 0], [0, 1], [-1, 0], [0, -1]];
const BANDS = [15, 22, 30, 40];
let cars = [];
function pickFlyTarget(f){
  f.tx = rr(8, MAP - 8); f.ty = rr(8, MAP - 8);
  f.ttl = 9 + rnd() * 16;
}
function placeFlyer(f, avoidCam){
  for (let t = 0; t < 30; t++){
    const th = rnd() * Math.PI * 2, rd = 25 + rnd() * 130;
    const x = clamp(cam.x + Math.cos(th) * rd, 6, MAP - 6);
    const y = clamp(cam.y + Math.sin(th) * rd, 6, MAP - 6);
    if (avoidCam && Math.hypot(x - cam.x, y - cam.y) < 40) continue;
    f.x = x; f.y = y;
    f.band = BANDS[(rnd() * BANDS.length) | 0] + rr(-2, 2);
    f.z = f.band;
    const a = rnd() * Math.PI * 2;
    f.dx = Math.cos(a); f.dy = Math.sin(a);
    f.spd = 7 + rnd() * 9;
    f.col = CARC[(rnd() * CARC.length) | 0];
    const sl = slots({ B: [f.col, 0.92], W: [C.glass, 0.52], T: [C.tire, 0.90],
                       L: [C.head, 1.0], R: [C.tail, 1.0] });
    f.sb = sl.base; f.sd = sl.dens;
    pickFlyTarget(f);
    return true;
  }
  return false;
}
function spawnCars(){
  cars = [];
  for (let i = 0; i < CFG.CARS; i++){
    const f = { x: 0, y: 0, z: 20, dx: 1, dy: 0, tx: 0, ty: 0, ttl: 0,
                band: 20, spd: 8, col: 0, len: 4.6, wid: 2.2, blink: 0, v: 8 };
    if (placeFlyer(f, false)) cars.push(f);
  }
}
function updateCar(f, dt){
  f.ttl -= dt;
  let dxT = f.tx - f.x, dyT = f.ty - f.y;
  const dist = Math.hypot(dxT, dyT);
  if (dist < 7 || f.ttl <= 0){ pickFlyTarget(f); dxT = f.tx - f.x; dyT = f.ty - f.y; }
  let hx = dxT / (dist || 1), hy = dyT / (dist || 1);

  // keep out of each other's way, but only within the same altitude slab
  const near = gridQuery(carGrid, f.x, f.y, 12, _q1);
  for (let i = 0; i < near.length; i++){
    const o = near[i];
    if (o === f || Math.abs(o.z - f.z) > 5) continue;
    const ddx = f.x - o.x, ddy = f.y - o.y;
    const d2 = ddx * ddx + ddy * ddy;
    if (d2 > 0.01 && d2 < 49){
      const d = Math.sqrt(d2);
      hx += ddx / d * 1.6; hy += ddy / d * 1.6;
    }
  }
  const hl = Math.hypot(hx, hy) || 1;
  hx /= hl; hy /= hl;
  const turn = Math.min(1, dt * 1.5);
  f.dx += (hx - f.dx) * turn; f.dy += (hy - f.dy) * turn;
  const l = Math.hypot(f.dx, f.dy) || 1;
  f.dx /= l; f.dy /= l;

  // Climb over whatever is coming up. Downtown towers run past 100 units, so
  // the lookahead has to scale with speed or a flyer meets a wall it cannot
  // out-climb; the floor clamp below is the guarantee.
  let hAhead = 0;
  const look = 12 + f.spd * 2.4;
  for (let k = 1; k <= 5; k++){
    const px = (f.x + f.dx * look * k * 0.2) | 0, py = (f.y + f.dy * look * k * 0.2) | 0;
    for (let oy = -1; oy <= 1; oy++)
      for (let ox = -1; ox <= 1; ox++){
        const th = heightAt(px + ox, py + oy);
        if (th > hAhead) hAhead = th;
      }
  }
  const want = Math.max(f.band, hAhead + 7);
  f.z += clamp(want - f.z, -12 * dt, 30 * dt);
  f.x += f.dx * f.spd * dt; f.y += f.dy * f.spd * dt;
  const under = heightAt(f.x | 0, f.y | 0);       // never inside the geometry,
  if (f.z < under + 2.5) f.z = under + 2.5;       // checked after the step
  f.blink += dt * f.spd;
  if (f.x < 3 || f.y < 3 || f.x > MAP - 4 || f.y > MAP - 4){
    f.x = clamp(f.x, 3, MAP - 4); f.y = clamp(f.y, 3, MAP - 4);
    pickFlyTarget(f);
  }
}

/*======================= 12. PEDESTRIANS + A* PATHING ======================
  Walkable cells are sidewalks, park lots and crosswalks (crosswalks carry a
  heavy cost so a pedestrian only crosses when it genuinely shortens the trip).
  Each pedestrian A*s to a random walkable tile, follows the waypoints, and
  waits at the kerb until the signal is red for traffic and the road is clear.
============================================================================*/
const gCost  = new Float32Array(MAP * MAP);
const came   = new Int32Array(MAP * MAP);
const stampO = new Int32Array(MAP * MAP);
const stampC = new Int32Array(MAP * MAP);
let   asGen = 0;
const HCAP = 40000;
const hpId = new Int32Array(HCAP), hpF = new Float32Array(HCAP);
let hpN = 0;
function hpPush(id, f){
  let i = hpN++;
  if (i >= HCAP) { hpN = HCAP; return; }
  hpId[i] = id; hpF[i] = f;
  while (i > 0){
    const p = (i - 1) >> 1;
    if (hpF[p] <= hpF[i]) break;
    const ti = hpId[p], tf = hpF[p];
    hpId[p] = hpId[i]; hpF[p] = hpF[i]; hpId[i] = ti; hpF[i] = tf; i = p;
  }
}
function hpPop(){
  const top = hpId[0]; hpN--;
  if (hpN > 0){
    hpId[0] = hpId[hpN]; hpF[0] = hpF[hpN];
    let i = 0;
    for (;;){
      const l = 2 * i + 1, r = l + 1; let m = i;
      if (l < hpN && hpF[l] < hpF[m]) m = l;
      if (r < hpN && hpF[r] < hpF[m]) m = r;
      if (m === i) break;
      const ti = hpId[m], tf = hpF[m];
      hpId[m] = hpId[i]; hpF[m] = hpF[i]; hpId[i] = ti; hpF[i] = tf; i = m;
    }
  }
  return top;
}
function astar(sx, sy, tx, ty, limit){
  const start = sy * MAP + sx, goal = ty * MAP + tx;
  if (!walkG[start] || !walkG[goal] || start === goal) return null;
  asGen++; hpN = 0;
  gCost[start] = 0; stampO[start] = asGen; came[start] = -1;
  hpPush(start, 0);
  let expanded = 0;
  while (hpN > 0){
    const cur = hpPop();
    if (stampC[cur] === asGen) continue;
    stampC[cur] = asGen;
    if (cur === goal){
      const path = [];
      let n = cur;
      while (n !== -1){ path.push(n); n = came[n]; }
      path.reverse();
      return path;
    }
    if (++expanded > limit) return null;
    const cx = cur % MAP, cy = (cur / MAP) | 0, g0 = gCost[cur];
    for (let d = 0; d < 4; d++){
      const nx = cx + DIRV[d][0], ny = cy + DIRV[d][1];
      if (nx < 0 || ny < 0 || nx >= MAP || ny >= MAP) continue;
      const ni = ny * MAP + nx, w = walkG[ni];
      if (!w || stampC[ni] === asGen) continue;
      const ng = g0 + w * 0.1;
      if (stampO[ni] === asGen && gCost[ni] <= ng) continue;
      stampO[ni] = asGen; gCost[ni] = ng; came[ni] = cur;
      hpPush(ni, ng + (Math.abs(nx - tx) + Math.abs(ny - ty)) * 1.12);
    }
  }
  return null;
}

let peds = [];
const repathQ = [];
const CROWD = [0.85, 1.00, 0.55, 0.18, 0.30, 0.07];  // by district: how busy the street is
function randWalkTile(weighted){
  for (let i = 0; i < 500; i++){
    const x = ri(1, MAP - 2), y = ri(1, MAP - 2);
    if (!walkG[y * MAP + x]) continue;
    if (weighted && rnd() > CROWD[districtAt(x, y)]) continue;
    return [x, y];
  }
  for (let i = 0; i < 400; i++){
    const x = ri(1, MAP - 2), y = ri(1, MAP - 2);
    if (walkG[y * MAP + x]) return [x, y];
  }
  return [RW + SW + 1, RW + SW + 1];
}
// a walkable tile beside a street stall, so crowds have somewhere to gather
function stallTile(nx, ny){
  if (!stalls.length) return null;
  let st = null, bd = 1e9;
  for (let k = 0; k < 24; k++){                 // nearest of a few random stalls
    const c = stalls[(rnd() * stalls.length) | 0];
    const d = Math.abs(c.x - nx) + Math.abs(c.y - ny);
    if (d < bd && d < 90){ bd = d; st = c; }
  }
  if (!st) return null;
  for (let t = 0; t < 12; t++){
    const x = (st.x + rr(-2.5, 2.5)) | 0, y = (st.y + rr(-2.5, 2.5)) | 0;
    if (inMap(x, y) && walkG[y * MAP + x]) return [x, y];
  }
  return null;
}
// The world is far larger than the population, so agents are kept around the
// camera instead of scattered thin across 4 km^2.
const STREAM_R = 130;
function randWalkNear(cx, cy, rmin, rmax){
  for (let i = 0; i < 260; i++){
    const th = rnd() * Math.PI * 2, r = rmin + rnd() * (rmax - rmin);
    const x = (cx + Math.cos(th) * r) | 0, y = (cy + Math.sin(th) * r) | 0;
    if (x < 1 || y < 1 || x >= MAP - 1 || y >= MAP - 1) continue;
    if (!walkG[y * MAP + x]) continue;
    return [x, y];
  }
  return null;
}
function streamAgents(){
  for (let i = 0; i < peds.length; i++){
    const p = peds[i];
    if (Math.abs(p.x - cam.x) < STREAM_R && Math.abs(p.y - cam.y) < STREAM_R) continue;
    const t = randWalkNear(cam.x, cam.y, 40, STREAM_R * 0.8);
    if (t){
      if (p.sit){ p.sit.occ--; p.sit = null; }
      p.x = t[0] + 0.5; p.y = t[1] + 0.5; p.path = null; p.pi = 0; p.cool = rnd() * 2;
    }
  }
  for (let i = 0; i < cars.length; i++){
    const c = cars[i];
    if (cam.riding === c) continue;
    if (Math.abs(c.x - cam.x) < STREAM_R * 1.5 && Math.abs(c.y - cam.y) < STREAM_R * 1.5) continue;
    const th = rnd() * Math.PI * 2, r = 60 + rnd() * 90;
    c.x = clamp(cam.x + Math.cos(th) * r, 3, MAP - 4);
    c.y = clamp(cam.y + Math.sin(th) * r, 3, MAP - 4);
    pickFlyTarget(c);
  }
}
function spawnPeds(){
  peds = []; repathQ.length = 0;
  for (let i = 0; i < CFG.PEDS; i++){
    const near = randWalkNear(cam.x, cam.y, 8, STREAM_R * 0.8);
    const [x, y] = near || randWalkTile(true);
    const shirt = SHIRTC[(rnd() * SHIRTC.length) | 0];
    const skin  = SKINC[(rnd() * SKINC.length) | 0];
    const sl = slots({ H: [skin, 0.92], S: [shirt, 0.86],
                       P: [C.pants, 0.82], T: [C.tire, 0.75] });
    peds.push({
      x: x + 0.5, y: y + 0.5, dx: 1, dy: 0,
      spd: 1.05 + rnd() * 0.75, path: null, pi: 0, phase: rnd() * 6,
      sb: sl.base, sd: sl.dens,
      wait: 0, cool: rnd() * 2, moving: 0, linger: false,
      jx: rr(-0.3, 0.3), jy: rr(-0.3, 0.3)
    });
    repathQ.push(i);
  }
}
// which intersection governs this crosswalk cell, and which traffic axis
function pedNudge(p, dx, dy){
  const nx = p.x + dx, ny = p.y + dy;
  if (walkG[clamp(ny | 0, 0, MAP - 1) * MAP + clamp(nx | 0, 0, MAP - 1)]){ p.x = nx; p.y = ny; }
}
function updatePed(p, i, dt){
  const x0 = p.x, y0 = p.y;
  p.cool -= dt;
  if (worldTime < panicT){                        // gunfire scatters the crowd
    const dx = p.x - panicX, dy = p.y - panicY, d2 = dx * dx + dy * dy;
    if (d2 < 260 && d2 > 0.001){
      if (p.sit){ p.sit.occ--; p.sit = null; }    // nobody keeps their seat
      const d = Math.sqrt(d2);
      pedNudge(p, dx / d * p.spd * 2.6 * dt, dy / d * p.spd * 2.6 * dt);
      p.dx = dx / d; p.dy = dy / d;
      p.phase += p.spd * dt * 6; p.moving = 1;
      p.path = null;
      return;
    }
  }
  if ((!p.path || p.pi >= p.path.length) && p.cool <= 0){
    if (repathQ.indexOf(i) < 0) repathQ.push(i);
    // people linger at a food stall instead of turning straight around
    p.cool = p.linger ? 7 + rnd() * 16 : 0.5 + rnd();
    p.linger = false;
  }
  p.moving = 0;
  // an idle pedestrian near a free bench sometimes takes the seat
  if (!p.sit && !p.path && p.cool > 3 && hash3(i, (worldTime / 4) | 0, 77) < 0.12){
    const near2 = gridQuery(propGrid, p.x, p.y, 2, _q2);
    for (let n = 0; n < near2.length; n++){
      const q = near2[n];
      if (q.k !== PK_BENCH || (q.occ || 0) >= 2) continue;
      p.sit = q; q.occ = (q.occ || 0) + 1;
      p.x = q.x + (q.occ === 1 ? -0.3 : 0.3); p.y = q.y;
      p.dx = 0; p.dy = 1;
      break;
    }
  }
  if (p.sit){
    if (p.cool <= 0.3){ p.sit.occ--; p.sit = null; }
    else return;
  }
  if (p.path && p.pi < p.path.length){
    const cell = p.path[p.pi];
    const cx = cell % MAP, cy = (cell / MAP) | 0;
    const tx = cx + 0.5 + p.jx, ty = cy + 0.5 + p.jy;
    let dx = tx - p.x, dy = ty - p.y;
    const dist = Math.hypot(dx, dy) || 1;

    // nothing to yield to any more - the roadway is a boulevard
    const sp = p.spd;
    p.dx = dx / dist; p.dy = dy / dist;
    p.x += p.dx * sp * dt; p.y += p.dy * sp * dt;
    p.phase += sp * dt * 3.4;
    p.moving = 1;
    if (dist < 0.34) p.pi++;
  }
  // Separation and shove are applied only where they land on legal ground, so
  // they can never cancel the pedestrian's own progress across a crosswalk.
  const near = gridQuery(pedGrid, p.x, p.y, 2, _q2);
  for (let n = 0; n < near.length; n++){
    const o = near[n]; if (o === p) continue;
    const dx = p.x - o.x, dy = p.y - o.y;
    const d2 = dx * dx + dy * dy;
    if (d2 > 0.0001 && d2 < 0.36){
      const d = Math.sqrt(d2), f = (0.6 - d) * 1.6 * dt;
      pedNudge(p, dx / d * f, dy / d * f);
    }
  }
  // A pedestrian must never end a frame on illegal ground - a body parked in a
  // traffic lane would block that lane forever.
  if (!walkG[clamp(p.y | 0, 0, MAP - 1) * MAP + clamp(p.x | 0, 0, MAP - 1)]){
    if (walkG[clamp(y0 | 0, 0, MAP - 1) * MAP + clamp(x0 | 0, 0, MAP - 1)]){
      p.x = x0; p.y = y0;                        // undo the illegal step
    } else {                                     // stranded: walk to legal ground
      let bx = -1, by = -1, bd = 1e9;
      for (let dy = -3; dy <= 3; dy++)
        for (let dx = -3; dx <= 3; dx++){
          const nx = (p.x | 0) + dx, ny = (p.y | 0) + dy;
          if (nx < 0 || ny < 0 || nx >= MAP || ny >= MAP || !walkG[ny * MAP + nx]) continue;
          const d = Math.hypot(nx + 0.5 - p.x, ny + 0.5 - p.y);
          if (d < bd){ bd = d; bx = nx; by = ny; }
        }
      if (bx >= 0){
        const step = Math.min(bd, 3.0 * dt);
        p.x += (bx + 0.5 - p.x) / bd * step;
        p.y += (by + 0.5 - p.y) / bd * step;
      }
      p.path = null;
    }
  }
}
function serviceRepaths(){
  let budget = 3;
  while (repathQ.length && budget-- > 0){
    const i = repathQ.shift();
    const p = peds[i]; if (!p) continue;
    const sx = clamp(p.x | 0, 0, MAP - 1), sy = clamp(p.y | 0, 0, MAP - 1);
    if (!walkG[sy * MAP + sx]){ p.path = null; continue; }
    let best = null, toStall = false;
    if (rnd() < 0.34){ best = stallTile(sx, sy); toStall = !!best; }
    if (!best) best = randWalkNear(sx, sy, 14, 62);
    if (!best) continue;
    const path = astar(sx, sy, best[0], best[1], 7000);
    if (path){ p.path = path; p.pi = 1; p.linger = toStall; }
  }
}

/*============================ 12b. ACTORS ==================================
  A persistent layer above the ambient crowd: named characters - NPCs now,
  quest-givers and enemies later. Unlike pedestrians they are never streamed
  away, solid ones block the camera, and each can carry dialog and a small
  brain. ACTORDEF is the species table; an actor is data plus a brain name.

  Brains: 'still' stands at its post; 'wander' strolls the walk grid within
  range of home. Either one stops and faces the player when approached.
============================================================================*/
const ACTORDEF = {
  citizen:  { speed: 1.1, solid: true, r: 0.34 },
  vendor:   { speed: 0.9, solid: true, r: 0.34 },
  razor:    { speed: 2.35, solid: true, r: 0.34 },
  enforcer: { speed: 2.6, solid: true, r: 0.36 }
};
let actors = [];
function spawnActor(kind, x, y, o){
  o = o || {};
  const def = ACTORDEF[kind];
  const sl = slots({ H: [o.skin !== undefined ? o.skin : SKINC[(rnd() * SKINC.length) | 0], 0.92],
                     S: [o.shirt !== undefined ? o.shirt : SHIRTC[(rnd() * SHIRTC.length) | 0], 0.86],
                     P: [C.pants, 0.82], T: [C.tire, 0.75] });
  const a = {
    id: actors.length, kind, name: o.name || 'STRANGER',
    x, y, dx: 0, dy: 1, spd: def.speed, r: def.r, solid: def.solid,
    path: null, pi: 0, phase: rnd() * 6, moving: 0, cool: rnd() * 3,
    brain: o.brain || 'still', dialog: o.dialog || null, tree: o.tree || null,
    homeX: x | 0, homeY: y | 0, range: o.range || 12,
    hp: o.hp || 0, maxHp: o.hp || 0, aggro: 0, hitT: 0, atkCool: 0,
    sb: sl.base, sd: sl.dens
  };
  actors.push(a);
  return a;
}
// direct loop - the cast is small; give this a grid if actors ever number 100+
function actorBlocked(x, y, rad){
  for (let i = 0; i < actors.length; i++){
    const a = actors[i];
    if (!a.solid) continue;
    const dx = x - a.x, dy = y - a.y, rr2 = (rad + a.r) * (rad + a.r);
    if (dx * dx + dy * dy < rr2) return true;
  }
  return false;
}
function updateActor(a, dt){
  a.cool -= dt;
  a.moving = 0;
  if (a.hitT) a.hitT = Math.max(0, a.hitT - dt);
  if (a.brain === 'hostile'){ hostileBrain(a, dt); return; }
  const prx = cam.x - a.x, pry = cam.y - a.y;
  const pr = Math.hypot(prx, pry);
  const engaged = pr < 2.6;                    // player close: stop, meet their eye
  if (engaged && pr > 0.001){ a.dx = prx / pr; a.dy = pry / pr; }
  if (pr < 0.9 && pr > 0.001){                 // and never stand inside them
    const bx = a.x - prx / pr * 1.4 * dt, by = a.y - pry / pr * 1.4 * dt;
    if (walkG[clamp(by | 0, 0, MAP - 1) * MAP + clamp(bx | 0, 0, MAP - 1)]){ a.x = bx; a.y = by; }
  }
  if (a.brain !== 'wander' || engaged) return;
  if ((!a.path || a.pi >= a.path.length) && a.cool <= 0){
    a.cool = 4 + rnd() * 8;
    const t = randWalkNear(a.homeX, a.homeY, 2, a.range);
    if (t){
      const path = astar(clamp(a.x | 0, 0, MAP - 1), clamp(a.y | 0, 0, MAP - 1), t[0], t[1], 3000);
      if (path){ a.path = path; a.pi = 1; }
    }
  }
  if (a.path && a.pi < a.path.length){
    const cell = a.path[a.pi], cx = cell % MAP, cy = (cell / MAP) | 0;
    const dx = cx + 0.5 - a.x, dy = cy + 0.5 - a.y;
    const dist = Math.hypot(dx, dy) || 1;
    a.dx = dx / dist; a.dy = dy / dist;
    a.x += a.dx * a.spd * dt; a.y += a.dy * a.spd * dt;
    a.phase += a.spd * dt * 3.4;
    a.moving = 1;
    if (dist < 0.34) a.pi++;
  }
}

/*======================== 12c. DOORS + INTERIORS ===========================
  Buildings have insides. The trick is that the renderer never finds out: the
  tile arrays (tType / tH / tB / walkG) are swapped by reference for a second
  interior set, the camera teleports into a small room stamped near the array
  origin, and every pass - DDA walls, floor projection, sprites, collision -
  keeps working untouched. A ceiling pass replaces the sky pass indoors.

  Rooms are generated on entry, seeded by the building, so a shop is the same
  shop every visit and nothing is stored. One door per building, cut into a
  street-facing wall, named after the sign the facade already carries.
============================================================================*/
const INT_CEIL = 3.0, IOX = 10, IOY = 10;
let doors = [], inside = null, EXT = null, INTB = null;
let intFloorA = 0, intFloorB = 0;
// district -> room archetype; each carries floor colours, a keeper, lines
const INTERIOR_KIND = ['lobby', 'shop', 'shop', 'depot', 'home', 'home'];
const INT_FLAVOR = {
  shop:  { keeper: 'SHOPKEEP', floorA: 0, floorB: 0, lines: [
           'Browse all you like. The cameras browse you back.',
           'Stock comes in on the metro, same as the customers.'] },
  lobby: { keeper: 'CONCIERGE', floorA: 0, floorB: 0, lines: [

  depot: { keeper: 'FOREMAN', floorA: 0, floorB: 0, lines: [

  home:  { keeper: 'RESIDENT', floorA: 0, floorB: 0, lines: [
           'You are standing in my house. The door was shut for a reason.',
           'Rain gets in through the roof. The landlord says that is weather.'] },
  office:  { keeper: 'CLERK', floorA: 0, floorB: 0, lines: [
           'If you are here about the invoices, the answer is still no.',

  apts:    { keeper: 'TENANT', floorA: 0, floorB: 0, lines: [

           'Do not knock on 4C. Trust me.'] },
  storage: { keeper: 'CARETAKER', floorA: 0, floorB: 0, lines: [
           'Everything here belongs to somebody who forgot it.'] }
};
function initInteriorFlavors(){          // palette indices exist by now
  INT_FLAVOR.shop.floorA  = C.walk;   INT_FLAVOR.shop.floorB  = C.deckOld;
  INT_FLAVOR.lobby.floorA = C.deck;   INT_FLAVOR.lobby.floorB = C.dataDk;
  INT_FLAVOR.depot.floorA = C.dataDk; INT_FLAVOR.depot.floorB = C.asphalt;
  INT_FLAVOR.home.floorA  = C.deckOld; INT_FLAVOR.home.floorB = C.trunk;
  INT_FLAVOR.office.floorA = C.deck;   INT_FLAVOR.office.floorB = C.screen;
  INT_FLAVOR.apts.floorA   = C.deckOld; INT_FLAVOR.apts.floorB = C.walk;
  INT_FLAVOR.storage.floorA = C.dataDk; INT_FLAVOR.storage.floorB = C.tire;

initInteriorFlavors();
// A building's canonical floors: always the street, sometimes a low floor,
// a couple of hash-picked mid numbers, and the top. Five layouts serve any
// tower - the numbers are the fiction, the seed makes them real.
function bldFloors(b){
  const top = Math.max(1, Math.round(b.h / 3.2));
  if (top < 3) return top === 1 ? [1] : [1, top];
  const list = [1], used = { 1: 1, [top]: 1 };
  const n = Math.min(3, 1 + ((top / 9) | 0));
  let guard = 0;
  while (list.length < n && guard++ < 24){
    const f = 2 + ((hash3(b.seed, list.length * 7 + guard, 55) * (top - 2)) | 0);
    if (!used[f]){ used[f] = 1; list.push(f); }
  }
  list.push(top);
  return list.sort((a, c) => a - c);
}
// One door per worthwhile building, on a wall that fronts a sidewalk.
function buildDoors(){
  doors = [];
  for (const b of buildings){
    if (b.landmark || b.dome || b.h < 2.4) continue;
    const cand = [];
    for (let y = b.y0; y <= b.y1; y++)
      for (let x = b.x0; x <= b.x1; x++){
        if (!inMap(x, y) || tB[y * MAP + x] !== b.id || tH[y * MAP + x] <= 0) continue;
        for (let d = 0; d < 4; d++){
          const nx = x + DIRV[d][0], ny = y + DIRV[d][1];
          if (!inMap(nx, ny) || tType[ny * MAP + nx] !== T_WALK) continue;
          cand.push([x, y, d]);
        }
      }
    if (!cand.length) continue;
    const c = cand[(hash3(b.id, 77, b.seed) * cand.length) | 0];
    const nx = DIRV[c[2]][0], ny = DIRV[c[2]][1];
    b.doorX = c[0]; b.doorY = c[1];        // the facade draws the door itself
    b.doorNX = nx; b.doorNY = ny;
    const D = DISTRICT[b.dist];
    doors.push({ x: c[0] + 0.5 + nx * 0.62, y: c[1] + 0.5 + ny * 0.62,
                 bx: c[0], by: c[1], nx, ny, b: b.id,
                 name: b.word || D.words[(hash3(b.id, 5, 1) * D.words.length) | 0] });
  }
}
function buildInterior(bld, door, floor){
  floor = floor || 1;
  if (!INTB) INTB = { tType: new Uint8Array(MAP * MAP), tH: new Float32Array(MAP * MAP),
                      tB: new Int16Array(MAP * MAP), walkG: new Uint8Array(MAP * MAP) };
  const S = INTB;
  S.tType.fill(0); S.tH.fill(0); S.tB.fill(-1); S.walkG.fill(0);
  const keep = rngState;
  srand((((bld.seed ^ 0x51ab) + floor * 2654435761) >>> 0) || 1);
  const kind = floor === 1 ? INTERIOR_KIND[bld.dist]
             : ['office', 'apts', 'storage'][(hash3(bld.seed, floor, 91) * 3) | 0];
  const F = INT_FLAVOR[kind];
  intFloorA = F.floorA; intFloorB = F.floorB;
  const rw = clamp(bld.x1 - bld.x0 + 3, 6, 15);
  const rh = clamp(bld.y1 - bld.y0 + 3, 6, 15);
  const doorX = IOX + (rw >> 1), doorY = IOY + rh;
  const rec = { id: buildings.length, interior: 1, col: bld.col, seed: bld.seed + floor,
                h: INT_CEIL, x0: IOX - 1, y0: IOY - 1, x1: IOX + rw, y1: IOY + rh,
                doorX: floor === 1 ? doorX : -99, doorY };
  buildings.push(rec);
  const cRec = { id: buildings.length, interior: 2, col: C.trunk, seed: bld.seed, h: 1.05 };
  buildings.push(cRec);
  for (let y = IOY - 1; y <= IOY + rh; y++)
    for (let x = IOX - 1; x <= IOX + rw; x++){
      const id = y * MAP + x;
      if (x === IOX - 1 || y === IOY - 1 || x === IOX + rw || y === IOY + rh){
        S.tType[id] = T_BLD; S.tH[id] = INT_CEIL; S.tB[id] = rec.id;
      } else { S.tType[id] = T_INF; S.walkG[id] = 25; }
    }
  const ip = [];                                    // interior props
  let slot = 0;                                     // deterministic pickup keys
  const dropItem = (x, y, z, id, qty, price) => {
    const key = floor === 1 ? 'b' + bld.id + '_' + (slot++)
                            : 'b' + bld.id + 'f' + floor + '_' + (slot++);
    if (worldDelta.taken[key]) return;              // already scavenged
    ip.push({ x, y, z, k: PK_ITEM, s: 0, r: 0, item: id, key, qty: qty || 1, price });
  };
  // a low partition, drawn like the counter
  const lowWall = (x, y) => {
    const id = y * MAP + x;
    S.tType[id] = T_BLD; S.tH[id] = 1.05; S.tB[id] = cRec.id; S.walkG[id] = 0;
  };
  if (kind === 'office'){                           // desks in partitioned rows
    for (let y = IOY + 2; y < IOY + rh - 2; y += 3){
      for (let x = IOX + 1; x < IOX + rw - 3; x++)
        if ((x - IOX) % 4 !== 0) lowWall(x, y);
      if (rnd() < 0.7) ip.push({ x: IOX + 2.5, y: y + 1.5, k: PK_BENCH, s: 0, r: 0.34 });
    }
    if (rnd() < 0.4) dropItem(IOX + rw - 1.5, IOY + 1.5, 0, 'soda');
    if (rnd() < 0.25) dropItem(IOX + 1.5, IOY + rh - 1.5, 0, 'medkit');
  } else if (kind === 'apts'){                      // a corridor of doors
    const cx2 = IOX + (rw >> 1);
    for (let y = IOY + 1; y < IOY + rh - 1; y++){
      if ((y - IOY) % 3 === 0) continue;            // gaps read as doorways
      if (cx2 - 2 > IOX) lowWall(cx2 - 2, y);
      if (cx2 + 2 < IOX + rw - 1) lowWall(cx2 + 2, y);
    }
    if (rnd() < 0.5) dropItem(IOX + 1.2, IOY + 1.5, 0, 'soda');
    if (rnd() < 0.3) dropItem(IOX + rw - 1.4, IOY + rh - 1.6, 0, 'medkit');
  } else if (kind === 'storage'){                   // deep stacks, good salvage
    for (let y = IOY + 1; y < IOY + rh - 1; y += 2)
      for (let x = IOX + 1; x < IOX + rw - 1; x += 2)
        if (rnd() < 0.65) ip.push({ x: x + 0.5, y: y + 0.5, k: PK_BIN, s: rnd(), r: 0.32 });
    dropItem(IOX + 1.5, IOY + 1.5, 0, 'scrap');
    if (rnd() < 0.6) dropItem(IOX + rw - 1.5, IOY + rh - 1.5, 0, 'scrap');
    if (rnd() < 0.5) dropItem(IOX + rw - 1.5, IOY + 1.5, 0, 'ammo', 4);
  } else if (kind === 'shop'){                      // counter across the back
    const cy = IOY + 2, gap = IOX + rw - 2;         // pass-through at the end

    for (let x = IOX + 1; x <= IOX + rw - 2; x++){
      if (x === gap) continue;
      const id = cy * MAP + x;
      S.tType[id] = T_BLD; S.tH[id] = 1.05; S.tB[id] = cRec.id; S.walkG[id] = 0;
    }
    for (let y = IOY + 4; y < IOY + rh - 2; y += 2)
      if (rnd() < 0.75) ip.push({ x: IOX + 0.6, y: y + 0.5, k: PK_BIN, s: rnd(), r: 0.3 });
    if (rw > 8) ip.push({ x: IOX + rw - 1.6, y: IOY + rh - 2.5, k: PK_STALL, s: rnd(), r: 0.5 });
    const t1 = IOX + 2, t2 = IOX + rw - 3;            // stock on the counter top
    dropItem(t1 + 0.5, cy + 0.5, 1.1, 'noodles', 1, 15);   // displays are priced
    if (t2 !== t1) dropItem(t2 + 0.5, cy + 0.5, 1.1, 'soda', 1, 10);
  } else if (kind === 'lobby'){
    for (const bx of [IOX + 2, IOX + rw - 3])
      for (let y = IOY + 3; y < IOY + rh - 3; y += 3)
        ip.push({ x: bx + 0.5, y: y + 0.5, k: PK_BENCH, s: 0, r: 0.35 });
    if (rnd() < 0.4) dropItem(IOX + 1.5, IOY + 2.5, 0, 'soda');
  } else if (kind === 'depot'){
    for (let y = IOY + 2; y < IOY + rh - 2; y += 2)
      for (let x = IOX + 2; x < IOX + rw - 2; x += 3)
        if (rnd() < 0.6 && Math.abs(x - doorX) > 1.5)
          ip.push({ x: x + 0.5, y: y + 0.5, k: PK_BIN, s: rnd(), r: 0.32 });
    dropItem(IOX + 2.5, IOY + rh - 2.5, 0, 'scrap');
    if (rnd() < 0.5) dropItem(IOX + rw - 2.5, IOY + 2.5, 0, 'scrap');
    if (rnd() < 0.55) dropItem(IOX + rw - 2.5, IOY + rh - 2.5, 0, 'ammo', 4);
  } else {                                          // home
    ip.push({ x: IOX + 1.6, y: IOY + 1.8, k: PK_BENCH, s: 0, r: 0.35 });
    if (rnd() < 0.7) ip.push({ x: IOX + rw - 1.6, y: IOY + 1.8, k: PK_BIN, s: rnd(), r: 0.3 });
    if (rnd() < 0.6) dropItem(IOX + rw - 1.5, IOY + 2.6, 0, 'medkit');
    if (rnd() < 0.5) dropItem(IOX + 1.5, IOY + rh - 2.5, 0, 'soda');
  }
  if (rnd() < (kind === 'storage' ? 0.35 : 0.85)){
    const kx = kind === 'apts' ? IOX + 1.4 : doorX + 0.5;
    const a = spawnActor('vendor', kx, IOY + 1.4,
                         { name: F.keeper, brain: 'still', dialog: F.lines });
    a.interior = 1;
    if (kind === 'shop'){ a.tree = SHOP_TREE; a.dialog = null; }
  }
  // stairs, when the building has anywhere else to go
  let stairs = null;
  if (bldFloors(bld).length > 1){
    const stx = IOX + rw - 1.5, sty = IOY + 1.5;
    for (const cy2 of [sty | 0, (sty | 0) + 1]){    // the step AND the landing
      const id2 = cy2 * MAP + (stx | 0);
      S.walkG[id2] = 25; S.tType[id2] = T_INF; S.tH[id2] = 0; S.tB[id2] = -1;
    }
    ip.push({ x: stx, y: sty, k: PK_STAIR, s: 0, r: 0 });
    stairs = { x: stx, y: sty };
  }
  rngState = keep;
  return { props: ip, stairs,
           px: floor === 1 ? doorX + 0.5 : (stairs ? stairs.x : doorX + 0.5),
           py: floor === 1 ? IOY + rh - 1.6 : (stairs ? stairs.y + 1.3 : IOY + rh - 1.6),
           ang: floor === 1 ? -Math.PI / 2 : Math.PI / 2,
           exit: floor === 1 ? { x: doorX + 0.5, y: doorY - 0.45 } : null };
}
function gotoFloor(f){

/* ---- the interaction ray -------------------------------------------------
   Each frame the probe asks: which actor is the player looking at, close
   enough to reach, in a narrow cone, with clear line of sight? The result
   drives the [SPACE] prompt and the SPACE key. Doors, items and anything
   else interactive will answer this same probe later. */
let lookTarget = null, _prSc = 0;
function probeConsider(x, y, obj){
  const vx = Math.cos(cam.ang), vy = Math.sin(cam.ang);
  const rx = x - cam.x, ry = y - cam.y;
  const d = Math.hypot(rx, ry);
  if (d > 3.6 || d < 0.001) return;
  const dot = (rx * vx + ry * vy) / d;
  if (dot < 0.82) return;                      // a narrow forward cone
  // no prompting through walls - but a counter is not a wall
  if (!sightClear(cam.x, cam.y, x, y)) return;
  const score = dot / (1 + d * 0.2);           // centred beats near
  if (score > _prSc){ _prSc = score; lookTarget = obj; }
}
function probeInteract(){
  lookTarget = null; _prSc = 0;
  if (sitting) return;                       // nothing to reach from a bench
  for (let i = 0; i < actors.length; i++){
    const a = actors[i];
    if ((!a.dialog && !a.tree) || !!a.interior !== !!inside) continue;
    probeConsider(a.x, a.y, { kind: 'actor', a, prompt: '[SPACE]  TALK - ' + a.name });
  }
  const nearP = gridQuery(propGrid, cam.x, cam.y, 4, _q2);
  for (let i = 0; i < nearP.length; i++){
    const p = nearP[i];
    if (p.k === PK_ITEM){
      const cost = p.price ? (player.corruption >= 3 ? Math.ceil(p.price * 1.25) : p.price) : 0;
      probeConsider(p.x, p.y, { kind: 'item', p,
        prompt: !p.price ? '[SPACE]  TAKE - ' + ITEMS[p.item].name
              : player.credits >= cost
                ? '[SPACE]  BUY - ' + ITEMS[p.item].name + ' (' + cost + ' cr)'
                : '[SPACE]  STEAL - ' + ITEMS[p.item].name + ' (+1 corruption)' });
    }
    else if (p.k === PK_BIN)
      probeConsider(p.x, p.y, { kind: 'bin', prompt: '[SPACE]  TRASH - STREET BIN' });
    else if (p.k === PK_BENCH && (p.occ || 0) < 2)
      probeConsider(p.x, p.y, { kind: 'bench', p, prompt: '[SPACE]  SIT - BENCH' });
  }
  if (inside){
    if (inside.exit)
      probeConsider(inside.exit.x, inside.exit.y,
        { kind: 'door', exit: true, prompt: '[SPACE]  LEAVE - BACK TO THE STREET' });
    if (inside.stairs)
      probeConsider(inside.stairs.x, inside.stairs.y,
        { kind: 'stairs', prompt: '[SPACE]  STAIRWELL - FLOOR ' + inside.floor });
  } else {
    for (let i = 0; i < doors.length; i++){
      const dr = doors[i];
      if (Math.abs(dr.x - cam.x) > 4 || Math.abs(dr.y - cam.y) > 4) continue;
      probeConsider(dr.x, dr.y, { kind: 'door', door: dr, prompt: '[SPACE]  ENTER - ' + dr.name });
    }
  }
}
function tryInteract(){
  const t = lookTarget;
  if (!t) return;
  if (t.kind === 'actor'){
    const a = t.a;
    const px = cam.x - a.x, py = cam.y - a.y, l = Math.hypot(px, py) || 1;
    a.dx = px / l; a.dy = py / l;
    openTalk(a);
  } else if (t.kind === 'door'){
    if (t.exit) exitInterior(); else enterInterior(t.door);
  } else if (t.kind === 'bin'){
    trashMarks = {};
    openTrashMenu();
  } else if (t.kind === 'bench'){
    sitDown(t.p);
  } else if (t.kind === 'stairs'){
    openFloorMenu();
  } else if (t.kind === 'item'){
    const def = ITEMS[t.p.item];
    const st = player.inv.find(s => s.id === t.p.item);
    if (st && st.qty >= def.stack){ toast('cannot carry more ' + def.name.toLowerCase()); return; }
    if (t.p.price){
      const cost = player.corruption >= 3 ? Math.ceil(t.p.price * 1.25) : t.p.price;
      if (player.credits >= cost) player.credits -= cost;
      else crimeEvent(1, 'theft');           // pocketed in front of the cameras
    }
    invAdd(t.p.item, t.p.qty || 1);
    if (t.p.key) worldDelta.taken[t.p.key] = 1;   // dropped loot has no key
    props.splice(props.indexOf(t.p), 1);
    indexProps(); indexSpriteProps();
    sfx('ui_select', { rate: 1.35, vol: 0.6 });
    toast((t.p.price ? '-' + t.p.price + ' cr   ' : '') + '+ ' + def.name);
  }
}

  let st = null, bd = 1e9;
  for (const s of stalls){
    const dd = Math.abs(s.x - cam.x) + Math.abs(s.y - cam.y);
    if (dd < bd){ bd = dd; st = s; }
  }
  if (st && bd < 120){
    for (let t = 0; t < 16; t++){
      const x = (st.x + rr(-1.8, 1.8)) | 0, y = (st.y + rr(-1.8, 1.8)) | 0;
      if (!inMap(x, y) || !walkG[y * MAP + x]) continue;
      spawnActor('vendor', x + 0.5, y + 0.5, {
        name: 'STALL COOK', brain: 'still', shirt: C.shirtA,
        tree: {
          entry: () => questStage('sphere') === undefined ? 'start'
                     : questStage('sphere') === 0 ? 'sent'
                     : questStage('sphere') === 1 ? 'back' : 'after',
          start: { text: 'Noodles. Broth. No questions. That is the menu - unless you want the other thing. A story.',
            opts: [{ t: 'Tell me the story', next: 'story',
                     if: () => landmarks.some(l => l.name === 'THE SPHERE') },
                   { t: 'Just looking' }] },
          story: { text: 'There is a dome downtown whose whole skin is one screen, and sometimes the face on it watches back. Go stand under THE SPHERE, then come tell me what it showed you. Nobody here believes me.',
            opts: [{ t: 'I will go look', do(){ startQuest('sphere'); }, next: 'go' },
                   { t: 'Faces do not watch' }] },
          go: { text: 'Follow the glow. You cannot miss a building that grins.' },
          sent: { text: 'You have not been yet. The dome does not come to you.' },
          back: { text: 'You saw it. People come back with the light still on them. What did it show you?',
            opts: [{ t: 'A grin. Then an advert.',
                     do(){ player.credits += 40; advanceQuest('sphere'); }, next: 'paid' }] },
          paid: { text: 'Ha. It showed me a heart, once. Forty credits - stories are the one thing I pay for.' },
          after: { text: 'The dome still grinning? Good. Soup is on whenever you are.' }
        } });
      break;
    }
  }
  // the fixer keeps a corner on the red mile - or failing that, any corner
  let fx0 = null;
  for (const b of buildings) if (b.redlight){ fx0 = [(b.x0 + b.x1) >> 1, b.y1 + 3]; break; }
  const fspot = fx0 && walkG[fx0[1] * MAP + fx0[0]] ? fx0
              : randWalkNear(cam.x, cam.y, 12, 24);
  if (fspot) spawnActor('citizen', fspot[0] + 0.5, fspot[1] + 0.5, {
    name: 'THE FIXER', brain: 'still', shirt: C.nPink, skin: C.skinB,
    tree: {
      entry: () => 'start',
      start: { text: () => 'Corruption ' + player.corruption + ' of 10. The system remembers everything - unless somebody pays it to forget. Forty a point.',
        opts: [{ t: 'Pay 40 cr - clean one point',
                 if: () => player.corruption > 0 && player.credits >= 40,
                 do(){ player.credits -= 40; player.corruption--; toast('one entry deleted'); },
                 next: 'start' },
               { t: 'Who are you?', next: 'who' },
               { t: 'Leave' }] },
      who: { text: 'A janitor. The mess I clean is in the records.' }
    } });
  // the belt has teeth: razors prowl the industrial district streets
  let packed = 0;
  for (let i = 0; i < 4000 && packed < 14; i++){
    const x = ri(1, MAP - 2), y = ri(1, MAP - 2);
    if (districtAt(x, y) !== D_IND || !walkG[y * MAP + x]) continue;
    if (Math.hypot(x - cam.x, y - cam.y) < 40) continue;   // never at the doorstep
    spawnActor('razor', x + 0.5, y + 0.5,
               { name: 'RAZOR', brain: 'hostile', hp: 26, shirt: C.camRed, skin: C.skinB });
    packed++;
  }
}

/*========================= 13. CAMERA, INPUT, COLLISION ====================*/
const cam = {
  x: 0, y: 0, z: 1.62, ang: 0, pitch: 0,
  bob: 0, riding: null, walkPhase: 0, rad: 0.32
};
let worldTime = 0, paused = false, showHelp = true, showMap = true;

const propGrid = makeGrid();
function indexProps(){
  gridClear(propGrid);
  for (const p of props) gridAdd(propGrid, p.x, p.y, p);
}
function tileBlocked(x, y, rad){
  const x0 = Math.floor(x - rad), x1 = Math.floor(x + rad);
  const y0 = Math.floor(y - rad), y1 = Math.floor(y + rad);
  for (let iy = y0; iy <= y1; iy++)
    for (let ix = x0; ix <= x1; ix++){
      if (!inMap(ix, iy)) return true;
      if (tType[iy * MAP + ix] === T_WATER){
        const cx = clamp(x, ix, ix + 1), cy = clamp(y, iy, iy + 1);
        const dx = cx - x, dy = cy - y;
        if (dx * dx + dy * dy < rad * rad) return true;
      }
      if (tH[iy * MAP + ix] <= 0) continue;
      const cx = clamp(x, ix, ix + 1), cy = clamp(y, iy, iy + 1);
      const dx = cx - x, dy = cy - y;
      if (dx * dx + dy * dy < rad * rad) return true;
    }
  return false;
}
function propBlocked(x, y, rad){
  const near = gridQuery(propGrid, x, y, 3, _q1);
  for (let i = 0; i < near.length; i++){
    const p = near[i];
    if (p.k === PK_ITEM || p.k === PK_CROP || p.k === PK_STAIR) continue;   // walk-through kinds
    const dx = x - p.x, dy = y - p.y, rr2 = (rad + p.r) * (rad + p.r);
    if (dx * dx + dy * dy < rr2) return true;
  }
  return false;
}

function blockedAt(x, y, rad){
  return tileBlocked(x, y, rad) || propBlocked(x, y, rad) || actorBlocked(x, y, rad);
}
function moveCam(dx, dy){                     // slide along whichever axis is free
  if (!blockedAt(cam.x + dx, cam.y, cam.rad)) cam.x += dx;
  if (!blockedAt(cam.x, cam.y + dy, cam.rad)) cam.y += dy;
}

/*------------------------------- input -------------------------------------*/
const keys = Object.create(null);
addEventListener('keydown', e => {
  audioUnlock();                                        // any gesture arms sound
  if (!e.repeat || modeStack.length) onPress(e.code);   // menus want key repeat
  keys[e.code] = 1;
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space', 'Tab'].indexOf(e.code) >= 0) e.preventDefault();
});
addEventListener('keyup', e => { keys[e.code] = 0; });
addEventListener('blur', () => { for (const k in keys) keys[k] = 0; });
function onCanvasClick(){
  if (TOUCH.on) return;                      // taps are handled by the touch layer
  audioUnlock();
  const m = topMode();
  if (m && m.name === 'pause') modeStack.length = 0;    // click through the pause card
  if (!document.pointerLockElement) tryPointerLock();
}
cv.addEventListener('click', onCanvasClick);
glv.addEventListener('click', onCanvasClick);
addEventListener('mousedown', e => {
  if (TOUCH.on) return;                      // touch drives its own fire button
  if (e.button === 0 && document.pointerLockElement === view && !topMode()) fireWeapon();
});
addEventListener('mousemove', e => {
  if (document.pointerLockElement === view && !topMode()){
    cam.ang -= e.movementX * 0.0026;
    cam.pitch = clamp(cam.pitch - e.movementY * 0.10, -R.rows * 0.62, R.rows * 0.62);
  }
});
function onPress(code){
  const m = topMode();                          // an open mode owns the keyboard
  if (m){ if (m.onKey) m.onKey(code); return; }
  switch (code){
    case 'Escape': openPauseMenu(); break;
    case 'Space': if (sitting){ standUp(); break; } tryInteract(); break;
    case 'KeyW': if (sitting) waitOnBench(); break;
    case 'ControlLeft': case 'ControlRight': fireWeapon(); break;
    case 'Tab': openInventory(); break;
    case 'KeyP': paused = !paused; break;
    case 'KeyH': showHelp = !showHelp; break;
    case 'KeyM': openMap(); break;
    case 'KeyG': if (inside){ toast('no metro in here'); break; } useMetro(); break;
    case 'KeyB': bloomOn = !bloomOn; toast('bloom ' + (bloomOn ? 'on' : 'off')); break;
    case 'KeyV': if (inside){ toast('the sky is outside'); break; } toggleRide(); break;
    case 'KeyN': newWorld((Math.random() * 1e9) | 0); break;
    case 'BracketLeft':
    case 'BracketRight':
      if (stepRes(code === 'BracketRight' ? 1 : -1))
        toast('grid ' + R.cols + 'x' + R.rows + '  ' + (R.cols * R.rows) + ' cells  cell ' + R.cellW + 'px  (manual)');
      else toast('grid: already at the limit');
      break;
  }
}
// Spiral out until we find somewhere you can actually stand.
// Point the camera down whichever direction is actually walkable - street
// geometry alone is not enough, because street furniture blocks too.
function faceClear(){
  let bestA = cam.ang, bestN = -1;
  for (let a = 0; a < 16; a++){
    const th = a / 16 * Math.PI * 2;
    let n = 0;
    for (; n < 12; n++)
      if (blockedAt(cam.x + Math.cos(th) * (n + 1), cam.y + Math.sin(th) * (n + 1), cam.rad)) break;
    if (n > bestN){ bestN = n; bestA = th; }
  }
  cam.ang = bestA;
}
function freeSpotNear(x, y){
  for (let r = 1; r < 9; r += 1){
    for (let a = 0; a < 16; a++){
      const th = a / 16 * Math.PI * 2;
      const px = x + Math.cos(th) * r, py = y + Math.sin(th) * r;
      const ix = px | 0, iy = py | 0;
      if (!inMap(ix, iy) || !walkG[iy * MAP + ix]) continue;
      if (!blockedAt(px, py, 0.34)) return [px, py];
    }
  }
  return [x, y];
}
function useMetro(){
  if (!metroStops.length){ toast('no metro on this map'); return; }
  let idx = -1, bd = 3.4;
  for (let i = 0; i < metroStops.length; i++){
    const d = Math.hypot(metroStops[i].x - cam.x, metroStops[i].y - cam.y);
    if (d < bd){ bd = d; idx = i; }
  }
  if (idx < 0){ toast('stand at a METRO entrance to travel'); return; }
  const next = metroStops[(idx + 1) % metroStops.length];
  const spot = freeSpotNear(next.x, next.y);
  cam.x = spot[0]; cam.y = spot[1]; cam.z = 1.62; cam.riding = null;
  fade = 1; faceClear();
  sfx('metro');
  toast('metro to ' + next.name);
}
function toggleRide(){
  if (cam.riding){ // step out onto the nearest walkable tile
    const c = cam.riding;
    for (let r = 2; r < 14; r++){
      for (let a = 0; a < 12; a++){
        const th = a / 12 * Math.PI * 2;
        const x = c.x + Math.cos(th) * r, y = c.y + Math.sin(th) * r;
        if (inMap(x | 0, y | 0) && walkG[(y | 0) * MAP + (x | 0)] && !blockedAt(x, y, 0.34)){
          cam.x = x; cam.y = y; cam.riding = null; cam.z = 1.62; return;
        }
      }
    }
    cam.riding = null; cam.z = 1.62; return;
  }
  let best = null, bd = 1e9;
  for (const c of cars){
    const d = Math.hypot(c.x - cam.x, c.y - cam.y);
    if (d < bd){ bd = d; best = c; }
  }
  if (best && bd < 90){
    cam.riding = best; cam.z = best.z + 0.7;
    sfx('metro', { rate: 1.4, vol: 0.5 });
    toast('boarding air traffic');
  }
}
function updateCam(dt){
  if (cam.riding){
    const c = cam.riding;
    cam.x = c.x - c.dx * 0.5; cam.y = c.y - c.dy * 0.5;
    let target = Math.atan2(c.dy, c.dx);
    let d = target - cam.ang;
    while (d > Math.PI) d -= Math.PI * 2;
    while (d < -Math.PI) d += Math.PI * 2;
    cam.ang += d * Math.min(1, dt * 2.2);
    cam.z = c.z + 0.7 + Math.sin(c.blink * 0.7) * 0.05;
    if (keys.ArrowLeft || keys.KeyA) cam.ang += 1.7 * dt;
    if (keys.ArrowRight || keys.KeyD) cam.ang -= 1.7 * dt;
    return;
  }
  if (sitting){                                 // on the bench: look, don't walk
    if (keys.ArrowLeft || keys.KeyQ) cam.ang += 1.9 * dt;
    if (keys.ArrowRight || keys.KeyE) cam.ang -= 1.9 * dt;
    if (keys.KeyR) cam.pitch = clamp(cam.pitch + 26 * dt, -R.rows * 0.62, R.rows * 0.62);
    if (keys.KeyF) cam.pitch = clamp(cam.pitch - 26 * dt, -R.rows * 0.62, R.rows * 0.62);
    cam.z = 1.12;
    return;
  }
  if (blockedAt(cam.x, cam.y, cam.rad)){        // wedged: ease back to open ground
    const spot = freeSpotNear(cam.x, cam.y);
    const dx = spot[0] - cam.x, dy = spot[1] - cam.y;
    const l = Math.hypot(dx, dy) || 1, step = Math.min(l, 6 * dt);
    cam.x += dx / l * step; cam.y += dy / l * step;
  }
  const run = keys.ShiftLeft || keys.ShiftRight ? 2.2 + 0.1 * player.stats.AGI : 1;
  const sp = 3.1 * run;
  let fwd = 0, str = 0;
  if (keys.KeyW || keys.ArrowUp) fwd += 1;
  if (keys.KeyS || keys.ArrowDown) fwd -= 1;
  if (keys.KeyD) str += 1;
  if (keys.KeyA) str -= 1;
  fwd += TOUCH.f; str += TOUCH.s;             // the virtual stick is analog
  if (keys.ArrowLeft || keys.KeyQ) cam.ang += 1.9 * dt;
  if (keys.ArrowRight || keys.KeyE) cam.ang -= 1.9 * dt;
  if (keys.KeyR) cam.pitch = clamp(cam.pitch + 26 * dt, -R.rows * 0.62, R.rows * 0.62);
  if (keys.KeyF) cam.pitch = clamp(cam.pitch - 26 * dt, -R.rows * 0.62, R.rows * 0.62);
  const ca = Math.cos(cam.ang), sa = Math.sin(cam.ang);
  let mx = (ca * fwd + sa * str), my = (sa * fwd - ca * str);
  const ml = Math.hypot(mx, my);
  if (ml > 0.001){
    const mag = Math.min(1, ml);              // keyboard is full tilt; a stick can creep
    mx = mx / ml * mag; my = my / ml * mag;
    moveCam(mx * sp * dt, my * sp * dt);
    // cadence, not distance: a sprint is a LONGER stride, so its footfalls
    // land slower than a walk's - heavier and lower-pitched too
    cam.walkPhase += dt * (run > 1 ? 5.0 : 6.4);
    const st = (cam.walkPhase / Math.PI) | 0;   // one footfall per half-cycle
    if (st !== audio.stepN){
      audio.stepN = st;
      sfx('footstep', run > 1 ? { vol: 0.9, rate: 0.76 + Math.random() * 0.12 }
                              : { vol: 0.5, rate: 0.92 + Math.random() * 0.16 });
    }
  }
  cam.z = 1.62 + Math.sin(cam.walkPhase) * (run > 1 ? 0.06 : 0.035) * (ml > 0.001 ? 1 : 0);
}

/*========================== 13b. MODES + MENUS =============================
  A stack of interface modes sits between the keyboard and the game. With the
  stack empty you are simply playing; otherwise the top mode owns every key,
  may freeze the world, and draws itself over the HUD. A mode is
  { name, pausesWorld, onKey(code), draw() } - menus, dialogs and inventory
  screens are all modes, and most are data fed through the one list-menu
  interpreter below rather than code of their own.
============================================================================*/
const modeStack = [];
function topMode(){ return modeStack.length ? modeStack[modeStack.length - 1] : null; }
function pushMode(m){ m.openedT = performance.now(); modeStack.push(m); }
function popMode(){ modeStack.pop(); }
// Refusal (browser cooldown after an ESC exit, or a context with no lock at
// all) just means the player clicks the canvas as before.
function tryPointerLock(){
  if (TOUCH.on) return;                      // no mouse to capture on glass
  try {
    const p = view.requestPointerLock && view.requestPointerLock();
    if (p && p.catch) p.catch(() => {});
  } catch (e){}
}
function closeMenus(){
  modeStack.length = 0;
  tryPointerLock();          // back to the game means back to mouselook
}
function worldFrozen(){
  const m = topMode();
  return paused || !!(m && m.pausesWorld);
}

/* A menu is data. Items are { label, hint?, act()?, value()?, adj(dir)? }:
   act fires on ENTER; adj fires on left/right, and ENTER steps it forward;
   value() renders right-aligned and is re-read every frame, so toggles show
   their new state with no redraw plumbing. { sep: true } draws a rule and is
   skipped by the cursor. */
function menuMove(m, d){
  const n = m.items.length;
  for (let k = 0; k < n; k++){
    m.cursor = (m.cursor + d + n) % n;
    if (!m.items[m.cursor].sep && !m.items[m.cursor].info) return;
  }
}
function makeListMenu(def){
  const m = {
    name: def.name || 'menu', title: def.title || '', items: def.items,
    cursor: 0, pausesWorld: def.pausesWorld !== false,
    onKey(code){
      const it = this.items[this.cursor];
      switch (code){
        case 'KeyW': case 'ArrowUp':    menuMove(this, -1); sfx('ui_move', { vol: 0.4 }); break;
        case 'KeyS': case 'ArrowDown':  menuMove(this, 1); sfx('ui_move', { vol: 0.4 }); break;
        case 'KeyA': case 'ArrowLeft':
          if (it.adj){ it.adj(-1); sfx('ui_move', { vol: 0.5, rate: 1.25 }); }
          else if (def.onLR){ def.onLR(-1); sfx('ui_move', { vol: 0.5, rate: 1.25 }); }
          break;
        case 'KeyD': case 'ArrowRight':
          if (it.adj){ it.adj(1); sfx('ui_move', { vol: 0.5, rate: 1.25 }); }
          else if (def.onLR){ def.onLR(1); sfx('ui_move', { vol: 0.5, rate: 1.25 }); }
          break;
        case 'Enter': case 'Space': case 'KeyE':
          if (it.act){ sfx('ui_select', { vol: 0.55 }); it.act(); }
          else if (it.adj){ it.adj(1); sfx('ui_move', { vol: 0.5, rate: 1.25 }); }
          break;
        case 'Tab':
          if (def.onTab) def.onTab();
          break;
        case 'Escape': case 'Backspace':
          // the ESC that releases pointer lock can leak through as a keydown
          // in the same instant this menu opens; that one is noise
          if (performance.now() - this.openedT < 250) break;
          sfx('ui_back', { vol: 0.5 });
          if (def.onBack) def.onBack(); else popMode();
          break;
      }
    },
    draw(){ drawListMenu(this); },
    tap(cx, cy){                              // touch: rows are buttons
      const h = this.hit;
      if (!h) return;
      if (cx < h.x || cx >= h.x + h.w || cy < h.y || cy >= h.y + h.h){
        this.onKey('Escape');                 // tapping past the card backs out
        return;
      }
      const idx = h.first + (cy - (h.y + 1));
      if (idx < 0 || idx >= this.items.length) return;
      const it = this.items[idx];
      if (it.sep) return;
      if (it.info){                           // the tab row splits left / right
        if (def.onLR) def.onLR(cx < h.x + (h.w >> 1) ? -1 : 1);
        return;
      }
      this.cursor = idx;
      this.onKey('Enter');
    }
  };
  if (m.items.length && m.items[0].sep) menuMove(m, 1);
  return m;
}

/* Dialog: a stack of pages typed out at 60 chars/s. SPACE reveals the rest
   of a page, then turns it, then closes; ESC leaves mid-sentence. */
function openDialog(title, pages){
  pushMode({
    name: 'dialog', pausesWorld: true, title, pages, idx: 0, t0: performance.now(),
    pageDone(){ return this.t0 < 0 || (performance.now() - this.t0) * 0.06 >= this.pages[this.idx].length; },
    onKey(code){
      switch (code){
        case 'Space': case 'Enter':
          if (!this.pageDone()) this.t0 = -1;
          else if (this.idx < this.pages.length - 1){
            this.idx++; this.t0 = performance.now();
            sfx('ui_move', { vol: 0.4, rate: 0.8 });
          } else { popMode(); sfx('ui_back', { vol: 0.5 }); }
          break;
        case 'Escape': case 'Backspace':
          if (performance.now() - this.openedT < 250) break;
          popMode(); sfx('ui_back', { vol: 0.5 });
          break;
      }
    },
    draw(){ drawDialog(this); }
  });
  sfx('ui_select', { vol: 0.5 });
}

/* A conversation tree is a map of nodes: { text, opts?, next? }. Options are
   { t, next?, if?, do? } - `if` hides an option, `do` fires its effects, and
   no `next` ends the talk. Node text may be a function for live counters.
   An optional tree.entry() picks the opening node from game state, so one
   character greets you differently as their quest moves along. */
function nodeText(n){ return typeof n.text === 'function' ? n.text() : n.text; }
function openTree(title, tree){
  pushMode({
    name: 'dialog', pausesWorld: true, title, tree,
    node: (tree.entry && tree.entry()) || 'start',
    cursor: 0, t0: performance.now(),
    cur(){ return this.tree[this.node]; },
    visibleOpts(){ const n = this.cur(); return (n.opts || []).filter(o => !o.if || o.if()); },
    pageDone(){ return this.t0 < 0 || (performance.now() - this.t0) * 0.06 >= nodeText(this.cur()).length; },
    go(id){
      if (!id || !this.tree[id]){ popMode(); sfx('ui_back', { vol: 0.5 }); return; }
      this.node = id; this.cursor = 0; this.t0 = performance.now();
    },
    onKey(code){
      const opts = this.pageDone() ? this.visibleOpts() : [];
      switch (code){
        case 'KeyW': case 'ArrowUp':
          if (opts.length){ this.cursor = (this.cursor + opts.length - 1) % opts.length; sfx('ui_move', { vol: 0.4 }); }
          break;
        case 'KeyS': case 'ArrowDown':
          if (opts.length){ this.cursor = (this.cursor + 1) % opts.length; sfx('ui_move', { vol: 0.4 }); }
          break;
        case 'Space': case 'Enter':
          if (!this.pageDone()){ this.t0 = -1; break; }
          if (opts.length){
            const o = opts[Math.min(this.cursor, opts.length - 1)];
            sfx('ui_select', { vol: 0.5 });
            if (o.do) o.do();
            this.go(o.next);
          } else this.go(this.cur().next);
          break;
        case 'Escape': case 'Backspace':
          if (performance.now() - this.openedT < 250) break;
          popMode(); sfx('ui_back', { vol: 0.5 });
          break;
      }
    },
    draw(){ drawTree(this); },
    tap(cx, cy){
      const h = this.hit;
      const opts = this.pageDone() ? this.visibleOpts() : [];
      if (h && opts.length && cx >= h.x && cx < h.x + h.w){
        const oi = cy - h.optStart;
        if (oi >= 0 && oi < opts.length){
          this.cursor = oi;
          this.onKey('Space');
          return;
        }
      }
      this.onKey('Space');                    // anywhere else: skip / advance
    }
  });
  sfx('ui_select', { vol: 0.5 });
}
function openTalk(a){
  if (a.tree) openTree(a.name, a.tree);
  else if (a.dialog) openDialog(a.name, a.dialog);
}

function stepRes(d){
  const n = CFG.resIdx + d;
  if (n < 0 || n >= CFG.CELLW.length) return false;
  CFG.manualRes = true; autoRes = false;
  CFG.resIdx = n; initRender();
  return true;
}

function openPauseMenu(){
  if (topMode()) return;
  pushMode(makeListMenu({
    name: 'pause', title: 'PAUSED',
    onBack(){ closeMenus(); },
    items: [
      { label: 'RESUME', hint: 'ESC or a click on the canvas also resumes',
        act(){ closeMenus(); } },
      { sep: true },
      { label: 'CLOCK', value: () => dateStr() + '  ' + clockStr(),
        hint: 'time flows on its own - benches let you wait it forward' },
      { label: 'WEATHER', value: () => ['CLEAR', 'RAIN', 'STORM', 'FOG'][weather],
        hint: 'the weather drifts on its own now' },

        adj(){ showMap = !showMap; } },

        } },

      { label: 'AMBIENCE',      value: () => volBar('ambient'), adj(d){ stepVol('ambient', d); } },

// ESC under pointer lock never reaches the page - the browser consumes it as

/*============================== 13c. AUDIO =================================
  Sound comes from local files in audio/ - free-use mp3 / wav the repo does
  not ship. Every slot is optional: a missing file is a silent no-op, so the
  game runs fine with no audio folder at all.

  Two tiers, picked once at the first user gesture:
    tier 1  WebAudio - fetch + decodeAudioData, per-bus gains, stereo pan.
            Available when the page is served over http(s).
    tier 2  <audio> elements - file:// blocks fetch, media elements are
            exempt, so each slot becomes an element. Volume and playback
            rate work; panning does not. Same city, flatter stage.

  A slot tries name.mp3 first, then name.wav, so a curated mp3 dropped next
  to a placeholder wav wins without deleting anything. Buses: music, ambient
  and weather (rain, thunder, wind) duck to 30% while the world is frozen;
  fx does not, so menu blips stay crisp. The slot list and every hook that
  fires one live here and in audio/AUDIO.md.
============================================================================*/
const AUD = {
  music_night:     { loop: 1, bus: 'music' },
  music_dusk:      { loop: 1, bus: 'music' },
  music_day:       { loop: 1, bus: 'music' },
  amb_downtown:    { loop: 1, bus: 'ambient' },
  amb_strip:       { loop: 1, bus: 'ambient' },
  amb_residential: { loop: 1, bus: 'ambient' },
  amb_industrial:  { loop: 1, bus: 'ambient' },
  amb_suburbs:     { loop: 1, bus: 'ambient' },
  amb_farmland:    { loop: 1, bus: 'ambient' },
  rain_loop:       { loop: 1, bus: 'weather' },
  wind_loop:       { loop: 1, bus: 'weather' },
  thunder:         { bus: 'weather' },
  footstep:        { bus: 'fx' },
  metro:           { bus: 'fx' },
  door:            { bus: 'fx' },
  shot:            { bus: 'fx' },
  hit:             { bus: 'fx' },
  hurt:            { bus: 'fx' },
  ui_move:         { bus: 'fx' },
  ui_select:       { bus: 'fx' },
  ui_back:         { bus: 'fx' }
};
const AMB_BY_DISTRICT = ['amb_downtown', 'amb_strip', 'amb_residential',
                         'amb_industrial', 'amb_suburbs', 'amb_farmland'];
const MUSIC_BY_TIME = ['music_night', 'music_dusk', 'music_day'];

let audioCtx = null;
const audio = {
  tier: 0, force: 0, unlocked: false, loaded: 0,
  vol: { master: 0.8, music: 0.7, ambient: 0.8, weather: 0.8, fx: 0.8 },
  duck: 1, buffers: {}, els: {}, missing: {}, loops: {},
  master: null, bus: null, oneShots: 0, stepN: 0
};
try { const v = JSON.parse(localStorage.getItem('asciiCityVol')); if (v) Object.assign(audio.vol, v); } catch (e){}
function saveVol(){ try { localStorage.setItem('asciiCityVol', JSON.stringify(audio.vol)); } catch (e){} }
function volBar(k){ const n = Math.round(audio.vol[k] * 10); return '#'.repeat(n) + '.'.repeat(10 - n); }
function stepVol(k, d){ audio.vol[k] = clamp(Math.round((audio.vol[k] + d * 0.1) * 10) / 10, 0, 1); saveVol(); }

// Browsers refuse sound until the page is touched, so the first click or
// keypress does all the startup work: context, tier probe, every load.
function audioUnlock(){
  if (audio.unlocked) return;
  audio.unlocked = true;
  const AC = window.AudioContext || window.webkitAudioContext;
  audioCtx = AC ? new AC() : null;
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
  // fetch resolves (even 404) over http, rejects outright on file://
  const probe = audio.force ? Promise.resolve(audio.force)
    : (audioCtx ? fetch('audio/.probe').then(() => 1, () => 2) : Promise.resolve(2));
  probe.then(t => {
    audio.tier = t;
    if (t === 1){
      audio.master = audioCtx.createGain();
      audio.master.connect(audioCtx.destination);
      audio.bus = {};
      for (const b of ['music', 'ambient', 'weather', 'fx']){
        const g = audioCtx.createGain(); g.connect(audio.master); audio.bus[b] = g;
      }
    }
    for (const name in AUD) audioLoad(name);
  });
  setTimeout(() => {
    if (audio.loaded === 0) toast('no audio files found - see audio/AUDIO.md');
  }, 4000);
}
function audioLoad(name){
  const exts = ['.mp3', '.wav'];
  if (audio.tier === 1){
    (function tryExt(i){
      if (i >= exts.length){ audio.missing[name] = 1; return; }
      fetch('audio/' + name + exts[i])
        .then(r => { if (!r.ok) throw 0; return r.arrayBuffer(); })
        .then(ab => audioCtx.decodeAudioData(ab))
        .then(buf => { audio.buffers[name] = buf; audio.loaded++; })
        .catch(() => tryExt(i + 1));
    })(0);
  } else {
    const el = new Audio();
    let i = 0;
    el.onerror = () => { if (++i < exts.length) el.src = 'audio/' + name + exts[i]; else audio.missing[name] = 1; };
    el.oncanplaythrough = () => { if (!audio.els[name]){ audio.els[name] = el; audio.loaded++; } };
    el.preload = 'auto';
    el.src = 'audio/' + name + exts[0];
  }
}

/* fire-and-forget one-shot; o = { vol, rate, pan } */
function sfx(name, o){
  if (!audio.tier || audio.missing[name]) return;
  o = o || {};
  const bus = AUD[name] ? AUD[name].bus : 'fx';
  if (audio.tier === 1){
    const buf = audio.buffers[name]; if (!buf) return;
    const s = audioCtx.createBufferSource(); s.buffer = buf;
    if (o.rate) s.playbackRate.value = o.rate;
    const g = audioCtx.createGain(); g.gain.value = o.vol !== undefined ? o.vol : 1;
    s.connect(g);
    if (o.pan !== undefined && audioCtx.createStereoPanner){
      const p = audioCtx.createStereoPanner(); p.pan.value = clamp(o.pan, -1, 1);
      g.connect(p); p.connect(audio.bus[bus]);
    } else g.connect(audio.bus[bus]);
    s.start();
  } else {
    const base = audio.els[name];
    if (!base || audio.oneShots > 14) return;      // cap runaway overlaps
    const el = base.cloneNode();
    el.loop = false;
    el.volume = clamp((o.vol !== undefined ? o.vol : 1) * audio.vol[bus] * audio.vol.master, 0, 1);
    if (o.rate){ el.preservesPitch = false; el.playbackRate = o.rate; }
    audio.oneShots++;
    el.onended = () => { audio.oneShots--; };
    el.play().catch(() => { audio.oneShots--; });
  }
}
/* one-shot at a world position: distance attenuation, panned by bearing */
function sfxAt(name, x, y, o){
  const dx = x - cam.x, dy = y - cam.y, d = Math.hypot(dx, dy);
  if (d > 46) return;
  o = Object.assign({}, o);
  o.vol = (o.vol !== undefined ? o.vol : 1) / (1 + d * 0.22);
  o.pan = clamp((dirY * dx - dirX * dy) / Math.max(0.001, d) * 0.9, -1, 1);
  sfx(name, o);
}

/* Looping beds never restart - they hold gain targets and chase them, so a
   district border or a weather change is a crossfade, not a cut. */
function loopVol(name, target){
  let L = audio.loops[name];
  if (!L) L = audio.loops[name] = { g: 0, t: 0, node: null };
  L.t = target;
}
function audioFrame(dt){
  if (!audio.tier) return;
  audio.duck += ((worldFrozen() ? 0.3 : 1) - audio.duck) * Math.min(1, dt * 4);
  if (audio.tier === 1){
    audio.master.gain.value = audio.vol.master;
    audio.bus.music.gain.value = audio.vol.music * audio.duck;
    audio.bus.ambient.gain.value = audio.vol.ambient * audio.duck;
    audio.bus.weather.gain.value = audio.vol.weather * audio.duck;
    audio.bus.fx.gain.value = audio.vol.fx;
  }
  // indoors the street bed goes muffled but does not change district
  const dn = inside ? inside.district : districtAt(cam.x, cam.y);
  const ambT = inside ? 0.45 : 0.9;
  for (let i = 0; i < AMB_BY_DISTRICT.length; i++) loopVol(AMB_BY_DISTRICT[i], i === dn ? ambT : 0);
  for (let i = 0; i < MUSIC_BY_TIME.length; i++) loopVol(MUSIC_BY_TIME[i], i === CFG.timeMode ? 0.9 : 0);
  loopVol('rain_loop', (weather === 2 ? 0.85 : weather === 1 ? 0.45 : 0) * (inside ? 0.3 : 1));
  loopVol('wind_loop', cam.riding ? 0.8 : 0);
  const K = Math.min(1, dt * 1.3);
  for (const name in audio.loops){
    const L = audio.loops[name];
    L.g += (L.t - L.g) * K;
    if (audio.tier === 1){
      if (!L.node && audio.buffers[name]){
        const s = audioCtx.createBufferSource();
        s.buffer = audio.buffers[name]; s.loop = true;
        const g = audioCtx.createGain(); g.gain.value = 0;
        s.connect(g); g.connect(audio.bus[AUD[name].bus]); s.start();
        L.node = g;
      }
      if (L.node) L.node.gain.value = L.g;
    } else {
      const el = audio.els[name];
      if (el){
        el.loop = true;
        const v = clamp(L.g * audio.vol[AUD[name].bus] * audio.vol.master * audio.duck, 0, 1);
        el.volume = v;
        if (v > 0.004 && el.paused) el.play().catch(() => {});
        else if (v <= 0.004 && !el.paused) el.pause();
      }
    }
  }
}

/*======================= 13d. PLAYER, ITEMS + SAVES ========================
  The player is data; items are a table plus one interpreter, in the same
  house style as districts and props. Pickups live in the world as PK_ITEM
  props - drawn, indexed and probed like everything else - and taking one is
  recorded in worldDelta, the running diff against the generated world.

  A save is tiny because the city is deterministic: seed + camera + player +
  delta. Loading rebuilds the same city from the seed and replays the diff.
============================================================================*/
let worldSeed = 0;
let worldDelta = { taken: {} };
const player = {
  hp: 100, maxHp: 100, credits: 120,
  stats: { VIT: 1, AGI: 1, TECH: 1 },
  inv: [],                                  // [{ id, qty }]
  quests: {}, qvar: {}, track: null,        // quest stages, counters, compass
  corruption: 0                             // how hard the system watches you
};
const ITEMS = {
  noodles: { name: 'CUP NOODLES', pcol: C.nAmber, stack: 5, cat: 'consumable', price: 15,
             hint: 'restores 25 hp',
             use(p){ if (p.hp >= p.maxHp) return false; p.hp = Math.min(p.maxHp, p.hp + 25); return true; } },
  soda:    { name: 'SYNTH COLA', pcol: C.nCyan, stack: 5, cat: 'consumable', price: 10,
             hint: 'restores 10 hp',
             use(p){ if (p.hp >= p.maxHp) return false; p.hp = Math.min(p.maxHp, p.hp + 10); return true; } },
  medkit:  { name: 'MEDKIT', pcol: C.camRed, stack: 2, cat: 'consumable', price: 60,
             hint: 'restores all hp',
             use(p){ if (p.hp >= p.maxHp) return false; p.hp = p.maxHp; return true; } },
  scrap:   { name: 'SCRAP ELECTRONICS', pcol: C.nGreen, stack: 9, cat: 'misc', price: 12,
             hint: 'shops pay a little; the watcher pays well' },
  pistol:  { name: 'ZIP PISTOL', pcol: C.rail, stack: 1, cat: 'weapon', price: 90,
             hint: 'LMB or CTRL fires; feeds on ammo' },
  ammo:    { name: 'AMMO', pcol: C.tlAmb, stack: 24, cat: 'weapon', price: 3,
             hint: 'rounds for the zip pistol' }
};
function invAdd(id, n){
  let st = player.inv.find(s => s.id === id);
  if (!st){ st = { id, qty: 0 }; player.inv.push(st); }
  st.qty = Math.min(ITEMS[id].stack, st.qty + (n || 1));
}
function invCount(id){
  const st = player.inv.find(s => s.id === id);
  return st ? st.qty : 0;
}
function invTake(id, n){
  const st = player.inv.find(s => s.id === id);
  if (!st || st.qty < n) return false;
  st.qty -= n;
  if (st.qty <= 0) player.inv.splice(player.inv.indexOf(st), 1);
  return true;
}
function useItem(id){
  const st = player.inv.find(s => s.id === id);
  if (!st) return;
  const def = ITEMS[id];
  if (!def.use){ toast('no use for it yet'); return; }
  if (!def.use(player)){ toast('no effect right now'); sfx('ui_back', { vol: 0.3 }); return; }
  st.qty--;
  if (st.qty <= 0) player.inv.splice(player.inv.indexOf(st), 1);
  sfx('ui_select', { vol: 0.5, rate: 0.9 });
  playVAnim(id);
  toast('used ' + def.name.toLowerCase());
}
function resetPlayer(){
  player.stats = { VIT: 1, AGI: 1, TECH: 1 };
  player.maxHp = 80 + player.stats.VIT * 20;
  player.hp = player.maxHp;
  player.credits = 120;
  player.inv = [];
  player.quests = {}; player.qvar = {}; player.track = null;
  player.corruption = 0;
}
// what a thing costs YOU: the flagged pay corpo prices
function priceOf(id){
  const p = ITEMS[id].price || 0;
  return player.corruption >= 3 ? Math.ceil(p * 1.25) : p;
}

/* the inventory screen is just a list menu built from data, in five tabs */
const INV_TABS = [['CONSUMABLES', 'consumable'], ['WEAPONS', 'weapon'],
                  ['CLOTHING', 'clothing'], ['ACCESSORIES', 'accessory'], ['MISC', 'misc']];
let invTab = 0;
function invTabOf(id){
  const c = ITEMS[id].cat;
  return INV_TABS.some(t => t[1] === c) ? c : 'misc';
}
function openInventory(){
  const tabLine = INV_TABS.map((t, i) => (i === invTab ? '[' + t[0] + ']' : ' ' + t[0] + ' ')).join('');
  const items = [
    { info: 'HP ' + player.hp + '/' + player.maxHp + '    CREDITS ' + player.credits +
            '    VIT ' + player.stats.VIT + '  AGI ' + player.stats.AGI + '  TECH ' + player.stats.TECH },
    { sep: true },
    { info: tabLine },
    { sep: true }
  ];
  const shown = player.inv.filter(st => invTabOf(st.id) === INV_TABS[invTab][1]);
  if (!shown.length) items.push({ info: 'nothing in this tab' });
  for (const st of shown){
    const def = ITEMS[st.id];
    items.push({ label: def.name, value: () => 'x' + st.qty, hint: def.hint,
                 act(){ useItem(st.id); refreshInventory(); } });
  }
  const qids = Object.keys(player.quests || {}).filter(id => QUESTS[id]);
  if (qids.length){
    items.push({ sep: true });
    items.push({ info: 'OBJECTIVES' });
    for (const id of qids){
      const s = player.quests[id];
      items.push({ info: s === 'done' ? '* ' + QUESTS[id].name + ' - done'
                                      : '! ' + QUESTS[id].name + ': ' + QUESTS[id].stages[s].log });
    }
  }
  items.push({ sep: true });
  items.push({ label: 'CLOSE', hint: 'TAB or ESC also closes; A/D switch tabs', act(){ popMode(); } });
  pushMode(makeListMenu({ name: 'inventory', title: 'INVENTORY', items,
                          onLR(d){ invTab = (invTab + d + INV_TABS.length) % INV_TABS.length;
                                   popMode(); openInventory(); },
                          onTab(){ popMode(); sfx('ui_back', { vol: 0.4 }); } }));
}
function refreshInventory(){
  const cur = topMode().cursor;
  popMode(); openInventory();
  const m = topMode();
  m.cursor = Math.min(cur, m.items.length - 1);
  if (m.items[m.cursor].sep || m.items[m.cursor].info) menuMove(m, -1);
}

/* street pickups: sparse, deterministic, clustered where people gather */
function placeStreetItems(){
  for (const st of stalls){
    const h = hash3(st.x | 0, st.y | 0, 901);
    if (h > 0.30) continue;
    for (let t = 0; t < 8; t++){
      const x = (st.x + rr(-2, 2)) | 0, y = (st.y + rr(-2, 2)) | 0;
      if (!inMap(x, y) || !walkG[y * MAP + x]) continue;
      props.push({ x: x + 0.5, y: y + 0.5, k: PK_ITEM, s: 0, r: 0,
                   item: h < 0.18 ? 'noodles' : 'soda', key: 's' + x + '_' + y });
      break;
    }
  }
}
function applyDeltaToProps(){
  let removed = false;
  for (let i = props.length - 1; i >= 0; i--){
    const p = props[i];
    if (p.k === PK_ITEM && p.key && worldDelta.taken[p.key]){ props.splice(i, 1); removed = true; }
  }
  if (removed){ indexProps(); indexSpriteProps(); }
}

/* ---- saves: seed + camera + player + delta, three slots -------------------
   Saving indoors stores the street position outside the door instead - the
   room itself regenerates from its seed, so nothing in it needs storing.  */
const saveKey = n => 'asciiCitySave' + n;
try {   // migrate the old single-slot save into slot 1, once
  const old = localStorage.getItem('asciiCitySave');
  if (old && !localStorage.getItem(saveKey(1))){
    localStorage.setItem(saveKey(1), old);
    localStorage.removeItem('asciiCitySave');
  }
} catch (e){}
function readSlot(n){
  try {
    const s = JSON.parse(localStorage.getItem(saveKey(n)));
    return s && s.v === 1 ? s : null;
  } catch (e){ return null; }
}
function anySave(){
  try { return !!(localStorage.getItem(saveKey(1)) || localStorage.getItem(saveKey(2)) ||
                  localStorage.getItem(saveKey(3))); }
  catch (e){ return false; }
}
function slotLabel(s){
  if (!s) return 'EMPTY';
  const d = new Date(s.at);
  return (d.getMonth() + 1) + '/' + d.getDate() + ' ' +
         String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
}
function openSlotMenu(kind){
  const slots = [readSlot(1), readSlot(2), readSlot(3)];
  const items = slots.map((s, i) => ({
    label: 'SLOT ' + (i + 1),
    value: () => slotLabel(s),
    hint: s ? (kind === 'save' ? 'overwrites: ' : '') +
              'hp ' + s.player.hp + '/' + s.player.maxHp +
              '   cr ' + s.player.credits + '   seed ' + s.seed
            : (kind === 'save' ? 'an empty slot' : 'nothing saved here'),
    act(){
      if (kind === 'save'){ saveGame(i + 1); popMode(); }
      else if (s) loadGame(i + 1);
      else toast('slot ' + (i + 1) + ' is empty');
    }
  }));
  items.push({ sep: true });
  items.push({ label: 'BACK', act(){ popMode(); } });
  pushMode(makeListMenu({ name: kind + '-slots',
                          title: kind === 'save' ? 'SAVE GAME' : 'LOAD GAME', items }));
}
function saveGame(n){
  const pos = inside
    ? { x: EXT.camX, y: EXT.camY, ang: EXT.camAng, pitch: EXT.camPitch }
    : { x: cam.x, y: cam.y, ang: cam.ang, pitch: cam.pitch };
  const s = { v: 1, at: Date.now(), seed: worldSeed, timeMode: CFG.timeMode, weather,
              clock, dayCount, fogLevel,
              cam: pos, player, delta: worldDelta };
  try {
    localStorage.setItem(saveKey(n), JSON.stringify(s));
    sfx('ui_select', { vol: 0.5 });
    toast('saved to slot ' + n + (inside ? ' - you will wake on the street outside' : ''));
  } catch (e){ toast('save failed - storage unavailable'); }
}
function loadGame(n){
  const s = readSlot(n);
  if (!s){ toast('no save in slot ' + n); return; }
  closeMenus();
  CFG.timeMode = s.timeMode | 0;
  clock = s.clock !== undefined ? s.clock : 20;
  dayCount = s.dayCount | 0;
  weather = s.weather | 0; flash = 0;
  if (s.fogLevel) fogLevel = s.fogLevel;
  newWorld(s.seed);                          // deterministic rebuild, fresh delta
  worldDelta = s.delta || { taken: {} };
  applyDeltaToProps();
  Object.assign(player, s.player);
  if (!player.quests) player.quests = {};      // saves from before quests existed
  if (!player.qvar) player.qvar = {};
  cam.x = s.cam.x; cam.y = s.cam.y; cam.ang = s.cam.ang; cam.pitch = s.cam.pitch;
  cam.riding = null; cam.z = 1.62;
  if (!walkG[clamp(cam.y | 0, 0, MAP - 1) * MAP + clamp(cam.x | 0, 0, MAP - 1)]){
    const sp = freeSpotNear(cam.x, cam.y);
    cam.x = sp[0]; cam.y = sp[1]; faceClear();
  }
  if (GL) glBuildPalette(); else buildAtlases();
  bgGrad = null; buildBackground();
  fade = 1;
  toast('save loaded');
}

/*============================== 13e. QUESTS ================================
  A quest is a table entry: named stages, each with a log line, an optional
  compass target() and an optional auto() trigger polled twice a second.
  Progress lives in player.quests (stage index, then 'done') and counters in
  player.qvar, so quest state saves and loads with the player for free.
  Dialog trees do most of the advancing; auto() covers go-and-see stages.
============================================================================*/
const QUESTS = {
  noodles: {
    name: 'A WARM MEAL',
    stages: [
      { log: 'bring CUP NOODLES to the drifter (stalls and shop counters carry them)',
        target(){ if (invCount('noodles') === 0) return null;
                  const a = actors.find(x => x.name === 'DRIFTER');
                  return a && { x: a.x, y: a.y, name: 'THE DRIFTER' }; } }
    ]
  },

/*============================== 13f. COMBAT ================================
  A hitscan pistol against melee hostiles. The shot ray is 2D - everyone is
  person-height - but it respects walls above chest height, so a 1.05 shop

/* ---- corruption: the system keeps a ledger --------------------------------

   1-2: the cameras notice you. 3-5: prices up a quarter, a third of doors

function pedCrime(n, why){

const SPARK_SL = slots({ X: [-1, 1.0] });
function addFx(x, y, z){ fxs.push({ x, y, z, t: 0.12 }); }
function sightClear(x0, y0, x1, y1){
  const dx = x1 - x0, dy = y1 - y0, d = Math.hypot(dx, dy);
  const steps = Math.ceil(d * 2);
  for (let s = 1; s < steps; s++){
    const t = s / steps;
    const ix = (x0 + dx * t) | 0, iy = (y0 + dy * t) | 0;
    if (!inMap(ix, iy) || tH[iy * MAP + ix] > 1.4) return false;
  }
  return true;
}
// how far a bullet travels before masonry stops it (chest height, 1.3)
function wallDist(maxD){
  const rdx = Math.cos(cam.ang), rdy = Math.sin(cam.ang);
  let mapX = cam.x | 0, mapY = cam.y | 0;
  const ddx = rdx === 0 ? 1e30 : Math.abs(1 / rdx);
  const ddy = rdy === 0 ? 1e30 : Math.abs(1 / rdy);
  let stepX, stepY, sdx, sdy;
  if (rdx < 0){ stepX = -1; sdx = (cam.x - mapX) * ddx; } else { stepX = 1; sdx = (mapX + 1 - cam.x) * ddx; }
  if (rdy < 0){ stepY = -1; sdy = (cam.y - mapY) * ddy; } else { stepY = 1; sdy = (mapY + 1 - cam.y) * ddy; }
  let guard = 0;
  while (guard++ < 200){
    let d;
    if (sdx < sdy){ d = sdx; sdx += ddx; mapX += stepX; } else { d = sdy; sdy += ddy; mapY += stepY; }
    if (d > maxD) return maxD;
    if (mapX < 0 || mapY < 0 || mapX >= MAP || mapY >= MAP) return d;
    if (tH[mapY * MAP + mapX] > 1.3) return d;
  }
  return maxD;
}
function hostileInSights(maxD, halfW){
  halfW = halfW || 0.45;
  const vx = Math.cos(cam.ang), vy = Math.sin(cam.ang);
  const wd = wallDist(maxD);
  let best = null, bd = 1e9;
  for (let i = 0; i < actors.length; i++){
    const a = actors[i];
    if (a.brain !== 'hostile' || !!a.interior !== !!inside) continue;
    const rx = a.x - cam.x, ry = a.y - cam.y;
    const f = rx * vx + ry * vy;
    if (f < 0.3 || f > wd) continue;
    if (Math.abs(vy * rx - vx * ry) > halfW) continue;
    if (f < bd){ bd = f; best = a; }
  }
  return best && { a: best, d: bd };
}
// like the above, but a bullet does not care who is in front of it
function characterInSights(maxD, halfW){
  halfW = halfW || 0.45;
  const hit = hostileInSights(maxD, halfW);
  let best = hit ? hit.a : null, bd = hit ? hit.d : 1e9, ped = false;
  if (!inside){
    const vx = Math.cos(cam.ang), vy = Math.sin(cam.ang);
    const wd = Math.min(bd, wallDist(maxD));
    const near = gridQuery(pedGrid, cam.x + vx * Math.min(12, maxD * 0.4),
                           cam.y + vy * Math.min(12, maxD * 0.4), 16, _q1);
    for (let i = 0; i < near.length; i++){
      const p = near[i];
      const rx = p.x - cam.x, ry = p.y - cam.y;
      const f = rx * vx + ry * vy;
      if (f < 0.3 || f > wd) continue;
      if (Math.abs(vy * rx - vx * ry) > halfW) continue;
      if (f < bd){ bd = f; best = p; ped = true; }
    }
  }
  return best && { a: best, d: bd, ped };
}

function hostileBrain(a, dt){
  a.atkCool = (a.atkCool || 0) - dt;
  const rx = cam.x - a.x, ry = cam.y - a.y;
  const pr = Math.hypot(rx, ry) || 0.001;
  if (!a.aggro){
    if (pr < 9 && sightClear(a.x, a.y, cam.x, cam.y)) a.aggro = 1;
    return;
  }
  if (pr > 30){ a.aggro = 0; return; }
  a.dx = rx / pr; a.dy = ry / pr;
  if (pr > 1.0){
    const nx = a.x + a.dx * a.spd * dt, ny = a.y + a.dy * a.spd * dt;
    if (walkG[clamp(a.y | 0, 0, MAP - 1) * MAP + clamp(nx | 0, 0, MAP - 1)]) a.x = nx;
    if (walkG[clamp(ny | 0, 0, MAP - 1) * MAP + clamp(a.x | 0, 0, MAP - 1)]) a.y = ny;
    a.phase += a.spd * dt * 3.4;
    a.moving = 1;
  } else if (a.atkCool <= 0 && player.hp > 0){
    a.atkCool = 1.1;
    damagePlayer((a.atk || 5) + ((Math.random() * 6) | 0));
  }
